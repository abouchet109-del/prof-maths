# Disponibilités pour les révisions (lu par tools/plan.py).
debut: 2026-11-03
fin: 2027-01-03                  # rien n'est planifié après cette date
examens: 2027-01-04              # « semaine du 9 janvier » (un samedi) : on vise le lundi 04/01 par prudence
examens_a_confirmer: true        # dates exactes à confirmer
minutes_exercices_jour: 150            # 2 h d'exercices nouveaux + 30 min de reprises (choix du 10/11/2026)
minutes_cours_jour: 30
cartes_par_jour: 20              # plafond de cartes Anki nouvelles par jour
minutes_reprises_max: 30         # plafond de minutes de reprises par jour (toutes matières)
annales_libres_des: 2026-12-07   # à partir de cette date, toutes les annales prioritaires sont éligibles
exceptions:
  - {type: "off", du: 2026-11-21, au: 2026-11-22}
  - {type: quota, du: 2026-12-21, au: 2027-01-03, minutes_exercices_jour: 240}
