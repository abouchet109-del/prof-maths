# Modèle de compréhension de l'utilisateur, notion par notion (format : docs/FORMATS.md,
# « Modèle de compréhension »). Écrit au debrief seulement, d'après ce qu'il a dit en séance ;
# lu par le skill seance et par tools/plan.py ; validé par tools/check.py.
# Une entrée : <id notion>: {niveau: inconnue|recitee|fragile|tenue|reliee, vision, liens: [{vers, texte}],
#   liens_manquants: [{vers, texte}], confusions: [{date, texte, statut: ouverte|reparee}],
#   preuves: [{date, source: cours|exercice|question, extrait, verdict: juste|partiel|faux}], maj}
# Un niveau ne monte que sur preuve.
notions:
  topo-p-0004:
    niveau: fragile
    vision: sup = plus petit des majorants ; M-eps < x <= M donne la fenetre ]M-1/n, M] qui contient un element de A ; confond encore le bord de la fenetre (M-1/n) avec un element de A
    liens:
    - vers: topo-n-0022
      texte: a vu seul que le sup est dans l'adhérence de A (suite qui tend vers M)
    liens_manquants: []
    confusions:
    - date: 2026-11-08
      texte: pour une suite d'éléments de A qui tend vers M = sup A, propose M - 1/n au lieu de x_n dans A avec M - 1/n < x_n <= M
      statut: ouverte
    - date: 2026-11-08
      texte: 'résolvant 1 - 1/n > 1 - eps : renverse mal l''inégalité (n < 1/99 au lieu de n > 100) et mélange eps avec la borne M - eps'
      statut: reparee
    - date: 2026-11-08
      texte: justifie sup ]0,1[ = 1 par « 1 < 2 » (plus petit que UN majorant) au lieu de « plus petit de TOUS les majorants »
      statut: reparee
    preuves:
    - date: 2026-11-08
      source: cours
      extrait: avec le milieu (c+1)/2, montre que c < 1 n'est pas un majorant de ]0,1[
      verdict: juste
    - date: 2026-11-08
      source: cours
      extrait: écrit l'encadrement M - 1/n < x_n <= M, mais voit la convergence comme une condition et non comme conséquence des gendarmes
      verdict: partiel
    - date: 2026-11-08
      source: question
      extrait: 'A={1-1/k^2} : sup=1, pas de max, suite 1-1/k^2 ; 1-1/2 hors de A seulement après avoir précisé k entier'
      verdict: juste
    - date: &id001 2026-11-09
      source: cours
      extrait: 'sup ]0,1[=1 : x=1-1/n, n>1/lambda, renverse bien l inegalite (n>100) ; oublie n>=2 pour que x soit dans ]0,1['
      verdict: partiel
    - date: *id001
      source: cours
      extrait: c<1 majorant impossible via le milieu (c+1)/2, trouve seul le jour suivant
      verdict: juste
    - date: *id001
      source: question
      extrait: propose a nouveau M-1/n comme suite de A (A={0,1}) ; trouve x_n dans la fenetre apres relance
      verdict: faux
    maj: *id001
  topo-n-0008:
    niveau: fragile
    vision: distance = application de X dans R+ avec positivité, séparation, symétrie, inégalité triangulaire ; la triangulaire, il la voit comme une « égalité des pentes »
    liens:
    - vers: topo-n-0011
      texte: voit que les boules ouvertes/fermées se cassent sans l'inégalité triangulaire
    liens_manquants: []
    confusions:
    - date: 2026-11-08
      texte: ne sait pas dire ce que garantit l'inégalité triangulaire ni ce qui casse sans elle (parle de pentes)
      statut: ouverte
    - date: 2026-11-08
      texte: 'séparation : ne pense qu''à d=0 => x=y (oublie d(x,x)=0) ; et prouve f=0 => N(f)=0 au lieu de N(f)=0 => f=0'
      statut: ouverte
    preuves:
    - date: 2026-11-08
      source: question
      extrait: 'd(x,y)=|x-y|^2 : calcule d(0,2)=4 > 2=d(0,1)+d(1,2), conclut que ce n''est pas une distance'
      verdict: juste
    - date: 2026-11-08
      source: exercice
      exercice: topo-td1-ex08
      extrait: 'distance discrète : disjonction de cas correcte pour la triangulaire'
      verdict: juste
    - date: 2026-11-08
      source: exercice
      exercice: topo-uvsq-td1-ex03q1
      extrait: séparation prouvée dans le mauvais sens, pas de condition sur g
      verdict: faux
    - date: *id001
      source: exercice
      extrait: 'separation ecrite dans le bon sens : N(f)=0 => f=0 ; suffisance (g!=0 dense) juste, reciproque non vue'
      verdict: partiel
      exercice: topo-uvsq-td1-ex03q1
    maj: *id001
  topo-n-0011:
    niveau: fragile
    vision: boule ouverte = disque sans le bord ; sphère = le contour ; pense en cercle euclidien
    liens: []
    liens_manquants:
    - vers: topo-n-0010
      texte: 'les boules ne sont pas rondes en général (carré pour d_infini) ni vides : a une boule non vide par centre'
    confusions:
    - date: 2026-11-08
      texte: boule fermée = « juste le cercle » (c'est la sphère) ; la boule fermée contient l'aire et le bord
      statut: ouverte
    - date: 2026-11-08
      texte: 'distance discrète : dit B(a,1) = vide (oublie que le centre est dans sa boule, d(a,a)=0<r) puis se contredit'
      statut: reparee
    preuves:
    - date: 2026-11-08
      source: question
      extrait: redonne B(a,1)={a}, S(a,1)=X\{a}, B-bar(a,1)=X, B(a,2)=X, après relance
      verdict: partiel
    - date: 2026-11-08
      source: exercice
      exercice: topo-td1-ex08
      extrait: cas r<1, r=1, r>1 bien séparés ; B(a,r) donné sans montrer a dans la boule
      verdict: partiel
    - date: *id001
      source: exercice
      extrait: 'distance discrete : B(a,r)={a} pour r<=1, X pour r>1 ; boule fermee X des r=1 ; centre dans sa boule'
      verdict: juste
      exercice: topo-td1-ex08
    maj: *id001
  topo-n-0012:
    niveau: fragile
    vision: les ouverts d'une distance = les boules ouvertes ({a}, X, vide pour la distance discrète)
    liens: []
    liens_manquants:
    - vers: topo-n-0014
      texte: une boule est un ouvert, mais un ouvert est une réunion de boules, pas une boule
    confusions:
    - date: 2026-11-08
      texte: 'confond ouvert et boule ouverte : écrit que les ouverts de la métrique discrète sont {{a},{X},vide} au lieu de toutes les parties'
      statut: ouverte
    preuves:
    - date: 2026-11-08
      source: exercice
      exercice: topo-td1-ex08
      extrait: 'ouverts de (X, d discrète) : liste fausse ; fermés non traités'
      verdict: faux
    - date: 2026-11-08
      source: question
      extrait: 'à froid : décrit les boules au lieu des ouverts, puis redit « les ouverts sont les boules ouvertes »'
      verdict: faux
    - date: *id001
      source: question
      extrait: 'ouverts de la metrique discrete : retrouve {x}=B(x,1) ouvert puis toute partie ouverte, apres relance (non ecrit dans la reprise)'
      verdict: partiel
      exercice: topo-td1-ex08
    maj: *id001
  topo-n-0015:
    niveau: fragile
    vision: d(A,B) = inf des d(a,b) ; pense qu'il faut calculer l'inf exactement, pas qu'il suffit d'une suite de couples
    liens: []
    liens_manquants:
    - vers: topo-p-0004
      texte: ne relie pas « inf = 0 » à la caractérisation de l'inf vue en début de séance (pour tout eps, une distance < eps)
    confusions:
    - date: 2026-11-08
      texte: pour montrer inf d(a,b)=0, cherche à minimiser une racine au lieu d'exhiber des couples (n,1/n),(n,0) à distance 1/n -> 0
      statut: reparee
    - date: 2026-11-08
      texte: 'fermés disjoints à distance nulle : {1/n} (non fermé) puis (x,1/x) fermé affirmé sans preuve'
      statut: reparee
    - date: &id002 2026-11-21
      texte: 'ex08 : U_n décrit comme une boule centrée en x de rayon 1/n ; c''est {x : d(x,F)<1/n}, réunion des boules B(y,1/n), y dans F'
      statut: ouverte
    preuves:
    - date: 2026-11-08
      source: exercice
      exercice: topo-td1-ex09
      extrait: voit seul que {(1/n,0)} n'est pas fermé (0 dans l'adhérence, hors de A)
      verdict: partiel
    - date: *id001
      source: exercice
      extrait: exhibe (n,0),(n,1/n) a distance 1/n -> 0 ; B={xy>=1} ferme par image reciproque ; Q2 (dans R) non faite
      verdict: partiel
      exercice: topo-td1-ex09
    - date: *id002
      source: exercice
      exercice: topo-uvsq-td1-ex08
      extrait: 'ex08 : écrit F = inter des X\{y} (non dénombrable) ; méthode U_n et ligne clé d(x,F)=0 => x dans F données (palier 3)'
      verdict: partiel
    - date: &id003 2026-11-23
      source: question
      extrait: 'pourquoi F = inter U_n et U_n ouvert : dit « réunion de boules » puis « intersection », double inclusion non terminée'
      verdict: partiel
    maj: *id003
  topo-n-0022:
    niveau: fragile
    vision: adhérence = plus petit fermé ; il connaît 5 caractérisations mais ne sait pas laquelle utiliser
    liens:
    - vers: topo-n-0028
      texte: ℚ dense dans ℝ donc adhérence ℝ
    liens_manquants: []
    confusions:
    - date: 2026-11-08
      texte: 'lit « 0 < |z| » comme « |z| >= 0 » : prend le disque fermé privé de 0 pour un fermé'
      statut: ouverte
    - date: 2026-11-08
      texte: croit que 1/n -> 0 montre 1/n dans l'adhérence de A = R\{1/n} (cela montre 0 adhérent à {1/n}) ; écrit « adhérence incluse dans A » (A est inclus dans son adhérence)
      statut: ouverte
    - date: &id004 2026-11-19
      texte: 'dit que les irrationnels sont des points isolés de Q : un point isolé appartient à l''ensemble ; Q n''a aucun point isolé, les irrationnels sont des points d''accumulation de Q'
      statut: ouverte
    preuves:
    - date: 2026-11-08
      source: exercice
      exercice: topo-td1-ex07
      extrait: cas 1 juste ; cas 2 faux (strict/large) ; cas 3 bonne conclusion, argument à l'envers
      verdict: partiel
    - date: 2026-11-08
      source: question
      extrait: 'A=]0,1[ u {2} : Ā et int justes d''abord, puis retire 2 de Ā avec des suites de ]0,1[ au lieu de suites de A'
      verdict: partiel
    - date: *id002
      source: exercice
      exercice: topo-uvsq-td1-ex15q2
      extrait: 'ex15q2 : {f>=0} fermé par suites et contient P (juste) ; manque f+1/n et P ouvert (paliers 1-2)'
      verdict: partiel
    maj: *id003
  topo-n-0043:
    niveau: fragile
    vision: x est dans l'adhérence de U s'il est limite d'éléments de U ; avec f continue nulle sur U, f est nulle sur l'adhérence
    liens: []
    liens_manquants:
    - vers: topo-n-0022
      texte: utilise la continuité par suites f(lim t_n)=lim f(t_n) seulement après qu'on la lui a rappelée
    confusions: []
    preuves:
    - date: 2026-11-08
      source: cours
      extrait: a refait seul l'argument t_n -> x, f(t_n)=0, donc f(x)=0, après explication (exemple g(t)=t)
      verdict: juste
    - date: *id001
      source: exercice
      extrait: f nulle sur {g!=0} dense + f continue + caracterisation sequentielle => f=0 sur son adherence
      verdict: juste
      exercice: topo-uvsq-td1-ex03q1
    - date: *id002
      source: exercice
      exercice: topo-uvsq-td1-ex09q2
      extrait: 'ex09q2 : 1/n -> 0 et 0 dans K donc K fermé (oral) ; produit de fermés fermé utilisé sans preuve (hors poly)'
      verdict: partiel
    maj: *id003
  topo-n-0028:
    niveau: fragile
    vision: 'dense = adhérence égale à tout l''espace ; il a l''intuition du « mince filet » du bord qui se rattrape par l''adhérence ; a retrouvé seul : dense dans X <=> int(complémentaire) vide, à condition
      de préciser l''espace ambiant X ; dense <=> rencontre tout ouvert non vide'
    liens:
    - vers: topo-n-0023
      texte: a trouvé seul int(A^c) = X \ adhérence(A)
    - vers: topo-n-0023
      texte: A dense dans X <=> int(A^c)=vide (via int(A^c)=X \ adh(A)), généralisé seul
    liens_manquants: []
    confusions:
    - date: 2026-11-08
      texte: 'test des boules : écrit adhérence(S) inter B(x,r) non vide au lieu de S inter B(x,r) non vide ; et « y dans un ouvert donc y intérieur à A » (faux)'
      statut: ouverte
    - date: 2026-11-08
      texte: 'densité de {g != 0} <=> g non nulle sur aucun intervalle : lit « ne s''annule sur aucun intervalle » comme « ne s''annule jamais »'
      statut: ouverte
    preuves:
    - date: 2026-11-08
      source: exercice
      exercice: topo-td1-ex13
      extrait: retrouve int(A^c)=X\adh(A) seul ; la suite de la preuve est confuse, preuve en 2 lignes donnée
      verdict: partiel
    - date: *id001
      source: exercice
      extrait: 'A U int(A^c) dense : structure finale juste mais fin faite avec la correction'
      verdict: partiel
      exercice: topo-td1-ex13
    - date: *id004
      source: cours
      extrait: 'Q dense dans R : idée « se déplacer à côté de x » ; propose x+r/2 (pas rationnel) ; floor(nx)/n après indice ; Archimède pas connu comme tel'
      verdict: partiel
    - date: *id002
      source: exercice
      exercice: topo-td1-ex14
      extrait: 'ex14 oral : U ouvert non vide, U inter A ouvert, B dense ; oublie que A dense rend U inter A non vide ; contre-exemple Q / Q^c juste'
      verdict: partiel
    maj: *id003
  topo-n-0023:
    niveau: fragile
    vision: 'int(A^c) = X \ adhérence(A) : complémentaire de l''adhérence = intérieur du complémentaire'
    liens:
    - vers: topo-n-0028
      texte: l'identité sert à montrer que A union int(A^c) est dense
    liens_manquants: []
    confusions: []
    preuves:
    - date: 2026-11-08
      source: exercice
      exercice: topo-td1-ex13
      extrait: écrit lui-même int(A^c) = X\A-bar sur sa copie
      verdict: juste
    - date: *id004
      source: cours
      extrait: 'retrouve int(A^c)=X \ adh(A) et en déduit int(Q^c)=vide ; généralise : A dense dans X <=> int(A^c)=vide'
      verdict: juste
    maj: *id003
  topo-n-0003:
    niveau: fragile
    vision: ouverts stables par reunion quelconque ; croit que l'intersection infinie d'ouverts est ouverte
    liens: []
    liens_manquants: []
    confusions:
    - date: *id001
      statut: ouverte
      texte: 'justifie par la stabilite par intersection qu''une intersection INFINIE d''ouverts est ouverte (ex05 Q3) : seule l''intersection finie est stable'
    preuves:
    - date: *id001
      source: question
      extrait: dit non pour l'intersection infinie, mais ne trouve pas d'exemple (donne ]-1/n,1/n[ -> {0})
      verdict: partiel
      exercice: topo-td1-ex05
    maj: *id001
  topo-n-0007:
    niveau: fragile
    vision: 'metrique discrete : boules {a} et X ; toute partie est ouverte et fermee (retrouve apres relance)'
    liens: []
    liens_manquants: []
    confusions: []
    preuves:
    - date: *id001
