      texte: inverse encore inter et union (ex05 Q1 ecrit union-inter pour limsup) ; dit une coquille orale, mais revient ; associe d'abord limsup a a partir d'un rang
    preuves:
    - date: 2026-11-10
      source: cours
      extrait: confond infinite de n et a partir d'un rang ; exemple pile/face compris, formules ∪∩/∩∪ retrouvees apres relance
      verdict: partiel
    - date: 2026-11-10
      source: cours
