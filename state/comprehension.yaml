      verdict: partiel
      exercice: mes-td1-ex06
    maj: *id001
  mesure-n-0003:
    niveau: fragile
    vision: 'indicatrice = 0 ou 1 ; 1_{A^c}=1-1_A, 1_{A inter B}=produit ; reunion : a dit min puis corrige en max ; formule 1_A+1_B-1_AB retrouvee'
    liens: []
    liens_manquants:
    - vers: mesure-n-0005
      texte: sup des indicatrices = indicatrice de la reunion ; veut une definition avec epsilon au lieu de raisonner dans {0,1}
    confusions:
    - date: *id001
      statut: ouverte
      texte: 'Q4 ex06 : ne voit pas limsup 1_{A_n} = 1_{limsup A_n} seul ; part sur epsilon-N alors qu''une suite decroissante de {0,1} est constante'
