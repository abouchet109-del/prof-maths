style:
- 'pense à voix haute, mélange exemple et cas général (lui redonner le fil) ; comprend par un chiffre concret puis généralise'
- 'confond stricte/large, sens des implications et inter/union (dit coquille orale, mais revient à l''écrit) : lui faire tester sur un chiffre'
- 'abandonne la méthode quand le résultat paraît absurde au lieu de revérifier la dernière étape ; demande la réponse pour finir un calcul : ne créditer que ce qui est écrit'
- 'bloque plus sur la redaction ecrite que sur l''idee ; saute les justifications qu''il juge ''immediates'' (vide dans T_n, denombrabilite, bien defini) : lui faire ecrire la sous-partie manquante'
- 'dit « inattention » pour des confusions de fond (ouvert/boule ouverte) : trancher cas par cas'
- 'bon réflexe : retrouve seul des identités et fait des liens (sup dans l''adhérence)'
