  mod-p-0003:
    niveau: fragile
    vision: "R = sup des r tels que (a_n r^n) bornée ; convergence normale sur tout segment fermé de ]-R,R[ mais pas sur l'ouvert entier (contre-exemple sum x^n) ; preuve : choisir rho entre r et R, borner |a_n| rho^n par M, comparer à une géométrique"
