      extrait: boules de la distance discrete justes ; ouverts/fermes (toutes les parties) non ecrits
      verdict: partiel
      exercice: topo-td1-ex08
    maj: *id001
  mesure-n-0005:
    niveau: fragile
    vision: limsup = infiniment souvent (inter des unions), liminf = a partir d'un rang (union des inter) ; retrouve en depliant les quantificateurs, avait d'abord inverse
    liens:
    - vers: mesure-n-0004
      texte: 'limsup d''ensembles comme limsup de suites : sup devient reunion, inf devient intersection'
    liens_manquants:
    - vers: mesure-n-0003
      texte: 'limsup des indicatrices = indicatrice du limsup : n''a pas vu le lien seul, refait avec les etapes'
    confusions:
    - date: *id001
      statut: ouverte
      texte: 'ex06 Q1 : ecrit limsup=F inter G (resultat du liminf reporte sans recalcul) ; au cours associait d''abord limsup a ''a partir d''un rang'''
    preuves:
