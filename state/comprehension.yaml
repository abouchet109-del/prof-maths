      source: exercice
      extrait: 'Q2 : sigma-additivite en deux cas ; nu(vide)=0 et nu bien definie oublies'
      verdict: partiel
      exercice: mes-cc1-2324-ex01
    maj: *id001
  mesure-n-0042:
    niveau: fragile
    vision: 'ensemble negligeable : sous-additivite et monotonie ; lit la monotonie a l''envers quand il cherche l''indice'
    liens: []
    liens_manquants: []
    confusions:
    - date: *id001
