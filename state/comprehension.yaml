  proba-n-0002:
    niveau: fragile
    vision: la continuite en croissant (reunion) et en decroissant (intersection) equivaut a la sigma-additivite ; passe de l'une a l'autre par complementaire
    liens: []
    liens_manquants: []
    confusions:
    - date: 2026-11-10
      statut: ouverte
      texte: melange les noms continuite croissante/decroissante ; definition ou theoreme selon le point de depart (sa prepa part de la sigma-additivite)
