    maj: *id001
  proba-p-0001:
    niveau: fragile
    vision: limsup = infiniment souvent = inter des unions ; liminf = a partir d'un rang = union des inter ; le complementaire de limsup est le liminf des complementaires
    liens:
    - vers: proba-n-0117
      texte: 'Borel-Cantelli : P(limsup A_n)=0 si la serie converge ; la definition ∩∪ sert a majorer P(∪ k>=n)'
    liens_manquants: []
    confusions:
    - date: 2026-11-10
