- id: ex-mes-ex-2526-ex01
  exercice: mes-ex-2526-ex01
  notion: mesure-n-0021
  recto: |-
    <b>Exo mes-ex-2526-ex01 : troncature d'une fonction mesurable</b><br>
    Soit \((X,\mathcal T)\) un espace mesurable et \(f:X\to\mathbb R\) mesurable. On définit \(g:X\to\mathbb R\) par \(g(x)=1\) si \(f(x)>1\), \(g(x)=f(x)\) si \(|f(x)|\le1\), \(g(x)=-1\) si \(f(x)<-1\).<br>
    1. Montrer que \(-1\le g(x)\le1\) pour tout \(x\in X\).<br>
    2. Caractériser \(\{g\le\alpha\}\) pour tout \(\alpha\in\mathbb R\).<br>
    3. En déduire que \(g\) est mesurable.<br>
    <b>Méthode ? Étape clé ?</b>
  verso: |-
    <b>Idée clé :</b> pour montrer la mesurabilité d'une fonction réelle, on montre \(\{g\le\alpha\}\in\mathcal T\) pour tout \(\alpha\) (ou \(\{g\ge a\}\)). On découpe selon \(\alpha\) en 3 cas et on ramène chaque ensemble à \(\emptyset\), \(X\) ou \(\{f\le\alpha\}\), qui sont dans \(\mathcal T\) car \(f\) est mesurable.<br>
    <b>Correction :</b><br>
    1. Si \(|f(x)|\le1\), \(g(x)=f(x)\in[-1,1]\) ; sinon \(g(x)=\pm1\). Dans tous les cas \(-1\le g(x)\le1\).<br>
    2. Si \(\alpha<-1\) : \(\{g\le\alpha\}=\emptyset\). Si \(\alpha\ge1\) : \(\{g\le\alpha\}=X\). Si \(\alpha\in[-1,1[\) : \(\{g\le\alpha\}=\{f\le\alpha\}\) (si \(f(x)<-1\), \(g(x)=-1\le\alpha\) et \(f(x)\le\alpha\) ; si \(|f(x)|\le1\), \(g(x)=f(x)\) ; si \(f(x)>1\), \(g(x)=1>\alpha\) et \(f(x)>\alpha\), donc \(x\) n'est dans aucun des deux).<br>
    3. \(\emptyset\in\mathcal T\), \(X=\emptyset^c\in\mathcal T\), et \(\{f\le\alpha\}=f^{-1}(]-\infty,\alpha])\in\mathcal T\) car \(f\) est mesurable. Donc \(\{g\le\alpha\}\in\mathcal T\) pour tout \(\alpha\) : \(g\) est mesurable.<br>
    <b>Piège :</b> ne pas confondre les cas : pour \(\alpha\ge1\), \(\{g\le\alpha\}\) est tout \(X\) (pas \(\{f\le\alpha\}\)), et pour \(\alpha=-1\) c'est \(\{f\le-1\}\) (pas \(\{f>1\}\), où \(g=1\)). Tester chaque cas sur les trois zones de \(f\) (\(f<-1\), \(|f|\le1\), \(f>1\)).<br>
    <b>Coquilles / points d'attention :</b> le tableau du 2 écrit en séance était faux dans quatre cas sur cinq ; ne garder que 3 cas (\(\alpha<-1\), \(-1\le\alpha<1\), \(\alpha\ge1\)) ; au 3, dire que chaque ensemble est l'image réciproque d'un intervalle (donc borélien) par \(f\) mesurable ; au 1, \(g(x)\in\{-1,1\}\) pour \(|f(x)|>1\), pas \(]-1,1[\).
  source: 'Énoncé : uvsq/mesure/Théorie de la mesure/Annales/examen.pdf p.1 (Ex 1). Corrigé officiel : examen-corrige.pdf p.1.'
