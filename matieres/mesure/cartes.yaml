- id: mesure-a-049-1
  notion: mesure-n-0007
  recto: 'Prop. 0.3 : lois de Morgan'
  verso: 'Pour toute famille \((A_i)_{i\in I}\) de parties d''un ensemble : \(\big(\bigcap_{i\in I}A_i\big)^c=\bigcup_{i\in I}A_i^c\) et \(\big(\bigcup_{i\in I}A_i\big)^c=\bigcap_{i\in I}A_i^c\).<br>En conséquence : \(\big(\limsup_{n\to+\infty}A_n\big)^c=\liminf_{n\to+\infty}A_n^c\).'
  source: Poly Mesure et intégration, Préliminaires, p. 4 (PDF)
