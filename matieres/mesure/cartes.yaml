- id: mesure-a-051-1
  notion: mesure-n-0045
  recto: 'Thm (CM du 20/10) : fonction de répartition d''une mesure finie sur \(\mathbb R\), mesure de Stieltjes'
  verso: '1) Soit \(\mu\) une mesure finie sur \((\mathbb R,\mathcal B(\mathbb R))\). On définit pour tout \(x\in\mathbb R\), \(F_\mu(x)=\mu(]-\infty,x])\). La fonction \(F_\mu\) est croissante, bornée, continue à droite, et \(\lim_{x\to-\infty}F_\mu(x)=0\).<br>2) Inversement, soit \(F:\mathbb R\to\mathbb R_+\) croissante, bornée, continue à droite et telle que \(\lim_{x\to-\infty}F(x)=0\) ; alors il existe une unique mesure \(\mu\) finie sur \((\mathbb R,\mathcal B(\mathbb R))\) telle que \(F=F_\mu\). On appelle \(\mu\) la mesure de Stieltjes associée à \(F\).<br>Rem. : lorsque \(F=F_\mu\), on note souvent \(\mu(dx)=dF(x)\) ; si \(F\) est \(\mathcal C^1\), \(dF(x)=F''(x)\,dx\).'
  source: CM Mesure et intégration du 20/10/2026, p. 3
  chapitre: Chapitre 1 - Tribus, espaces mesurables et applications mesurables
  priorite: 2
  tags:
  - theoreme

