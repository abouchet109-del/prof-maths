# Cartes de mesure et intégration (Paris Cité L3, UVSQ pour les notions etab: uvsq). Pages = repères "--- page N ---" du PDF (diapo pour l'UVSQ).
- id: mesure-a-001-1
  notion: mesure-n-0002
  recto: 'Prop. 0.1 (point 3) : image réciproque d''une réunion et d''une intersection'
  verso: 'Soit \(f:\Omega\to E\) une application de \(\Omega\) dans un ensemble \(E\).<br>Si \((A_i)_{i\in I}\) est une famille quelconque de parties de \(E\), \(f^{-1}(\cup_{i\in I}A_i)=\cup_{i\in I}f^{-1}(A_i)\) et \(f^{-1}(\cap_{i\in I}A_i)=\cap_{i\in I}f^{-1}(A_i)\).<br>(le poly écrit « parties de \(\Omega\) » : coquille, les \(A_i\) sont des parties de \(E\))'
  source: 'Poly de mesure Paris Cité, ch. 0, Prop. 0.1, p. 3'
  chapitre: 'Chapitre 0 - Préliminaires'
  priorite: 2
  tags: [propriete]
- id: mesure-a-001-2
  notion: mesure-n-0002
  recto: 'Prop. 0.1 (point 4) : image réciproque d''un complémentaire'
  verso: 'Soit \(f:\Omega\to E\) une application de \(\Omega\) dans un ensemble \(E\) et \(A\) une partie de \(E\).<br>\(\complement_\Omega(f^{-1}(A))=f^{-1}(\complement_E A)\).'
  source: 'Poly de mesure Paris Cité, ch. 0, Prop. 0.1, p. 3'
  chapitre: 'Chapitre 0 - Préliminaires'
  priorite: 2
  tags: [propriete]
- id: mesure-a-001-3
  notion: mesure-n-0002
  recto: 'Prop. 0.1 (point 2) : monotonie de l''image réciproque'
  verso: 'Soit \(f:\Omega\to E\) une application de \(\Omega\) dans un ensemble \(E\).<br>Si \(A\subseteq B\), alors \(f^{-1}(A)\subseteq f^{-1}(B)\).'
  source: 'Poly de mesure Paris Cité, ch. 0, Prop. 0.1, p. 3'
  chapitre: 'Chapitre 0 - Préliminaires'
  priorite: 2
  tags: [propriete]

- id: mesure-a-002-1
  notion: mesure-n-0005
  recto: 'Déf : limite supérieure d''une suite d''ensembles'
  verso: 'Soit \((A_n)_{n\ge1}\) une suite dénombrable de sous-ensembles d''un ensemble \(X\). On définit la limite supérieure de la suite \(A_n\) par :<br>\(\limsup_{n\to+\infty}A_n=\bigcap_{n\ge1}\bigcup_{k\ge n}A_k=\{x\in X : \forall n\ge1,\ \exists k\ge n,\ \text{tel que } x\in A_k\}=\{x\in X : x\in A_k \text{ infiniment souvent}\}\).'
  source: 'Poly de mesure Paris Cité, ch. 0, p. 4'
  chapitre: 'Chapitre 0 - Préliminaires'
  priorite: 1
  tags: [definition]
- id: mesure-a-002-2
  notion: mesure-n-0005
  recto: 'Déf : limite inférieure d''une suite d''ensembles'
  verso: 'Soit \((A_n)_{n\ge1}\) une suite dénombrable de sous-ensembles d''un ensemble \(X\). On définit la limite inférieure de la suite \(A_n\) par :<br>\(\liminf_{n\to+\infty}A_n=\bigcup_{n\ge1}\bigcap_{k\ge n}A_k=\{x\in X : \exists n\ge1,\ \forall k\ge n,\ \text{tel que } x\in A_k\}=\{x\in X : x\in A_k \text{ à partir d''un certain rang}\}\).'
  source: 'Poly de mesure Paris Cité, ch. 0, p. 4'
  chapitre: 'Chapitre 0 - Préliminaires'
  priorite: 1
  tags: [definition]

- id: mesure-a-003-1
  notion: mesure-n-0006
  recto: 'Prop. 0.2 : limites supérieure et inférieure et valeurs d''adhérence'
  verso: 'Soit \((u_n)_{n\ge0}\) une suite à valeurs réelles. Alors<br>\(\limsup_{n\to+\infty}u_n=\max\{\ell\in\overline{\mathbb R} : \ell \text{ valeur d''adhérence de } (u_n)_{n\ge0}\}\)<br>\(\liminf_{n\to+\infty}u_n=\min\{\ell\in\overline{\mathbb R} : \ell \text{ valeur d''adhérence de } (u_n)_{n\ge0}\}\).'
  source: 'Poly de mesure Paris Cité, ch. 0, Prop. 0.2, p. 4'
  chapitre: 'Chapitre 0 - Préliminaires'
  priorite: 2
  tags: [propriete]

- id: mesure-a-004-1
  notion: mesure-n-0009
  recto: 'Exemple 1.2 (point 1) : tribu grossière'
  verso: 'Soit \(X\) un ensemble. Tribu grossière : \(T=\{\emptyset,X\}\).'
  source: 'Poly de mesure Paris Cité, ch. 1, Ex. 1.2, p. 5'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [exemple]
- id: mesure-a-004-2
  notion: mesure-n-0009
  recto: 'Exemple 1.2 (point 2) : tribu triviale (nom du poly)'
  verso: 'Soit \(X\) un ensemble. \(T=\mathcal P(X)\) est une tribu sur \(X\) : la tribu discrète.<br>(le poly écrit « tribu triviale » pour \(\mathcal P(X)\) ; usuellement, « triviale » désigne \(\{\emptyset,X\}\), que le poly appelle « grossière »)'
  source: 'Poly de mesure Paris Cité, ch. 1, Ex. 1.2, p. 5'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [exemple]
- id: mesure-a-004-3
  notion: mesure-n-0009
  recto: 'Exemple 1.2 (point 3) : tribu engendrée par une partie'
  verso: 'Soit \(X\) un ensemble et \(A\subset X\). \(T=\{\emptyset,A,A^c,X\}\) est une tribu. C''est la plus petite tribu contenant le sous-ensemble \(A\).'
  source: 'Poly de mesure Paris Cité, ch. 1, Ex. 1.2, p. 5'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [exemple]

- id: mesure-a-005-1
  notion: mesure-n-0015
  recto: 'Rem. 1.7 : mesurabilité de l''indicatrice'
  verso: 'Si \(A\subset X\), \(X\) muni de la tribu \(\mathcal A\), on constate que la fonction indicatrice \(\mathbf 1_A\) est mesurable ssi \(A\in\mathcal A\).'
  source: 'Poly de mesure Paris Cité, ch. 1, Rem. 1.7, p. 6'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [propriete]

- id: mesure-a-006-1
  notion: mesure-n-0017
  recto: 'Lemme 1.9 : tribu image réciproque'
  verso: 'Soit \(f:X\to Y\) une application et \(\mathcal B\) une tribu sur \(Y\). Alors \(f^{-1}(\mathcal B)\) est une tribu sur \(X\). On l''appelle tribu image réciproque de \(\mathcal B\) par \(f\).'
  source: 'Poly de mesure Paris Cité, ch. 1, Lemme 1.9, p. 6'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 2
  tags: [propriete]
- id: mesure-a-006-2
  notion: mesure-n-0017
  recto: 'Lemme 1.9 (application) : tribu trace'
  verso: 'Soit \(X\subset Y\) et \(\mathcal B\) une tribu sur \(Y\). Alors l''ensemble \(\{X\cap B : B\in\mathcal B\}\) est une tribu sur \(X\), appelée la tribu trace de \(\mathcal B\) sur \(X\).'
  source: 'Poly de mesure Paris Cité, ch. 1, Lemme 1.9, p. 6'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 2
  tags: [propriete]

- id: mesure-a-007-1
  notion: mesure-n-0018
  recto: 'Lemme 1.10 : tribu induite'
  verso: 'Soit \(f:X\to Y\) une application et \(\mathcal A\) une tribu sur \(X\). Alors l''ensemble \(\mathcal B=\{B\subset Y : f^{-1}(B)\in\mathcal A\}\) est une tribu sur \(Y\) appelée tribu induite de \(\mathcal A\) par \(f\) sur \(Y\).'
  source: 'Poly de mesure Paris Cité, ch. 1, Lemme 1.10, p. 6'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 2
  tags: [propriete]

- id: mesure-a-008-1
  notion: mesure-n-0019
  recto: 'Lemme 1.11 : image réciproque de la tribu engendrée'
  verso: 'Soit \(f:X\to Y\) et \(\mathcal E\subset\mathcal P(Y)\). Alors \(f^{-1}(\sigma(\mathcal E))=\sigma(f^{-1}(\mathcal E))\).'
  source: 'Poly de mesure Paris Cité, ch. 1, Lemme 1.11, p. 6'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 2
  tags: [propriete]
- id: mesure-a-008-2
  notion: mesure-n-0019
  recto: 'Lemme 1.11 (application 1) : tribu borélienne d''un sous-espace'
  verso: 'Soit \(Y\) un espace topologique muni de la tribu \(\mathcal B(Y)\) et \(X\subset Y\) muni de la topologie induite. Alors \(\mathcal B(X)=\{A\cap X : A\in\mathcal B(Y)\}\).'
  source: 'Poly de mesure Paris Cité, ch. 1, Lemme 1.11, application 1, p. 6'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 2
  tags: [propriete]
- id: mesure-a-008-3
  notion: mesure-n-0019
  recto: 'Lemme 1.11 (application 2) : tribu borélienne de \(\overline{\mathbb R}\)'
  verso: 'En prenant \(X=\mathbb R\), \(Y=\overline{\mathbb R}\), on montre que (avec les résultats précédents sur \(\mathcal B(\mathbb R)\)) :<br>\(\mathcal B(\overline{\mathbb R})=\sigma(\{[a,+\infty],\ a\in\mathbb R\})=\sigma(\{]a,+\infty],\ a\in\mathbb R\})\).'
  source: 'Poly de mesure Paris Cité, ch. 1, Lemme 1.11, application 2, p. 6'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 2
  tags: [propriete]

- id: mesure-a-009-1
  notion: mesure-n-0029
  recto: 'Exemple 1.21 : mesure trace'
  verso: 'Soit \(\mu\) une mesure sur \((X,\mathcal A)\) et \(B\in\mathcal A\). La mesure trace de \(\mu\) sur \(B\) est la mesure définie par : pour tout \(A\in\mathcal A\), \(\mu_B(A)=\mu(A\cap B)\).'
  source: 'Poly de mesure Paris Cité, ch. 1, Ex. 1.21, p. 8'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [exemple]
- id: mesure-a-009-2
  notion: mesure-n-0029
  recto: 'Exemple 1.21 : mesure conditionnelle'
  verso: 'Soit \(\mu\) une mesure sur \((X,\mathcal A)\) et \(B\in\mathcal A\) avec \(0 < \mu(B) < +\infty\). La mesure conditionnelle sachant \(B\) est définie par : pour tout \(A\in\mathcal A\), \(\mu(A|B)=\dfrac{\mu(A\cap B)}{\mu(B)}=\dfrac{\mu_B(A)}{\mu(B)}\).<br>(le poly écrit seulement « si \(\mu(B)\neq0\) » ; il faut aussi \(\mu(B) < +\infty\) pour que le quotient ait un sens)'
  source: 'Poly de mesure Paris Cité, ch. 1, Ex. 1.21, p. 8'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [exemple]

- id: mesure-a-010-1
  notion: mesure-n-0030
  recto: 'Exemple 1.21 : mesure de probabilité sur \(\mathbb N\) déterminée par les singletons'
  verso: 'Toute mesure de probabilité sur \((\mathbb N,\mathcal P(\mathbb N))\) est déterminée par ses valeurs sur les singletons. En effet, soit \(\mu\) une mesure de probabilité sur \((\mathbb N,\mathcal P(\mathbb N))\), alors pour tout \(A\subset\mathbb N\), \(\mu(A)=\mu\left(\bigcup_{k\in A}\{k\}\right)=\sum_{k\in A}\mu(\{k\})\), où l''on a utilisé dans la dernière égalité le fait que \(A\) est au plus dénombrable.'
  source: 'Poly de mesure Paris Cité, ch. 1, Ex. 1.21, p. 8'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 2
  tags: [exemple]
- id: mesure-a-010-2
  notion: mesure-n-0030
  recto: 'Exemple 1.21 : mesure de probabilité associée à une suite \((p_k)\)'
  verso: 'Si l''on se donne une suite \((p_k)_{k\in\mathbb N}\) de réels positifs vérifiant \(\sum_{k\in\mathbb N}p_k=1\), alors l''application \(\mu:\mathcal P(\mathbb N)\to[0,1]\), \(A\mapsto\sum_{k\in A}p_k\) est une mesure de probabilité sur \((\mathbb N,\mathcal P(\mathbb N))\).<br>En effet, pour des \(A_n\in\mathcal P(\mathbb N)\) deux à deux disjoints, \(\mu\left(\bigcup_nA_n\right)=\sum_{k\in\cup_nA_n}p_k=\sum_{n\in\mathbb N}\sum_{k\in A_n}p_k=\sum_{n\in\mathbb N}\mu(A_n)\) ; trivialement \(\mu(\emptyset)=0\), et \(\mu(\mathbb N)=\sum_kp_k=1\).<br>(le poly écrit « suite de réels » et « soit \(A_n\in\mathcal P(\mathbb N)\) » : il faut \(p_k\ge0\) et des \(A_n\) deux à deux disjoints)'
  source: 'Poly de mesure Paris Cité, ch. 1, Ex. 1.21, p. 8'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 2
  tags: [exemple]

- id: mesure-a-011-1
  notion: mesure-n-0032
  recto: 'Prop. (i) : croissance de \(\mu\)'
  verso: 'Soit \((X,\mathcal A,\mu)\) un espace mesuré et \(A,B\in\mathcal A\).<br>Si \(A\subset B\), alors \(\mu(A)\le\mu(B)\) (\(\mu\) est croissante pour l''inclusion).<br>De plus, dans le cas \(A\subset B\) : \(\mu(B)=\mu(A)+\mu(B\setminus A)\).'
  source: 'Cours Paris Cité, notes du CM du 13/10/2026, p. 1'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [propriete]
- id: mesure-a-011-2
  notion: mesure-n-0032
  recto: 'Rem. : \(\mu(B\setminus A)=\mu(B)-\mu(A)\) (suite de la Prop. (i))'
  verso: 'Soit \((X,\mathcal A,\mu)\) un espace mesuré et \(A,B\in\mathcal A\) avec \(A\subset B\).<br>Si \(\mu(A) < +\infty\), alors \(\mu(B\setminus A)=\mu(B)-\mu(A)\).<br>Si \(\mu(A)=+\infty\), on ne peut rien dire sur \(\mu(B\setminus A)\).'
  source: 'Cours Paris Cité, notes du CM du 13/10/2026, p. 1'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [propriete]
- id: mesure-a-011-3
  notion: mesure-n-0032
  recto: 'Preuve : croissance de \(\mu\) (Prop. (i))'
  verso: 'Soit \((X,\mathcal A,\mu)\) un espace mesuré et \(A\subset B\) dans \(\mathcal A\).<br>\(B=A\cup(B\cap A^c)\) est une union disjointe d''éléments de \(\mathcal A\), donc \(\mu(B)=\mu(A)+\mu(B\cap A^c)\) (additivité). Comme \(\mu(B\setminus A)\ge0\), on obtient \(\mu(A)\le\mu(B)\).'
  source: 'Cours Paris Cité, notes du CM du 13/10/2026, p. 1'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [propriete]

- id: mesure-a-012-1
  notion: mesure-n-0033
  recto: 'Prop. (ii) : \(\mu(A\cup B)+\mu(A\cap B)\)'
  verso: 'Soit \((X,\mathcal A,\mu)\) un espace mesuré.<br>Pour tous \(A,B\in\mathcal A\) : \(\mu(A\cup B)+\mu(A\cap B)=\mu(A)+\mu(B)\).'
  source: 'Cours Paris Cité, notes du CM du 13/10/2026, p. 1'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 3
  tags: [propriete]
- id: mesure-a-012-2
  notion: mesure-n-0033
  recto: 'Preuve : \(\mu(A\cup B)+\mu(A\cap B)=\mu(A)+\mu(B)\) (Prop. (ii))'
  verso: 'Soit \((X,\mathcal A,\mu)\) un espace mesuré et \(A,B\in\mathcal A\).<br>Si \(\mu(A\cap B)=+\infty\) : \(A\cap B\) est inclus dans \(A\), \(B\) et \(A\cup B\), donc par croissance les deux membres valent \(+\infty\).<br>Sinon \(A\cup B=(A\setminus(A\cap B))\cup(B\setminus(A\cap B))\cup(A\cap B)\), union disjointe ; avec \(\mu(A\setminus(A\cap B))=\mu(A)-\mu(A\cap B)\) (mesure finie), on obtient \(\mu(A\cup B)=\mu(A)+\mu(B)-\mu(A\cap B)\).'
  source: 'Cours Paris Cité, notes du CM du 13/10/2026, p. 1'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 3
  tags: [propriete]

- id: mesure-a-013-1
  notion: mesure-n-0035
  recto: 'Preuve : continuité séquentielle croissante, décomposition (Prop. (iii), 1/2)'
  verso: 'Soit \((X,\mathcal A,\mu)\) un espace mesuré et \((A_n)\) dans \(\mathcal A\) avec \(A_n\subset A_{n+1}\) pour tout \(n\).<br>\(A_n=A_{n-1}\cup(A_n\setminus A_{n-1})\). On note \(B_0=A_0\) et \(B_n=A_n\setminus A_{n-1}\) pour \(n\ge1\). Alors \(A_n=\bigcup_{k=0}^nB_k\), et les \(B_n\) sont deux à deux disjoints et dans \(\mathcal A\) ; de plus \(\bigcup_nA_n=\bigcup_nB_n\).'
  source: 'Cours Paris Cité, notes du CM du 13/10/2026, p. 1'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [demonstration]
- id: mesure-a-013-2
  notion: mesure-n-0035
  recto: 'Preuve : continuité séquentielle croissante, conclusion (Prop. (iii), 2/2)'
  verso: 'Soit \((X,\mathcal A,\mu)\) un espace mesuré et \((A_n)\) dans \(\mathcal A\) avec \(A_n\subset A_{n+1}\) ; \(B_0=A_0\), \(B_n=A_n\setminus A_{n-1}\) (\(B_n\) disjoints, \(A_n=\bigcup_{k=0}^nB_k\)).<br>\(\mu(A_n)=\sum_{k=0}^n\mu(B_k)\) (additivité). Comme \(\bigcup_nA_n=\bigcup_nB_n\) : \(\mu(\bigcup_nA_n)=\mu(\bigcup_nB_n)=\sum_n\mu(B_n)=\lim_n\sum_{k=0}^n\mu(B_k)=\lim_n\mu(A_n)\).'
  source: 'Cours Paris Cité, notes du CM du 13/10/2026, p. 1'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [demonstration]

- id: mesure-a-014-1
  notion: mesure-n-0037
  recto: 'Exemple : contre-exemple à la continuité séquentielle décroissante si l''hypothèse (P) est fausse'
  verso: 'Soit \((X,\mathcal A,\mu)\) un espace mesuré.<br>Hypothèse (P) de la Prop. (iv) : il existe \(n_0\in\mathbb N\) avec \(\mu(A_{n_0}) < +\infty\).<br>Contre-exemple si (P) est fausse : \(X=\mathbb N\), \(\mathcal A=\mathcal P(\mathbb N)\), \(\mu\) la mesure de comptage. Soit \(A_n=[n,+\infty[\cap\mathbb N\) : \(\mu(A_n)=+\infty\) pour tout \(n\) et \(A_{n+1}\subset A_n\). Mais \(\bigcap_nA_n=\emptyset\) et \(\mu(\emptyset)=0\), donc \(\mu(\bigcap A_n)\neq\lim\mu(A_n)\).'
  source: 'Cours Paris Cité, notes du CM du 13/10/2026, p. 2'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 3
  tags: [exemple]

- id: mesure-a-015-1
  notion: mesure-n-0038
  recto: 'Prop. (v) : \(\sigma\)-sous-additivité'
  verso: 'Soit \((X,\mathcal A,\mu)\) un espace mesuré.<br>Soit \((A_n)\) une suite d''éléments de \(\mathcal A\). Alors \(\mu\left(\bigcup_nA_n\right)\le\sum_n\mu(A_n)\).'
  source: 'Cours Paris Cité, notes du CM du 13/10/2026, p. 2'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [propriete]
- id: mesure-a-015-2
  notion: mesure-n-0038
  recto: 'Preuve : \(\sigma\)-sous-additivité (Prop. (v))'
  verso: 'Soit \((X,\mathcal A,\mu)\) un espace mesuré et \((A_n)\) dans \(\mathcal A\).<br>Soit \(B_n=A_n\setminus\bigcup_{k < n}A_k\) et \(B_0=A_0\). Alors \(\bigcup_nB_n=\bigcup_nA_n\), les \(B_n\) sont deux à deux disjoints, et \(B_n\subset A_n\) donc \(\mu(B_n)\le\mu(A_n)\). D''où \(\mu(\bigcup_nA_n)=\sum_n\mu(B_n)\le\sum_n\mu(A_n)\).'
  source: 'Cours Paris Cité, notes du CM du 13/10/2026, p. 2'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [propriete]

- id: mesure-a-016-1
  notion: mesure-n-0040
  recto: 'Preuve : \(\lambda(I)=\operatorname{long}(I)\), étape 1 (\(\lambda(\{x\})=0\))'
  verso: 'Soit \(\lambda\) la mesure de Lebesgue sur \(\mathbb R\) ; on prouve \(\lambda(I)=\operatorname{long}(I)\) pour tout intervalle \(I\) de \(\mathbb R\).<br>Pour tout \(x\in\mathbb R\), \(\lambda(\{x\})=0\).<br>Soit \(\alpha=\lambda(\{0\})\) : par invariance par translation \(\lambda(\{x\})=\alpha\). Les \(n\) points \(\frac1k\) (\(1\le k\le n\)) sont dans \([0,1]\) : \(n\alpha=\lambda(\{\frac1k:1\le k\le n\})\le\lambda([0,1])=1\) (\(\sigma\)-additivité, croissance). Donc \(0\le\alpha\le\frac1n\) pour tout \(n\in\mathbb N\), d''où \(\alpha=0\).'
  source: 'Cours Paris Cité, notes du CM du 13/10/2026, p. 2'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 3
  tags: [demonstration]
- id: mesure-a-016-2
  notion: mesure-n-0040
  recto: 'Preuve : \(\lambda(I)=\operatorname{long}(I)\), étape 2 (\(\lambda(]0,\frac1n])=\frac1n\))'
  verso: 'Soit \(\lambda\) la mesure de Lebesgue sur \(\mathbb R\) ; on prouve \(\lambda(I)=\operatorname{long}(I)\) pour tout intervalle \(I\) de \(\mathbb R\).<br>Pour tout \(n\in\mathbb N^*\), \(\lambda(]0,\frac1n])=\frac1n\).<br>\(]0,1]=\bigsqcup_{k=1}^n]\frac{k-1}n,\frac kn]\) (disjoints) et \(\lambda(]0,1])=1\) d''après l''étape 1. Donc \(1=\sum_{k=1}^n\lambda(]\frac{k-1}n,\frac kn])=n\,\lambda(]0,\frac1n])\) par invariance par translation.'
  source: 'Cours Paris Cité, notes du CM du 13/10/2026, p. 2'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 3
  tags: [demonstration]
- id: mesure-a-016-3
  notion: mesure-n-0040
  recto: 'Preuve : \(\lambda(I)=\operatorname{long}(I)\), étape 3 (bornes rationnelles)'
  verso: 'Soit \(\lambda\) la mesure de Lebesgue sur \(\mathbb R\) ; on prouve \(\lambda(I)=\operatorname{long}(I)\) pour tout intervalle \(I\) de \(\mathbb R\).<br>Pour tous rationnels \(r < r''\), \(\lambda(]r,r''])=r''-r\).<br>On met \(r\) et \(r''\) au même dénominateur : \(r=\frac{k_1}n\), \(r''=\frac{k_2}n\) avec \(k_1,k_2\in\mathbb Z\), \(n\in\mathbb N^*\), \(k_1 < k_2\). Alors \(]r,r'']=\bigsqcup_{k=k_1+1}^{k_2}]\frac{k-1}n,\frac kn]\), chaque morceau a pour mesure \(\lambda(]0,\frac1n])=\frac1n\) (invariance par translation), d''où \(\lambda(]r,r''])=\frac{k_2-k_1}n=r''-r\).'
  source: 'Cours Paris Cité, notes du CM du 20/10/2026, p. 1'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 3
  tags: [demonstration]
- id: mesure-a-016-4
  notion: mesure-n-0040
  recto: 'Preuve : \(\lambda(I)=\operatorname{long}(I)\), étape 4 (bornes irrationnelles)'
  verso: 'Soit \(\lambda\) la mesure de Lebesgue sur \(\mathbb R\) ; on prouve \(\lambda(I)=\operatorname{long}(I)\) pour tout intervalle \(I\) de \(\mathbb R\).<br>Soient \(a < b\) réels non rationnels : \(\lambda(]a,b])=b-a\).<br>\(\mathbb Q\) est dense dans \(\mathbb R\) : il existe des suites de rationnels \((r_n)\) décroissante de limite \(a\) et \((r''_n)\) croissante de limite \(b\), avec \(r_n < r''_n\). Alors \(]r_n,r''_n]\uparrow]a,b]\) et, par continuité séquentielle croissante, \(\lambda(]a,b])=\lim\lambda(]r_n,r''_n])=\lim(r''_n-r_n)=b-a\).'
  source: 'Cours Paris Cité, notes du CM du 20/10/2026, p. 2'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 3
  tags: [demonstration]
- id: mesure-a-016-5
  notion: mesure-n-0040
  recto: 'Preuve : \(\lambda(I)=\operatorname{long}(I)\), conclusion (autres intervalles, intervalles infinis)'
  verso: 'Soit \(\lambda\) la mesure de Lebesgue sur \(\mathbb R\) ; on prouve \(\lambda(I)=\operatorname{long}(I)\) pour tout intervalle \(I\) de \(\mathbb R\).<br>Pour tous \(a < b\) réels : \(\lambda([a,b])=\lambda(]a,b])=\lambda(]a,b[)=\lambda([a,b[)=b-a\) (les points sont de mesure nulle).<br>\(\lambda([a,+\infty[)=\lambda(\bigcup_{n}[a,a+n[)=\lim_n\lambda([a,a+n[)=\lim n=+\infty\) (continuité séquentielle croissante). De même \(\lambda(]-\infty,b])=\lambda(]-\infty,+\infty[)=+\infty\).'
  source: 'Cours Paris Cité, notes du CM du 20/10/2026, p. 2'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 3
  tags: [demonstration]

- id: mesure-a-017-1
  notion: mesure-n-0043
  recto: 'Déf : espace mesuré complet'
  verso: 'Soit \((X,\mathcal A,\mu)\) un espace mesuré.<br>On dit que \(A\subset X\) est \(\mu\)-négligeable s''il existe \(B\in\mathcal A\) tel que \(A\subset B\) et \(\mu(B)=0\). Soit \(\mathcal N(\mu)\) l''ensemble des parties \(\mu\)-négligeables.<br>On dit que \((X,\mathcal A,\mu)\) est complet si \(A\in\mathcal N(\mu)\Rightarrow A\in\mathcal A\). On dit alors que \(\mu\) est complète.'
  source: 'Cours Paris Cité, notes du CM du 20/10/2026, p. 3'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [definition]

- id: mesure-a-018-1
  notion: mesure-n-0046
  recto: 'Thm : mesures finies sur \(\mathbb R\) et mesure de Stieltjes (2)'
  verso: '1) Soit \(\mu\) une mesure finie sur \((\mathbb R,\mathcal B(\mathbb R))\). On définit pour tout \(x\in\mathbb R\) : \(F_\mu(x)=\mu(]-\infty,x])\). La fonction \(F_\mu\) est croissante, bornée, continue à droite, et \(\lim_{x\to-\infty}F_\mu(x)=0\).<br>2) Inversement, soit \(F:\mathbb R\to\mathbb R_+\) croissante, bornée, continue à droite et telle que \(\lim_{x\to-\infty}F(x)=0\). Alors il existe une unique mesure \(\mu\) finie sur \((\mathbb R,\mathcal B(\mathbb R))\) telle que \(F=F_\mu\). On appelle \(\mu\) la mesure de Stieltjes associée à \(F\).'
  source: 'Cours Paris Cité, notes du CM du 20/10/2026, p. 3'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 3
  tags: [theoreme]
- id: mesure-a-018-2
  notion: mesure-n-0046
  recto: 'Rem. : notation \(\mu(dx)=dF(x)\) (mesure de Stieltjes)'
  verso: 'Lorsque \(F=F_\mu\) (\(\mu\) mesure finie sur \((\mathbb R,\mathcal B(\mathbb R))\), \(F_\mu(x)=\mu(]-\infty,x])\)), on note souvent \(\mu(dx)=dF(x)\).<br>Si \(F\) est \(\mathcal C^1\), on a \(dF(x)=F''(x)\,dx\).'
  source: 'Cours Paris Cité, notes du CM du 20/10/2026, p. 3'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 3
  tags: [theoreme]

- id: mesure-a-019-1
  notion: mesure-n-0047
  recto: 'Citer des ensembles dénombrables classiques (un ensemble \(E\) est dénombrable s''il existe une injection de \(E\) dans \(\mathbb N\)).'
  verso: 'Tout ensemble fini, \(\mathbb N\), \(\mathbb Z\), \(\mathbb N^2\), \(\mathbb Q\), \(\mathbb N^d\).<br>(convention UVSQ. Le poly de Paris Cité, p. 3, dit « dénombrable » pour « en bijection avec \(\mathbb N\) » : un ensemble fini y est seulement « au plus dénombrable »)'
  source: 'UVSQ, Théorie de la mesure, séance 1, diapo 5'
  chapitre: 'Chapitre 1 - Espace mesurable et mesure (UVSQ)'
  priorite: 2
  tags: [propriete]
- id: mesure-a-019-2
  notion: mesure-n-0047
  recto: 'Citer des ensembles non dénombrables classiques.'
  verso: '\(\mathbb R\) et \([0,1]\).'
  source: 'UVSQ, Théorie de la mesure, séance 1, diapo 5'
  chapitre: 'Chapitre 1 - Espace mesurable et mesure (UVSQ)'
  priorite: 2
  tags: [propriete]

- id: mesure-a-022-1
  notion: mesure-n-0063
  recto: 'Changement de variables en coordonnées polaires : quelle formule pour \(\int_{\mathbb R^2}f(x,y)\,dx\,dy\) (\(f\) mesurable, positive ou intégrable) ?'
  verso: 'Avec \(\varphi(\rho,\theta)=(\rho\cos\theta,\rho\sin\theta)\) sur \(]0,+\infty[\times]0,2\pi[\) : \(\int_{\mathbb R^2}f(x,y)\,dx\,dy=\int_{]0,+\infty[\times]0,2\pi[}f(\rho\cos\theta,\rho\sin\theta)\,\rho\,d\rho\,d\theta\) (jacobien \(\rho\)).'
  source: 'UVSQ, Théorie de la mesure, séance 9, diapo 12'
  chapitre: 'Chapitre 4 - Intégrales multiples et changement de variables (UVSQ)'
  priorite: 1
  tags: [methode]
- id: mesure-a-022-2
  notion: mesure-n-0063
  recto: 'Changement de variables en coordonnées sphériques : quelle formule pour \(\int_{\mathbb R^3}f(x,y,z)\,dx\,dy\,dz\) (\(f\) mesurable, positive ou intégrable) ?'
  verso: 'Avec \(\psi(\rho,\theta,\delta)=(\rho\cos\theta\cos\delta,\ \rho\sin\theta\cos\delta,\ \rho\sin\delta)\) sur \(G=]0,+\infty[\times]-\pi,\pi[\times]-\frac\pi2,\frac\pi2[\) : \(\int_{\mathbb R^3}f\,dx\,dy\,dz=\int_G f\circ\psi(\rho,\theta,\delta)\,\rho^2\cos\delta\,d\rho\,d\theta\,d\delta\) (jacobien \(\rho^2\cos\delta\)).'
  source: 'UVSQ, Théorie de la mesure, séance 10, diapos 1-2'
  chapitre: 'Chapitre 4 - Intégrales multiples et changement de variables (UVSQ)'
  priorite: 1
  tags: [methode]

- id: mesure-a-024-1
  notion: mesure-n-0069
  recto: 'Sur un espace mesuré de mesure finie (\(\mu(X) < +\infty\)), quelle inclusion entre \(\mathcal L^p(X)\) et \(\mathcal L^q(X)\) pour \(p,q\in[1,+\infty]\) ?'
  verso: 'Si \(p\ge q\), alors \(\mathcal L^p(X)\subset\mathcal L^q(X)\).'
  source: 'UVSQ, Théorie de la mesure, séance 10, diapo 6'
  chapitre: 'Chapitre 5 - Espaces Lp (UVSQ)'
  priorite: 3
  tags: [propriete]
- id: mesure-a-024-2
  notion: mesure-n-0069
  recto: 'Mesure finie : comment retenir l''inclusion \(\mathcal L^\infty(X)\subset\mathcal L^1(X)\) ?'
  verso: 'Si \(f\in\mathcal L^\infty(X)\), il existe \(C\) avec \(\mu(\{|f| > C\})=0\), et alors \(\int_X|f|\,d\mu\le C\,\mu(X) < +\infty\).'
  source: 'UVSQ, Théorie de la mesure, séance 10, diapo 6'
  chapitre: 'Chapitre 5 - Espaces Lp (UVSQ)'
  priorite: 3
  tags: [propriete]
- id: mesure-a-024-3
  notion: mesure-n-0069
  recto: 'Sur \(\mathbb R\) muni de la mesure de Lebesgue (mesure infinie), les espaces \(\mathcal L^p\) sont-ils comparables ? Contre-exemples pour \(\mathcal L^\infty\) et \(\mathcal L^1\).'
  verso: 'Non : \(\mathcal L^\infty(\mathbb R)\not\subset\mathcal L^1(\mathbb R)\) (exemple \(f=1\)) et \(\mathcal L^1(\mathbb R)\not\subset\mathcal L^\infty(\mathbb R)\) (exemple \(f(x)=\frac1{\sqrt{|x|}}\) sur \([-1,1]\), \(0\) ailleurs).'
  source: 'UVSQ, Théorie de la mesure, séance 10, diapo 7'
  chapitre: 'Chapitre 5 - Espaces Lp (UVSQ)'
  priorite: 3
  tags: [propriete]
- id: mesure-a-025-1
  notion: null
  recto: 'Définir une relation d''équivalence \(\sim\) sur un ensemble \(E\), la classe d''un élément \(x\), et ce que forment les classes.'
  verso: '\(\sim\) est réflexive (\(x\sim x\)), symétrique (\(x\sim y\Rightarrow y\sim x\)) et transitive (\(x\sim y\) et \(y\sim z\Rightarrow x\sim z\)). Classe de \(x\) : \([x]=\{y\in E:\ y\sim x\}\). Les classes forment une partition de \(E\) : chaque \(x\) est dans sa classe, et deux classes sont égales ou disjointes (\([x]=[y]\iff x\sim y\)).'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans mes-td2-ex10, mes-td4-ex08'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 2
  tags: [prerequis-l1l2, definition]
- id: mesure-a-025-2
  notion: null
  recto: 'Axiome du choix, forme « ensemble de représentants » : énoncer pour une partition de \(E\).'
  verso: 'Si \((C_i)_{i\in I}\) est une partition de \(E\) (parties non vides, deux à deux disjointes, de réunion \(E\)), il existe une partie \(A\subset E\) contenant exactement un élément de chaque \(C_i\). Pour une relation d''équivalence \(\sim\) : pour tout \(x\in E\), il existe un unique \(y\in A\) tel que \(x\sim y\). Existence non constructive.'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans mes-td4-ex08'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 2
  tags: [prerequis-l1l2, theoreme]
- id: mesure-a-025-3
  notion: null
  recto: 'Vitali : sur \(\mathbb R\), \(x\sim y\iff x-y\in\mathbb Q\). Quelle est la classe de \(x\), et pourquoi peut-on choisir l''ensemble de représentants \(A\subset[0,1[\) ?'
  verso: 'La classe de \(x\) est \(x+\mathbb Q=\{x+q:\ q\in\mathbb Q\}\). Si \(y\) représente une classe, \(y-\lfloor y\rfloor\in[0,1[\) est dans la même classe (car \(\lfloor y\rfloor\in\mathbb Z\subset\mathbb Q\)) : on remplace chaque représentant \(y\) par \(y-\lfloor y\rfloor\).'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans mes-td4-ex08'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 2
  tags: [prerequis-l1l2, methode]
- id: mesure-e001
  notion: null
  recto: 'Soit \((E,\mathcal E)\) un espace mesurable et \((f_n)\) une suite de fonctions mesurables de \((E,\mathcal E)\) dans \((\mathbb R,\mathcal B(\mathbb R))\). Écrire l''ensemble \(C\) où \((f_n(x))\) converge à l''aide d''intersections et réunions dénombrables. Quelle règle de traduction \(\forall,\exists\to\cap,\cup\) ?'
  verso: 'Critère de Cauchy : \(x\in C\iff\forall m\ge1,\exists N,\forall p,q\ge N,\ |f_p(x)-f_q(x)|\le 1/m\). Donc \(C=\bigcap_{m\ge1}\bigcup_{N\in\mathbb N}\bigcap_{p,q\ge N}\{|f_p-f_q|\le 1/m\}\in\mathcal E\). Règle : \(\forall\to\bigcap\), \(\exists\to\bigcup\), dans l''ordre d''apparition ; tous les indices dans \(\mathbb N\) (on remplace \(\varepsilon\) par \(1/m\) pour rester dénombrable).'
  source: 'mes-td3-ex04 ; séance 2026-11-04'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [erreur]
- id: mesure-e002
  notion: mesure-n-0008
  recto: 'Sur \(X=\{1,2,3\}\), \(T=\{\emptyset,\{1\},\{2,3\},X\}\) est une tribu. Parmi \(1\in T\), \(\{1\}\in T\), \(\{1\}\subset T\), \(\{1\}\subset X\), lesquelles sont vraies ?'
  verso: '\(\{1\}\in T\) et \(\{1\}\subset X\) sont vraies. \(1\in T\) est fausse (\(1\) est un point de \(X\), pas une partie) et \(\{1\}\subset T\) aussi (\(1\) n''est pas un élément de \(T\)). Une tribu est un ensemble de **parties** de \(X\) : on écrit \(A\in T\) (A mesurable) et \(A\subset X\).'
  source: 'Séance 2026-11-04 (cours : élément contre sous-ensemble)'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [erreur]
