- id: ex-mes-td2-ex08
  exercice: mes-td2-ex08
  notion: mesure-n-0012
  recto: |-
    <b>Exo mes-td2-ex08 : exemples de boréliens</b><br>
    1. Démontrer que \(A:=\{x\in\mathbb R:\exists n\in\mathbb N^*,\ |x-n|<1/n\}\) est un borélien de \(\mathbb R\).<br>
    2. Démontrer que \(B:=\{(x,x):x\in\mathbb R\}\) est un borélien de \(\mathbb R^2\).<br>
    3. Démontrer que \(C:=\{(x,y)\in\mathbb R^2:x^2+y^2=1\text{ et }x\notin\mathbb Q\}\) est un borélien de \(\mathbb R^2\).<br>
    4. Soient \(d\in\mathbb N^*\) et \((f_n)_{n\in\mathbb N}\) une suite de fonctions continues de \(\mathbb R^d\) dans \(\mathbb R\). Démontrer que \(D:=\{x\in\mathbb R^d:\lim_{n\to+\infty}f_n(x)=0\}\) est un borélien de \(\mathbb R^d\).<br>
    <b>Méthode ? Étape clé ?</b>
  verso: |-
    <b>Idée clé :</b> \(\mathcal B(\mathbb R^d)\) est une tribu qui contient les ouverts (donc les fermés). Un borélien s'obtient en écrivant l'ensemble avec des ouverts ou des fermés et des opérations <i>dénombrables</i> (réunion, intersection, complémentaire) ; pour une limite, on remplace « \(\forall\varepsilon\) » par « \(\forall m\in\mathbb N^*,\ \varepsilon=1/m\) » pour rendre l'intersection dénombrable.<br>
    <b>Correction :</b><br>
    1. \(A=\bigcup_{n\in\mathbb N^*}\,]n-\tfrac1n,n+\tfrac1n[\), réunion dénombrable d'ouverts, donc un ouvert, donc un borélien.<br>
    2. \(B=f^{-1}(\{0\})\) avec \(f(x,y)=x-y\) continue et \(\{0\}\) fermé : \(B\) est un fermé de \(\mathbb R^2\), donc le complémentaire d'un ouvert, donc un borélien (stabilité par complémentaire).<br>
    3. \(C=S^1\cap C_0\) avec \(S^1=\{x^2+y^2=1\}\) (fermé : image réciproque de \(\{1\}\) par \((x,y)\mapsto x^2+y^2\) continue) et \(C_0=\{(x,y):x\notin\mathbb Q\}\). Or \(C_0^c=\mathbb Q\times\mathbb R=\bigcup_{q\in\mathbb Q}\{q\}\times\mathbb R\) est une réunion <i>dénombrable</i> de fermés (droites verticales), donc un borélien ; \(C_0\) aussi par complémentaire, et \(C\) est une intersection de deux boréliens.<br>
    4. \(\lim f_n(x)=0\iff\forall m\in\mathbb N^*,\exists N,\forall n\ge N,\ |f_n(x)|<1/m\), donc \(D=\bigcap_{m\in\mathbb N^*}\bigcup_{N\in\mathbb N}\bigcap_{n\ge N}f_n^{-1}(]-\tfrac1m,\tfrac1m[)\). Chaque \(f_n^{-1}(]-\tfrac1m,\tfrac1m[)\) est ouvert (\(f_n\) continue), donc borélien, et \(\mathcal B(\mathbb R^d)\) est stable par réunion et intersection dénombrables : \(D\) est un borélien.<br>
    <b>Piège :</b> \(D\) n'est <i>pas</i> ouvert en général : les ouverts sont stables par réunion quelconque et intersection <i>finie</i>, pas dénombrable (\(\bigcap_n\,]-\tfrac1n,\tfrac1n[\,=\{0\}\)). La conclusion « borélien » vient de la stabilité de la <i>tribu</i>. De même \(\mathbb Q\) n'est ni ouvert ni fermé mais est borélien (réunion dénombrable de singletons fermés) : « ni ouvert ni fermé » ne prouve rien.<br>
    <b>Coquilles / points d'attention :</b> \(n\in\mathbb N^*\) en 1 (\(1/n\)) ; pour 3, \(\mathbb Q^c\) est une partie de \(\mathbb R\), il faut \(\mathbb Q^c\times\mathbb R\subset\mathbb R^2\) ; \(\mathcal B(\mathbb R^2)\) et non \(\mathcal B(\mathbb R)\) en 2 ; en 4, \(x\in\mathbb R^d\) et non \(\mathbb R\). <b>Erreur du corrigé officiel (3) :</b> il écrit \(C=S^1\cup C_0\) et « union finie » ; c'est une intersection (« et »), la conclusion reste vraie.
  source: 'Énoncé et corrigé officiel : mesure/td/td2-corrige.pdf p.5-6 (Ex 8) ; l''erreur union/intersection en 3 est celle du corrigé, vérifiée par Claude.'
