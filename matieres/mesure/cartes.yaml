- id: ex-mes-cc1-2425-ex03
  exercice: mes-cc1-2425-ex03
  notion: mesure-n-0008
  recto: |-
    <b>Exo mes-cc1-2425-ex03 : Intersection dénombrable de tribus (CC1 2024-25)</b><br>
    Sur un ensemble \(X\), on considère une famille dénombrable de tribus \((\mathcal T_n)_{n\in\mathbb N}\). Montrer que \(\bigcap_{n\in\mathbb N}\mathcal T_n\) est une tribu. Est-ce que l'hypothèse de dénombrabilité est nécessaire ?<br>
    <b>Méthode ? Étape clé ?</b>
  verso: |-
    <b>Idée clé :</b> vérifier les trois axiomes (\(\emptyset\), complémentaire, réunion dénombrable) pour \(\mathcal T=\bigcap_n\mathcal T_n\), en les vérifiant dans chaque \(\mathcal T_n\) à \(n\) fixé, puis en concluant « pour tout \(n\) ».<br>
    <b>Correction :</b> soit \(\mathcal T=\bigcap_{n\in\mathbb N}\mathcal T_n\).<br>
    • \(\emptyset\in\mathcal T_n\) pour tout \(n\) (c'est une tribu), donc \(\emptyset\in\mathcal T\).<br>
    • Soit \(A\in\mathcal T\). Pour tout \(n\), \(A\in\mathcal T_n\) donc, \(\mathcal T_n\) étant une tribu, \(A^c\in\mathcal T_n\). Comme c'est vrai pour tout \(n\), \(A^c\in\mathcal T\).<br>
    • Soit \((A_p)_{p\in\mathbb N}\) une famille d'éléments de \(\mathcal T\). Pour tout \(n\) et tout \(p\), \(A_p\in\mathcal T_n\) donc, \(\mathcal T_n\) étant une tribu, \(\bigcup_{p\in\mathbb N}A_p\in\mathcal T_n\). Comme c'est vrai pour tout \(n\), \(\bigcup_pA_p\in\mathcal T\).<br>
    Donc \(\mathcal T\) est une tribu.<br>
    Dénombrabilité : l'hypothèse n'est pas nécessaire, car elle n'a servi nulle part. La preuve se fait tribu par tribu (« pour tout \(n\) ») et n'utilise jamais le cardinal de l'ensemble des indices : on pourrait considérer \((\mathcal T_\alpha)_{\alpha\in I}\) avec \(I\) quelconque (par exemple \(I=\mathbb R\)). C'est ce qui permet de définir \(\sigma(\mathcal E)\) comme l'intersection de toutes les tribus contenant \(\mathcal E\).<br>
    <b>Piège :</b> il y a deux « dénombrable » différents : l'indice \(n\) des tribus et l'indice \(p\) des ensembles \(A_p\) de la réunion (axiome de stabilité par réunion dénombrable). Seul le second compte dans la preuve. Rédiger complètement le troisième axiome (réunion) : \(A_p\in\mathcal T_n\) pour tous \(p\) et \(n\), puis \(\bigcup_pA_p\in\mathcal T_n\) pour chaque \(n\).
  source: 'Énoncé : uvsq/mesure/Théorie de la mesure/Annales/CC1-2024-2025.pdf p.2 (Ex 3). Corrigé officiel : uvsq/mesure/Théorie de la mesure/Annales/CC1-corrige-2024-2025.pdf p.3. Erreurs de la séance du 2026-11-04.'
