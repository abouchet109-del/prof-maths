- id: ex-mes-td3-ex01
  exercice: mes-td3-ex01
  notion: mesure-n-0014
  recto: |-
    <b>Exo mes-td3-ex01 : fonctions mesurables pour des tribus simples</b><br>
    Décrire l'ensemble des fonctions mesurables de \((E,\mathcal E)\) dans \((\mathbb R,\mathcal B(\mathbb R))\) dans les cas suivants :<br>
    1. \(E\) quelconque et \(\mathcal E:=\{\emptyset,E\}\).<br>
    2. \(E\) quelconque et \(\mathcal E:=\mathcal P(E)\).<br>
    3. \(E=\{a,b,c,d\}\) et \(\mathcal E:=\sigma(\{\{a\},\{b,c\}\})\).<br>
    <b>Méthode ? Étape clé ?</b>
  verso: |-
    <b>Idée clé :</b> \(f\) est mesurable si et seulement si \(f^{-1}(B)\in\mathcal E\) pour tout borélien \(B\). Plus la tribu de départ est pauvre, plus il y a de contraintes : \(f\) doit être constante sur chaque « atome » de \(\mathcal E\) (partie minimale non vide de la tribu) ; il suffit de tester avec les singletons \(\{y\}\), qui sont des fermés donc des boréliens.<br>
    <b>Correction :</b><br>
    1. <u>Les fonctions constantes</u>. Si \(f\equiv y\), alors \(f^{-1}(B)=E\) si \(y\in B\) et \(\emptyset\) sinon, dans \(\mathcal E\). Réciproquement, si \(f\) est mesurable, soit \(x_0\in E\) et \(y=f(x_0)\) : \(\{y\}\) est fermé donc borélien, donc \(f^{-1}(\{y\})\in\{\emptyset,E\}\) ; comme il contient \(x_0\), c'est \(E\), donc \(f\equiv y\).<br>
    2. <u>Toutes les fonctions de \(E\) dans \(\mathbb R\)</u> : pour tout borélien \(B\), \(f^{-1}(B)\subset E\), donc \(f^{-1}(B)\in\mathcal P(E)=\mathcal E\).<br>
    3. Les atomes de \(\mathcal E\) sont \(\{a\},\{b,c\},\{d\}\), et \(\mathcal E=\{\emptyset,\{a\},\{b,c\},\{d\},\{a,b,c\},\{a,d\},\{b,c,d\},E\}\) (les réunions d'atomes, 8 éléments). <u>\(f\) est mesurable si et seulement si \(f(b)=f(c)\)</u>, c'est-à-dire \(f=\alpha\mathbf 1_{\{a\}}+\beta\mathbf 1_{\{b,c\}}+\gamma\mathbf 1_{\{d\}}\), \((\alpha,\beta,\gamma)\in\mathbb R^3\). Si \(f(b)\ne f(c)\), le borélien \(B=\{f(b)\}\) a pour image réciproque une partie contenant \(b\) mais pas \(c\), qui n'est pas dans \(\mathcal E\) (tout élément de \(\mathcal E\) contenant \(b\) contient \(c\)). Si \(f(b)=f(c)\), \(f^{-1}(B)\) est la réunion de ceux des atomes dont la valeur est dans \(B\), donc dans \(\mathcal E\).<br>
    <b>Piège :</b> « fonctions constantes », pas « surjectives » ; et il faut démontrer les <i>deux</i> sens (mesurable \(\Rightarrow\) constante : la ligne \(f^{-1}(\{y\})\in\mathcal E\) car \(\{y\}\) est fermé est la clé ; constante \(\Rightarrow\) mesurable).<br>
    <b>Coquilles / points d'attention :</b> \(f^{-1}(B)\in\mathcal E\) et non \(\subset\mathcal E\) ; ne pas rayer la ligne « \(\{y\}\) fermé donc borélien » ; en 3, lister les 8 éléments de \(\mathcal E\) (\(\{d\}\) et \(E\) y sont) puis conclure sur les fonctions.
  source: 'Énoncé : mesure/td/td3.pdf p.1 (Ex 1). Pas de corrigé officiel : vérifiée par Claude, à confirmer.'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
