- id: mesure-a-053-1
  notion: mesure-n-0070
  recto: 'Remarques : propriétés de la tribu engendrée \(\mathcal T(\mathcal E)\)'
  verso: 'Soit \(\mathcal E\subset\mathcal P(X)\) et \(\mathcal T(\mathcal E)=\bigcap_{\mathcal E\subset\mathcal T,\ \mathcal T\text{ tribu}}\mathcal T\) la tribu engendrée par \(\mathcal E\).<br>• Si \(\mathcal E\subset\mathcal T\) où \(\mathcal T\) est une tribu, alors \(\mathcal T(\mathcal E)\subset\mathcal T\).<br>• Si \(\mathcal E\) est une tribu, alors \(\mathcal T(\mathcal E)=\mathcal E\).<br>• Si \(\mathcal E_1\subset\mathcal E_2\), alors \(\mathcal T(\mathcal E_1)\subset\mathcal T(\mathcal E_2)\).<br>Exemple : \(X=\{a,b,c\}\), \(\mathcal E=\{\{a\},\{b\}\}\) : déterminer \(\mathcal T(\mathcal E)\).'
  source: UVSQ, Théorie de la mesure (M. Boulakia), séance 1, diapo 9
  chapitre: Chapitre 1 - Espace mesurable et mesure (UVSQ)
  priorite: 2
  tags:
  - propriete
- id: mesure-a-054-1
  notion: mesure-n-0071
  recto: 'Prop. : \(\mathcal B(\mathbb R^d)\) engendrée par les pavés ouverts'
  verso: 'Soit \((X,d)\) un espace métrique : la tribu borélienne \(\mathcal B(X)\) est la tribu engendrée par l''ensemble des ouverts de \(X\) (les fermés de \(X\) sont des éléments de \(\mathcal B(X)\)).<br>La tribu \(\mathcal B(\mathbb R^d)\) est engendrée par l''ensemble des pavés ouverts, c''est-à-dire par les ouverts de la forme \(\prod_{i=1}^d\,]a_i,b_i[\), \(a_i\in\mathbb R\cup\{-\infty\}\), \(b_i\in\mathbb R\cup\{+\infty\}\).<br>En particulier, la tribu \(\mathcal B(\mathbb R)\) est engendrée par l''ensemble des intervalles ouverts.'
  source: UVSQ, Théorie de la mesure (M. Boulakia), séance 1, diapo 10
  chapitre: Chapitre 1 - Espace mesurable et mesure (UVSQ)
  priorite: 2
  tags:
  - propriete
- id: mesure-a-054-2
  notion: mesure-n-0071
  recto: 'Prop. : familles génératrices de \(\mathcal B(\mathbb R)\) (demi-droites)'
  verso: Soit \(\mathcal S=\mathbb Q\) ou \(\mathbb R\). La tribu \(\mathcal B(\mathbb R)\) est engendrée par l'une des familles suivantes :<br>• \(\{[a,+\infty[,\ a\in\mathcal S\}\) ;<br>• \(\{]a,+\infty[,\ a\in\mathcal S\}\) ;<br>• \(\{]-\infty,a[,\ a\in\mathcal S\}\) ;<br>• \(\{]-\infty,a],\ a\in\mathcal S\}\).
  source: UVSQ, Théorie de la mesure (M. Boulakia), séance 2, diapo 1
  chapitre: Chapitre 1 - Espace mesurable et mesure (UVSQ)
  priorite: 2
  tags:
  - propriete
- id: mesure-a-055-1
  notion: mesure-n-0072
  recto: 'Propriétés de la mesure de Lebesgue : points, intervalles, ensembles dénombrables'
  verso: Sur \((\mathbb R,\mathcal B(\mathbb R))\), \(\lambda\) est l'unique mesure telle que \(\lambda(]a,b[)=b-a\) pour tout intervalle ouvert \(]a,b[\). Alors :<br>• \(\lambda(\{a\})=0\), pour tout \(a\in\mathbb R\) ;<br>• \(\lambda(]a,b])=\lambda([a,b[)=\lambda([a,b])=b-a\) ;<br>• \(\lambda(E)=0\), pour tout ensemble dénombrable \(E\). En particulier, \(\lambda(\mathbb N)=\lambda(\mathbb Q)=0\).
  source: UVSQ, Théorie de la mesure (M. Boulakia), séance 2, diapo 9-10
  chapitre: Chapitre 1 - Espace mesurable et mesure (UVSQ)
  priorite: 2
  tags:
  - propriete
- id: mesure-a-056-1
  notion: mesure-n-0073
  recto: 'Déf : distance sur la droite réelle achevée \(\overline{\mathbb R}\), tribu \(\mathcal B(\overline{\mathbb R})\)'
  verso: Sur \(\overline{\mathbb R}\), on définit la fonction \(d:\overline{\mathbb R}\times\overline{\mathbb R}\to\mathbb R\), \((x,y)\mapsto|h(x)-h(y)|\), où \(h(x)=\arctan(x)\) si \(x\in\mathbb R\), \(h(-\infty)=-\frac\pi2\), \(h(+\infty)=\frac\pi2\).<br>Alors \((\overline{\mathbb R},d)\) est un espace métrique. De plus, \(\mathcal B(\overline{\mathbb R})\) est engendrée par l'ensemble des intervalles de la forme \(]a,+\infty]\), \(a\in\mathbb Q\) ou \(\mathbb R\).
  source: UVSQ, Théorie de la mesure (M. Boulakia), séance 3, diapo 5
  chapitre: Chapitre 2 - Application mesurable et intégrale de Lebesgue (UVSQ)
  priorite: 2
  tags:
