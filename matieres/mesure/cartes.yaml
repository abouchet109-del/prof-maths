- id: ex-mes-cc1-2324-ex01
  exercice: mes-cc1-2324-ex01
  notion: mesure-n-0008
  recto: |-
    <b>Exo mes-cc1-2324-ex01 : Tribu \(\{E:\mu(E)=0\text{ ou }\mu(X\setminus E)=0\}\) et mesure 0-1 (CC1 2023-24)</b><br>
    Soit \((X,\mathcal T,\mu)\) un espace mesuré de mesure non nulle et \(\mathcal T'=\{E\in\mathcal T:\mu(E)=0\text{ ou }\mu(X\setminus E)=0\}\).<br>
    1. Montrer que \(\mathcal T'\) est une tribu.<br>
    2. Sur \(\mathcal T'\), \(\nu(E)=0\) si \(\mu(E)=0\), \(\nu(E)=1\) si \(\mu(X\setminus E)=0\). Montrer que \(\nu\) est une mesure sur \(\mathcal T'\).<br>
    <b>Méthode ? Étape clé ?</b>
  verso: |-
    <b>Idée clé :</b> pour une famille \((E_n)\), couper en deux cas <i>sur les \(E_n\)</i> : ou bien tous les \(\mu(E_n)=0\) (sous-additivité), ou bien il existe \(n_0\) avec \(\mu(X\setminus E_{n_0})=0\) (monotonie : \(X\setminus\bigcup E_n\subset X\setminus E_{n_0}\)). La monotonie dit : une <i>partie</i> d'un ensemble de mesure nulle est de mesure nulle.<br>
    <b>Correction :</b><br>
    1. \(\emptyset\in\mathcal T\) et \(\mu(\emptyset)=0\), donc \(\emptyset\in\mathcal T'\). Si \(E\in\mathcal T'\), alors \(X\setminus E\in\mathcal T\), et « \(\mu(E)=0\) ou \(\mu(X\setminus E)=0\) » se lit aussi « \(\mu(X\setminus(X\setminus E))=0\) ou \(\mu(X\setminus E)=0\) » : \(X\setminus E\in\mathcal T'\). Soit \((E_n)\) dans \(\mathcal T'\) : \(\bigcup E_n\in\mathcal T\). Cas 1 : tous les \(\mu(E_n)=0\), alors \(\mu(\bigcup E_n)\le\sum\mu(E_n)=0\). Cas 2 : il existe \(n_0\) avec \(\mu(X\setminus E_{n_0})=0\) ; comme \(X\setminus\bigcup E_n\subset X\setminus E_{n_0}\), \(\mu(X\setminus\bigcup E_n)\le0\). Dans les deux cas, \(\bigcup E_n\in\mathcal T'\).<br>
    2. <u>Bien définie :</u> \(\mu(E)+\mu(X\setminus E)=\mu(X)\ne0\) (mesure non nulle), donc on ne peut avoir à la fois \(\mu(E)=0\) et \(\mu(X\setminus E)=0\). <u>\(\nu(\emptyset)=0\)</u> car \(\mu(\emptyset)=0\). <u>\(\sigma\)-additivité</u> pour \((E_n)\) deux à deux disjoints dans \(\mathcal T'\). Cas 1 : tous les \(\mu(E_n)=0\), donc \(\nu(E_n)=0\) pour tout \(n\) ; de plus \(\mu(\bigcup E_n)=0\) (sous-additivité), donc \(\nu(\bigcup E_n)=0=\sum\nu(E_n)\). Cas 2 : il existe \(n_0\) avec \(\mu(X\setminus E_{n_0})=0\), donc \(\nu(E_{n_0})=1\). Pour \(n\ne n_0\), \(E_n\subset X\setminus E_{n_0}\) (disjoints), donc \(\mu(E_n)=0\) et \(\nu(E_n)=0\) ; donc \(\sum\nu(E_n)=1\). Comme \(E_{n_0}\subset\bigcup E_n\), \(X\setminus\bigcup E_n\subset X\setminus E_{n_0}\), donc \(\mu(X\setminus\bigcup E_n)=0\) et \(\nu(\bigcup E_n)=1\).<br>
    <b>Piège :</b> la monotonie ne se lit que dans un sens : de \(\mu(\bigcap E_n^c)=0\) et \(\bigcap E_n^c\subset E_i^c\) on ne déduit pas \(\mu(E_i^c)=0\) (erreur de la séance, intuition prise pour une preuve). Pour trouver \(n_0\), raisonner par l'absurde ou couper les cas sur les \(E_n\) (comme ci-dessus). À écrire : \(\nu\) bien définie et \(\nu(\emptyset)=0\). Deux indices \(i\ne j\) avec \(\mu(E_i^c)=\mu(E_j^c)=0\) sont impossibles : \(E_i\subset E_j^c\) donne \(\mu(E_i)=0\), puis \(\mu(X)=\mu(E_i)+\mu(E_i^c)=0\), absurde.
  source: 'Énoncé : uvsq/mesure/Théorie de la mesure/Annales/CC1-2023-2024.pdf p.1 (Ex 1). Corrigé officiel : uvsq/mesure/Théorie de la mesure/Annales/CC1-corrige-2023-2024.pdf p.1. Erreurs de la séance du 2026-11-09.'
