- id: mesure-a-048-1
  notion: mesure-n-0003
  recto: 'Déf : indicatrice d''une partie'
  verso: L'indicatrice d'une partie \(A\) de \(\Omega\) est l'application, notée \(\mathbf 1_A\), de \(\Omega\) dans \(\mathbb R\) définie, pour tout \(\omega\in\Omega\), par \(\mathbf 1_A(\omega):=0\) si \(\omega\notin A\) et \(\mathbf 1_A(\omega):=1\) si \(\omega\in A\).
  source: Poly Mesure et intégration, Préliminaires, p. 3 (PDF)
