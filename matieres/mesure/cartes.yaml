- id: mesure-a-050-1
  notion: mesure-n-0023
  recto: 'Déf 1.15 : fonction étagée'
  verso: Une fonction \(f:(X,\mathcal A)\to\mathbb R\) (ou \(\mathbb C\)) est étagée si elle est mesurable et ne prend qu'un nombre fini de valeurs finies. Toute fonction étagée peut s'écrire \(f=\sum_{i\in I}\alpha_i\mathbf 1_{A_i}\), avec \(I\) fini et \((A_i)_{i\in I}\) partition \(\mathcal A\)-mesurable de \(X\).
  source: Poly Mesure et intégration, ch. 1, p. 7 (PDF)
