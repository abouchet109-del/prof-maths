# Cartes de mesure et intégration (Paris Cité L3, UVSQ pour les notions etab: uvsq). Pages = repères "--- page N ---" du PDF (diapo pour l'UVSQ).
- id: mesure-a-001-1
  notion: mesure-n-0002
  recto: 'Soit \(f:\Omega\to E\). Comment l''image réciproque \(f^{-1}\) se comporte-t-elle avec les réunions et intersections quelconques ?'
  verso: 'Pour toute famille \((A_i)_{i\in I}\) de parties de \(E\) : \(f^{-1}\left(\bigcup_i A_i\right)=\bigcup_i f^{-1}(A_i)\) et \(f^{-1}\left(\bigcap_i A_i\right)=\bigcap_i f^{-1}(A_i)\).'
  source: 'Poly de mesure Paris Cité, ch. 0, Prop. 0.1, p. 3'
  chapitre: 'Chapitre 0 - Préliminaires'
  priorite: 2
  tags: [propriete]
- id: mesure-a-001-2
  notion: mesure-n-0002
  recto: 'Soit \(f:\Omega\to E\) et \(A\subset E\). Que vaut le complémentaire de \(f^{-1}(A)\) ?'
  verso: '\(\Omega\setminus f^{-1}(A)=f^{-1}(E\setminus A)\) : l''image réciproque commute avec le passage au complémentaire.'
  source: 'Poly de mesure Paris Cité, ch. 0, Prop. 0.1, p. 3'
  chapitre: 'Chapitre 0 - Préliminaires'
  priorite: 2
  tags: [propriete]
- id: mesure-a-001-3
  notion: mesure-n-0002
  recto: 'Que dire de \(f^{-1}(A)\) et \(f^{-1}(B)\) si \(A\subset B\) ?'
  verso: '\(f^{-1}(A)\subset f^{-1}(B)\) (monotonie de l''image réciproque).'
  source: 'Poly de mesure Paris Cité, ch. 0, Prop. 0.1, p. 3'
  chapitre: 'Chapitre 0 - Préliminaires'
  priorite: 2
  tags: [propriete]

- id: mesure-a-002-1
  notion: mesure-n-0005
  recto: 'Définir \(\limsup A_n\) pour une suite d''ensembles \((A_n)_{n\ge1}\) de \(X\).'
  verso: '\(\limsup A_n=\bigcap_{n\ge1}\bigcup_{k\ge n}A_k=\{x\in X : \forall n\ge1,\ \exists k\ge n,\ x\in A_k\}\) : les \(x\) qui appartiennent à \(A_k\) infiniment souvent.'
  source: 'Poly de mesure Paris Cité, ch. 0, p. 4'
  chapitre: 'Chapitre 0 - Préliminaires'
  priorite: 1
  tags: [definition]
- id: mesure-a-002-2
  notion: mesure-n-0005
  recto: 'Définir \(\liminf A_n\) pour une suite d''ensembles \((A_n)_{n\ge1}\) de \(X\).'
  verso: '\(\liminf A_n=\bigcup_{n\ge1}\bigcap_{k\ge n}A_k=\{x\in X : \exists n\ge1,\ \forall k\ge n,\ x\in A_k\}\) : les \(x\) qui appartiennent à \(A_k\) à partir d''un certain rang.'
  source: 'Poly de mesure Paris Cité, ch. 0, p. 4'
  chapitre: 'Chapitre 0 - Préliminaires'
  priorite: 1
  tags: [definition]

- id: mesure-a-003-1
  notion: mesure-n-0006
  recto: 'Pour une suite réelle \((u_n)\), comment \(\limsup u_n\) et \(\liminf u_n\) se lisent-elles avec les valeurs d''adhérence ?'
  verso: '\(\limsup u_n\) est la plus grande valeur d''adhérence de \((u_n)\) dans \(\overline{\mathbb R}\) (un max), \(\liminf u_n\) la plus petite (un min).'
  source: 'Poly de mesure Paris Cité, ch. 0, Prop. 0.2, p. 4'
  chapitre: 'Chapitre 0 - Préliminaires'
  priorite: 2
  tags: [propriete]

- id: mesure-a-004-1
  notion: mesure-n-0009
  recto: 'Quelle est la tribu grossière sur un ensemble \(X\) ?'
  verso: '\(\{\emptyset, X\}\).'
  source: 'Poly de mesure Paris Cité, ch. 1, Ex. 1.2, p. 5'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [exemple]
- id: mesure-a-004-2
  notion: mesure-n-0009
  recto: 'Quelle est la tribu triviale (discrète) sur un ensemble \(X\) ?'
  verso: '\(\mathcal P(X)\), l''ensemble de toutes les parties de \(X\).'
  source: 'Poly de mesure Paris Cité, ch. 1, Ex. 1.2, p. 5'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [exemple]
- id: mesure-a-004-3
  notion: mesure-n-0009
  recto: 'Quelle est la tribu engendrée par une partie \(A\subset X\) ?'
  verso: '\(\{\emptyset, A, A^c, X\}\) : c''est la plus petite tribu contenant \(A\).'
  source: 'Poly de mesure Paris Cité, ch. 1, Ex. 1.2, p. 5'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [exemple]

- id: mesure-a-005-1
  notion: mesure-n-0015
  recto: 'Soit \((X,\mathcal A)\) un espace mesurable et \(A\subset X\). Quand l''indicatrice \(\mathbf 1_A\) est-elle mesurable ?'
  verso: '\(\mathbf 1_A\) est mesurable si et seulement si \(A\in\mathcal A\).'
  source: 'Poly de mesure Paris Cité, ch. 1, Rem. 1.7, p. 6'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [propriete]

- id: mesure-a-006-1
  notion: mesure-n-0017
  recto: 'Soit \(f:X\to Y\) et \(\mathcal B\) une tribu sur \(Y\). Que dire de \(f^{-1}(\mathcal B)\) ?'
  verso: 'C''est une tribu sur \(X\), appelée tribu image réciproque de \(\mathcal B\) par \(f\).'
  source: 'Poly de mesure Paris Cité, ch. 1, Lemme 1.9, p. 6'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 2
  tags: [propriete]
- id: mesure-a-006-2
  notion: mesure-n-0017
  recto: 'Soit \(X\subset Y\) et \(\mathcal B\) une tribu sur \(Y\). Qu''est-ce que la tribu trace de \(\mathcal B\) sur \(X\) ?'
  verso: '\(\{X\cap B : B\in\mathcal B\}\), une tribu sur \(X\).'
  source: 'Poly de mesure Paris Cité, ch. 1, Lemme 1.9, p. 6'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 2
  tags: [propriete]

- id: mesure-a-007-1
  notion: mesure-n-0018
  recto: 'Soit \(f:X\to Y\) et \(\mathcal A\) une tribu sur \(X\). Quelle est la tribu induite de \(\mathcal A\) par \(f\) sur \(Y\) ?'
  verso: '\(\{B\subset Y : f^{-1}(B)\in\mathcal A\}\), une tribu sur \(Y\).'
  source: 'Poly de mesure Paris Cité, ch. 1, Lemme 1.10, p. 6'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 2
  tags: [propriete]

- id: mesure-a-008-1
  notion: mesure-n-0019
  recto: 'Soit \(f:X\to Y\) et \(\mathcal E\subset\mathcal P(Y)\). Que vaut \(f^{-1}(\sigma(\mathcal E))\) ?'
  verso: '\(f^{-1}(\sigma(\mathcal E))=\sigma(f^{-1}(\mathcal E))\).'
  source: 'Poly de mesure Paris Cité, ch. 1, Lemme 1.11, p. 6'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 2
  tags: [propriete]
- id: mesure-a-008-2
  notion: mesure-n-0019
  recto: 'Soit \(Y\) un espace topologique et \(X\subset Y\) muni de la topologie induite. Comment s''écrit \(\mathcal B(X)\) à l''aide de \(\mathcal B(Y)\) ?'
  verso: '\(\mathcal B(X)=\{A\cap X : A\in\mathcal B(Y)\}\).'
  source: 'Poly de mesure Paris Cité, ch. 1, Lemme 1.11, application 1, p. 6'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 2
  tags: [propriete]
- id: mesure-a-008-3
  notion: mesure-n-0019
  recto: 'Donner deux familles de parties qui engendrent la tribu borélienne de \(\overline{\mathbb R}\).'
  verso: '\(\mathcal B(\overline{\mathbb R})=\sigma(\{[a,+\infty] : a\in\mathbb R\})=\sigma(\{]a,+\infty] : a\in\mathbb R\})\).'
  source: 'Poly de mesure Paris Cité, ch. 1, Lemme 1.11, application 2, p. 6'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 2
  tags: [propriete]

- id: mesure-a-009-1
  notion: mesure-n-0029
  recto: 'Soit \(\mu\) une mesure sur \((X,\mathcal A)\) et \(B\in\mathcal A\). Définir la mesure trace de \(\mu\) sur \(B\).'
  verso: '\(\mu_B(A)=\mu(A\cap B)\) pour tout \(A\in\mathcal A\).'
  source: 'Poly de mesure Paris Cité, ch. 1, Ex. 1.21, p. 8'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [exemple]
- id: mesure-a-009-2
  notion: mesure-n-0029
  recto: 'Soit \(\mu\) une mesure sur \((X,\mathcal A)\) et \(B\in\mathcal A\). Définir la mesure conditionnelle sachant \(B\).'
  verso: 'Pour \(A\in\mathcal A\) : \(\mu(A|B)=\dfrac{\mu(A\cap B)}{\mu(B)}=\dfrac{\mu_B(A)}{\mu(B)}\), définie pour \(0 < \mu(B) < +\infty\) (le cours écrit seulement \(\mu(B)\neq0\), mais si \(\mu(B)=+\infty\) le quotient n''a pas de sens).'
  source: 'Poly de mesure Paris Cité, ch. 1, Ex. 1.21, p. 8'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [exemple]

- id: mesure-a-010-1
  notion: mesure-n-0030
  recto: 'Par quoi une mesure de probabilité \(\mu\) sur \((\mathbb N,\mathcal P(\mathbb N))\) est-elle déterminée ? Quelle formule ?'
  verso: 'Par ses valeurs sur les singletons : \(A\) est au plus dénombrable, donc \(\mu(A)=\sum_{k\in A}\mu(\{k\})\).'
  source: 'Poly de mesure Paris Cité, ch. 1, Ex. 1.21, p. 8'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 2
  tags: [exemple]
- id: mesure-a-010-2
  notion: mesure-n-0030
  recto: 'Soit \((p_k)_{k\in\mathbb N}\) une suite de réels positifs avec \(\sum_k p_k=1\). Que définit \(\mu(A)=\sum_{k\in A}p_k\) sur \(\mathcal P(\mathbb N)\) ?'
  verso: 'Une mesure de probabilité sur \((\mathbb N,\mathcal P(\mathbb N))\) : \(\mu(\emptyset)=0\), \(\sigma\)-additivité par regroupement des sommes, \(\mu(\mathbb N)=\sum_k p_k=1\).'
  source: 'Poly de mesure Paris Cité, ch. 1, Ex. 1.21, p. 8'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 2
  tags: [exemple]

- id: mesure-a-011-1
  notion: mesure-n-0032
  recto: 'Soit \((X,\mathcal A,\mu)\) un espace mesuré et \(A\subset B\) dans \(\mathcal A\). Comparer \(\mu(A)\) et \(\mu(B)\), et exprimer \(\mu(B)\).'
  verso: '\(\mu(A)\le\mu(B)\) (\(\mu\) est croissante pour l''inclusion) et \(\mu(B)=\mu(A)+\mu(B\setminus A)\).'
  source: 'Cours Paris Cité, notes du CM du 13/10/2026, p. 1'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [propriete]
- id: mesure-a-011-2
  notion: mesure-n-0032
  recto: 'Pour \(A\subset B\) dans \(\mathcal A\), quand a-t-on \(\mu(B\setminus A)=\mu(B)-\mu(A)\) ?'
  verso: 'Si \(\mu(A) < +\infty\). Si \(\mu(A)=+\infty\), on ne peut rien dire sur \(\mu(B\setminus A)\) à partir de cette formule.'
  source: 'Cours Paris Cité, notes du CM du 13/10/2026, p. 1'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [propriete]
- id: mesure-a-011-3
  notion: mesure-n-0032
  recto: 'Comment prouver \(\mu(B)=\mu(A)+\mu(B\setminus A)\) pour \(A\subset B\) ?'
  verso: '\(B=A\cup(B\cap A^c)\) est une union disjointe d''éléments de \(\mathcal A\) ; on applique l''additivité de \(\mu\). Comme \(\mu(B\setminus A)\ge0\), on en tire \(\mu(A)\le\mu(B)\).'
  source: 'Cours Paris Cité, notes du CM du 13/10/2026, p. 1'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [propriete]

- id: mesure-a-012-1
  notion: mesure-n-0033
  recto: 'Pour \(A,B\in\mathcal A\), quelle relation lie \(\mu(A\cup B)\), \(\mu(A\cap B)\), \(\mu(A)\) et \(\mu(B)\) ?'
  verso: '\(\mu(A\cup B)+\mu(A\cap B)=\mu(A)+\mu(B)\).'
  source: 'Cours Paris Cité, notes du CM du 13/10/2026, p. 1'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 3
  tags: [propriete]
- id: mesure-a-012-2
  notion: mesure-n-0033
  recto: 'Comment démontre-t-on \(\mu(A\cup B)+\mu(A\cap B)=\mu(A)+\mu(B)\) ?'
  verso: 'Si \(\mu(A\cap B)=+\infty\) : \(A\cap B\) est inclus dans \(A\), \(B\) et \(A\cup B\), donc les deux membres valent \(+\infty\). Sinon \(A\cup B=(A\setminus(A\cap B))\cup(B\setminus(A\cap B))\cup(A\cap B)\), union disjointe : \(\mu(A\cup B)=\mu(A)-\mu(A\cap B)+\mu(B)-\mu(A\cap B)+\mu(A\cap B)\).'
  source: 'Cours Paris Cité, notes du CM du 13/10/2026, p. 1'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 3
  tags: [propriete]

- id: mesure-a-013-1
  notion: mesure-n-0035
  recto: 'Continuité croissante (\(A_n\subset A_{n+1}\), montrer \(\mu(\bigcup A_n)=\lim\mu(A_n)\)) : en quelles parties disjointes décompose-t-on les \(A_n\) ?'
  verso: '\(B_0=A_0\) et \(B_n=A_n\setminus A_{n-1}\) pour \(n\ge1\) : les \(B_n\) sont dans \(\mathcal A\), deux à deux disjoints, \(A_n=\bigcup_{k=0}^n B_k\) et \(\bigcup_n A_n=\bigcup_n B_n\).'
  source: 'Cours Paris Cité, notes du CM du 13/10/2026, p. 1'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [demonstration]
- id: mesure-a-013-2
  notion: mesure-n-0035
  recto: 'Continuité croissante : avec \(B_0=A_0\), \(B_n=A_n\setminus A_{n-1}\), comment conclut-on \(\mu(\bigcup A_n)=\lim\mu(A_n)\) ?'
  verso: 'Additivité : \(\mu(A_n)=\sum_{k=0}^n\mu(B_k)\). \(\sigma\)-additivité : \(\mu(\bigcup A_n)=\mu(\bigcup B_n)=\sum_{n}\mu(B_n)=\lim_n\sum_{k=0}^n\mu(B_k)=\lim_n\mu(A_n)\).'
  source: 'Cours Paris Cité, notes du CM du 13/10/2026, p. 1'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [demonstration]

- id: mesure-a-014-1
  notion: mesure-n-0037
  recto: 'Continuité décroissante : que peut-il arriver si on omet l''hypothèse « il existe \(n_0\) avec \(\mu(A_{n_0}) < +\infty\) » ? Contre-exemple.'
  verso: 'Sur \((\mathbb N,\mathcal P(\mathbb N))\) avec la mesure de comptage et \(A_n=[n,+\infty[\cap\mathbb N\) (décroissante) : \(\mu(A_n)=+\infty\) pour tout \(n\), mais \(\bigcap_n A_n=\emptyset\) de mesure \(0\). Donc \(\mu(\bigcap A_n)\neq\lim\mu(A_n)\).'
  source: 'Cours Paris Cité, notes du CM du 13/10/2026, p. 2'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 3
  tags: [exemple]

- id: mesure-a-015-1
  notion: mesure-n-0038
  recto: 'Énoncer la \(\sigma\)-sous-additivité d''une mesure \(\mu\).'
  verso: 'Pour toute suite \((A_n)\) d''éléments de \(\mathcal A\) : \(\mu\left(\bigcup_n A_n\right)\le\sum_n\mu(A_n)\).'
  source: 'Cours Paris Cité, notes du CM du 13/10/2026, p. 2'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [propriete]
- id: mesure-a-015-2
  notion: mesure-n-0038
  recto: 'Comment démontre-t-on la \(\sigma\)-sous-additivité de \(\mu\) ?'
  verso: 'Poser \(B_0=A_0\) et \(B_n=A_n\setminus\bigcup_{k<n}A_k\) : les \(B_n\) sont deux à deux disjoints, \(\bigcup B_n=\bigcup A_n\) et \(B_n\subset A_n\). Donc \(\mu(\bigcup A_n)=\sum\mu(B_n)\le\sum\mu(A_n)\).'
  source: 'Cours Paris Cité, notes du CM du 13/10/2026, p. 2'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [propriete]

- id: mesure-a-016-1
  notion: mesure-n-0040
  recto: 'Preuve de \(\lambda(I)=\operatorname{long}(I)\), étape 1 : pourquoi \(\lambda(\{x\})=0\) ?'
  verso: 'Par invariance par translation, \(\lambda(\{x\})=\alpha=\lambda(\{0\})\). Les \(n\) points \(\frac1k\) (\(1\le k\le n\)) sont dans \([0,1]\) : \(n\alpha=\lambda(\{\frac1k:1\le k\le n\})\le\lambda([0,1])=1\). Donc \(0\le\alpha\le\frac1n\) pour tout \(n\), d''où \(\alpha=0\).'
  source: 'Cours Paris Cité, notes du CM du 13/10/2026, p. 2'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 3
  tags: [demonstration]
- id: mesure-a-016-2
  notion: mesure-n-0040
  recto: 'Preuve de \(\lambda(I)=\operatorname{long}(I)\), étape 2 : pourquoi \(\lambda(]0,\frac1n])=\frac1n\) ?'
  verso: '\(]0,1]=\bigsqcup_{k=1}^n]\frac{k-1}n,\frac kn]\), donc \(1=\sum_{k=1}^n\lambda(]\frac{k-1}n,\frac kn])=n\,\lambda(]0,\frac1n])\) par invariance par translation.'
  source: 'Cours Paris Cité, notes du CM du 13/10/2026, p. 2'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 3
  tags: [demonstration]
- id: mesure-a-016-3
  notion: mesure-n-0040
  recto: 'Preuve de \(\lambda(I)=\operatorname{long}(I)\), étape 3 : pourquoi \(\lambda(]r,r''])=r''-r\) pour \(r < r''\) rationnels ?'
  verso: 'Réduire au même dénominateur : \(r=\frac{k_1}n\), \(r''=\frac{k_2}n\), \(k_1 < k_2\). Alors \(]r,r'']=\bigsqcup_{k=k_1+1}^{k_2}]\frac{k-1}n,\frac kn]\) et chaque morceau a pour mesure \(\lambda(]0,\frac1n])=\frac1n\) : \(\lambda(]r,r''])=\frac{k_2-k_1}n=r''-r\).'
  source: 'Cours Paris Cité, notes du CM du 20/10/2026, p. 1'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 3
  tags: [demonstration]
- id: mesure-a-016-4
  notion: mesure-n-0040
  recto: 'Preuve de \(\lambda(I)=\operatorname{long}(I)\), étape 4 : comment passer à des bornes \(a < b\) irrationnelles ?'
  verso: '\(\mathbb Q\) est dense : prendre des rationnels \(r_n\downarrow a\) et \(r''_n\uparrow b\) avec \(r_n < r''_n\). Alors \(]r_n,r''_n]\uparrow]a,b]\) et, par continuité croissante, \(\lambda(]a,b])=\lim(r''_n-r_n)=b-a\).'
  source: 'Cours Paris Cité, notes du CM du 20/10/2026, p. 2'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 3
  tags: [demonstration]
- id: mesure-a-016-5
  notion: mesure-n-0040
  recto: 'Preuve de \(\lambda(I)=\operatorname{long}(I)\), étape 5 : comment traiter les autres types d''intervalles et les intervalles infinis ?'
  verso: 'Les points sont de mesure nulle : \(\lambda([a,b])=\lambda(]a,b])=\lambda(]a,b[)=\lambda([a,b[)=b-a\). Et \([a,+\infty[=\bigcup_n[a,a+n[\) croissante donne \(\lambda([a,+\infty[)=\lim n=+\infty\) ; de même \(\lambda(]-\infty,b])=\lambda(]-\infty,+\infty[)=+\infty\).'
  source: 'Cours Paris Cité, notes du CM du 20/10/2026, p. 2'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 3
  tags: [demonstration]

- id: mesure-a-017-1
  notion: mesure-n-0043
  recto: 'Quand un espace mesuré \((X,\mathcal A,\mu)\) (ou la mesure \(\mu\)) est-il complet ?'
  verso: 'Quand toute partie \(\mu\)-négligeable appartient à \(\mathcal A\) (\(A\subset X\) est \(\mu\)-négligeable s''il existe \(B\in\mathcal A\) avec \(A\subset B\) et \(\mu(B)=0\)).'
  source: 'Cours Paris Cité, notes du CM du 20/10/2026, p. 3'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 1
  tags: [definition]

- id: mesure-a-018-1
  notion: mesure-n-0046
  recto: 'Énoncer la réciproque sur les mesures finies de \((\mathbb R,\mathcal B(\mathbb R))\) : mesure de Stieltjes associée à \(F\).'
  verso: 'Soit \(F:\mathbb R\to\mathbb R_+\) croissante, bornée, continue à droite, avec \(\lim_{x\to-\infty}F(x)=0\). Il existe une unique mesure finie \(\mu\) sur \((\mathbb R,\mathcal B(\mathbb R))\) telle que \(F=F_\mu\), où \(F_\mu(x)=\mu(]-\infty,x])\). \(\mu\) est la mesure de Stieltjes associée à \(F\).'
  source: 'Cours Paris Cité, notes du CM du 20/10/2026, p. 3'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 3
  tags: [theoreme]
- id: mesure-a-018-2
  notion: mesure-n-0046
  recto: 'Quelle notation pour la mesure de Stieltjes \(\mu\) associée à \(F=F_\mu\), et que devient-elle si \(F\) est \(\mathcal C^1\) ?'
  verso: '\(\mu(dx)=dF(x)\) ; si \(F\) est \(\mathcal C^1\), \(dF(x)=F''(x)\,dx\).'
  source: 'Cours Paris Cité, notes du CM du 20/10/2026, p. 3'
  chapitre: 'Chapitre 1 - Tribus, espaces mesurables et applications mesurables'
  priorite: 3
  tags: [theoreme]

- id: mesure-a-019-1
