- id: mes-dm-s5
  titre: 'DM : mesures extérieures et théorème de Carathéodory'
  enonce: |
    Soit $E$ un ensemble.

    Définition 6. Une application $\mu^*:\mathcal P(E)\to\overline{\mathbb R}_+$ est appelée mesure extérieure si
    i. $\mu^*(\emptyset)=0$
    ii. $A\subset B\Rightarrow\mu^*(A)\le\mu^*(B)$
    iii. Pour toute suite $A_n$, $n\in\mathbb N$, de parties de $E$, $\mu^*(\bigcup_nA_n)\le\sum_{n\in\mathbb N}\mu^*(A_n)$.

    Dans la suite, on fixe une mesure extérieure $\mu^*$ sur $E$.

    Définition 7. Une partie $B\subset E$ est dite $\mu^*$-mesurable si pour toute partie $A$ de $E$, on a $\mu^*(A)=\mu^*(A\cap B)+\mu^*(A\cap B^c)$. On note $\mathcal M(\mu^*)$ l'ensemble des parties $\mu^*$-mesurables.

    Le but de cette partie est de montrer les résultats suivants :
    Théorème 8. i. $\mathcal M(\mu^*)$ est une tribu qui contient toutes les parties $B\subset E$ telles que $\mu^*(B)=0$.
    ii. La restriction de $\mu^*$ à $\mathcal M(\mu^*)$ est une mesure.

    Questions :
    1. Montrer que si $\mu^*(B)=0$ alors $B\in\mathcal M(\mu^*)$.
    2. Montrer que $\mathcal M(\mu^*)$ contient $\emptyset$, est stable par passage au complémentaire et est stable par union finie.
    3. Soit $B_n$, $n\in\mathbb N$, d'éléments de $\mathcal M(\mu^*)$, deux à deux disjoints. Montrer que pour tout $m\in\mathbb N$, pour tout $A\subset E$,
    $$\mu^*(A)=\sum_{n=0}^m\mu^*(A\cap B_n)+\mu^*\Big(A\cap\Big(\bigcap_{n=0}^mB_n^c\Big)\Big)\ \ge\ \sum_{n=0}^m\mu^*(A\cap B_n)+\mu^*\Big(A\cap\Big(\bigcap_{n=0}^{+\infty}B_n^c\Big)\Big).$$
    4. En déduire que $\bigcup_nB_n\in\mathcal M(\mu^*)$.
    5. Montrer que pour toute suite $B_n$, $n\in\mathbb N$, d'éléments de $\mathcal M(\mu^*)$, deux à deux disjoints, alors $\bigcup_nB_n\in\mathcal M(\mu^*)$.
    6. Conclure sur le fait que $\mathcal M(\mu^*)$ est une tribu.
    7. En utilisant l'inégalité de la question 4., montrer que $\mu^*(\bigcup_nB_n)\ge\sum_{n\in\mathbb N}\mu^*(B_n)$, pour toute suite $B_n$, $n\in\mathbb N$, d'éléments de $\mathcal M(\mu^*)$ deux à deux disjoints.
    8. Conclure que $\mu^*$ restreint à $\mathcal M(\mu^*)$ est une mesure.
  sources:
