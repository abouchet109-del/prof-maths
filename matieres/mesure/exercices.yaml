- id: mes-td7-ex05
  titre: Volume de la boule unité de R^n
  enonce: |
    Soit $n\in\mathbb N^*$. On note $b_n$ le volume de la boule unité de $\mathbb R^n$, i.e. $b_n:=\lambda_n(B_n)$ avec
    $$B_n:=\{(x_1,\dots,x_n)\in\mathbb R^n : x_1^2+\dots+x_n^2\le1\}$$
    1. Que valent $b_1$, $b_2$ et $b_3$ ?
    2. Établir une relation de récurrence entre $b_n$ et $b_{n-2}$, pour tout $n\ge3$, en remarquant que $x_1^2+\dots+x_n^2\le1$ équivaut à $x_1^2+x_2^2\le1$ et $x_3^2+\dots+x_n^2\le1-x_1^2-x_2^2$.
    3. En déduire l'expression de $b_n$.
