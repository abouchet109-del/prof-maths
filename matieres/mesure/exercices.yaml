- id: mes-td2-ex04
  titre: Tribu produit et réunion de tribus
  enonce: |
    Soient $\mathcal E$ et $\mathcal F$ deux tribus sur l'ensemble $E$.
    1. La famille $\mathcal E\times\mathcal F:=\{A\times B : A\in\mathcal E,\ B\in\mathcal F\}$ est-elle une tribu sur $E\times E$ ?
    2. La famille $\mathcal E\cup\mathcal F$ est-elle une tribu sur $E$ ? Puis montrer que
    $$\sigma(\mathcal E\cup\mathcal F)=\sigma(\{A\cup B : A\in\mathcal E,\ B\in\mathcal F\})=\sigma(\{A\cap B : A\in\mathcal E,\ B\in\mathcal F\})$$
