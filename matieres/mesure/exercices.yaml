- id: mes-td1-ex08
  titre: 'Dénombrabilité : produits, réunions, suites finies'
  enonce: |
    1. Montrer que tout produit fini d'ensembles dénombrables est dénombrable.
    2. Montrer que toute réunion dénombrable d'ensembles dénombrables est dénombrable.
    3. Soit $D$ un ensemble dénombrable. Montrer que l'ensemble des suites finies d'éléments de $D$ est dénombrable.
