- id: mes-td4-ex07
  titre: Fonction de répartition et atomes
  enonce: |
    On se place sur la droite réelle $(\mathbb R,\mathcal B(\mathbb R))$.
    1. Soit $\mu$ une mesure finie sur $(\mathbb R,\mathcal B(\mathbb R))$. On définit sur $\mathbb R$ la fonction $F$ par $F(x):=\mu(]-\infty,x])$.
       (a) Montrer que $F$ est croissante et déterminer les limites de $F$ en $-\infty$ et $+\infty$.
       (b) Montrer que $F$ est continue à droite.
       (c) Montrer que $F$ est continue en $y\in\mathbb R$ si et seulement si $\mu(\{y\})=0$.
       (d) On appelle atome de $\mu$ tout élément $x\in\mathbb R$ tel que $\mu(\{x\})>0$. Montrer que le nombre d'atomes de $\mu$ est fini ou dénombrable.
    2. On rappelle qu'une mesure $\mu$ sur $(E,\mathcal E)$ est $\sigma$-finie s'il existe une suite croissante d'éléments $A_n\in\mathcal E$ telle que $\bigcup_{n\in\mathbb N}A_n=E$ et $\mu(A_n)<+\infty$ pour tout $n\in\mathbb N$. Soit $\mu$ une mesure $\sigma$-finie sur $(\mathbb R,\mathcal B(\mathbb R))$. Montrer que le nombre d'atomes de $\mu$ est également fini ou dénombrable.
    3. Donner un exemple de mesure $\mu$ sur $(\mathbb R,\mathcal B(\mathbb R))$ qui admet un nombre non dénombrable d'atomes.
  sources:
