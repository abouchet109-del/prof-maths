- id: mes-td1-ex01
  titre: Formules de Hausdorff
  enonce: |
    Soit $f:E\to F$ une application.
    1. Montrer que pour toute famille $(B_i)_{i\in I}$ de parties de $F$, on a :
       (a) $f^{-1}(\bigcup_{i\in I}B_i)=\bigcup_{i\in I}f^{-1}(B_i)$
       (b) $f^{-1}(\bigcap_{i\in I}B_i)=\bigcap_{i\in I}f^{-1}(B_i)$
    2. Montrer que toute famille $(A_i)_{i\in I}$ de parties de $E$, on a $f(\bigcup_{i\in I}A_i)=\bigcup_{i\in I}f(A_i)$.
    3. Montrer que si $f$ est injective, on a $f(\bigcap_{i\in I}A_i)=\bigcap_{i\in I}f(A_i)$. Montrer par un contre-exemple que l'égalité est fausse en général.
  sources:
  - etab: paris-cite
    fichier: mesure/td/td1-corrige.pdf
    page: 1
    numero: Ex 1
  annale_prioritaire: false
  type_source: td
