- id: mes-td4-ex03
  titre: Mesures de Radon, atomes et partie diffuse
  enonce: |
    Soit $\mathbb R$ muni de sa tribu borélienne. Soit $\mu$ une mesure telle que $\mu(K)<+\infty$ pour tout compact $K$ (une telle mesure est dite de Radon). Soit $D:=\{a\in\mathbb R : \mu(\{a\})>0\}$.
    1. Soit $n$ et $p$ des entiers strictement positifs et $D_{n,p}:=\{a\in\mathbb R : |a|\le n,\ \mu(\{a\})\ge1/p\}$.
       (a) Montrer que $D_{n,p}$ est fini.
       (b) Montrer que $D$ est (au plus) dénombrable.
    2. On pose pour tout $B\in\mathcal B(\mathbb R)$, $\lambda(B):=\mu(D\cap B)$.
       (a) Montrer que cela a un sens et que $\lambda$ est une mesure de Radon.
       (b) Montrer que $\lambda=\sum_{a\in D}\mu(\{a\})\delta_a$.
    3. Montrer que $\mu=\lambda+\nu$ où $\nu$ est une mesure de Radon telle que pour tout $x\in\mathbb R$, $\nu(\{x\})=0$ (une telle mesure est dite diffuse).
  sources:
  - etab: paris-cite
