- id: mes-td7-ex04
  titre: Calculs d'intégrales multiples
  enonce: |
    Calculer l'intégrale de $f$ sur $D$ :
    1. $f(x,y):=(1+x+y)^{-\alpha}$, $\alpha\in\mathbb R$, $D:=(\mathbb R_+^*)^2$.
    2. $f(x,y):=(x+y)^{-\alpha}$, $\alpha\in\mathbb R$, $D:=]0,1]^2$.
    3. $f(x,y):=(x^2+y^2)^{-\alpha}$, $\alpha\in\mathbb R$, $D:=\{(x,y)\in(\mathbb R_+^*)^2 : x^2+y^2<1\}$.
    4. $f(x,y):=\exp(x+y)$, $D:=\{(x,y)\in\mathbb R^2 : |x+y|\le1,\ |x-y|\le1\}$.
    5. $f(x,y):=\sin\sqrt{x^2+y^2}$, $D:=\{(x,y)\in\mathbb R^2 : \pi<x^2+y^2\le4\pi^2\}$.
    6. $f(x,y):=x^2+y^2$, $D:=\{(x,y)\in\mathbb R^2 : \frac{x^2}{a^2}+\frac{y^2}{b^2}\le1\}$ avec $a,b>0$.
    7. $f(x,y,z):=z$, $D:=\{(x,y,z)\in\mathbb R^3 : x^2+y^2\le1,\ 0\le z\le h\}$ avec $h>0$.
    8. $f(x,y):=x+y$, $D:=\{(x,y)\in\mathbb R^2 : 0<x^2\le y\le2x^2,\ 1/x\le y\le2/x\}$. (Poser $u=y/x^2$ et $v=xy$).
    9. $f(x,y,z):=xyz$, $D:=\{(x,y,z)\in\mathbb R^3 : x\ge0,\ y\ge0,\ z\ge0,\ x^2+y^2+z^2\le1\}$.
