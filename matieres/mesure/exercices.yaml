- id: mes-ex-2425-ex05
  titre: 'F(t)=∫_0^1 1/(t+x^r) : comportement en 0+'
  enonce: |
    Soit $r>0$ fixé. Pour tout $t>0$, on pose
    $$F(t)=\int_0^1\frac1{t+x^r}\,dx.$$
    1. Pour commencer, on prend $r=\frac12$. Montrer que $F$ est continue sur $[0,+\infty[$. Donner la limite de $F$ quand $t$ tend vers $0^+$.
    2. On prend maintenant $r=2$. En faisant le changement de variables $x=\sqrt t\,y$, donner un équivalent de $F$ quand $t$ tend vers $0^+$.
    3. On prend maintenant $r=1$. Montrer que $F(t)$ tend vers $+\infty$ quand $t$ tend vers $0^+$.
  sources:
