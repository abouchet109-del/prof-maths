- id: mes-td5-ex04
  titre: Interversion série-intégrale
  enonce: |
    Soit $(E,\mathcal A,\mu)$ un espace mesuré et $(f_n)_{n\in\mathbb N}$ une suite de fonctions intégrables par rapport à $\mu$.
    1. Montrer que si $\sum_{n\in\mathbb N}\int_E|f_n|\,d\mu<+\infty$, alors $\int_E\sum_{n\in\mathbb N}f_n\,d\mu=\sum_{n\in\mathbb N}\int_Ef_n\,d\mu$.
       Indication : commencer par supposer que $f_n\ge0$ pour tout $n\in\mathbb N$.
    2. On définit $f_n(x):=e^{-nx}-2e^{-2nx}$ si $x>0$ et $f_n(x)=0$ sinon. Calculer et comparer $\int_{\mathbb R}\sum_{n\in\mathbb N}f_n(x)\,dx$ et $\sum_{n\in\mathbb N}\int_{\mathbb R}f_n(x)\,dx$.
