- id: mes-td1-ex03
  titre: Fonction indicatrice
  enonce: |
    Pour toute partie $A$ d'un ensemble $\Omega$, on appelle fonction indicatrice de $A$, notée $\mathbf 1_A$, l'application de $\Omega$ vers $\{0,1\}$ définie par $\mathbf 1_A(\omega)=1$ si $\omega\in A$, $\mathbf 1_A(\omega)=0$ si $\omega\notin A$.
    Soient $A$, $B$ et $C$ trois parties de $\Omega$.
    1. Vérifier que $\mathbf 1_A+\mathbf 1_B=\mathbf 1_{A\cup B}+\mathbf 1_{A\cap B}$.
    2. Écrire $\mathbf 1_{A\cap B}$ et $\mathbf 1_{A\cup B}$ en fonction de $\mathbf 1_A$ et $\mathbf 1_B$.
    3. Déterminer les fonctions indicatrices des ensembles suivants : $A^c$, $A\setminus B$, $A\cup B\cup C$ et $A\Delta B$ en fonction de $\mathbf 1_A$, $\mathbf 1_B$ et $\mathbf 1_C$.
    4. Soit $(A_n)_{n\in\mathbb N^*}$ une suite de parties de $E$. Déterminer $\mathbf 1_{\bigcap_{n=1}^N A_n}$, $N\in\mathbb N$, en fonction des $\mathbf 1_{A_n}$. En déduire
    $$\mathbf 1_{\bigcup_{n=1}^N A_n}=\sum_{n=1}^N(-1)^{n+1}\Big(\sum_{1\le i_1<i_2<\dots<i_n\le N}\mathbf 1_{A_{i_1}\cap\dots\cap A_{i_n}}\Big)$$
  sources:
  - etab: paris-cite
    fichier: mesure/td/td1-corrige.pdf
    page: 2
    numero: Ex 3
  annale_prioritaire: false
  type_source: td
