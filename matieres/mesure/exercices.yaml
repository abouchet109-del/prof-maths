- id: mes-td2-ex08
  titre: Exemples de boréliens
  enonce: |
    1. Démontrer que $A:=\{x\in\mathbb R : \exists n\in\mathbb N^*,\ |x-n|<1/n\}$ est un borélien de $\mathbb R$.
    2. Démontrer que $B:=\{(x,x)\in\mathbb R^2 : x\in\mathbb R\}$ est un borélien de $\mathbb R^2$.
    3. Démontrer que $C:=\{(x,y)\in\mathbb R^2 : x^2+y^2=1 \text{ et } x\notin\mathbb Q\}$ est un borélien de $\mathbb R^2$.
    4. Soient $d\in\mathbb N^*$ et $(f_n)_{n\in\mathbb N}$ une suite de fonctions continues de $\mathbb R^d$ dans $\mathbb R$. Démontrer que $D:=\{x\in\mathbb R^d : \lim_{n\to+\infty}f_n(x)=0\}$ est un borélien de $\mathbb R^d$.
