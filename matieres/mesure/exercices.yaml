- id: mes-td6-ex03
  titre: Intégrale gaussienne dépendant de t
  enonce: |
    Soit, pour $t\in\mathbb R$ et $x>0$, $f(t,x):=\dfrac1{\sqrt{2\pi}}\exp\!\Big(-\dfrac12\Big(x^2+\dfrac{t^2}{x^2}\Big)\Big)$ et $F(t):=\int_0^{+\infty}f(t,x)\,dx$.
    1. Montrer que $F$ est continue sur $\mathbb R$ vérifiant $F(-t)=F(t)$ pour tout $t\in\mathbb R$.
    2. Soit $t_0>0$ et $\varepsilon>0$ tel que $]t_0-\varepsilon,t_0+\varepsilon[\subset\mathbb R_+^*$. Montrer que l'on a $\big|\frac{\partial f}{\partial t}(t,x)\big|\le Ae^{-x^2/2}$ pour $x>0$ et $t\in]t_0-\varepsilon,t_0+\varepsilon[$ et une certaine constante $A>0$. En déduire que $F$ est dérivable sur $\mathbb R^*$.
    3. Montrer que $F$ satisfait une équation différentielle sur $]0,+\infty[$ (on pourra commencer par effectuer le changement de variable $u=t/x$ dans l'expression de $F'(t)$). En déduire l'expression de $F$ sur $\mathbb R$.
