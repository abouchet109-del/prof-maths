- id: mes-dm-s1
  titre: 'DM : classes monotones et pi-systèmes'
  enonce: |
    Soit $E$ un ensemble.

    Définition 1. On dit qu'un ensemble de parties $\mathcal A$ de $E$ est une classe monotone ou encore $\lambda$-système de $E$ si $\mathcal A$ vérifie :
    i. $E\in\mathcal A$ ;
    ii. Pour tous $A,B\in\mathcal A$ tels que $B\subset A$, $A\setminus B\in\mathcal A$ (stabilité par différence propre) ;
    iii. Pour toute suite croissante $(A_n)_{n\ge0}$, $A_n\subset A_{n+1}$, de parties de $\mathcal A$, l'union $\bigcup^{\uparrow}_{n\ge1}A_n\in\mathcal A$.

    Définition 2. On dit qu'un ensemble de parties $\mathcal A$ de $E$ est un $\pi$-système de $E$ si $\mathcal A$ est stable par intersection finie : $A,B\in\mathcal A\Rightarrow A\cap B\in\mathcal A$.

    Questions :
    1. Montrer que si $\mathcal A$ est à la fois une classe monotone et un $\pi$-système, alors $\mathcal A$ est une tribu.
    2. Montrer que toute intersection de classes monotones est encore une classe monotone. On peut donc définir la classe monotone engendrée par une famille d'ensembles $\mathcal E$ comme étant la plus petite classe monotone contenant $\mathcal E$, que l'on notera $\mathcal M(\mathcal E)$. C'est-à-dire :
    $$\mathcal M(\mathcal E)=\bigcap_{\substack{\mathcal M\text{ classe monotone sur }E\\ \mathcal E\subset\mathcal M}}\mathcal M.$$
  sources:
