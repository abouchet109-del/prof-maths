- id: mes-cc2-2425-ex02
  titre: F(t)=∫ (sin x / x)^2 e^{-tx}
  enonce: |
    On définit, pour tout $(t,x)\in\mathbb R_+\times\mathbb R_+^*$
    $$f(t,x)=\Big(\frac{\sin x}x\Big)^2e^{-tx}.$$
    1. Montrer que, pour tout $t\in\mathbb R_+$, la fonction $x\mapsto f(t,x)$ est intégrable sur $\mathbb R_+^*$.
    On pose $F(t)=\int_0^{+\infty}f(t,x)\,dx$.
    2. Montrer que $F$ est continue sur $\mathbb R_+$.
    3. Montrer que $F$ est deux fois dérivable sur $\mathbb R_+^*$ et déterminer $F'$ et $F''$.
    4. On considère une suite $(t_n)$ de $\mathbb R_+$ telle que $t_n\to+\infty$. Déterminer la limite de $(F'(t_n))$ quand $n$ tend vers $+\infty$.
    5. En utilisant les questions précédentes, en déduire une expression simple de $F''$ puis de $F'$.
  sources:
