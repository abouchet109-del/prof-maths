- id: mes-td2-ex06
  titre: Tribu borélienne sur R^2
  enonce: |
    Soit $\mathcal T$ la tribu sur $\mathbb R^2$ engendrée par $\{A\times B : A,B\in\mathcal B(\mathbb R)\}$. On va montrer ici que $\mathcal T=\mathcal B(\mathbb R^2)$.
    1. Montrer que tout ouvert de $\mathbb R^2$ est réunion au plus dénombrable de produits d'intervalles ouverts de $\mathbb R$. En déduire que $\mathcal B(\mathbb R^2)\subset\mathcal T$.
    2. Soient $A$ un ouvert de $\mathbb R$ et $\mathcal T_1:=\{B\in\mathcal B(\mathbb R) : A\times B\in\mathcal B(\mathbb R^2)\}$. Montrer que $\mathcal T_1$ est une tribu sur $\mathbb R$ contenant les ouverts de $\mathbb R$. En déduire que $\mathcal T_1=\mathcal B(\mathbb R)$.
    3. Soient $B\in\mathcal B(\mathbb R)$ et $\mathcal T_2:=\{A\in\mathcal B(\mathbb R) : A\times B\in\mathcal B(\mathbb R^2)\}$. Montrer que $\mathcal T_2=\mathcal B(\mathbb R)$.
    4. Montrer que $\mathcal T\subset\mathcal B(\mathbb R^2)$ et donc que $\mathcal T=\mathcal B(\mathbb R^2)$.
  sources:
