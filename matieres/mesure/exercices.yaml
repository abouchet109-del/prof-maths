- id: mes-td2-ex10
  titre: Pas de tribu infinie dénombrable
  enonce: |
    Le but de cet exercice est de prouver qu'il n'existe pas d'espace mesurable $(E,\mathcal E)$ avec $\mathcal E$ infini et dénombrable.
    1. Si $E$ est fini, conclure.
    2. On suppose désormais que $E$ est de cardinal infini et que $\mathcal E$ est infini et dénombrable. Pour tout $x\in E$, on définit l'atome de $x$ par
    $$C(x):=\bigcap_{A\in\mathcal E,\ x\in A}A.$$
       (a) Justifier que la relation $\sim$ sur $E\times E$ définie par $x\sim y$ si et seulement si $\forall A\in\mathcal E,\ x\in A\iff y\in A$ est une relation d'équivalence.
       (b) Montrer que pour tout $x\in E$, $C(x)$ est égal à la classe d'équivalence de $x$ pour la relation $\sim$. Les atomes forment ainsi une partition de $E$.
       (c) Montrer que pour tout $x\in E$, $C(x)\in\mathcal E$.
       (d) En déduire que tout élément $A$ de $\mathcal E$ s'écrit comme une union au plus dénombrable d'atomes.
       (e) Si $\mathcal E$ contient un nombre fini d'atomes, montrer que $\mathcal E$ est de cardinal fini.
       (f) Montrer que $\mathcal E$ ne peut pas être dénombrable.
