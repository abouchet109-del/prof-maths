- id: mes-td1-ex02
  titre: Images directes et réciproques, complémentaires
  enonce: |
    Soit $f:E\to F$ une application.
    1. Montrer que pour toute partie $A$ de $F$, on a $f^{-1}(A^c)=(f^{-1}(A))^c$.
    2. Que peut-on dire de $f(A^c)$ pour une partie $A$ de $E$ ?
    3. Montrer que : $f$ est surjective si et seulement si $\forall B\subset F,\ f(f^{-1}(B))=B$.
    4. Montrer que : $f$ injective si et seulement si $\forall A\subset E,\ f^{-1}(f(A))=A$.
