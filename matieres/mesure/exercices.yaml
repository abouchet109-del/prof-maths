- id: mes-dm-s3
  titre: 'DM : théorème d''unicité de mesures'
  enonce: |
    Le but de cette partie est de démontrer le théorème suivant.

    Théorème 4 (Unicité d'une mesure finie). Soient $\mu$ et $\nu$ deux mesures sur un espace mesurable $(E,\mathcal A)$ et $\mathcal B\subset\mathcal A$ un $\pi$-système contenant $E$ (i.e. $E\in\mathcal B$) et engendrant $\mathcal A$ (i.e. $\sigma(\mathcal B)=\mathcal A$). On suppose que pour tout $B\in\mathcal B$, $\mu(B)=\nu(B)$. Alors
    1. Si $\mu(E)=\nu(E)<+\infty$, alors $\mu=\nu$ sur $\mathcal A$ (i.e. $\forall A\in\mathcal A,\ \mu(A)=\nu(A)$).
    2. S'il existe une suite croissante de parties $E_n\in\mathcal B$, $n\in\mathbb N$, telle que $E=\bigcup_nE_n$ et pour tout $n\in\mathbb N$, $\mu(E_n)=\nu(E_n)<+\infty$, alors $\mu=\nu$ sur $\mathcal A$.

    Définition 5. On dit que la mesure $\mu$ est $\sigma$-finie s'il existe une suite $E_n$, $n\in\mathbb N$, de sous-ensembles mesurables de $E$, telle que $E=\bigcup_nE_n$ et pour tout $n\in\mathbb N$, $\mu(E_n)<+\infty$.

    Questions :
    1. On suppose que $\mu$ et $\nu$ sont finies. Montrer que $\mathcal C=\{A\in\mathcal A : \mu(A)=\nu(A)\}$ est une classe monotone contenant $\mathcal B$.
    2. Conclure grâce au lemme de classe monotone.
    3. On suppose que $\mu$ et $\nu$ sont $\sigma$-finies. Soit $\mu_n$ (respectivement $\nu_n$) la mesure trace de $\mu$ (resp. $\nu$) sur $E_n$. Montrer que $\mu_n=\nu_n$ sur $\mathcal A$.
    4. Conclure.
    5. Le théorème est-il encore vrai si l'on enlève l'hypothèse « $\mathcal B$ est un $\pi$-système » ? Donner un contre-exemple.
  sources:
