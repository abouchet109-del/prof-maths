- id: mes-td6-ex02
  titre: Intégrale de Dirichlet via un paramètre
  enonce: |
    Pour $u\ge0$, on pose
    $$F(u):=\int_0^{+\infty}\frac{1-\cos(x)}{x^2}e^{-ux}\,dx$$
    1. Montrer que $F$ est définie et continue sur $[0,+\infty[$. Calculer $\lim_{u\to+\infty}F(u)$.
    2. Montrer que $F$ est de classe $C^2$ sur $]0,+\infty[$. Calculer $F''$.
    3. $F$ est-elle dérivable à droite en $0$ ?
    4. Déduire de 1. et 2. une expression de $F$.
    5. Déterminer la valeur de $\int_0^{+\infty}\dfrac{1-\cos(x)}{x^2}\,dx$.
