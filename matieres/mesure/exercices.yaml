- id: mes-cc1-2425-ex02
  titre: 'Formule du gâteau en couches : intégrale de ψ(t)=μ(f>t)'
  enonce: |
    Soit $(X,\mathcal T,\mu)$ un espace mesuré tel que $\mu(X)<+\infty$. On considère une fonction mesurable positive $f:X\to\mathbb R_+$ et on définit la fonction $\psi:\mathbb R_+\to\mathbb R_+$ par
    $$\psi(t)=\mu(S_f(t))\quad\text{où}\quad S_f(t)=\{x\in X : f(x)>t\}.$$
    1. Montrer que $\psi$ est une fonction décroissante.
    2. On suppose dans cette question que $f$ est une fonction indicatrice d'un élément $A$ de $\mathcal T$, c'est-à-dire $f=\mathbf 1_A$. Après avoir caractérisé $S_f(t)$ pour tout $t\ge0$, montrer que $\psi=\mu(A)\mathbf 1_{[0,1[}$ sur $[0,+\infty[$. En déduire que
    $$\int_0^{+\infty}\psi(t)\,dt=\int_Xf\,d\mu.\tag{1}$$
    3. On suppose dans cette question que $f$ est une fonction étagée positive, c'est-à-dire que $f=\sum_{i=1}^N\alpha_i\mathbf 1_{A_i}$ où les $(A_i)_{1\le i\le N}$ forment une partition de $X$ et les $\alpha_i$ sont des réels positifs. Montrer que, pour tout $t\ge0$
    $$S_f(t)=\bigcup_{\{i/\alpha_i>t\}}A_i\quad\text{et}\quad\psi(t)=\sum_{i=1}^N\mu(A_i)\mathbf 1_{[0,\alpha_i[}(t).$$
    En déduire que la formule (1) est vraie.

    À partir de maintenant, on considère le cas général d'une fonction $f$ mesurable positive.
    4. Soit $(f_n)$ une suite croissante de fonctions mesurables positives qui tend vers $f$. Pour tout $n\in\mathbb N$, pour tout $t\in[0,+\infty[$, on pose $\psi_n(t)=\mu(S_{f_n}(t))$. Montrer que $(\psi_n)$ est une suite croissante et que pour tout $t\in[0,+\infty[$, $\lim_{n\to+\infty}\psi_n(t)=\psi(t)$.
    5. Conclure que la formule (1) est vraie dans le cas général.
  sources:
  - etab: uvsq
    fichier: uvsq/mesure/Théorie de la mesure/Annales/CC1-2024-2025.pdf
    page: 1
