- id: mes-cc1-2425-ex04
  titre: 'Invariance par translation : deux points à distance entière'
  enonce: |
    Sur $(\mathbb R,\mathcal B(\mathbb R))$, on considère la mesure de Lebesgue $\lambda$ qui satisfait la propriété d'invariance par translation : pour tout $A\in\mathcal B(\mathbb R)$, pour tout $x\in\mathbb R$, $\lambda(A-x)=\lambda(A)$ où $A-x=\{a-x,\ a\in A\}$.
    Soit $B\in\mathcal B(\mathbb R)$ tel que $\lambda(B)>1$.
    1. Montrer que
    $$\lambda(B)=\sum_{n\in\mathbb Z}\lambda(B\cap[n,n+1[)$$
    puis que
    $$\lambda(B)=\sum_{n\in\mathbb Z}\lambda((B-n)\cap[0,1[)$$
    2. En déduire que la suite d'ensembles $(B-n)\cap[0,1[$, $n\in\mathbb Z$ n'est pas constituée d'ensembles tous disjoints 2 à 2.
    3. Conclure qu'il existe $a$ et $b\in B$ tels que $a-b$ est un entier supérieur ou égal à $1$.
