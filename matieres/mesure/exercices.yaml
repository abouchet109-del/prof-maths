- id: mes-td4-ex05
  titre: Mesure image
  enonce: |
    Soit $(E,\mathcal E,\mu)$ un espace mesuré et $f:(E,\mathcal E)\to(F,\mathcal F)$ une application mesurable.
    1. Montrer que
    $$f_*\mu:\ \mathcal F\longrightarrow[0,+\infty],\quad B\longmapsto\mu(f^{-1}(B))$$
    définit une mesure sur $(F,\mathcal F)$ appelée mesure image de $\mu$ par $f$ (on la note aussi $f(\mu)$ ou $\mu_f$).
    2. Déterminer la mesure image $f_*\mu$ dans le cas où $\mu:=\delta_a$ avec $a\in E$.
    3. Soit $f$ la fonction $f(x):=x^3$ définie sur $\mathbb R$ et $\lambda$ la mesure de Lebesgue sur $\mathbb R$. Étant donné un intervalle $[a,b]\subset\mathbb R$, calculer $f_*\lambda([a,b])$.
    4. Soit $g:(E',\mathcal E')\to(G,\mathcal G)$ une application mesurable, avec $f:(E,\mathcal E)\to(E',\mathcal E')$. Montrer que $(g\circ f)_*\mu=g_*(f_*\mu)$.
    5. Soit $\nu$ une mesure sur $F$ et supposons $f$ surjective. Montrer qu'il existe une unique mesure $\mu$ sur $(E,f^{-1}(\mathcal F))$ telle que $\nu=f_*\mu$.
  sources:
