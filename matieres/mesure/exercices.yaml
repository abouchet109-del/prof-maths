- id: mes-cc1-2526-ex02
  titre: Intégrale et séries des mesures de {f>=n}
  enonce: |
    On considère un espace mesuré $(X,\mathcal T,\mu)$ tel que $\mu(X)<+\infty$ et on munit $\mathbb R$ de la tribu borélienne $\mathcal B(\mathbb R)$. Soit $f:X\to\mathbb R$ une fonction mesurable positive.
    Pour cet exercice, on admettra que, pour $(D_n)_{n\in\mathbb N}$ une famille d'éléments de $\mathcal T$ deux à deux disjoints, $\int_{\bigcup_{n\in\mathbb N}D_n}f\,d\mu=\sum_{n\in\mathbb N}\int_{D_n}f\,d\mu$.
    Pour tout $n\in\mathbb N$, on pose $A_n=\{x\in X : f(x)\ge n\}$.
    1. Montrer que les ensembles $A_n\setminus A_{n+1}$ appartiennent à $\mathcal T$, sont deux à deux disjoints et que $X=\bigcup_{n\in\mathbb N}(A_n\setminus A_{n+1})$.
    2. Montrer que
    $$\sum_{n\in\mathbb N}n\,\mu(A_n\setminus A_{n+1})\le\int_Xf\,d\mu\le\sum_{n\in\mathbb N}(n+1)\,\mu(A_n\setminus A_{n+1}).$$
    3. On suppose que $\int_Xf\,d\mu<+\infty$.
       (a) En utilisant la question 2, montrer que, pour tout $N\in\mathbb N^*$, $\sum_{n=1}^N\mu(A_n)\le\int_Xf\,d\mu+N\mu(A_N)$.
       (b) En déduire que $\sum_{n\in\mathbb N}\mu(A_n)<+\infty$.
    4. Réciproquement, montrer à l'aide de la question 2 que, si $\sum_{n\in\mathbb N}\mu(A_n)<+\infty$, alors $\int_Xf\,d\mu<+\infty$.
