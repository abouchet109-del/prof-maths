- id: mes-td1-ex06
  titre: limsup et liminf d'ensembles
  enonce: |
    Soit $(A_n)_{n\in\mathbb N}$ une suite de parties d'un ensemble $\Omega$.
    1. Déterminer $\limsup_{n\to+\infty}A_n$ et $\liminf_{n\to+\infty}A_n$ lorsque $A_{2p}=F$ et $A_{2p+1}=G$ où $F$ et $G$ sont deux parties de $\Omega$.
    2. Calculer $(\limsup_{n\to+\infty}A_n)^c$ et montrer que $\liminf_{n\to+\infty}A_n\subset\limsup_{n\to+\infty}A_n$.
    3. Calculer $\limsup_{n\to+\infty}A_n$ et $\liminf_{n\to+\infty}A_n$ dans les cas suivants :
       (a) $A_n:=]-\infty,a_n]$ pour tout $n\in\mathbb N^*$, où $a_{2p}:=1+\dfrac1{2p}$ pour tout $p\in\mathbb N^*$ et $a_{2p+1}:=-1-\dfrac1{2p+1}$ pour tout $p\in\mathbb N$.
       (b) $A_{2p}=]0,3+\dfrac1{3p}[$ et $A_{2p+1}=]-1-\dfrac1{3p},2]$ pour tout $p\in\mathbb N^*$.
       (c) $A_k=p_k\mathbb N$ où $(p_k)_{k\in\mathbb N}$ est la suite des nombres premiers et $p_k\mathbb N$ est l'ensemble des multiples de $p_k$.
    4. Montrer que dans le cas général : $\limsup_{n\to+\infty}\mathbf 1_{A_n}=\mathbf 1_{\limsup_{n\to+\infty}A_n}$. Donner une expression analogue pour la limite inférieure.
  sources:
  - etab: paris-cite
    fichier: mesure/td/td1-corrige.pdf
    page: 5
    numero: Ex 6
  annale_prioritaire: false
  type_source: td
  annale: null
  disponible: true
  sous_chapitre: Chapitre 0 - Préliminaires > Limite supérieure, limite inférieure
  methodes:
  - mes-m-02
  - mes-m-01
  notions:
  - mesure-n-0005
  - mesure-n-0003
  importance: important
  justification: limsup d'ensembles, nécessaire pour Borel-Cantelli et l'annale cc2l3-2425-ex04
