- id: mes-td7-ex07
  titre: Somme de 1/n^2 par une double intégrale
  enonce: |
    1. En calculant de deux façons différentes l'intégrale $I:=\int_{\mathbb R_+^2}\dfrac1{(1+y)(1+x^2y)}\,dx\,dy$, donner la valeur de l'intégrale $J=\int_0^{+\infty}\dfrac{\ln(x)}{x^2-1}\,dx$.
    2. Trouver une relation entre $\int_0^1\dfrac{\ln(x)}{x^2-1}\,dx$ et $\int_1^{+\infty}\dfrac{\ln(x)}{x^2-1}\,dx$ à l'aide d'un changement de variable.
    3. Montrer que $\int_0^1\dfrac{\ln(x)}{x^2-1}\,dx=\sum_{k=0}^{+\infty}\int_0^1-x^{2k}\ln(x)\,dx$.
    4. En déduire la valeur de la série $\sum_{n=0}^{+\infty}\dfrac1{(2n+1)^2}$ puis celle de $\sum_{n=1}^{+\infty}\dfrac1{n^2}$.
