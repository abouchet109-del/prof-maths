  enonce: |
    On considère un espace mesuré $(E,\mathcal A,\mu)$, $f$ une fonction mesurable, et $(A_n)_{n\in\mathbb N}$ une partition dénombrable de $E$.
    1. On suppose que $f$ est positive. Montrer que $\int_Ef\,d\mu=\sum_{n=0}^{+\infty}\int_{A_n}f\,d\mu$.
    2. Montrer que l'égalité ci-dessus est toujours vraie si $f$ est intégrable.
