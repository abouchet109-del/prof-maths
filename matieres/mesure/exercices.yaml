- id: mes-td5-ex03
  titre: Contre-exemple n 1_]0,1/n]
  enonce: |
    Soit $\lambda$ la mesure de Lebesgue sur $\mathbb R$. Soit $(f_n)_{n\in\mathbb N^*}$ la suite de fonctions donnée par $f_n:=n\mathbf 1_{]0,\frac1n]}$.
    1. Montrer que $(f_n)_{n\in\mathbb N^*}$ est une suite de fonctions positives convergeant simplement vers une fonction $f$ que l'on déterminera.
    2. Calculer $\int_{\mathbb R}f_n\,d\lambda$ et montrer que cette intégrale ne converge pas vers $\int_{\mathbb R}f\,d\lambda$.
    3. Que manque-t-il pour pouvoir appliquer :
       (a) le théorème de Beppo-Levi ?
       (b) le théorème de convergence dominée ?
    4. Mêmes questions en remplaçant la mesure de Lebesgue $\lambda$ par la mesure $\mu$ définie par $\mu(A):=\int_A|x|\,d\lambda(x)$ pour tout borélien $A$.
