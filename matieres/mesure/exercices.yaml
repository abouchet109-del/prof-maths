- id: mes-td1-ex05
  titre: limsup et liminf de suites réelles
  enonce: |
    Soit $(u_n)_{n\in\mathbb N}$ une suite de réels. On définit $v_k:=\sup_{n\ge k}u_n$ et $w_k:=\inf_{n\ge k}u_n$.
    1. Montrer que ces deux suites sont monotones et convergentes dans $\overline{\mathbb R}$. On définit ainsi la limite supérieure et inférieure de la suite $(u_n)_{n\in\mathbb N}$ par : $\limsup_{n\to+\infty}u_n:=\lim_{k\to+\infty}v_k$ et $\liminf_{n\to+\infty}u_n:=\lim_{k\to+\infty}w_k$.
    2. Montrer que la suite $(u_n)_{n\in\mathbb N}$ converge vers $\ell\in\overline{\mathbb R}$ si et seulement si : $\limsup_{n\to+\infty}u_n=\liminf_{n\to+\infty}u_n=\ell$.
    3. Déterminer les limites inférieures et supérieures des suites suivantes :
       (a) $a_n=(-1)^n$
       (b) $b_n=4+\dfrac{(-1)^n}{n+1}+\sin\!\big(\dfrac{n\pi}{2}\big)$
  sources:
  - etab: paris-cite
    fichier: mesure/td/td1-corrige.pdf
    page: 4
    numero: Ex 5
  annale_prioritaire: false
  type_source: td
