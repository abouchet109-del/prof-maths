- id: mes-cc1-2324-ex05
  titre: Convergence en mesure
  enonce: |
    Soit $(X,\mathcal T,\mu)$ un espace mesuré. On considère une fonction mesurable $f:X\to\mathbb R$ ainsi qu'une suite de fonctions mesurables $(f_n)_{n\in\mathbb N}$ définies de $X$ dans $\mathbb R$. On dit que $(f_n)$ converge en mesure vers $f$ si, pour tout $\epsilon>0$
    $$\lim_{n\to+\infty}\mu\big(\{x\in X : |f_n(x)-f(x)|\ge\epsilon\}\big)=0$$
    1. Montrer que, pour tout $\epsilon>0$, pour tout $n\in\mathbb N$, $\{x\in X : |f_n(x)-f(x)|\ge\epsilon\}\in\mathcal T$.
    2. On prend $(X,\mathcal T,\mu)=(\mathbb R,\mathcal B(\mathbb R),\lambda)$ où $\lambda$ est la mesure de Lebesgue et on considère les fonctions
    $$f_n=\mathbf 1_{[n,n+1]}=\begin{cases}1&\text{sur }[n,n+1]\\0&\text{sur }\mathbb R\setminus[n,n+1]\end{cases}$$
    Montrer que cette suite de fonctions converge simplement vers $0$ mais ne converge pas en mesure vers $0$.
    3. On suppose que $\mu(X)<+\infty$ et que la suite de fonctions $(f_n)_{n\in\mathbb N}$ converge presque partout vers $f$.
       (a) Pour $\epsilon>0$ fixé, on définit $E_n=\{x\in X : |f_k(x)-f(x)|\ge\epsilon,\text{ pour un }k\ge n\}$. Montrer que $\bigcap_{n\in\mathbb N}E_n\subset\{x\in X : (f_n(x))_{n\in\mathbb N}\text{ ne converge pas vers }f(x)\}$.
       (b) En déduire que $\mu(\bigcap_{n\in\mathbb N}E_n)=0$ puis que $\lim_{n\to+\infty}\mu(E_n)=0$.
       (c) Conclure que la suite $(f_n)_{n\in\mathbb N}$ converge en mesure vers $f$.
  sources:
