- id: mes-td5-ex08
  titre: Limites de suites d'intégrales
  enonce: |
    Calculer les limites quand $n$ tend vers l'infini des suites d'intégrales suivantes :
    1. $\displaystyle\int_0^1\frac{1+nt}{(1+t)^n}\,dt$
    2. $\displaystyle\int_0^{+\infty}\frac{\cos(nt)}{(nt+1)(1+t^2)}\,dt$
    3. $\displaystyle\int_0^{+\infty}\frac{t}{1+t^n}\,dt$ $(n\ge3)$
    4. $\displaystyle\int_0^{+\infty}\arcsin\Big(\frac1\pi\arctan\Big(\frac n{t^2}\Big)\Big)\,dt$
    5. $\displaystyle\int_0^{+\infty}\frac{n\ln(1+\frac tn)}{(1+t^2)^2}\,dt$ $(n\ge1)$

    Indication : on rappelle que pour tout $t>-1$, $\ln(1+t)\le t$.
