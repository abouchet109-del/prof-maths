- id: mes-dm-s6
  titre: 'DM : construction de la mesure de Lebesgue'
  enonce: |
    Définition 9. Pour toute partie $A\subset\mathbb R$, on définit
    $$\lambda^*(A)=\inf\Big\{\sum_{i\in\mathbb N}(b_i-a_i) : A\subset\bigcup_{i\in\mathbb N}]a_i,b_i[\Big\}.$$

    Le but de cette partie est de démontrer le résultat suivant :
    Théorème 10. i. $\lambda^*$ est une mesure extérieure sur $\mathbb R$.
    ii. $\mathcal B(\mathbb R)\subset\mathcal M(\lambda^*)$
    iii. Pour tout $a\le b$, $\lambda^*([a,b])=\lambda^*(]a,b[)=b-a$.

    Questions :
    1. Montrer que $\lambda^*(\emptyset)=0$ et que si $A\subset B$, $\lambda^*(A)\le\lambda^*(B)$.
    2. Soit $\varepsilon>0$ et soit $A_n$, $n\in\mathbb N$ une suite de parties de $\mathbb R$. Montrer que $\lambda^*(\bigcup_nA_n)\le\sum_{n\in\mathbb N}\lambda^*(A_n)+\varepsilon$.
    3. En déduire que $\lambda^*$ est une mesure extérieure sur $\mathbb R$.
    4. Montrer que tout intervalle de la forme $]-\infty,\alpha]$, $\alpha\in\mathbb R$, est dans $\mathcal M(\lambda^*)$.
    5. En déduire que $\mathcal B(\mathbb R)\subset\mathcal M(\lambda^*)$.
    6. À l'aide du théorème de compacité de Borel-Lebesgue : de tout recouvrement par des ouverts d'un compact, on peut extraire un sous-recouvrement fini, montrer le point iii. du théorème.
    7. Montrer que $\lambda^*$ restreint à $\mathcal B(\mathbb R)$ est la mesure de Lebesgue définie en cours.
