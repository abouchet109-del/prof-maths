- id: mes-td4-ex06
  titre: Vrai ou faux sur la mesure de Lebesgue
  enonce: |
    On se place sur $\mathbb R$ muni de la tribu borélienne $\mathcal B(\mathbb R)$ et de la mesure de Lebesgue $\lambda$. Les affirmations suivantes sont-elles vraies ou fausses ? Justifier votre réponse.
    1. Si $A\subset\mathbb R$ est dense dans $\mathbb R$, alors $\lambda(A\cap]0,1])>0$.
    2. Si $U$ est un ouvert non vide de $\mathbb R$, alors $\lambda(U)>0$.
    3. Si $K$ est un compact de $\mathbb R$, alors $K$ est mesurable et $\lambda(K)<+\infty$.
    4. Si $A$ est une partie mesurable telle que $\lambda(A)<+\infty$, alors il existe un compact $K$ tel que $A\subset K$.
    5. Si $A$ est une partie mesurable telle que $\lambda(A)>0$, alors il existe un ouvert non vide contenu dans $A$.
    6. Si $A$ est une partie mesurable telle que $\lambda(A)=0$, alors $A$ est fermé.
    7. Soit $\mathcal C\subset\mathcal P(\mathbb R)$ tel que $\mathcal B(\mathbb R)=\sigma(\mathcal C)$. Soient $m_1$ et $m_2$ deux mesures sur $(\mathbb R,\mathcal B(\mathbb R))$ telles que $m_1(A)=m_2(A)$ pour tout $A\in\mathcal C$. Alors, $m_1=m_2$.
  sources:
  - etab: paris-cite
    fichier: mesure/td/td4.pdf
    page: 2
    numero: Ex 6
  annale_prioritaire: false
  type_source: td
