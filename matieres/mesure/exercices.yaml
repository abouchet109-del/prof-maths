- id: mes-cc2l3-2425-ex04
  titre: Queue d'une fonction intégrable et limsup/liminf de {|f|>=n}
  enonce: |
    Soit $f:X\to\mathbb R$ une fonction intégrable de $(X,\mathcal T,\mu)$ dans $(\mathbb R,\mathcal B(\mathbb R),\lambda)$, où $\lambda$ désigne la mesure de Lebesgue sur $\mathbb R$. Pour tout entier $n\in\mathbb N$, on note $E_n=\{|f|\ge n\}$.
    1. Montrer que $\int_{E_n}|f|\,d\mu$ tend vers $0$ quand $n\to\infty$.
    2. Identifier les valeurs du réel $a>0$ pour lesquelles $\mu(E_n)=o(n^{-a})$ quand $n\to\infty$.
