- id: mes-ex-2324-ex04
  titre: Mesure extérieure et ensembles ν-mesurables
  enonce: |
    Soit $X$ un ensemble. On note $\mathcal P(X)$ l'ensemble des parties de $X$ et on considère une application $\nu:\mathcal P(X)\to[0,+\infty]$ qui satisfait les propriétés suivantes :
    (a) $\nu(\emptyset)=0$.
    (b) pour tout $A\subset B\subset X$, $\nu(A)\le\nu(B)$.
    (c) pour toute famille $(A_n)_{n\in\mathbb N}$ d'éléments de $X$, $\nu\big(\bigcup_{n\in\mathbb N}A_n\big)\le\sum_{n\in\mathbb N}\nu(A_n)$.

    1. Dans cette question, on suppose que $X$ est un ensemble non dénombrable et on pose : pour tout $A\in\mathcal P(X)$
    $$\nu(A)=\begin{cases}0&\text{si }A=\emptyset\\1&\text{si }A\text{ est dénombrable et }A\ne\emptyset\\2&\text{si }A\text{ est non dénombrable.}\end{cases}$$
    Montrer que $\nu$ satisfait les propriétés (a), (b) et (c). $\nu$ est-elle une mesure ?

    On revient à une application $\nu:\mathcal P(X)\to[0,+\infty]$ quelconque qui satisfait les propriétés (a), (b) et (c). On dit qu'un ensemble $E\subset X$ est $\nu$-mesurable si pour tout $A\subset X$
    $$\nu(A)=\nu(A\cap E)+\nu(A\setminus E).$$
    2. Montrer que si $E$ est $\nu$-mesurable, alors le complémentaire de $E$ est $\nu$-mesurable.
    3. Montrer que si $\nu(E)=0$, alors $E$ est $\nu$-mesurable.
    4. Soit $(A_n)_{n\in\mathbb N}$ une famille d'éléments $\nu$-mesurables disjoints 2 à 2. Montrer par récurrence que, pour tout $N\in\mathbb N$
    $$\nu\Big(\bigcup_{n=0}^NA_n\Big)=\sum_{n=0}^N\nu(A_n).$$
    En déduire que $\nu\big(\bigcup_{n\in\mathbb N}A_n\big)=\sum_{n\in\mathbb N}\nu(A_n)$.
  sources:
  - etab: uvsq
    fichier: uvsq/mesure/Théorie de la mesure/Annales/examen-2023-2024.pdf
    page: 2
    numero: Ex 4
