- id: mes-td6-ex06
  titre: Convolution d'une fonction intégrable et d'une fonction bornée
  enonce: |
    1. Soit $f$ une fonction intégrable sur $\mathbb R$ muni de la mesure de Lebesgue, et soit $g$ une fonction continue bornée. Montrer que la formule
    $$f*g(x)=\int_{-\infty}^{+\infty}f(x-y)g(y)\,dy=\int_{-\infty}^{+\infty}g(x-y)f(y)\,dy$$
    définit une fonction continue et bornée sur $\mathbb R$.
    2. On suppose de plus que $g$ est de classe $C^1$ et que la fonction $g'$ est bornée. Montrer que $f*g$ est de classe $C^1$ et calculer sa dérivée.
