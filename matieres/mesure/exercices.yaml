- id: mes-cc1-2526-ex03
  titre: Décomposition atomique d'une mesure σ-finie
  enonce: |
    Soit $(X,\mathcal T,\mu)$ un espace mesuré tel que, pour tout $x\in X$, $\{x\}\in\mathcal T$.
    On suppose qu'il existe une famille $(X_n)_{n\in\mathbb N}$ d'éléments de $\mathcal T$ telle que, pour tout $n\in\mathbb N$, $\mu(X_n)<+\infty$ et telle que $X=\bigcup_{n\in\mathbb N}X_n$.
    1. Montrer que pour tout $n\in\mathbb N$ et $k\in\mathbb N^*$, l'ensemble $\{x\in X_n : \mu(\{x\})\ge\frac1k\}$ a un nombre fini d'éléments.
    2. En déduire que l'ensemble $A=\{x\in X : \mu(\{x\})>0\}$ est dénombrable puis que $A\in\mathcal T$.
    3. On définit les applications $\mu_1$ et $\mu_2$ de $\mathcal T$ dans $\mathbb R^+$ par : pour tout $B\in\mathcal T$, $\mu_1(B)=\mu(A\cap B)$, $\mu_2(B)=\mu(A^\complement\cap B)$. Montrer que $\mu_1$ (ou $\mu_2$) est une mesure sur $(X,\mathcal T)$ et que $\mu=\mu_1+\mu_2$.
    4. Montrer que, pour tout $x\in X$, $\mu_2(\{x\})=0$.
