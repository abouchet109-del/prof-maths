- id: mes-dm-s2
  titre: 'DM : lemme de classe monotone'
  enonce: |
    Le but de cette partie est de démontrer le théorème suivant (les définitions de classe monotone, $\pi$-système et $\mathcal M(\mathcal E)$ sont celles de la section précédente).

    Théorème 3 (Lemme de classe monotone). Soit $\mathcal E$ un $\pi$-système contenant $E$ (i.e. $E\in\mathcal E$). Alors $\mathcal M(\mathcal E)=\sigma(\mathcal E)$.

    Questions :
    1. Justifier que l'on a toujours $\mathcal M(\mathcal E)\subset\sigma(\mathcal E)$.
    2. Justifier que pour montrer l'inclusion inverse il suffit de montrer que $\mathcal M(\mathcal E)$ est un $\pi$-système.
    3. Soit $B\in\mathcal E$. On pose $\mathcal C_B=\{A\in\mathcal M(\mathcal E) : A\cap B\in\mathcal M(\mathcal E)\}$. Montrer que $\mathcal C_B$ est une classe monotone contenant $\mathcal E$. En déduire que $\forall B\in\mathcal E,\ \forall A\in\mathcal M(\mathcal E),\ A\cap B\in\mathcal M(\mathcal E)$.
    4. Soit $C\in\mathcal M(\mathcal E)$. Montrer que $\mathcal C_C=\{A\in\mathcal M(\mathcal E),\ A\cap C\in\mathcal M(\mathcal E)\}$ est aussi une classe monotone contenant $\mathcal E$. Conclure.
