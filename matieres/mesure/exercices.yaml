- id: mes-td7-ex06
  titre: Fonctions Gamma et Bêta
  enonce: |
    Pour $a,b>0$, on pose $\Gamma(a):=\int_0^{+\infty}e^{-t}t^{a-1}\,dt$ et $B(a,b):=\int_0^1t^{a-1}(1-t)^{b-1}\,dt$.
    1. Montrer que les intégrales $\Gamma(a)$ et $B(a,b)$ sont finies pour tout $a,b>0$.
    2. Démontrer que la fonction $\Gamma$ est indéfiniment dérivable sur $\mathbb R_+^*$.
    3. Montrer que pour tout $a,b>0$, $B(a,b)=\dfrac{\Gamma(a)\Gamma(b)}{\Gamma(a+b)}$.
    4. Montrer que pour tout $a>0$, $\Gamma(a+1)=a\Gamma(a)$ puis en déduire la valeur de $\Gamma(n)$ pour tout $n\in\mathbb N^*$.
    5. Étudier les comportements de la fonction $\Gamma$ (convexité, variations, limites).
    6. Calculer $\Gamma(n+1/2)$ pour tout $n\in\mathbb N^*$.
