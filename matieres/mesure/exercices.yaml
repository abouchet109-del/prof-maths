- id: mes-td4-ex08
  titre: Ensemble de Vitali non mesurable
  enonce: |
    Le but de cet exercice est de construire un sous-ensemble de $\mathbb R$ non mesurable (pour la tribu borélienne).
    1. Montrer que la relation définie par $x\sim y\iff x-y\in\mathbb Q$ est une relation d'équivalence sur $\mathbb R$. En déduire que $\bigcup_{x\in\mathbb R}(x+\mathbb Q)$ forme une partition de $\mathbb R$.
    2. D'après l'axiome du choix, il existe un ensemble $A$ de représentants de la partition, c'est-à-dire que pour tout $x\in\mathbb R$, il existe un unique $y\in A$ tel que $x-y\in\mathbb Q$. Justifier que l'on peut imposer que $A\subset[0,1[$.
       Indication : on pourra considérer la fonction partie entière.
    3. Étant donné cet ensemble $A\subset[0,1[$ de représentants de la partition, on pose
    $$B=\bigcup_{q\in\mathbb Q\cap[-1,1]}(q+A).$$
    Montrer que l'union définissant $B$ est disjointe et que $[0,1]\subset B\subset[-1,2]$.
    4. Montrer que $A$ n'est pas mesurable en raisonnant par l'absurde sur les valeurs des mesures de Lebesgue $\lambda(A)$ et $\lambda(B)$.
  sources:
  - etab: paris-cite
    fichier: mesure/td/td4.pdf
    page: 2
    numero: Ex 8
  annale_prioritaire: false
  type_source: td
