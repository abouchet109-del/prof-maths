# Prérequis L1-L2 : notions `type: prerequis` servies avant les notions du poly de leur sous-chapitre
- id: mod-p-0001
  titre: Lemme de substitution
  type: prerequis
  chapitre: Chapitre 3 - Processus de Poisson et files d'attente
  sous_chapitre: 3.1.2 Processus de Poisson
  enonce: 'Si $X$ et $Y$ sont indépendantes et $f$ mesurable : $P(f(X,Y)\in B)=\int P(f(x,Y)\in B)\,dP_X(x)$, c''est-à-dire $P(f(X,Y)\in B\mid X=x)=P(f(x,Y)\in B)$.'
  source: {etab: l1-l2}
  essentiel: true
  requis_par: [mod-exa2324-ex04]
- id: mod-p-0002
  titre: Sommation des équivalents
  type: prerequis
  chapitre: Chapitre 1 - Modèle de Galton-Watson et séries génératrices
  sous_chapitre: 1.3.4 Comportement asymptotique
  enonce: Si $a_n\sim b_n$ avec $b_n>0$ et $\sum b_n$ divergente, alors $\sum_{k<n}a_k\sim\sum_{k<n}b_k$. En particulier $v_{n+1}-v_n\sim c>0$ donne $v_n\sim cn$.
