- id: mod-td1-ex07
  titre: Galton-Watson à loi géométrique, binomiale B(2,p) et B(3,p)
  enonce: |
    Soit $(X_{n,k},\ n\geqslant 0,\ k\geqslant 1)$ une famille de variables aléatoires indépendantes suivant toutes une loi géométrique sur $\mathbb{N}$ de paramètre $p\in\,]0,1[$ :
    $$\forall l\geqslant 0,\quad \mathbb{P}(X_{n,k}=l)=p(1-p)^l.$$
    On considère le processus de Galton-Watson $Z=(Z_n,\ n\geqslant 0)$ défini par :
    $$Z_0=1 \quad\text{et}\quad Z_{n+1}=\sum_{k=1}^{Z_n}X_{n,k}\quad\text{pour tout } n\geqslant 0.$$
    1. Déterminer la loi de $Z_1$, puis celle de $Z_2$.
    2. Déterminer $\mathbb{E}[Z_n]$ pour tout $n\geqslant 1$.
    3. Déterminer, en fonction de $p$, la probabilité d'extinction du processus $Z$.
    4. Mêmes questions avec une loi binomiale $\mathcal{B}(2,p)$.
    5. Mêmes questions avec une loi binomiale $\mathcal{B}(3,p)$.
