- id: mod-exa2526-ex01
  titre: Galton-Watson de loi uniforme sur {0,1,2,3}
  enonce: |
    On considère un processus de Galton-Watson $Z=(Z_n)_{n\in\mathbb{N}}$ défini par $Z_0=1$ et $Z_{n+1}=\sum_{k=1}^{Z_n}X_{k,n}$ pour tout $n\geq 0$, où les variables $X_{k,n}$, $k\geq 1$, $n\geq 0$, sont indépendantes et de même loi sur $\{0,1,2,3\}$ donnée par
    $$\mathbb{P}(X_{k,n}=0)=\mathbb{P}(X_{k,n}=1)=\mathbb{P}(X_{k,n}=2)=\mathbb{P}(X_{k,n}=3)=1/4.$$
    1. Donner $\mathbb{E}[Z_n]$ pour tout $n\geq 0$.
    2. Déterminer la fonction génératrice des variables $X_{k,n}$ et en déduire la probabilité d'extinction.
