- id: mod-td1-ex06
  titre: Galton-Watson issu de N individus
  enonce: |
    Soit $(X_{n,k},\ n\geqslant 0,\ k\geqslant 1)$ une famille de variables aléatoires indépendantes et de même loi, ayant un moment d'ordre $2$. On considère le processus de Galton-Watson $Z=(Z_n,\ n\geqslant 0)$ défini par :
    $$Z_0=N \quad\text{et}\quad Z_{n+1}=\sum_{k=1}^{Z_n}X_{n,k}\quad\text{pour tout } n\geqslant 0,$$
    où $N$ est un entier quelconque supérieur ou égal à $1$.
    1. En reprenant les preuves par récurrence du cours, déterminer $\mathbb{E}[Z_n]$, $\mathrm{var}(Z_n)$ et $G_n=\phi_{Z_n}$.
    2. Expliquer de façon probabiliste les formules obtenues.
