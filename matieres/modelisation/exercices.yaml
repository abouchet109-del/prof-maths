- id: mod-td2-ex09
  titre: Mutation de l'ADN
  enonce: |
    L'ADN est composé des quatre acides aminés $A$, $C$, $G$ et $T$. On s'intéresse à l'acide aminé occupant une position particulière dans un gène et on observe son évolution au cours des générations, dans un modèle (très) simplifié où un parent (unique) engendre un enfant (unique). Lorsque le gène est transmis à la génération suivante, une mutation peut avoir lieu, et il y peut y avoir un changement d'acide aminé au niveau de la position observée, ce que l'on modélise par une chaîne de Markov $(X_n,\ n\geqslant 0)$ sur l'espace d'états $S=\{A,C,G,T\}$ et avec la matrice de transition suivante :
    $$P_\varepsilon=\begin{pmatrix}
    1-2\varepsilon & \varepsilon & \varepsilon & 0\\
    \varepsilon & 1-\varepsilon & 0 & 0\\
    \varepsilon & 0 & 1-\varepsilon & 0\\
    2\varepsilon & 0 & 0 & 1-2\varepsilon
    \end{pmatrix}$$
    1. Quels sont les états récurrents, transients, les classes de récurrence ?
    2. Quelle est la distribution à très long terme des acides aminés sur la position observée ? Quelle est la vitesse de convergence vers cette distribution ?
    3. On suppose qu'à l'instant $0$ l'acide aminé est $A$ et que $\varepsilon$ est à peu près égal à $10^{-6}$. Déterminer, avec une approximation raisonnable, la distribution des acides aminés au bout de 1000 générations.
  sources:
