- id: mod-td1-ex08
  titre: Population de baleines
  enonce: |
    On souhaite étudier une population de baleines au cours des ans. Pour cela, on ne s'intéresse qu'aux individus femelles et on considère une génération par an, régulée par le processus suivant :
    - Si la baleine meurt dans l'année, son éventuel baleineau meurt également, et elle a $0$ descendant l'année suivante.
    - Si la baleine survit mais n'a pas de baleineau femelle, elle engendre un descendant dans la population de l'année suivante (elle-même).
    - Si la baleine survit et a un baleineau femelle, elle engendre deux descendants (elle-même et le baleineau).

    On suppose que toutes les baleines meurent d'une année sur l'autre avec la même probabilité $p$. On note $\mu$ la probabilité d'enfanter un baleineau femelle, et on suppose que la mort et l'enfantement sont indépendants.
    1. Quelle relation doivent satisfaire $p$ et $\mu$ pour que la population ne s'éteigne pas forcément ?
    2. Dans ce cas, avec quelle probabilité s'éteindra-t-elle tout de même ?
  sources:
