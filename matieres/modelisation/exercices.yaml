- id: mod-par2526-ex02
  titre: 'Galton-Watson géométrique : fonction génératrice de Z_n et extinction'
  enonce: |
    Soit $(X_{n,k})_{n\geqslant 0,k\geqslant 1}$ une famille de variables aléatoires indépendantes suivant toutes une loi géométrique sur $\mathbb{N}$ de paramètre $p\in\,]0,1[$ :
    $$\forall l\geqslant 0,\quad \mathbb{P}(X_{n,k}=l)=p(1-p)^l.$$
    On considère le processus de Galton-Watson $Z=(Z_n)_{n\geqslant 0}$ défini par :
    $$Z_0=1 \quad\text{et}\quad Z_{n+1}=\sum_{k=1}^{Z_n}X_{n,k}\quad\text{pour tout } n\geqslant 0.$$
    On note $\varphi$ la fonction génératrice de $X_{0,1}$ et $m$ son espérance.
    1. (a) Montrer que $\varphi(s)=\dfrac{p}{1-(1-p)s}$, $s\in[0,1]$. En déduire que $m=\dfrac{1-p}{p}$. Pour quelles valeurs de $p$ a-t-on $m\leq 1$ ?
       - (b) Déterminer en fonction de $p$ la probabilité d'extinction, que l'on notera $\alpha$.
       - (c) Soit $T$ le temps d'extinction du processus : $T=\inf\{n\geqslant 0\mid Z_n=0\}$ où l'on pose $\inf\emptyset=+\infty$. Donner un équivalent simple de $\mathbb{P}(T>n)$ quand $n$ tend vers l'infini, dans le cas où $p\in\,]0.5,1[$. On fera référence à un résultat de cours.
       - (d) Que peut-on dire de $Z_n$ quand $n$ tend vers l'infini, dans le cas où $p\in\,]0,0.5[$ ? On fera référence à un résultat de cours.
    2. Dans cette question, on suppose que $p\neq\frac12$. Le but de cette question est de calculer la fonction génératrice $G_n$ de $Z_n$. On considère la fonction auxiliaire $u_n(s)=\dfrac{1}{1-G_n(s)}$, $s\in[0,1[$. En particulier $u_0(s)=\dfrac{1}{1-s}$, $s\in[0,1[$.
       - (a) Montrer que, pour tout $n\geq 0$ et tout $s\in[0,1[$, $u_{n+1}(s)=\dfrac{1}{m}u_n(s)+1$.
       - (b) En déduire que $u_n(s)=\beta+\dfrac{1}{m^n}(u_0(s)-\beta)$, $s\in[0,1[$, avec $\beta=\dfrac{1-p}{1-2p}$.
       - (c) Conclure que $G_n$ est donnée par
         $$\forall n\geq 0,\ \forall s\in[0,1],\quad G_n(s)=\frac{p\,m^n(1-s)+(1-p)s-p}{(1-p)\,m^n(1-s)+(1-p)s-p}.$$
    3. Dans cette question, on suppose toujours que $p\neq\frac12$.
       - (a) Déduire de la question précédente que $\mathbb{P}(Z_n=0)=\dfrac{m^{n}-1}{m^{n+1}-1}$ et retrouver la valeur de la probabilité d'extinction dans les deux cas $p<1/2$ et $p>1/2$.
       - (b) Déterminer $\mathbb{P}(T>n)$ et en donner un équivalent explicite en $+\infty$, quand $p$ appartient à $]0.5,1[$.
       - (c) Déterminer la loi du temps d'extinction $T$, quand $p$ appartient à $]0.5,1[$.
    4. Dans cette question, on suppose que $p=1/2$. En s'inspirant des questions précédentes, déterminer $\mathbb{P}(T>n)$.
