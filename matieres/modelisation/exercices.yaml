- id: mod-exa2526-ex02
  titre: Modèle des puces (Ehrenfest)
  enonce: |
    Deux chiens $A$ et $B$ dorment côte à côte. Des puces passent d'un chien à l'autre au cours du temps selon le modèle suivant. On suppose qu'il y a au total $N$ puces. À chaque instant, on tire uniformément au hasard une puce et celle-ci saute sur le chien d'à côté. On note $X_n$ le nombre de puces présentes sur le chien $A$ à l'instant $n$, et on suppose que $X_0=N$ p.s.
    1. Montrer que $X=(X_n)_{n\in\mathbb{N}}$ est une chaîne de Markov sur $E=\{0,1,\dots,N\}$ de noyau de transition défini pour tout $(k,j)\in\{0,\dots,N\}^2$ par
       $$P(k,j)=\begin{cases}\dfrac{N-k}{N} & \text{si } j=k+1 \text{ et } 0\leq k\leq N-1,\\[2mm] \dfrac{k}{N} & \text{si } j=k-1 \text{ et } 1\leq k\leq N,\\[2mm] 0 & \text{sinon.}\end{cases}$$
    2. Dessiner le graphe de transition de la chaîne pour $N=3$.
    3. Justifier que $P$ est irréductible.
    4. On dit qu'une mesure de probabilité $\pi$ est réversible pour un noyau de transition $Q$ sur un espace $F$ fini si $\pi(x)Q(x,y)=\pi(y)Q(y,x)$ pour tout $x,y\in F$.
       - (a) Montrer que si $\pi$ est une mesure de probabilité réversible pour $Q$, alors elle est invariante pour $Q$.
       - (b) Vérifier que la loi $\pi=\mathcal{B}(N,1/2)$ est une mesure de probabilité réversible pour $P$.
    5. On note $T=\inf\{n\geq 1: X_n=N\}$. Que représente $T$ ? Donner $\mathbb{E}[T]$.
