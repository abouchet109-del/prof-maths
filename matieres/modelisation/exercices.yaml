- id: mod-td1-ex09
  titre: 'Cas critique : temps d''extinction d''espérance infinie'
  enonce: |
    On considère un processus de Galton-Watson $(Z_n)_{n\in\mathbb{N}}$. On note $\phi$ la fonction génératrice de $Z_1$, et on suppose que $m=\phi'(1)=1$ et que $Z_1$ admet un moment d'ordre $2$, ce qui signifie que $\phi''(1^-)$ existe. On suppose de plus que la variance de $Z_1$ n'est pas nulle. Soit $\tau=\inf\{n\geq 0,\ Z_n=0\}$ le temps d'extinction.
    1. Justifier que $\tau$ est presque sûrement fini.
    2. On pose $u_n=\mathbb{P}(\tau>n)$. Écrire $u_n$ en fonction de $G_n(0)$, où $G_n$ est la fonction génératrice de $Z_n$, et en déduire une relation de récurrence sur la suite $(u_n)_n$.
    3. Que vaut $\lim_{n\to\infty}u_n$ ? En déduire un développement limité à l'ordre de $2$ dans la relation de récurrence.
    4. Montrer que $\dfrac{1}{u_{n+1}}-\dfrac{1}{u_n}\underset{+\infty}{\sim}\dfrac{\phi''(1^-)}{2}$.
    5. En déduire que $u_n\underset{+\infty}{\sim}\dfrac{2}{\phi''(1^-)\,n}$.
    6. Montrer que $\mathbb{E}[\tau]=+\infty$.
  sources:
  - etab: paris-cite
    fichier: modelisation/td/td1-galton-watson.pdf
    page: 2
