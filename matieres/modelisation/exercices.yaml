- id: mod-td2-ex12
  titre: Trois produits concurrents
  enonce: |
    Les consommateurs de trois produits concurrents ($P_1$, $P_2$ et $P_3$) sont répartis en 50% pour $P_1$, 30% pour $P_2$ et 20% pour $P_3$. Après chaque mois, 60% restent fidèles à $P_1$ contre 70% pour $P_2$ et 90% pour $P_3$. Les autres se répartissent entre les deux autres produits de façon équiprobable. On note $X_n$ le produit choisi par un consommateur quelconque au mois $n$.
    1. On souhaite modéliser la suite $(X_n,\ n\geqslant 0)$ par une chaîne de Markov. Quelles sont les hypothèses implicites d'une telle modélisation ?
    2. Quelles sont la loi initiale et la matrice de transition de la chaîne de Markov ? Dessiner le diagramme de la chaîne.
    3. Quelle est la loi de $X_n$ quand $n$ tend vers l'infini ? En moyenne, à quel produit va la préférence du consommateur ?
    4. Quelle est la vitesse de convergence de la chaîne de Markov vers sa mesure stationnaire ?
    5. Soit $T_1$ le nombre de mois avant le premier passage par $P_1$ : $T_1=\inf\{n\geqslant 1\mid X_n=P_1\}$. Que vaut $\mathbb{E}[T_1\mid X_0=P_1]$ ?
    6. Déterminer un système linéaire d'équations entre $\mathbb{E}[T_1\mid X_0=P_1]$, $\mathbb{E}[T_1\mid X_0=P_2]$ et $\mathbb{E}[T_1\mid X_0=P_3]$, et le résoudre. Est-ce cohérent avec la valeur précédente ?
    7. On suppose que la chaîne de Markov a atteint son régime stationnaire. Donner le nombre de mois moyen pour qu'un consommateur choisisse le produit $P_1$.
