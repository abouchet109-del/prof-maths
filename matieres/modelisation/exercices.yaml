- id: mod-td2-ex07
  titre: Photocopieuse
  enonce: |
    Le fonctionnement d'une photocopieuse est décrit de manière très simplifiée par une chaîne de Markov sur un espace d'état $\Omega=\{0,1\}$, $0$ correspondant à l'état hors service et $1$ correspondant à l'état de marche. La matrice de transition est donnée par :
    $$P=\begin{pmatrix} 0.6 & 0.4\\ 0.02 & 0.98 \end{pmatrix}$$
    1. On suppose que $\mathbb{P}(X_0=1)=1$. Déterminer $\mathbb{P}(X_1=1)$ et $\mathbb{P}(X_2=1)$.
    2. Plus généralement, déterminer une équation de récurrence vérifiée par $u_n=\mathbb{P}(X_n=1)$.
    3. Déterminer la loi limite $\mu_\infty$ de $X_n$ et vérifier qu'il s'agit d'une distribution stationnaire, autrement dit, que $X_{n+1}$ suit la loi $\mu_\infty$ si $X_n$ suit la loi $\mu_\infty$.
