- id: mod-par2324-ex01
  titre: Galton-Watson de Poisson, taille totale de la population
  enonce: |
    On considère un processus de Galton-Watson $Z=(Z_n)_{n\geq 0}$ où le nombre de descendants d'un individu suit une loi de Poisson de paramètre $\lambda>0$. Autrement dit :
    $$Z_0=1 \quad\text{et pour tout } n\geq 0,\quad Z_{n+1}=\sum_{k=1}^{Z_n}X_{n,k}$$
    où les $X_{n,k}$, $n\geq 0$, $k\geq 1$, sont indépendantes et de loi $\mathcal{P}(\lambda)$. On rappelle que dans ce cas $\mathbb{E}[X_{0,1}]=\mathrm{Var}(X_{0,1})=\lambda$. On note $G_n$ la fonction génératrice de $Z_n$.
    1. Montrer que $G_1(z)=e^{\lambda(z-1)}$, $z\in[-1,1]$. Déterminer $G_2$, puis en déduire $\mathbb{P}(Z_2=0)$ et $\mathbb{P}(Z_2=1)$.
    2. Donner $\mathbb{E}[Z_n]$ et $\mathrm{Var}(Z_n)$ pour tout $n\geq 1$. On fera référence à un résultat de cours.
    3. On note $E$ l'événement « La population finit par s'éteindre » et $p=\mathbb{P}(E)$. Quelle équation est vérifiée par $p$ ?
    4. À quelle condition $p$ est-elle égale à $1$ ? Montrer que si $\lambda>1$, alors $p\geq \dfrac{1}{e^\lambda-\lambda}$. Indication : On rappelle que $e^x\geq 1+x$ pour tout $x\in\mathbb{R}$.
    5. On considère $T=\sum_{k=0}^{+\infty}Z_k$ qui représente la taille totale de la population. Montrer que si $\lambda<1$, alors $\mathbb{E}[T]=\dfrac{1}{1-\lambda}$. Que peut-on dire si $\lambda=1$ ?
    6. Soit $N\geq 1$. On considère $Z^{(1)},\dots,Z^{(N)}$ des copies indépendantes du processus $Z$, et on note $Z'$ le processus défini par $Z'_n=Z^{(1)}_n+\cdots+Z^{(N)}_n$ pour tout $n\geq 0$. On note $H_n$ la fonction génératrice de $Z'_n$. Montrer que $H_n=(G_1^{\circ n})^N$.
    7. En déduire la probabilité d'extinction du processus $Z'$, en fonction de $p$.
    8. On souhaite déterminer la fonction génératrice $\varphi_T$ de $T$.
       - (a) On note $T'=\sum_{k=0}^{+\infty}Z'_k$ la taille totale de la population du processus $Z'$. Montrer que $\varphi_{T'}=(\varphi_T)^N$.
       - (b) Expliquer pourquoi, conditionnellement à $Z_1=N$, $T$ a même loi que $1+T'$. On ne demande pas de justification complètement rigoureuse.
       - (c) En déduire que $\varphi_T$ vérifie l'équation : $\forall s\in[-1,1],\ \varphi_T(s)=s\,G_1(\varphi_T(s))$.
