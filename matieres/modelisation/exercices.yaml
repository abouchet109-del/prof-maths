- id: mod-td2-ex11
  titre: Processus de vie et de mort fini
  enonce: |
    Soit $0<p<1$. On modélise un processus de vie et de mort fini par une chaîne de Markov à valeurs dans $\{0,\dots,N\}$. Quand il n'y a pas d'individu, il s'en crée un avec probabilité $p$, quand il y en a $N$, l'un d'eux meurt avec probabilité $1-p$. Quand il y en a $k$, $0<k<N$, il y a une naissance avec probabilité $p$ et une mort avec probabilité $1-p$.
    1. Dessiner le diagramme de la chaîne.
    2. Déterminer sa matrice de transition.
    3. Déterminer la mesure invariante et le comportement asymptotique de la chaîne ?
    4. Quel est le comportement de la chaîne pour $p$ très petit, très proche de $1$ et $p=\frac12$ ?
