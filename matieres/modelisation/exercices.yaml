    1. Soit $n\geqslant 0$ et $x\in S$ tel que $\mu_n(x)$ soit strictement positive. Soit $y\in S$ tel qu'il existe un chemin de $x$ à $y$. Montrer qu'il existe $p\geqslant 0$ tel que $\mu_{n+p}(y)>0$.
    2. On suppose que $X$ est irréductible. Soit $\pi$ la mesure de probabilité invariante. Montrer que pour tout $x\in S$, $\pi(x)>0$.
