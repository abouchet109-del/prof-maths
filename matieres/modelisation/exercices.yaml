- id: mod-td2-ex13
  titre: Chaîne à 5 états avec matrice à compléter
  enonce: |
    Soit $X=(X_n,\ n\geqslant 0)$ une chaîne de Markov sur l'espace d'états $S=\{1,2,3,4,5\}$, décrite par la matrice de transition suivante :
    $$P=\begin{pmatrix}
    \frac12 & 0 & 0 & 0 & \\
    0 & & \frac13 & \frac13 & 0\\
    0 & \frac14 & & \frac14 & \frac14\\
    0 & 0 & 0 & & 0\\
     & 0 & 0 & 0 & \frac13
    \end{pmatrix}$$
    1. Compléter la matrice de transition et tracer le graphe de la chaîne de Markov.
    2. Quels sont les états récurrents ? transients ? les classes de récurrence ? La chaîne de Markov est-elle irréductible ?
    3. On suppose que $X_0=1$. Montrer que la loi de $X_n$ converge vers une loi invariante $\pi_1$ que l'on déterminera. Déterminer également la vitesse de cette convergence.
    4. Dans le cas général, déterminer l'ensemble des lois invariantes.
    5. On note $\mathcal{C}_1=\{1,5\}$, $\mathcal{C}_2=\{2,3\}$ et $\mathcal{C}_3=\{4\}$. On définit, pour $i\in\{1,2,3\}$ et $x\in S$ : $T_i=\inf\{n\geq 0\mid X_n\in\mathcal{C}_i\}$ et $q_x^{(i)}=\mathbb{P}(T_i<+\infty\mid X_0=x)$. Que vaut $q_x^{(1)}$ si $x\in\mathcal{C}_1$ ? si $x\in\mathcal{C}_3$ ?
    6. Montrer que pour tout $i\in\{1,2,3\}$ et $x\in S\setminus\mathcal{C}_i$ : $q_x^{(i)}=\sum_{y\in S}P(x,y)\,q_y^{(i)}$.
    7. En déduire $q_x^{(1)}$ pour $x\in\mathcal{C}_2$.
    8. Puis en déduire $q_x^{(3)}$ pour tout $x\in S$.
    9. Soit $x\in S$. On suppose $X_0=x$. Déterminer la loi limite de $X_n$ quand $n$ tend vers l'infini.
