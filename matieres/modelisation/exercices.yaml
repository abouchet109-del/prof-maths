- id: mod-exa2526-ex03
  titre: Âge et temps résiduel d'un processus de Poisson
  enonce: |
    Soit $N=(N_t)_{t\geq 0}$ un processus de Poisson d'intensité $\lambda>0$ et $(T_n)_{n\geq 1}$ le processus ponctuel associé. On fixe un instant $t>0$.
    1. Montrer que $A_t:=t-T_{N_t}$ a même loi que $\min(X,t)$ où $X$ suit une loi exponentielle de paramètre $\lambda$. Indication : On remarquera que $t-T_{N_t}>s$ si et seulement si $N_t=N_{t-s}$.
    2. Montrer que $B_t:=T_{N_t+1}-t$ suit la loi exponentielle de paramètre $\lambda$. Indication : On remarquera que $B_t>s$ si et seulement si $N_t=N_{t+s}$.
    3. Calculer $\mathbb{E}[A_t+B_t]$.
    4. Justifier que les variables $A_t$ et $B_t$ sont indépendantes.
