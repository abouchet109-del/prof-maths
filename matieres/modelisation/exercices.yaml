- id: mod-td2-ex03
  titre: Deux urnes, rouge et bleue
  enonce: |
    Une urne rouge contient 2 boules rouges et 3 boules bleues. Une urne bleue contient une boule rouge et 4 boules bleues. On considère le processus aléatoire suivant : à chaque étape, une boule est choisie au hasard dans une urne, on note sa couleur et on la remet dans son urne. La boule suivante est extraite de l'urne dont la couleur coïncide avec celle de la boule extraite à l'étape précédente. L'espace des états correspond à la couleur des urnes dans lesquelles on effectue les tirages : $E=\{R,B\}$.
    1. Écrire la matrice $P$ de transition de la chaîne de Markov $(X_n)_{n\geq 0}$ ainsi définie, et dessiner son graphe.
    2. Si on suppose que l'on tire initialement dans l'urne rouge, quelle est la probabilité que l'on tire aussi dans l'urne rouge à l'étape $n=3$ ? Et à l'étape $n=100$ ?
    3. Montrer que, quelles que soient les probabilités initiales $\mathbb{P}(X_0=R)$ et $\mathbb{P}(X_0=B)$, lorsque $n$ tend vers l'infini, $\mathbb{P}(X_n=R)$ tend vers $1/4$ et $\mathbb{P}(X_n=B)$ tend vers $3/4$.
