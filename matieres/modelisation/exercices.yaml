  titre: Propagation d'une information
  enonce: |
    On considère la propagation d'une information d'un individu $0$ à un individu $n$ via $n-1$ relais. On note $\alpha$ la probabilité que l'information soit fausse à l'individu $k+1$ sachant qu'elle était vraie en $k$ et $\beta$ la probabilité qu'elle soit vraie en $k+1$ alors qu'elle était fausse en $k$.
    1. Modéliser l'état de l'information à l'aide d'une chaîne de Markov.
    2. En déduire un moyen de calculer la probabilité que l'information soit encore vraie pour un nombre de pas tendant vers l'infini.
