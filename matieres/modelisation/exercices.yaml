- id: mod-exa2324-ex03
  titre: Commandes en ligne et processus de Poisson
  enonce: |
    On modélise le nombre de commandes passées lors d'une journée sur un site de vente en ligne par un processus de Poisson $N=(N_t)_{t\in[0,24]}$, d'intensité $\lambda>0$, l'unité de temps étant l'heure. On estime qu'il y a en moyenne $2$ commandes par heure.
    1. Que vaut $\lambda$ ?
    2. Quelle est la probabilité qu'il n'y ait aucune commande de toute la journée ?
    3. Quelle est la probabilité qu'il y ait exactement une commande dans chaque intervalle $[k,k+1[$, $k\in\{0,1,\dots,23\}$ ?
    4. Quelle est la probabilité qu'il y ait autant de commandes avant et après midi ? On donnera la réponse sous la forme de la somme d'une série convergente.
    5. Sachant qu'il y a eu deux commandes entre 0h et 1h, quelle est la durée moyenne séparant ces deux commandes ?
