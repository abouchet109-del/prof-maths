- id: mod-exa2324-ex04
  titre: Poisson et œufs de tortues
  enonce: |
    On considère deux processus de Poisson $N=(N_t)_{t\geq 0}$ et $N'=(N'_t)_{t\geq 0}$ indépendants d'intensités respectives $\lambda>0$ et $\mu>0$. On note $(T'_n)_{n\geq 1}$ les temps de saut du processus $N'$. On suppose que $N$ représente le nombre d'œufs pondus par une colonie de tortues au cours du temps et que $(T'_n)_{n\geq 1}$ représente les instants aléatoires où des scientifiques viennent compter les œufs en question. On pose, pour tout $n\geq 1$, $M_n=N_{T'_n}-N_{T'_{n-1}}$ avec $T'_0=0$.
    1. Que représente $M_n$ ? Quelles sont les valeurs possibles pour $M_n$ ?
    2. Montrer que pour tout $\alpha>0$ et tout $k\geq 0$, $\displaystyle\int_0^{+\infty}x^ke^{-\alpha x}\,dx=\frac{k!}{\alpha^{k+1}}$. On pourra procéder par récurrence.
    3. En déduire $\mathbb{P}(M_1=k)$ pour tout $k\geq 0$.
    4. Montrer que les variables $M_n$ ont toutes la même loi.
    5. Justifier que les variables $(M_n)_{n\geq 1}$ sont indépendantes. Pour cela on se contentera de montrer que $M_1$ et $M_2$ sont indépendantes.
