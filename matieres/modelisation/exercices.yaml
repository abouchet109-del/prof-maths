- id: mod-td2-ex02
  titre: Loi de X_n pour une chaîne à deux états
  enonce: |
    Supposons que $E=\{1,2\}$, que $(X_n)$ soit une chaîne de Markov sur $E$ telle que :
    - $\mathbb{P}(X_1=1\mid X_0=1)=p_{11}$ et $\mathbb{P}(X_1=2\mid X_0=1)=p_{12}$
    - $\mathbb{P}(X_1=1\mid X_0=2)=p_{21}$ et $\mathbb{P}(X_1=2\mid X_0=2)=p_{22}$

    Soit $\mu_0=(a,b)$ la mesure initiale, c'est-à-dire que $\mathbb{P}(X_0=1)=a$ et $\mathbb{P}(X_0=2)=b$. On pose $P=(p_{ij})_{1\leq i,j\leq 2}$.
    1. Donner la loi de $X_1$.
    2. On note $\mu_n=(a_n,b_n)$ la loi de $X_n$. Donner une formule de récurrence pour $a_n$ et $b_n$.
    3. Montrer, par récurrence sur $n$, que $(a_n,b_n)=\mu_0P^n$.
  sources:
