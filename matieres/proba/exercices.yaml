- id: pro-td4-ex03
  titre: 'Loi mélange : atome et partie uniforme'
  enonce: |
    Soit $X$ une variable aléatoire dont la fonction de répartition est donnée par :
    $$F_X(x)=\begin{cases}0 & \text{si } x<0\\ \frac12x & \text{si } x\in[0,1[\\ 1 & \text{si } x>1\end{cases}$$

    1. Tracer le graphe de $F_X$. $X$ est-elle une variable discrète ? Une variable à densité ?
    2. Donner les valeurs de $\mathbb{P}\left(X=\frac12\right)$, $\mathbb{P}(X=1)$, $\mathbb{P}\left(\frac34<X\le1\right)$ et $\mathbb{P}\left(\frac34<X<1\right)$.
    3. Soit $U$ et $V$ deux variables indépendantes telles que $U$ suive une loi de Bernoulli de paramètre $\frac12$ et $V$ suive une loi uniforme sur $[0,1]$. On pose $W=U+(1-U)V$. Autrement dit : $W=1$ si $U=1$, $W=V$ si $U=0$. On dit que la loi de $W$ est un mélange des lois de $V$ et de la constante 1. Montrer que $W$ et $X$ ont même loi.
    4. Soit $f$ une fonction réelle continue et bornée. Déterminer $\mathbb{E}[f(X)]$.
