- id: pro-td3-ex04
  titre: Inégalité de Cantelli-Tchebycheff
  enonce: |
    1. Soit $X$ une variable aléatoire réelle ayant un moment d'ordre 2. On la suppose centrée et on note $\sigma^2$ sa variance. Montrer que pour tout $t>0$ on a l'inégalité :
       $$\mathbb{P}(X\ge t)\le\frac{\sigma^2}{\sigma^2+t^2}.$$
       Comparer cette inégalité à l'inégalité de Bienaymé-Tchebycheff.
    2. Soit $t>0$. Peut-on choisir $X$ (centrée et de variance $\sigma^2$) telle que $\mathbb{P}(X\ge t)=\frac{\sigma^2}{\sigma^2+t^2}$ ?
