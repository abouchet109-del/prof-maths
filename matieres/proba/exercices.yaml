- id: pro-exa2526-ex04
  titre: 'Modes de convergence : suite X_n valant 0 ou n'
  enonce: |
    On considère une suite $(X_n)_{n\ge1}$ de variables aléatoires indépendantes telles que, pour tout $n\ge1$,
    $$\mathbb{P}(X_n=0)=1-\frac1n\quad\text{et}\quad\mathbb{P}(X_n=n)=\frac1n.$$
    Les quatre questions suivantes peuvent être traitées indépendamment les unes des autres.

    1. (a) Montrer que $X_n$ tend vers 0 en probabilité, quand $n\to+\infty$.

       (b) Montrer qu'avec une probabilité égale à $1$, $X_n=n$ pour une infinité d'indices $n$.

       (c) En déduire que $X_n$ ne converge pas vers $0$ presque sûrement.

       (d) A-t-on convergence en moyenne d'ordre 1 ?
    2. Dans cette question, on considère une suite $(Z_n)_{n\ge1}$ de variables aléatoires positives telle que $M:=\sup_{n\ge1}\mathbb{E}[Z_n^2]<+\infty$ et telle que $Z_n$ converge vers $0$ en loi, quand $n\to\infty$.

       (a) Montrer que, pour tout $a>0$, $\mathbb{E}[Z_n]\le\mathbb{E}[\min(Z_n,a)]+M^{1/2}\,\mathbb{P}(Z_n>a)^{1/2}$.
       Indication : on commencera par montrer que pour tout $z\ge0$, $z\le\min(z;a)+z\mathbf 1_{\{z>a\}}$.

       (b) En déduire que $\mathbb{E}[Z_n]\to0$ quand $n\to\infty$.
    3. Dans cette question, on pose $Y_n=\frac1n\sum_{k=1}^nX_k$, $n\ge1$.

       (a) Montrer que $\mathbb{E}[Y_n]=1$ et $\mathrm{Var}(Y_n)=\frac{n-1}{2n}$.
       Indication : on rappelle que pour tout nombre entier $N$, $1+2+\dots+N=N(N+1)/2$.

       (b) En utilisant la question 2, montrer que $Y_n$ ne converge pas en loi vers $0$, quand $n\to+\infty$.

       (c) A-t-on convergence en probabilité ?
    4. Dans cette question, on considère une suite $(X'_n)_{n\ge1}$ de variables aléatoires indépendantes telles que, pour tout $n\ge1$,
       $$\mathbb{P}(X'_n=0)=1-\frac1{n^2}\quad\text{et}\quad\mathbb{P}(X'_n=n)=\frac1{n^2},$$
       et on pose $Y'_n=\frac1n\sum_{k=1}^nX'_k$, $n\ge1$.

       (a) Montrer que $X'_n$ converge vers $0$ presque sûrement.

       (b) En déduire que $Y'_n$ converge vers $0$ presque sûrement.
       Indication : on rappelle le résultat d'analyse suivant : si une suite à valeurs réelles $(u_n)_{n\ge1}$ converge vers une limite $\ell$, alors $\frac1n\sum_{k=1}^nu_k\to\ell$ quand $n\to\infty$ (théorème de Cesàro).
