- id: pro-par2526-ex03
  titre: Cauchy-Schwarz et inégalité de Paley-Zygmund
  enonce: |
    La question 2 peut être traitée en admettant le résultat de la question 1.

    1. On considère deux variables aléatoires $U,V$ telles que $\mathbb{E}[U^2]<+\infty$ et $\mathbb{E}[V^2]<+\infty$.
       1. Montrer que $\mathbb{E}[|UV|]\le\frac12\mathbb{E}[U^2]+\frac12\mathbb{E}[V^2]$.
       2. En déduire l'inégalité de Cauchy-Schwarz : $\mathbb{E}[|UV|]\le\sqrt{\mathbb{E}[U^2]\mathbb{E}[V^2]}$.
          Indication : on commencera par traiter le cas $\mathbb{E}[U^2]=\mathbb{E}[V^2]=1$.
    2. Soit $X$ une variable aléatoire positive et telle que $0<\mathbb{E}[X^2]<+\infty$ et $\alpha\in]0,1[$.
       1. Montrer que $(1-\alpha)\mathbb{E}[X]\le\mathbb{E}\left[X\mathbf 1_{\{X\ge\alpha\mathbb{E}[X]\}}\right]$.
          Indication : on écrira $(1-\alpha)\mathbb{E}[X]=\mathbb{E}[X-\alpha\mathbb{E}[X]]$.
       2. En utilisant l'inégalité de Cauchy-Schwarz, en déduire que
          $$\mathbb{P}(X\ge\alpha\mathbb{E}[X])\ge\frac{(1-\alpha)^2\mathbb{E}[X]^2}{\mathbb{E}[X^2]}.$$
       3. En modifiant légèrement le raisonnement précédent, montrer que
          $$\mathbb{P}(X\ge\alpha\mathbb{E}[X])\ge\frac{(1-\alpha)^2\mathbb{E}[X]^2}{\mathrm{Var}(X)+(1-\alpha)^2\mathbb{E}[X]^2}.$$
