       $$\mathbb{E}[X]=\sum_{n=1}^{+\infty}\mathbb{P}(X\ge n)\quad\text{et}\quad \mathbb{E}[X^2]-\mathbb{E}[X]=2\sum_{n=1}^{+\infty}n\,\mathbb{P}(X>n).$$
