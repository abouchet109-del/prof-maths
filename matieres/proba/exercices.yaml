- id: pro-td2-ex06
  titre: Fonction Gamma et loi Gamma
  enonce: |
    On définit la fonction Gamma par
    $$\Gamma:x\mapsto\int_0^\infty t^{x-1}e^{-t}\,dt$$
    et, pour deux paramètres $p,\theta>0$, la fonction
    $$f_{p,\theta}:t\mapsto\frac{\theta^p}{\Gamma(p)}e^{-\theta t}t^{p-1}\mathbf 1_{t>0}.$$

    1. Justifier que la fonction $\Gamma$ est bien définie sur $\mathbb{R}_+^*$.
    2. Montrer que $\Gamma(x+1)=x\Gamma(x)$, pour tout $x>0$. En déduire que pour tout $n\in\mathbb{N}$, $\Gamma(n+1)=n!$.
    3. Montrer que $f_{p,\theta}$ définit bien une densité d'une loi de probabilité sur $\mathbb{R}$. On l'appelle loi Gamma, notée $\gamma(p,\theta)$. Calculer l'espérance et la variance d'une variable aléatoire $X$ suivant la loi $\gamma(p,\theta)$.
    4. Soit $Z$ une variable aléatoire $\mathcal N(0,1)$. Calculer une densité de la variable $Z^2$. Quelle est la loi de $Z^2$ ? Montrer aussi que $\Gamma(1/2)=\sqrt\pi$.
  sources:
  - etab: paris-cite
    fichier: proba/td/td2.pdf
    page: 2
    numero: Ex 6
  annale_prioritaire: false
  type_source: td
  annale: null
