- id: pro-td1-ex05
  titre: Limite supérieure d'événements et inégalité de Fatou
  enonce: |
    Soit $(A_i,\ i\ge1)$ une famille dénombrable d'événements. On définit l'événement $\limsup_{i\to+\infty}A_i$ comme l'ensemble de toutes les observations contenues dans un nombre infini de $A_i$.

    1. Montrer l'égalité $\displaystyle\limsup_{i\to+\infty}A_i=\bigcap_{i=1}^{+\infty}\Big(\bigcup_{j=i}^{+\infty}A_j\Big)$.
    2. Montrer la relation suivante (où $\liminf_{i\to+\infty}B_i:=\bigcup_{i=1}^{+\infty}\bigcap_{j=i}^{+\infty}B_j$) :
       $$\Big(\limsup_{i\to+\infty}A_i\Big)^c=\liminf_{i\to+\infty}A_i^c.$$
    3. Calculer $\limsup_{i\to+\infty}A_i$ dans les cas suivants :
       1. $A_{2i}=F$ et $A_{2i+1}=G$ pour tout $i\ge1$, où $F$ et $G$ sont deux ensembles fixés.
       2. $A_i=\left]-\infty,\frac{(-1)^i}{i}\right]$ pour tout $i\ge1$.
       3. $A_i=\left[\frac{(-1)^i}{i},+\infty\right[$ pour tout $i\ge1$.
    4. Montrer l'inégalité de Fatou :
       $$\lim_{k\to+\infty}\Big(\sup_{i\ge k}\mathbb{P}(A_i)\Big)\le\mathbb{P}\Big(\limsup_{i\to+\infty}A_i\Big).$$
       Proposer un exemple où il y a égalité et un exemple où l'inégalité est stricte.
  sources:
  - etab: paris-cite
    fichier: proba/td/td1.pdf
    page: 1
    numero: Ex 5
  annale_prioritaire: false
  type_source: td
  annale: null
  disponible: true
  sous_chapitre: Chapitre 1 - Rappels sur le modèle probabiliste > 1.3 Probabilité
