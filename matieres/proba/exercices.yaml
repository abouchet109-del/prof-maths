- id: pro-td3-ex05
  titre: Borne de Chernoff pour une somme de Bernoulli
  enonce: |
    Soit $X_1,\dots,X_n$ des variables aléatoires indépendantes suivant chacune des lois de Bernoulli de paramètres respectifs $p_1,\dots,p_n\in[0,1]$. On étudie dans cet exercice comment la somme $S=X_1+\dots+X_n$ peut excéder sa moyenne probabiliste $m=p_1+\dots+p_n$.

    1. Soit $X$ une variable de Bernoulli de paramètre $p\in[0,1]$ et $t$ un réel strictement positif. Vérifier : $\mathbb{E}\left[e^{tX}\right]\le e^{p(e^t-1)}$.
    2. Soit $\lambda>0$. Montrer que $\mathbb{P}(S\ge\lambda)\le e^{-\lambda t}\,\mathbb{E}\left[e^{tS}\right]$.
    3. En déduire que
       $$\mathbb{P}(S\ge m(1+\delta))\le\frac{e^{m(e^t-1)}}{e^{m(1+\delta)t}}$$
       pour tous $t$ et $\delta$ strictement positifs.
    4. En choisissant une valeur de $t>0$ optimale, obtenir l'inégalité suivante :
       $$\mathbb{P}(S\ge m(1+\delta))\le\left(\frac{e^\delta}{(1+\delta)^{1+\delta}}\right)^m.$$
    5. Soit $p\in]0,1[$, et $Y_n$ une variable aléatoire de loi binomiale de paramètres $n$ et $p$. Quelle est la limite de $\mathbb{P}\left(\frac{Y_n}{n}\le p+\varepsilon\right)$ quand $n$ tend vers l'infini, pour tout $\varepsilon>0$ ?
