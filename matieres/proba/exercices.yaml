- id: pro-td1-ex04
  titre: Inégalités de Bonferroni pour une réunion
  enonce: |
    Soit $A_1,\dots,A_n$ une famille d'événements d'un espace de probabilité $(\Omega,\mathbb{P})$. Montrer que
    $$\mathbb{P}\Big(\bigcup_{i=1}^n A_i\Big)\ge\sum_{i=1}^n\mathbb{P}(A_i)-\sum_{1\le i<j\le n}\mathbb{P}(A_i\cap A_j)$$
    et que
    $$\mathbb{P}\Big(\bigcup_{i=1}^n A_i\Big)\le\sum_{i=1}^n\mathbb{P}(A_i)-\sum_{1\le i<j\le n}\mathbb{P}(A_i\cap A_j)+\sum_{1\le i<j<k\le n}\mathbb{P}(A_i\cap A_j\cap A_k).$$
