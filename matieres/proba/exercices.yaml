- id: pro-td3-ex03
  titre: Inégalité de Hoeffding
  enonce: |
    Soit $X$ une variable aléatoire réelle telle que $|X|\le1$ presque sûrement. On suppose de plus qu'elle est centrée : $\mathbb{E}[X]=0$.

    1. Soit $t\in\mathbb{R}$ quelconque. Montrer en utilisant la convexité de la fonction exponentielle que :
       $$\forall x\in[-1,1],\quad \exp(tx)\le\frac{1-x}{2}\exp(-t)+\frac{1+x}{2}\exp(t).\qquad(1)$$
    2. Après avoir justifié l'existence de l'espérance de $\exp(tX)$, en déduire que : $\mathbb{E}[\exp(tX)]\le\exp\left(\frac{t^2}{2}\right)$.
    3. En déduire que pour tout $\varepsilon>0$ : $\mathbb{P}(X\ge\varepsilon)\le e^{-\varepsilon^2/2}$, puis que : $\mathbb{P}(|X|\ge\varepsilon)\le2e^{-\varepsilon^2/2}$.
    4. Soit $(X_n,\ n\ge1)$ une suite de variables aléatoires réelles et indépendantes, de loi uniforme sur $\{-1,1\}$ : $\mathbb{P}(X_n=-1)=\mathbb{P}(X_n=1)=\frac12$. On note $S_n=\sum_{k=1}^nX_k$ pour tout $n\ge1$.
       1. En utilisant l'inégalité (1), montrer que pour tout $t\in\mathbb{R}$ : $\mathbb{E}[\exp(tS_n)]\le\exp\left(n\frac{t^2}{2}\right)$.
       2. Montrer que pour tout $\varepsilon>0$ : $\mathbb{P}(|S_n|\ge\varepsilon)\le2\exp\left(-\frac{\varepsilon^2}{2n}\right)$.
       3. Comparer cette dernière inégalité avec la majoration obtenue grâce à l'inégalité de Bienaymé-Tchebycheff.
