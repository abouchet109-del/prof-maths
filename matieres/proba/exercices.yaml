- id: pro-exa2526-ex02
  titre: Densité de Pareto et densité du produit XY
  enonce: |
    Soit $\alpha>0$ et la fonction $f(x)=\frac{\alpha}{x^{\alpha+1}}\mathbf 1_{]1,+\infty[}(x)$.

    1. Vérifier que $f$ est une densité de probabilité.

    Soient $X$ et $Y$ deux variables indépendantes de même densité $f$.

    1. Montrer que le vecteur aléatoire $(XY,X)$ admet pour densité la fonction
       $$g(u,v)=\frac{\alpha^2}{u^{\alpha+1}}\frac1v\mathbf 1_{]1,+\infty[}(u)\mathbf 1_{]1,u[}(v).$$
    2. En déduire une densité de $Z=XY$.
    3. Calculer l'espérance de la variable $1/\ln(Z)$.
