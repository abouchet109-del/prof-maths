- id: pro-exa2425-ex02
  titre: Découpage d'une longueur L en L1=XL et L2=(1-X)L
  enonce: |
    Soit $L$ une variable aléatoire positive admettant une densité de probabilité $h$ sur $]0,+\infty[$ et $X$ une variable aléatoire de loi uniforme sur $]0,1[$, indépendante de $L$. On définit deux variables aléatoires $L_1$ et $L_2$ par $L_1=XL$ et $L_2=(1-X)L$.

    La question 2 peut être traitée en admettant les résultats de la question 1.

    1. (a) Montrer que l'application
       $$\varphi:]0,1[\times]0,+\infty[\to]0,+\infty[\times]0,+\infty[:(x,l)\mapsto(xl,(1-x)l)$$
       est un $C^1$-difféomorphisme.

       (b) Montrer que le vecteur aléatoire $(L_1,L_2)$ admet pour densité la fonction
       $$f_{L_1,L_2}(u,v)=\frac{h(u+v)}{u+v}\mathbf 1_{]0,+\infty[^2}(u,v).$$
       En déduire que $f_{L_1}(u)=f_{L_2}(u)=\int_u^{+\infty}\frac{h(x)}{x}\,dx$, $u>0$.
    2. Soit $\lambda>0$. On suppose désormais que $h(x)=\lambda^2x\exp(-\lambda x)\mathbf 1_{]0,+\infty[}(x)$, $x\in\mathbb{R}$.

       (a) Vérifier que $h$ est bien une densité de probabilité.

       (b) Déterminer $f_{L_1,L_2}$, $f_{L_1}$ et $f_{L_2}$. En déduire que les variables $L_1,L_2$ sont indépendantes et donner leur loi.

       (c) Justifier l'existence de $\mathbb{E}[L_1L_2]$ et déterminer sa valeur.

       (d) Déterminer et reconnaître la loi de $Z=\min(L_1,L_2)$.
