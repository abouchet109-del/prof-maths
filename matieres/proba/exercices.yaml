- id: pro-par2425-ex03
  titre: Maximum et minimum de variables exponentielles i.i.d.
  enonce: |
    Pour l'exercice qui suit, on rappelle que des variables aléatoires réelles $X_1,\dots,X_n$ sont indépendantes si
    $$\mathbb{P}(X_1\in A_1,X_2\in A_2,\dots,X_n\in A_n)=\mathbb{P}(X_1\in A_1)\mathbb{P}(X_2\in A_2)\cdots\mathbb{P}(X_n\in A_n),$$
    pour tous $A_1\subset\mathbb{R},\dots,A_n\subset\mathbb{R}$. De plus, si $X_1,\dots,X_n$ sont indépendantes, alors pour toutes fonctions $f_1,\dots,f_n:\mathbb{R}\to\mathbb{R}$ telles que $f_1(X_1),\dots,f_n(X_n)$ sont intégrables, on a $\mathbb{E}[f_1(X_1)\cdots f_n(X_n)]=\mathbb{E}[f_1(X_1)]\cdots\mathbb{E}[f_n(X_n)]$.

    On considère une suite $(X_i)_{i\ge1}$ de variables aléatoires indépendantes et identiquement distribuées selon la loi exponentielle de paramètre $1$. On rappelle que la densité commune de ces variables est $f_{X_1}(x)=e^{-x}\mathbf 1_{\mathbb{R}_+}(x)$, $x\in\mathbb{R}$. Les questions 1 et 2 sont indépendantes.

    1. Pour tout $n\ge1$, on considère $M_n=\max(X_1,\dots,X_n)$.
       1. Calculer la fonction de répartition de $M_n$.
       2. En déduire la densité de $M_n$ et justifier que $M_n$ admet des moments de tous ordres.
       3. Montrer, à l'aide d'intégrations par parties successives, que la fonction caractéristique de $M_n$ est donnée par $\displaystyle\phi_{M_n}(t)=\frac{n!}{\prod_{k=1}^n(k-it)}$, $\forall t\in\mathbb{R}$.
       4. En déduire la valeur de $\mathbb{E}[M_n]$.
       5. Pour tout $n\ge1$, on pose $S_n=X_1+\frac{X_2}{2}+\dots+\frac{X_n}{n}$. Montrer que $S_n$ et $M_n$ ont la même loi.
       6. Retrouver la valeur de $\mathbb{E}[M_n]$ et calculer $\mathrm{Var}(M_n)$.
    2. Pour tout $n\ge1$, on pose maintenant $I_n=1+\min([X_1],\dots,[X_n])$, où $[\cdot]$ désigne la fonction partie entière. On rappelle que pour tout $x\in\mathbb{R}$, $[x]$ est l'unique entier relatif $n\in\mathbb{Z}$ tel que $n\le x<n+1$.
       1. Calculer $\mathbb{P}(I_n\le k)$ pour tout $k\in\mathbb{N}$.
       2. En déduire $\mathbb{P}(I_n=k)$ pour tout $k\in\mathbb{N}^*$. Quelle est la loi de $I_n$ ?
       3. Donner $\mathbb{E}[I_n]$ et $\mathrm{Var}(I_n)$ (sans calcul).
