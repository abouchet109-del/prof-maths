- id: pro-td1-ex01
  titre: Bornes sur P(A∩B) pour P(A)=3/4, P(B)=1/3
  enonce: |
    Soit $(\Omega,\mathbb{P})$ un espace de probabilité. Soit $A$ et $B$ des événements tels que $\mathbb{P}(A)=\frac34$ et $\mathbb{P}(B)=\frac13$.

    1. Montrer que $\frac1{12}\le \mathbb{P}(A\cap B)\le\frac13$.
    2. Soit $\Omega=\{1,2,\dots,12\}$ et $\mathbb{P}$ la probabilité uniforme sur $\Omega$. Proposer des exemples d'événements $A$ et $B$ vérifiant les hypothèses et tels que $\mathbb{P}(A\cap B)$ atteigne les bornes ci-dessus.
    3. Donner des bornes correspondantes pour $\mathbb{P}(A\cup B)$.
