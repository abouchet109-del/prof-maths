- id: pro-td1-ex03
  titre: Inégalité de Bonferroni et tentatives de pénalités
  enonce: |
    1. Soit $A,B$ deux événements d'un espace de probabilité $\Omega$. Montrer l'inégalité $\mathbb{P}(A\cap B)\ge \mathbb{P}(A)+\mathbb{P}(B)-1$.
    2. Soit $A_1,\dots,A_n$ une famille finie d'événements. Montrer l'inégalité :
       $$\mathbb{P}(A_1\cap\dots\cap A_n)\ge \mathbb{P}(A_1)+\dots+\mathbb{P}(A_n)-n+1.$$
       Aide : on pourra procéder par récurrence.
    3. Dans une école de rugby, les joueurs passent un test consistant à marquer des pénalités. Chacun a deux tentatives. On constate que $72\%$ des joueurs ont marqué à la première tentative et $65\%$ ont marqué à la seconde. Montrer que la probabilité qu'un joueur ait marqué aux deux tentatives est supérieure à $37\%$. On déterminera d'abord l'espace des épreuves.
  sources:
