- id: pro-exa2526-ex03
  titre: Vecteur gaussien de matrice de covariance donnée
  enonce: |
    Soit $(X,Y,Z)$ un vecteur gaussien d'espérance $(0,3,2)$, de matrice de covariance
    $$\Gamma=\begin{pmatrix}2&1&-2\\1&1&-2\\-2&-2&4\end{pmatrix}.$$

    1. Calculer $\mathrm{Var}(2Y+Z)$. Que peut-on en déduire sur la variable $2Y+Z$ ?
    2. Donner la loi du vecteur $(X-Y,Z)$. Qu'en déduisez-vous sur $X-Y$ et $Z$ ?
    3. Montrer que $(X,Y)$ admet une densité et la calculer.
