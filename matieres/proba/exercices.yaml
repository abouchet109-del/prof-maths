- id: pro-par2526-ex04
  titre: Approximation de Bernstein d'une fonction lipschitzienne
  enonce: |
    On considère une fonction $f:[0,1]\to\mathbb{R}$ qu'on suppose $L$-Lipschitz, c'est-à-dire telle que
    $$|f(x)-f(y)|\le L|x-y|,\quad\forall x,y\in[0,1].$$
    Pour tout $p\in[0,1]$ et $n\ge1$, on considère une variable aléatoire $X_p^{(n)}$ de loi binomiale de paramètres $n$ et $p$ et on pose
    $$Q_n(p)=\mathbb{E}\left[f\left(\frac{X_p^{(n)}}{n}\right)\right],\quad\forall p\in[0,1].$$

    1. Montrer que $Q_n$ est une fonction polynomiale de degré $\le n$.
    2. Montrer l'inégalité $|Q_n(p)-f(p)|\le\frac Ln\,\mathbb{E}\left[(X_p^{(n)}-np)^2\right]^{1/2}$.
    3. En déduire que $\sup_{p\in[0,1]}|Q_n(p)-f(p)|\to0$ quand $n\to\infty$.
