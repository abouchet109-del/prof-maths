- id: pro-td1-ex10
  titre: Limite inférieure d'événements et inégalité de Fatou
  enonce: |
    Soit $(A_i,\ i\ge1)$ une famille dénombrable d'événements. On définit l'événement $\liminf_{i\to+\infty}A_i$ comme l'ensemble de toutes les observations contenues dans tous les $A_i$ à l'exception éventuelle d'un nombre fini d'entre eux.

    1. Montrer l'égalité $\displaystyle\liminf_{i\to+\infty}A_i=\bigcup_{i=1}^{+\infty}\Big(\bigcap_{j=i}^{+\infty}A_j\Big)$.
    2. Montrer la relation suivante avec $\limsup_{i\to+\infty}A_i$ : $\displaystyle\liminf_{i\to+\infty}A_i\subset\limsup_{i\to+\infty}A_i$.
    3. Calculer $\liminf_{i\to+\infty}A_i$ dans les cas suivants :
       1. $A_{2i}=F$ et $A_{2i+1}=G$ pour tout $i\ge1$, où $F$ et $G$ sont deux ensembles fixés.
       2. $A_i=\left]-\infty,\frac{(-1)^i}{i}\right]$ pour tout $i\ge1$.
       3. $A_i=\left[\frac{(-1)^i}{i},+\infty\right[$ pour tout $i\ge1$.
    4. Montrer l'inégalité de Fatou :
       $$\mathbb{P}\Big(\liminf_{i\to+\infty}A_i\Big)\le\lim_{k\to+\infty}\Big(\inf_{i\ge k}\mathbb{P}(A_i)\Big).$$
       Proposer un exemple où il y a égalité et un exemple où l'inégalité est stricte.
