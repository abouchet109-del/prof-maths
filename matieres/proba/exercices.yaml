- id: pro-td3-ex01
  titre: Inégalité de Markov raffinée et o(1/t)
  enonce: |
    Soit $X$ une variable aléatoire réelle, définie sur un espace de probabilité $(\Omega,\mathbb{P})$.

    1. Après avoir justifié l'existence du terme de droite, montrer l'inégalité : pour tout $t>0$ on a $t\,\mathbb{P}(X\ge t)\le\mathbb{E}[X\mathbf 1_{X\ge t}]$.
    2. En déduire que si $X$ admet une espérance finie, alors $\mathbb{P}(X\ge t)=o\left(\frac1t\right)$ en $+\infty$.
    3. En déduire, sous les mêmes hypothèses : $\mathbb{P}(|X|\ge t)=o\left(\frac1t\right)$ en $+\infty$.
    4. Et que conclure si $\mathbb{E}[|X|^n]<+\infty$ ? ($n\in\mathbb{N}^*$)
