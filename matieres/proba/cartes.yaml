- id: proba-a-096-2
  notion: proba-p-0003
  recto: 'Avec \(T_k\) le rang du \(k\)-ième succès (\(k\in\mathbb N^*\)) dans des épreuves de Bernoulli(\(p\)) indépendantes, \(p\in]0,1[\) : écrire \(T_k\) comme somme de variables simples, puis donner \(E[T_k]\) et \(\mathrm{Var}(T_k)\).'
  verso: '\(T_k=G_1+\dots+G_k\), où \(G_i=T_i-T_{i-1}\) (avec \(T_0=0\)) est le nombre d''épreuves nécessaires, après le \((i-1)\)-ième succès, pour obtenir le \(i\)-ième ; les \(G_i\) sont indépendantes de loi géométrique \(\mathcal G(p)\). Donc \(E[T_k]=\frac kp\) et \(\mathrm{Var}(T_k)=\frac{k(1-p)}{p^2}\).'
