- id: proba-a-099-1
  notion: proba-p-0007
  recto: 'Prop. : limite de \(\left(1+\frac{z_n}n\right)^n\) pour une suite complexe \(z_n\to z\)'
  verso: 'Soit \((z_n)\) une suite de nombres complexes qui converge vers \(z\in\mathbb C\). Alors \(\left(1+\frac{z_n}n\right)^n\to e^z\) quand \(n\to+\infty\). Usage (TCL) : \(\varphi_{Z_1}(s)=1-\frac{\sigma^2}2s^2+o(s^2)\) donne, à \(t\) fixé, \(\varphi_{Z_1}(t/\sqrt n)=1+\frac{z_n}n\) avec \(z_n\to-\frac{\sigma^2t^2}2\), d''où \(\varphi_{Z_1}(t/\sqrt n)^n\to e^{-\sigma^2t^2/2}\). Dans \(\mathbb C\), on ne peut pas écrire directement \(\exp\big(n\ln(1+\frac{z_n}n)\big)\) avec le logarithme réel.'
