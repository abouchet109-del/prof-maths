- id: proba-a-095-1
  notion: null
  recto: 'Théorème de Cesàro pour les suites réelles : énoncer avec ses hypothèses.'
  verso: 'Si \((u_k)_{k\ge1}\) est une suite de réels qui converge vers \(\ell\in\mathbb R\), alors \(\frac1n\sum_{k=1}^nu_k\to\ell\) quand \(n\to+\infty\). (Reste vrai pour \(\ell=\pm\infty\) ; la réciproque est fausse : \(u_k=(-1)^k\).)'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans pro-exa2526-ex04'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [prerequis-l1l2, theoreme]
- id: proba-a-095-2
  notion: null
  recto: 'Sachant que \(X_k\to0\) presque sûrement, comment utilise-t-on Cesàro pour montrer que \(\frac1n\sum_{k=1}^nX_k\to0\) presque sûrement ?'
  verso: 'Il existe un événement \(\Omega_0\) de probabilité \(1\) tel que, pour tout \(\omega\in\Omega_0\), la suite réelle \((X_k(\omega))_k\) tend vers \(0\). Pour chaque tel \(\omega\) fixé, Cesàro (suite réelle) donne \(\frac1n\sum_{k=1}^nX_k(\omega)\to0\) : la convergence a lieu sur \(\Omega_0\), donc presque sûrement.'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans pro-exa2526-ex04'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [prerequis-l1l2, methode]
- id: proba-a-096-1
  notion: null
  recto: 'Épreuves de Bernoulli indépendantes de paramètre \(p\in]0,1[\) ; \(T_k\) est le rang du \(k\)-ième succès. Donner la loi de \(T_k\), puis le cas \(k=1\).'
  verso: '\(T_k\) est à valeurs dans \(\{k,k+1,\dots\}\) et \(P(T_k=n)=\binom{n-1}{k-1}p^k(1-p)^{n-k}\) pour \(n\ge k\) (\(k-1\) succès parmi les \(n-1\) premières épreuves, puis un succès à l''épreuve \(n\)) : loi binomiale négative. Pour \(k=1\) : \(P(T_1=n)=p(1-p)^{n-1}\), loi géométrique \(\mathcal G(p)\) sur \(\mathbb N^*\).<br>Attention : <code>rnbinom</code> de R compte les échecs avant le \(k\)-ième succès, soit \(T_k-k\).'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans pro-exa2425-ex01'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [prerequis-l1l2, definition]
- id: proba-a-096-2
  notion: null
  recto: 'Avec \(T_k\) le rang du \(k\)-ième succès dans des épreuves de Bernoulli(\(p\)) indépendantes : écrire \(T_k\) comme somme de variables simples, puis donner \(E[T_k]\) et \(\mathrm{Var}(T_k)\).'
  verso: '\(T_k=G_1+\dots+G_k\), où \(G_i\) est le nombre d''épreuves entre le \((i-1)\)-ième et le \(i\)-ième succès ; les \(G_i\) sont indépendantes de loi géométrique \(\mathcal G(p)\). Donc \(E[T_k]=\frac kp\) et \(\mathrm{Var}(T_k)=\frac{k(1-p)}{p^2}\).'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans pro-exa2425-ex01'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [prerequis-l1l2, propriete]
- id: proba-a-097-1
  notion: null
  recto: 'En R, que renvoie <code>rbinom(n, size, prob)</code> ? Comment simuler une variable de Bernoulli de paramètre \(p\) ?'
  verso: 'Un vecteur de <code>n</code> réalisations indépendantes de la loi binomiale \(\mathcal B(\texttt{size},\texttt{prob})\). Bernoulli(\(p\)) : <code>rbinom(1, 1, p)</code> (une valeur, une seule épreuve).'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans pro-exa2425-ex01'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [prerequis-l1l2, R]
- id: proba-a-097-2
  notion: null
  recto: 'En R, quelle est la signature de <code>rpois</code> ? Écrire une fonction <code>S(N, lambda)</code> qui simule la somme de \(N\) variables de Poisson indépendantes de paramètre \(\lambda\).'
  verso: '<code>rpois(n, lambda)</code> renvoie un vecteur de <code>n</code> réalisations indépendantes de \(\mathcal P(\texttt{lambda})\). Donc :<br><code>S <- function(N, lambda) { sum(rpois(N, lambda)) }</code><br>(Cette somme suit \(\mathcal P(N\lambda)\), donc <code>rpois(1, N*lambda)</code> donne la même loi.)'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans pro-exa2526-ex01'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [prerequis-l1l2, R]
- id: proba-a-097-3
  notion: null
  recto: 'Que simule ce code R, et quelle est la loi de <code>n</code> pour \(k=1\) ?<br><code>x <- rbinom(1, 1, p); n <- 1; while (sum(x) < k) { n <- n + 1; x <- c(x, rbinom(1, 1, p)) }</code>'
  verso: 'On répète des épreuves de Bernoulli(\(p\)) tant que le nombre de succès <code>sum(x)</code> est inférieur à \(k\) ; à la sortie de la boucle, <code>n</code> est le rang du \(k\)-ième succès : une réalisation de la loi binomiale négative. Pour \(k=1\) : loi géométrique \(\mathcal G(p)\).'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans pro-exa2425-ex01'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [prerequis-l1l2, R]
