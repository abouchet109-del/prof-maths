- id: proba-a-097-3
  notion: proba-p-0004
  recto: 'Pour \(p\in]0,1[\) et \(k\in\mathbb N^*\) fixés, que simule ce code R, et quelle est la loi de <code>n</code> pour \(k=1\) ?<br><code>x <- rbinom(1, 1, p); n <- 1; while (sum(x) < k) { n <- n + 1; x <- c(x, rbinom(1, 1, p)) }</code>'
  verso: 'On répète des épreuves de Bernoulli(\(p\)) tant que le nombre de succès <code>sum(x)</code> est inférieur à \(k\) ; à la sortie de la boucle, <code>n</code> est le rang du \(k\)-ième succès : une réalisation de la loi binomiale négative. Pour \(k=1\) : loi géométrique \(\mathcal G(p)\).'
