  notion: proba-p-0006
  recto: 'Prop. : inégalités triangulaires et module dans \(\mathbb C\)'
  verso: 'Pour tous \(z,w\in\mathbb C\) : \(|z+w|\le|z|+|w|\) et \(\big||z|-|w|\big|\le|z-w|\). De plus \(|z|^2=z\bar z=(\mathrm{Re}\,z)^2+(\mathrm{Im}\,z)^2\), donc \(|\mathrm{Re}\,z|\le|z|\) et \(|\mathrm{Im}\,z|\le|z|\).'
