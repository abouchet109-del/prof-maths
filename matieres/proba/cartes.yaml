- id: proba-a-098-2
  notion: proba-p-0006
  recto: 'Prop. : module et conjugué de \(e^{i\theta}\) (\(\theta\) réel)'
  verso: 'Pour tout \(\theta\in\mathbb R\) : \(e^{i\theta}=\cos\theta+i\sin\theta\) (formule d''Euler), donc \(|e^{i\theta}|=1\) et \(\overline{e^{i\theta}}=e^{-i\theta}\). Ainsi \(\cos\theta=\mathrm{Re}(e^{i\theta})=\frac{e^{i\theta}+e^{-i\theta}}2\) et \(\sin\theta=\mathrm{Im}(e^{i\theta})=\frac{e^{i\theta}-e^{-i\theta}}{2i}\). Usage : \(|e^{itX}|=1\) pour \(t\) et \(X\) réels, d''où \(|\varphi_X(t)|\le1\).'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans proba-n-0064, proba-n-0065, proba-n-0073'
