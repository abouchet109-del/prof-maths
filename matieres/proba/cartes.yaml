- id: proba-a-095-1
  notion: proba-p-0002
  recto: 'Théorème de Cesàro pour les suites réelles : énoncer avec ses hypothèses.'
  verso: 'Si \((u_k)_{k\ge1}\) est une suite de réels qui converge vers \(\ell\in\mathbb R\), alors \(\frac1n\sum_{k=1}^nu_k\to\ell\) quand \(n\to+\infty\). (Reste vrai pour \(\ell=\pm\infty\) ; la réciproque est fausse : \(u_k=(-1)^k\).)'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans pro-exa2526-ex04'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [prerequis-l1l2, theoreme]
- id: proba-a-095-2
  notion: proba-p-0002
  recto: 'Soit \((X_k)_{k\ge1}\) une suite de variables aléatoires réelles sur \((\Omega,P)\). Sachant que \(X_k\to0\) presque sûrement, comment utilise-t-on Cesàro pour montrer que \(\frac1n\sum_{k=1}^nX_k\to0\) presque sûrement ?'
  verso: 'Il existe un événement \(\Omega_0\) de probabilité \(1\) tel que, pour tout \(\omega\in\Omega_0\), la suite réelle \((X_k(\omega))_k\) tend vers \(0\). Pour chaque tel \(\omega\) fixé, Cesàro (suite réelle) donne \(\frac1n\sum_{k=1}^nX_k(\omega)\to0\) : la convergence a lieu sur \(\Omega_0\), donc presque sûrement.'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans pro-exa2526-ex04'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [prerequis-l1l2, methode]
- id: proba-a-096-1
  notion: proba-p-0003
  recto: 'Épreuves de Bernoulli indépendantes de paramètre \(p\in]0,1[\) ; \(T_k\) est le rang du \(k\)-ième succès (\(k\in\mathbb N^*\)). Donner la loi de \(T_k\), puis le cas \(k=1\).'
  verso: '\(T_k\) est à valeurs dans \(\{k,k+1,\dots\}\) et \(P(T_k=n)=\binom{n-1}{k-1}p^k(1-p)^{n-k}\) pour \(n\ge k\) (\(k-1\) succès parmi les \(n-1\) premières épreuves, puis un succès à l''épreuve \(n\)) : loi binomiale négative. Pour \(k=1\) : \(P(T_1=n)=p(1-p)^{n-1}\), loi géométrique \(\mathcal G(p)\) sur \(\mathbb N^*\).<br>Attention : <code>rnbinom</code> de R compte les échecs avant le \(k\)-ième succès, soit \(T_k-k\).'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans pro-exa2425-ex01'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [prerequis-l1l2, definition]
- id: proba-a-096-2
  notion: proba-p-0003
  recto: 'Avec \(T_k\) le rang du \(k\)-ième succès (\(k\in\mathbb N^*\)) dans des épreuves de Bernoulli(\(p\)) indépendantes, \(p\in]0,1[\) : écrire \(T_k\) comme somme de variables simples, puis donner \(E[T_k]\) et \(\mathrm{Var}(T_k)\).'
  verso: '\(T_k=G_1+\dots+G_k\), où \(G_i=T_i-T_{i-1}\) (avec \(T_0=0\)) est le nombre d''épreuves nécessaires, après le \((i-1)\)-ième succès, pour obtenir le \(i\)-ième ; les \(G_i\) sont indépendantes de loi géométrique \(\mathcal G(p)\). Donc \(E[T_k]=\frac kp\) et \(\mathrm{Var}(T_k)=\frac{k(1-p)}{p^2}\).'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans pro-exa2425-ex01'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [prerequis-l1l2, propriete]
- id: proba-a-097-1
  notion: proba-p-0004
  recto: 'En R, que renvoie <code>rbinom(n, size, prob)</code> ? Comment simuler une variable de Bernoulli de paramètre \(p\) ?'
  verso: 'Un vecteur de <code>n</code> réalisations indépendantes de la loi binomiale \(\mathcal B(\texttt{size},\texttt{prob})\). Bernoulli(\(p\)) : <code>rbinom(1, 1, p)</code> (une valeur, une seule épreuve).'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans pro-exa2425-ex01'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [prerequis-l1l2, R]
- id: proba-a-097-2
  notion: proba-p-0005
  recto: 'En R, quelle est la signature de <code>rpois</code> ? Écrire une fonction <code>S(N, lambda)</code> qui simule la somme de \(N\) variables de Poisson indépendantes de paramètre \(\lambda\).'
  verso: '<code>rpois(n, lambda)</code> renvoie un vecteur de <code>n</code> réalisations indépendantes de \(\mathcal P(\texttt{lambda})\). Donc :<br><code>S <- function(N, lambda) { sum(rpois(N, lambda)) }</code><br>(Cette somme suit \(\mathcal P(N\lambda)\), donc <code>rpois(1, N*lambda)</code> donne la même loi.)'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans pro-exa2526-ex01'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [prerequis-l1l2, R]
- id: proba-a-097-3
  notion: proba-p-0004
  recto: 'Pour \(p\in]0,1[\) et \(k\in\mathbb N^*\) fixés, que simule ce code R, et quelle est la loi de <code>n</code> pour \(k=1\) ?<br><code>x <- rbinom(1, 1, p); n <- 1; while (sum(x) < k) { n <- n + 1; x <- c(x, rbinom(1, 1, p)) }</code>'
  verso: 'On répète des épreuves de Bernoulli(\(p\)) tant que le nombre de succès <code>sum(x)</code> est inférieur à \(k\) ; à la sortie de la boucle, <code>n</code> est le rang du \(k\)-ième succès : une réalisation de la loi binomiale négative. Pour \(k=1\) : loi géométrique \(\mathcal G(p)\).'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans pro-exa2425-ex01'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [prerequis-l1l2, R]
- id: ex-pro-par2425-ex02
  exercice: pro-par2425-ex02
  notion: proba-n-0048
  recto: |-
    <b>Exo pro-par2425-ex02 : Densité 3x², A = -log X et polynôme aléatoire (partiel 2024-25)</b><br>
    \(X\) est une variable aléatoire de densité \(f_X(x)=3x^2\mathbf 1_{[0,1]}(x)\), \(x\in\mathbb R\).<br>
    1. Calculer \(\mathbb P(X\in]0,1])\).<br>
    2. On pose \(A=-\log X\). Justifier qu'avec probabilité 1, \(A\) est bien définie et positive.<br>
    3. Calculer la fonction de répartition de \(A\). Quelle est la loi de \(A\) ?<br>
    4. Soit \(P(t)=t^2+3At+2A^2+4\), \(t\in\mathbb R\). Calculer la probabilité que \(P\) n'admette aucune racine réelle.<br>
    <b>Méthode ? Étape clé ?</b>
  verso: |-
    <b>Idée clé :</b> loi de \(g(X)\) par la fonction de répartition : \(\{A\le t\}=\{X\ge e^{-t}\}\), puis on intègre la densité. Pour la question 4, le discriminant ramène tout à un événement sur \(A\) seul.<br>
    <b>Correction :</b><br>
    1. \(\mathbb P(X\in]0,1])=\int_0^1 3x^2\,dx=\left[x^3\right]_0^1=1\).<br>
    2. D'après 1, avec probabilité 1, \(0<X\le1\) (\(\mathbb P(X=0)=0\)). Donc avec probabilité 1, \(A=-\log X\) est bien définie et \(A\ge0\) (car \(\log X\le0\)).<br>
    3. Pour \(t<0\), \(F_A(t)=0\) (car \(A\ge0\) presque sûrement). Pour \(t>0\), \(\{A\le t\}=\{X\ge e^{-t}\}\), donc \(F_A(t)=\mathbb P(X\ge e^{-t})=\int_{e^{-t}}^1 3x^2\,dx=\left[x^3\right]_{e^{-t}}^1=1-e^{-3t}\). On reconnaît la fonction de répartition de la loi exponentielle de paramètre \(3\).<br>
    4. \(P\) est de degré 2 : il n'a aucune racine réelle si et seulement si son discriminant est strictement négatif. \(\Delta=(3A)^2-4(2A^2+4)=9A^2-8A^2-16=A^2-16<0\iff A\in]-4,4[\). Comme \(A\ge0\) presque sûrement et que \(A\) a une densité, \(\mathbb P(A\in]-4,4[)=\mathbb P(A\le4)=F_A(4)=1-e^{-12}\).<br>
    <b>Piège :</b> ne pas oublier \(X=0\) (probabilité nulle, mais à dire) ; \(9A^2-8A^2=A^2\), pas \(-5A^2\) ; écrire le calcul de \(F_A\) avant d'annoncer « exponentielle de paramètre 3 » ; la question 4 va jusqu'au nombre \(1-e^{-12}\).
  source: 'Énoncé : proba/annales/partiel-2024-25.pdf p.1 (Ex 2). Corrigé officiel : proba/annales/partiel-2024-25-corrige.pdf p.1. Erreurs de la séance du 2026-11-07.'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 1
  tags: [exercice]
- id: proba-a-098-1
  notion: proba-p-0006
  recto: 'Prop. : inégalités triangulaires et module dans \(\mathbb C\)'
  verso: 'Pour tous \(z,w\in\mathbb C\) : \(|z+w|\le|z|+|w|\) et \(\big||z|-|w|\big|\le|z-w|\). De plus \(|z|^2=z\bar z=(\mathrm{Re}\,z)^2+(\mathrm{Im}\,z)^2\), donc \(|\mathrm{Re}\,z|\le|z|\) et \(|\mathrm{Im}\,z|\le|z|\).'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans proba-n-0064, proba-n-0065, mes-td6-ex04'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [prerequis-l1l2, propriete]
- id: proba-a-098-2
  notion: proba-p-0006
  recto: 'Prop. : module et conjugué de \(e^{i\theta}\) (\(\theta\) réel)'
  verso: 'Pour tout \(\theta\in\mathbb R\) : \(e^{i\theta}=\cos\theta+i\sin\theta\) (formule d''Euler), donc \(|e^{i\theta}|=1\) et \(\overline{e^{i\theta}}=e^{-i\theta}\). Ainsi \(\cos\theta=\mathrm{Re}(e^{i\theta})=\frac{e^{i\theta}+e^{-i\theta}}2\) et \(\sin\theta=\mathrm{Im}(e^{i\theta})=\frac{e^{i\theta}-e^{-i\theta}}{2i}\). Usage : \(|e^{itX}|=1\) pour \(t\) et \(X\) réels, d''où \(|\varphi_X(t)|\le1\).'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans proba-n-0064, proba-n-0065, proba-n-0073'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [prerequis-l1l2, propriete]
- id: proba-a-098-3
  notion: proba-p-0006
  recto: 'Prop. : exponentielle complexe d''une somme'
  verso: 'Pour tous \(z,w\in\mathbb C\) : \(e^{z+w}=e^ze^w\). De plus \(|e^z|=e^{\mathrm{Re}\,z}\), donc \(e^z\neq0\). En particulier \(e^{i(s+t)}=e^{is}e^{it}\) et \(e^{itX}e^{itY}=e^{it(X+Y)}\).'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans proba-n-0064, proba-n-0065'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [prerequis-l1l2, propriete]
- id: proba-a-099-1
  notion: proba-p-0007
  recto: 'Prop. : limite de \(\left(1+\frac{z_n}n\right)^n\) pour une suite complexe \(z_n\to z\)'
  verso: 'Soit \((z_n)\) une suite de nombres complexes qui converge vers \(z\in\mathbb C\). Alors \(\left(1+\frac{z_n}n\right)^n\to e^z\) quand \(n\to+\infty\). Usage (TCL) : \(\varphi_{Z_1}(s)=1-\frac{\sigma^2}2s^2+o(s^2)\) donne, à \(t\) fixé, \(\varphi_{Z_1}(t/\sqrt n)=1+\frac{z_n}n\) avec \(z_n\to-\frac{\sigma^2t^2}2\), d''où \(\varphi_{Z_1}(t/\sqrt n)^n\to e^{-\sigma^2t^2/2}\). Dans \(\mathbb C\), on ne peut pas écrire directement \(\exp\big(n\ln(1+\frac{z_n}n)\big)\) avec le logarithme réel.'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans proba-n-0143'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 2
  tags: [prerequis-l1l2, propriete]
