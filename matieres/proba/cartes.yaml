- id: proba-a-095-2
  notion: proba-p-0002
  recto: 'Soit \((X_k)_{k\ge1}\) une suite de variables aléatoires réelles sur \((\Omega,P)\). Sachant que \(X_k\to0\) presque sûrement, comment utilise-t-on Cesàro pour montrer que \(\frac1n\sum_{k=1}^nX_k\to0\) presque sûrement ?'
  verso: 'Il existe un événement \(\Omega_0\) de probabilité \(1\) tel que, pour tout \(\omega\in\Omega_0\), la suite réelle \((X_k(\omega))_k\) tend vers \(0\). Pour chaque tel \(\omega\) fixé, Cesàro (suite réelle) donne \(\frac1n\sum_{k=1}^nX_k(\omega)\to0\) : la convergence a lieu sur \(\Omega_0\), donc presque sûrement.'
