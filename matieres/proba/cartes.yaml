- id: proba-a-096-1
  notion: proba-p-0003
  recto: 'Épreuves de Bernoulli indépendantes de paramètre \(p\in]0,1[\) ; \(T_k\) est le rang du \(k\)-ième succès (\(k\in\mathbb N^*\)). Donner la loi de \(T_k\), puis le cas \(k=1\).'
  verso: '\(T_k\) est à valeurs dans \(\{k,k+1,\dots\}\) et \(P(T_k=n)=\binom{n-1}{k-1}p^k(1-p)^{n-k}\) pour \(n\ge k\) (\(k-1\) succès parmi les \(n-1\) premières épreuves, puis un succès à l''épreuve \(n\)) : loi binomiale négative. Pour \(k=1\) : \(P(T_1=n)=p(1-p)^{n-1}\), loi géométrique \(\mathcal G(p)\) sur \(\mathbb N^*\).<br>Attention : <code>rnbinom</code> de R compte les échecs avant le \(k\)-ième succès, soit \(T_k-k\).'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans pro-exa2425-ex01'
