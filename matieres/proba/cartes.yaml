- id: proba-a-001-1
  notion: proba-n-0004
  recto: 'Prop. : probabilité du complémentaire'
  verso: 'Soit \((\Omega,P)\) un espace de probabilité. Pour tout événement \(A\) de \(\Omega\), \(P(A^c)=1-P(A)\) (conséquence de (i) \(P(\Omega)=1\) et de (ii) l''additivité sur deux événements disjoints).'
  source: 'Poly Probabilités 5, ch. 1, p. 6 (PDF)'
  chapitre: 'Chapitre 1 - Rappels sur le modèle probabiliste'
  priorite: 3
  tags: [propriete]
- id: proba-a-001-2
  notion: proba-n-0004
  recto: 'Prop. : monotonie de la probabilité'
  verso: 'Soit \((\Omega,P)\) un espace de probabilité. Si \(A\) et \(B\) sont deux événements tels que \(A\subset B\), alors \(P(A)\le P(B)\).'
  source: 'Poly Probabilités 5, ch. 1, p. 7 (PDF)'
  chapitre: 'Chapitre 1 - Rappels sur le modèle probabiliste'
  priorite: 3
  tags: [propriete]
- id: proba-a-001-3
  notion: proba-n-0004
  recto: 'Prop. : sous-additivité finie'
  verso: 'Soit \((\Omega,P)\) un espace de probabilité. \(P(A\cup B)\le P(A)+P(B)\) pour tous événements \(A,B\) de \(\Omega\) ; par récurrence immédiate, \(P(A_1\cup\dots\cup A_n)\le P(A_1)+\dots+P(A_n)\) pour tous événements \(A_1,\dots,A_n\) de \(\Omega\).'
  source: 'Poly Probabilités 5, ch. 1, p. 7 (PDF)'
  chapitre: 'Chapitre 1 - Rappels sur le modèle probabiliste'
  priorite: 3
  tags: [propriete]
- id: proba-a-001-4
  notion: proba-n-0004
  recto: 'Prop. : sous-additivité dénombrable'
  verso: 'Soit \((\Omega,P)\) un espace de probabilité. \(P\big(\bigcup_{n\in\mathbb N}A_n\big)\le\sum_{n=0}^{+\infty}P(A_n)\) pour toute famille d''événements \((A_n,n\in\mathbb N)\) (le second membre peut valoir \(+\infty\)).<br>Preuve : pour tout \(n\ge0\), \(P\big(\bigcup_{k=0}^{n}A_k\big)\le\sum_{k=0}^{n}P(A_k)\) ; on passe à la limite \(n\to+\infty\) avec la continuité de \(P\).'
  source: 'Poly Probabilités 5, ch. 1, p. 7 (PDF)'
  chapitre: 'Chapitre 1 - Rappels sur le modèle probabiliste'
  priorite: 3
  tags: [propriete]
- id: proba-a-002-1
  notion: proba-n-0007
  recto: 'Prop. 1.5 (1) : réunion d''événements négligeables'
  verso: 'Soit \((\Omega,P)\) un espace de probabilité. Une réunion finie ou dénombrable d''événements négligeables est un événement négligeable.'
  source: 'Poly Probabilités 5, ch. 1, p. 8 (PDF)'
  chapitre: 'Chapitre 1 - Rappels sur le modèle probabiliste'
  priorite: 1
  tags: [propriete]
- id: proba-a-002-2
  notion: proba-n-0007
  recto: 'Prop. 1.5 (2) : intersection d''événements presque sûrs'
  verso: 'Soit \((\Omega,P)\) un espace de probabilité. Une intersection finie ou dénombrable d''événements presque sûrs est un événement presque sûr (par passage au complémentaire à partir de (1)).'
  source: 'Poly Probabilités 5, ch. 1, p. 8 (PDF)'
  chapitre: 'Chapitre 1 - Rappels sur le modèle probabiliste'
  priorite: 1
  tags: [propriete]
- id: proba-a-002-3
  notion: proba-n-0007
  recto: 'Preuve : Prop. 1.5 (1), réunion de négligeables'
  verso: 'Soit \((\Omega,P)\) un espace de probabilité et \((A_n,n\ge1)\) une famille finie ou dénombrable d''événements négligeables.<br>\(P\big(\bigcup_{n\ge1}A_n\big)\le\sum_{n\ge1}P(A_n)=\sum_{n\ge1}0=0\) (sous-additivité).'
  source: 'Poly Probabilités 5, ch. 1, p. 8 (PDF)'
  chapitre: 'Chapitre 1 - Rappels sur le modèle probabiliste'
  priorite: 1
  tags: [propriete]
- id: proba-a-002-4
  notion: proba-n-0007
  recto: 'Exemple : probabilité de \(\mathbb Z\) pour la loi gaussienne'
  verso: 'Soit \(P\) la loi gaussienne centrée réduite définie sur \(\mathbb R\). Alors la probabilité de tout singleton est nulle et l''on en déduit :<br>\(P(\mathbb Z)=P\big(\bigcup_{n\in\mathbb Z}\{n\}\big)=\sum_{n\in\mathbb Z}P(\{n\})=0\).'
  source: 'Poly Probabilités 5, ch. 1, p. 8 (PDF)'
  chapitre: 'Chapitre 1 - Rappels sur le modèle probabiliste'
  priorite: 1
  tags: [propriete]
- id: proba-a-003-1
  notion: proba-n-0010
  recto: 'Prop. 1.9 : variables égales presque sûrement'
  verso: 'Soient \(X\) et \(Y\) deux variables aléatoires définies sur un même espace de probabilité \((\Omega,P)\) et à valeurs dans un même espace \(E\). Si \(X\) et \(Y\) sont égales presque sûrement, alors elles ont même loi. (La réciproque est fausse.)'
  source: 'Poly Probabilités 5, ch. 1, p. 8 (PDF)'
  chapitre: 'Chapitre 1 - Rappels sur le modèle probabiliste'
  priorite: 3
  tags: [propriete]
- id: proba-a-003-2
  notion: proba-n-0010
  recto: 'Exemple : même loi sans égalité presque sûre'
  verso: 'Attention, la réciproque de la Prop. 1.9 n''est pas vraie. Si \(X\) est une variable de Bernoulli de paramètre \(1/2\), alors \(X\) est égale en loi à \(Y=1-X\), mais \(P(X=Y)=P(X=1/2)=0\).'
  source: 'Poly Probabilités 5, ch. 1, p. 8 (PDF)'
  chapitre: 'Chapitre 1 - Rappels sur le modèle probabiliste'
  priorite: 3
  tags: [propriete]
- id: proba-a-003-3
  notion: proba-n-0010
  recto: 'Preuve : Prop. 1.9, égalité p.s. implique même loi'
  verso: 'Soient \(X\) et \(Y\) deux variables aléatoires définies sur un même espace de probabilité \((\Omega,P)\) et à valeurs dans un même espace \(E\), égales presque sûrement ; \(P_X\) et \(P_Y\) désignent leurs lois. Soit \(N=\{\omega\in\Omega\mid X(\omega)\neq Y(\omega)\}\), négligeable par hypothèse, et \(B\) un événement quelconque de \(E\).<br>\(P_X(B)=P(X\in B,\ Y\in B)+P(X\in B,\ Y\notin B)\) et \(\{X\in B,\ Y\notin B\}\subset N\) est négligeable, donc \(P_X(B)=P(X\in B,\ Y\in B)\). De même \(P_Y(B)=P(X\in B,\ Y\in B)\). D''où \(P_X(B)=P_Y(B)\) pour tout \(B\).'
  source: 'Poly Probabilités 5, ch. 1, p. 9 (PDF)'
  chapitre: 'Chapitre 1 - Rappels sur le modèle probabiliste'
  priorite: 3
  tags: [propriete]
- id: proba-a-004-1
  notion: proba-n-0014
  recto: 'Prop. 2.1 : ensemble des atomes'
  verso: 'Soit \((\Omega,P)\) un espace de probabilité. Soit \(S\subset\Omega\) défini par \(S=\{\omega\in\Omega\mid P(\{\omega\})\gt 0\}\). Alors \(S\) est fini ou dénombrable.'
  source: 'Poly Probabilités 5, ch. 2, p. 12 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 3
  tags: [propriete]
- id: proba-a-004-2
  notion: proba-n-0014
  recto: 'Preuve : Prop. 2.1, support fini ou dénombrable'
  verso: 'Soit \((\Omega,P)\) un espace de probabilité et \(S=\{\omega\in\Omega\mid P(\{\omega\})\gt 0\}\).<br>\(S=\bigcup_{n\ge1}\{\omega\mid P(\{\omega\})\gt 1/n\}\). Pour tout \(n\ge1\), cet ensemble a au plus \(n\) éléments (sinon sa probabilité dépasserait strictement \(1\)). \(S\) est donc une réunion dénombrable et croissante d''ensembles finis : il est fini ou dénombrable.'
  source: 'Poly Probabilités 5, ch. 2, p. 12 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 3
  tags: [propriete]
- id: proba-a-005-1
  notion: proba-n-0024
  recto: 'Déf 2.13 : loi à densité'
  verso: 'Une loi \(P\) définie sur \(\mathbb R\) est dite à densité s''il existe une fonction réelle \(f\) telle que :<br>- \(f\) est suffisamment régulière pour être localement intégrable ;<br>- \(f\) est positive et d''intégrale égale à \(1\) : \(\int_{\mathbb R}f(x)\,dx=1\) ;<br>- pour tous \(a,b\in\,]-\infty,+\infty[\,\cup\{-\infty,+\infty\}\) tels que \(a\le b\), \(P(]a,b])=\int_a^b f(x)\,dx\).'
  source: 'Poly Probabilités 5, ch. 2, p. 16 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 1
  tags: [definition]
- id: proba-a-005-2
  notion: proba-n-0024
  recto: 'Exemple : probabilité d''un événement pour une loi à densité'
  verso: 'Soit \(P\) une loi sur \(\mathbb R\) de densité \(f\). Par définition de la densité, pour tout intervalle \(A\) de la forme \(]a,b]\) : \(P(A)=\int_A f(x)\,dx=\int_{\mathbb R}\mathbf 1_A(x)f(x)\,dx\). On peut montrer que cette formule reste vraie pour tout événement \(A\) de \(\mathbb R\). Cela implique en particulier que la densité d''une probabilité caractérise cette probabilité.'
  source: 'Poly Probabilités 5, ch. 2, p. 16 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 1
  tags: [definition]
- id: proba-a-005-3
  notion: proba-n-0024
  recto: 'Rem. : calcul de \(P(A)\), correspondance formelle entre loi discrète et loi à densité'
  verso: 'Soit \(P\) une loi sur \(\mathbb R\) et \(A\) un événement (borélien) quelconque de \(\mathbb R\).<br>Si \(P\) est discrète, de support \(S\) et de poids \(p_s=P(\{s\})\) : \(P(A)=\sum_{s\in A\cap S}p_s=\sum_{s\in S}\mathbf 1_A(s)P(\{s\})\).<br>Si \(P\) a pour densité \(f\) : \(P(A)=\int_A f(x)\,dx=\int_{\mathbb R}\mathbf 1_A(x)f(x)\,dx\).<br>Correspondance formelle : \(\mathbf 1_A(s)\leftrightarrow\mathbf 1_A(x)\), \(P(\{s\})\leftrightarrow f(x)\), \(\sum_{s\in S}\leftrightarrow\int_{\mathbb R}dx\) ; la famille \((P(\{s\}))_{s\in S}\) joue le rôle d''une « densité discrète ».'
  source: 'Poly Probabilités 5, ch. 2, p. 16 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 1
  tags: [definition]
- id: proba-a-006-1
  notion: proba-n-0025
  recto: 'Prop. 2.15 : singletons d''une loi à densité'
  verso: 'Si la loi \(P\) est à densité, alors \(P(\{x\})=0\) pour tout \(x\in\mathbb R\).'
  source: 'Poly Probabilités 5, ch. 2, p. 17 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 1
  tags: [propriete]
- id: proba-a-006-2
  notion: proba-n-0025
  recto: 'Cor. 2.16 : intervalles d''une loi à densité'
  verso: 'Si la loi \(P\) est à densité, pour tous \(a,b\in\mathbb R\) tels que \(a\le b\), \(P(]a,b[)=P([a,b[)=P(]a,b])=P([a,b])\).'
  source: 'Poly Probabilités 5, ch. 2, p. 17 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 1
  tags: [propriete]
- id: proba-a-006-3
  notion: proba-n-0025
  recto: 'Prop. 2.15 : la réciproque est fausse'
  verso: 'Attention : la Prop. 2.15 (si \(P\) est à densité, \(P(\{x\})=0\) pour tout \(x\in\mathbb R\)) ne caractérise pas les lois à densité. Il existe des lois \(P\) qui ne sont pas à densité (et encore moins discrètes) et vérifiant néanmoins \(P(\{x\})=0\) pour tout \(x\in\mathbb R\).'
  source: 'Poly Probabilités 5, ch. 2, p. 17 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 1
  tags: [propriete]
- id: proba-a-007-1
  notion: proba-n-0026
  recto: 'Déf 2.17 : support d''une loi à densité'
  verso: 'Si \(P\) est une loi à densité sur \(\mathbb R\), son support \(S\) est l''ensemble des points \(x\in\mathbb R\) tels que pour tout \(\epsilon\gt 0\), \(P(]x-\epsilon,x+\epsilon[)\gt 0\).'
  source: 'Poly Probabilités 5, ch. 2, p. 17 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 2
  tags: [definition]
- id: proba-a-007-2
  notion: proba-n-0026
  recto: 'Déf 2.17 : pourquoi pas \(\{x : P(\{x\})\gt 0\}\)'
  verso: 'Soit \(P\) une loi à densité sur \(\mathbb R\). Pour définir le support d''une loi admettant une densité, on s''inspire de la définition donnée pour une loi discrète. Si très naïvement on pose \(S=\{x\in\mathbb R\mid P(\{x\})\gt 0\}\), alors \(S=\emptyset\) d''après la Prop. 2.15 (\(P(\{x\})=0\) pour tout \(x\)).'
  source: 'Poly Probabilités 5, ch. 2, p. 17 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 2
  tags: [definition]
- id: proba-a-007-3
  notion: proba-n-0026
  recto: 'Prop. 2.18 (1) et (2) : support d''une loi à densité'
  verso: 'Si \(P\) est une loi à densité sur \(\mathbb R\) de support \(S\), alors :<br>1. \(S\) est un ensemble fermé de \(\mathbb R\) et \(P(S)=1\) ;<br>2. \(S\) est le plus petit (au sens de l''inclusion) ensemble fermé de \(\mathbb R\) de masse \(1\) sous \(P\).'
  source: 'Poly Probabilités 5, ch. 2, p. 17 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 2
  tags: [definition]
- id: proba-a-007-4
  notion: proba-n-0026
  recto: 'Prop. 2.18 (3) : point de densité strictement positive'
  verso: 'Si \(P\) est une loi à densité sur \(\mathbb R\) de support \(S\), admettant une densité \(f\) continue en \(x_0\) et telle que \(f(x_0)\gt 0\), alors \(x_0\in S\).'
  source: 'Poly Probabilités 5, ch. 2, p. 17 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 2
  tags: [definition]
- id: proba-a-007-5
  notion: proba-n-0026
  recto: 'Exemple : supports de lois usuelles'
  verso: 'Le support d''une loi gaussienne de variance strictement positive est \(\mathbb R\), celui d''une loi exponentielle est \(\mathbb R_+\), celui d''une loi uniforme sur \([a,b]\) est \([a,b]\).'
  source: 'Poly Probabilités 5, ch. 2, p. 17 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 2
  tags: [definition]
- id: proba-a-008-1
  notion: proba-n-0027
  recto: 'Déf 2.20 : espérance d''une variable à densité (cas positif)'
  verso: 'Soit \(X\) une variable aléatoire réelle admettant la densité \(f_X\). Si le support de la loi de \(X\) est inclus dans \(\mathbb R_+\), autrement dit si \(f_X\) est nulle presque partout sur \(\mathbb R_-\), alors la fonction \(x\mapsto xf_X(x)\) est positive et l''on peut définir \(E[X]=\int_{\mathbb R}xf_X(x)\,dx=\int_0^{+\infty}xf_X(x)\,dx\in[0,+\infty[\,\cup\{+\infty\}\). On dit que \(X\) admet une espérance finie ou infinie.'
  source: 'Poly Probabilités 5, ch. 2, p. 17 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 1
  tags: [definition]
- id: proba-a-008-2
  notion: proba-n-0027
  recto: 'Déf 2.20 : espérance d''une variable à densité (cas intégrable)'
  verso: 'Soit \(X\) une variable aléatoire réelle admettant la densité \(f_X\). Si \(E[|X|]\lt +\infty\), autrement dit si l''intégrale de la fonction \(x\mapsto xf_X(x)\) est absolument convergente, alors on peut définir \(E[X]=\int_{\mathbb R}xf_X(x)\,dx\in\,]-\infty,+\infty[\). On dit que \(X\) admet une espérance finie.'
  source: 'Poly Probabilités 5, ch. 2, p. 18 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 1
  tags: [definition]
- id: proba-a-009-1
  notion: proba-n-0030
  recto: 'Prop. 2.22 : fonction muette'
  verso: 'Soit \(X\) une variable aléatoire réelle. S''il existe une fonction positive \(f\) telle que \(E[\varphi(X)]=\int_{\mathbb R}\varphi(x)f(x)\,dx\) pour toute fonction \(\varphi\) continue bornée ou pour toute fonction continue positive, alors la loi de \(X\) admet la densité \(f\).'
  source: 'Poly Probabilités 5, ch. 2, p. 18 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 2
  tags: [methode]
- id: proba-a-009-2
  notion: proba-n-0030
  recto: 'Soit \(X\) une variable aléatoire réelle de densité \(f_X\) et \(\psi:\mathbb R\to\mathbb R\) de classe \(C^1\) par morceaux. Densité de \(Y=\psi(X)\) par la fonction muette : les étapes.'
  verso: 'Soit \(\varphi\) continue bornée. Formule de transfert : \(E[\varphi(Y)]=\int_{\mathbb R}\varphi(\psi(x))f_X(x)\,dx\). Changement de variable \(y=\psi(x)\) (en découpant \(\mathbb R\) si \(\psi\) n''est pas injective). On obtient \(E[\varphi(Y)]=\int\varphi(y)g(y)\,dy\) : \(g\) est la densité de \(Y\).'
  source: 'Poly Probabilités 5, ch. 2, p. 18 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 2
  tags: [methode]
- id: proba-a-009-3
  notion: proba-n-0030
  recto: 'Exemple : changement de variable \(y=x^2\) pour \(X\) gaussienne'
  verso: 'Soit \(X\) une variable aléatoire gaussienne centrée réduite, \(Y=X^2\), et \(\varphi\) continue bornée sur \(\mathbb R\). Par la formule de transfert, \(E[\varphi(Y)]=\int_{\mathbb R}\varphi(x^2)\frac{e^{-x^2/2}}{\sqrt{2\pi}}dx\).<br>On ne peut faire directement le changement de variables \(y=x^2\) dans l''intégrale : s''il est \(C^1\), il n''est cependant pas injectif sur l''intervalle d''intégration. Il suffit de couper l''intervalle d''intégration en parties sur lesquelles le changement de variables sera bien injectif : \(\int_{-\infty}^0+\int_0^{+\infty}\).'
  source: 'Poly Probabilités 5, ch. 2, p. 18 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 2
  tags: [methode]
- id: proba-a-010-1
  notion: proba-n-0031
  recto: 'Exemple : loi de \(X^2\) pour \(X\) gaussienne centrée réduite'
  verso: 'Soit \(X\) une variable aléatoire gaussienne centrée réduite, \(Y=X^2\). Alors la loi de \(Y\) admet la densité \(f_Y(y)=\dfrac{e^{-y/2}}{\sqrt{2\pi y}}\mathbf 1_{y\gt 0}\). On reconnaît une loi Gamma de paramètres \(\left(\tfrac12,\tfrac12\right)\).'
  source: 'Poly Probabilités 5, ch. 2, p. 19 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 3
  tags: [exemple]
- id: proba-a-010-2
  notion: proba-n-0031
  recto: 'Exemple : changement de variables sur \(]-\infty,0[\) pour \(X^2\)'
  verso: 'Soit \(X\) gaussienne centrée réduite, \(Y=X^2\), \(\varphi\) continue bornée. On calcule \(\int_{-\infty}^0\varphi(x^2)\frac{e^{-x^2/2}}{\sqrt{2\pi}}dx\). Sur \(]-\infty,0[\), \(x\mapsto x^2\) est \(C^1\) et bijective de \(]-\infty,0[\) sur \(]0,+\infty[\).<br>Inverse : \(y=x^2\Leftrightarrow x=-\sqrt y\). Élément différentiel : \(dx=(-\sqrt y)^{\prime}dy=-\frac{1}{2\sqrt y}dy\). Bornes : \(\lim_{x\to-\infty}x^2=+\infty\), \(\lim_{x\to0^-}x^2=0\).<br>D''où \(\int_{-\infty}^0\varphi(x^2)\frac{e^{-x^2/2}}{\sqrt{2\pi}}dx=\frac12\int_0^{+\infty}\varphi(y)\frac{e^{-y/2}}{\sqrt{2\pi y}}dy\). Le changement de variables sur \(]0,+\infty[\) donne le même résultat, d''où \(E[\varphi(Y)]=\int_0^{+\infty}\varphi(y)\frac{e^{-y/2}}{\sqrt{2\pi y}}dy\).'
  source: 'Poly Probabilités 5, ch. 2, p. 19 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 3
  tags: [exemple]
- id: proba-a-011-1
  notion: proba-n-0032
  recto: 'Déf 2.23 : variable étagée'
  verso: 'Soit \((\Omega,P)\) un espace de probabilité. Une variable aléatoire \(X\) définie sur \(\Omega\) est dite étagée s''il existe une famille finie d''événements \(A_1,\dots,A_p\) disjoints deux à deux et des nombres \(\alpha_1,\dots,\alpha_p\) tels que \(X=\sum_{i=1}^p\alpha_i\mathbf 1_{A_i}\). En d''autres termes, une variable aléatoire étagée est une variable ne prenant qu''un nombre fini de valeurs ; il s''agit en particulier d''une variable discrète. L''espérance d''une variable étagée est donnée par \(E[X]=\sum_{i=1}^p\alpha_iP(A_i)\).'
  source: 'Poly Probabilités 5, ch. 2, p. 19 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 3
  tags: [definition]
- id: proba-a-012-1
  notion: proba-n-0040
  recto: 'Preuve : Prop. 2.33 (Markov), encadrement de l''indicatrice'
  verso: 'Soit \(X\) une variable aléatoire réelle, \(X^+=\max(0,X)\) et \(t\gt 0\). Pour tout \(x\in\mathbb R\), on a les inégalités \(\mathbf 1_{[t,+\infty[}(x)\le\dfrac{x}{t}\mathbf 1_{[t,+\infty[}(x)\le\dfrac{\max(0,x)}{t}\le\dfrac{|x|}{t}\).'
  source: 'Poly Probabilités 5, ch. 2, p. 23 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 2
  tags: [demonstration]
- id: proba-a-012-2
  notion: proba-n-0040
  recto: 'Preuve : Prop. 2.33 (Markov), conclusion'
  verso: 'Soit \(X\) une variable aléatoire réelle, \(X^+=\max(0,X)\) et \(t\gt 0\). La proposition s''en déduit de l''encadrement \(\mathbf 1_{[t,+\infty[}(x)\le\frac{\max(0,x)}{t}\le\frac{|x|}{t}\) (appliqué à \(X\), puis espérance, par monotonie de l''espérance (2.1)) et du fait que \(P(X\ge t)=E\big[\mathbf 1_{[t,+\infty[}(X)\big]\). On obtient \(P(X\ge t)\le\frac{E[X^+]}{t}\le\frac{E[|X|]}{t}\).'
  source: 'Poly Probabilités 5, ch. 2, p. 23 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 2
  tags: [demonstration]
- id: proba-a-013-1
  notion: proba-n-0041
  recto: 'Prop. 2.35 : variable positive d''espérance nulle'
  verso: 'Soit \(X\) une variable aléatoire presque sûrement positive (\(P(X\ge0)=1\)). Alors \(P(X=0)=1\iff E[X]=0\).'
  source: 'Poly Probabilités 5, ch. 2, p. 23 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 3
  tags: [propriete]
- id: proba-a-013-2
  notion: proba-n-0041
  recto: 'Preuve : Prop. 2.35, \(E[X]=0\Rightarrow P(X=0)=1\)'
  verso: 'Soit \(X\) variable aléatoire presque sûrement positive avec \(E[X]=0\).<br>\(P(X=0)=P(X\ge0)-P(X\gt 0)=1-P(X\gt 0)\) et, par continuité croissante de \(P\), \(P(X\gt 0)=P\big(\bigcup_{n\ge1}\{X\gt 1/n\}\big)=\lim_{n\to+\infty}P(X\gt 1/n)\). Or, d''après l''inégalité de Markov, \(0\le P(X\gt 1/n)\le nE[X]=0\) pour tout \(n\ge1\). Donc \(\lim_n P(X\gt 1/n)=0\), puis \(P(X=0)=1\).'
  source: 'Poly Probabilités 5, ch. 2, p. 23 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 3
  tags: [propriete]
- id: proba-a-014-1
  notion: proba-n-0042
  recto: 'Thm 2.36 : inégalité de Jensen'
  verso: 'Soit \(X\) une variable aléatoire admettant une espérance finie, à valeurs dans un intervalle \(I\) de \(\mathbb R\). Soit \(\varphi\) une fonction réelle, définie et convexe sur \(I\). On suppose que \(\varphi(X)\) est presque sûrement positive ou d''espérance finie. Alors \(\varphi(E[X])\le E[\varphi(X)]\).'
  source: 'Poly Probabilités 5, ch. 2, p. 24 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 1
  tags: [theoreme]
- id: proba-a-014-2
  notion: proba-n-0042
  recto: 'Prop. : l''espérance appartient à tout intervalle contenant le support'
  verso: 'Soit \(X\) une variable aléatoire de support \(S_X\) et admettant une espérance finie. Cette espérance n''appartient pas nécessairement à \(S_X\) (une variable de Bernoulli de paramètre \(1/2\) a pour support \(\{0,1\}\) et pour espérance \(1/2\)). Mais si \(I\) est un intervalle qui contient \(S_X\), alors \(E[X]\in I\). Par exemple, si \(S_X\subset I=[a,b]\) : \(a\le X\le b\) p.s., d''où \(a\le E[X]\le b\), autrement dit \(E[X]\in I\).'
  source: 'Poly Probabilités 5, ch. 2, p. 24 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 1
  tags: [theoreme]
- id: proba-a-015-1
  notion: proba-n-0043
  recto: 'Cor. 2.38 : comparaison des normes \(L^p\)'
  verso: 'Soit \(X\) une variable aléatoire réelle et \(p,q\in\mathbb R_+^*\) tels que \(p\lt q\). Alors \(E[|X|^p]^{1/p}\le E[|X|^q]^{1/q}\).'
  source: 'Poly Probabilités 5, ch. 2, p. 24 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 1
  tags: [propriete]
- id: proba-a-015-2
  notion: proba-n-0043
  recto: 'Preuve : Cor. 2.38 par Jensen'
  verso: 'Soit \(X\) variable aléatoire réelle et \(0\lt p\lt q\). On applique l''inégalité de Jensen à la variable aléatoire \(|X|^p\), à valeurs dans \([0,+\infty[\), et à la fonction \(x\mapsto x^{q/p}\), bien définie et convexe sur \([0,+\infty[\) dès lors que \(q/p\gt 1\) : \(E[|X|^p]^{q/p}\le E\big[(|X|^p)^{q/p}\big]=E[|X|^q]\). Comme \(x\mapsto x^{1/q}\) est croissante sur \(\mathbb R_+\), le corollaire en résulte.<br>(le poly ne vérifie pas l''hypothèse de Jensen \(E[|X|^p]\lt +\infty\) : si \(E[|X|^q]=+\infty\) l''inégalité est triviale, sinon \(|x|^p\le 1+|x|^q\) donne \(E[|X|^p]\lt +\infty\))'
  source: 'Poly Probabilités 5, ch. 2, p. 24 (PDF)'
  chapitre: 'Chapitre 2 - Variables aléatoires réelles'
  priorite: 1
  tags: [propriete]
- id: proba-a-016-1
  notion: proba-n-0045
  recto: 'Prop. 3.3 : toute densité est la densité d''une loi'
  verso: 'Soit \(f\) une fonction suffisamment régulière sur \(\mathbb R\), positive, et d''intégrale égale à \(1\). Alors il existe une variable aléatoire dont la loi admet la densité \(f\).'
  source: 'Poly Probabilités 5, ch. 3, p. 25 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-016-2
  notion: proba-n-0045
  recto: 'Prop. 3.4 : égalité de lois à densité'
  verso: 'Soient \(X\) et \(Y\) deux variables aléatoires réelles, dont les lois admettent les densités \(f_X\) et \(f_Y\). Alors \(X\) et \(Y\) ont même loi si et seulement si \(f_X=f_Y\) sauf éventuellement sur un ensemble de longueur nulle.'
  source: 'Poly Probabilités 5, ch. 3, p. 26 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-016-3
  notion: proba-n-0045
  recto: 'Déf : ensemble de longueur nulle'
  verso: 'On entend par ensemble de longueur nulle (ou d''intégrale nulle) un ensemble \(A\) tel que \(\int_A dx=0\). C''est le cas par exemple si \(A\) est fini ou dénombrable.'
  source: 'Poly Probabilités 5, ch. 3, p. 26 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-017-1
  notion: proba-n-0046
  recto: 'Prop. 3.5 : critère pour des lois distinctes'
  verso: 'Soient \(X\) et \(Y\) deux variables aléatoires réelles de densités \(f_X\) et \(f_Y\). S''il existe \(x_0\in\mathbb R\) tel que \(f_X\) et \(f_Y\) soient continues en \(x_0\), et \(f_X(x_0)\neq f_Y(x_0)\), alors les lois de \(X\) et \(Y\) sont distinctes.'
  source: 'Poly Probabilités 5, ch. 3, p. 26 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 3
  tags: [propriete]
- id: proba-a-017-2
  notion: proba-n-0046
  recto: 'Preuve : Prop. 3.5, critère pour des lois distinctes'
  verso: 'Soient \(X,Y\) variables aléatoires réelles de densités \(f_X,f_Y\) et de fonctions de répartition \(F_X,F_Y\), et \(x_0\in\mathbb R\) tel que \(f_X\) et \(f_Y\) soient continues en \(x_0\) et \(f_X(x_0)\neq f_Y(x_0)\).<br>Alors \(F_X\) et \(F_Y\) sont dérivables en \(x_0\) et \(F_X^{\prime}(x_0)=f_X(x_0)\neq f_Y(x_0)=F_Y^{\prime}(x_0)\) d''après la Prop. 3.11. Les fonctions de répartition de \(X\) et \(Y\) sont donc distinctes. Comme elles caractérisent les lois de \(X\) et \(Y\), ces lois sont différentes.'
  source: 'Poly Probabilités 5, ch. 3, p. 31 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 3
  tags: [propriete]
- id: proba-a-018-1
  notion: proba-n-0047
  recto: 'Prop. : schéma général des fonctions tests'
  verso: 'Soit \(X,Y\) deux variables aléatoires réelles de lois respectives \(P_X\) et \(P_Y\). Pour tout événement \(A\) de \(\mathbb R\), \(P_X(A)=E[\mathbf 1_A(X)]\) et \(P_Y(A)=E[\mathbf 1_A(Y)]\). Donc \(P_X=P_Y\) si et seulement si \(E[\psi(X)]=E[\psi(Y)]\) pour toute fonction \(\psi\in\mathcal F=\{\mathbf 1_A,\ A\text{ événement de }\mathbb R\}\). Si l''ensemble \(\mathcal F\) de fonctions tests est assez riche : \(P_X=P_Y\iff\forall\psi\in\mathcal F,\ E[\psi(X)]=E[\psi(Y)]\).'
  source: 'Poly Probabilités 5, ch. 3, p. 26 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [methode]
- id: proba-a-018-2
  notion: proba-n-0047
  recto: 'Prop. : famille de tests paramétrée'
  verso: 'Soit \(X,Y\) deux variables aléatoires réelles de lois respectives \(P_X\) et \(P_Y\). Si l''on paramètre les fonctions de \(\mathcal F=\{\psi_\lambda,\lambda\in\Lambda\}\) et que l''on définit \(H_X(\lambda)=E[\psi_\lambda(X)]\) (et de même \(H_Y\)), alors \(P_X=P_Y\iff\forall\psi\in\mathcal F,\ E[\psi(X)]=E[\psi(Y)]\iff\forall\lambda\in\Lambda,\ E[\psi_\lambda(X)]=E[\psi_\lambda(Y)]\iff\forall\lambda\in\Lambda,\ H_X(\lambda)=H_Y(\lambda)\). Les fonctions \(H_X\) et \(H_Y\), définies sur \(\Lambda\), caractérisent les lois de \(X\) et \(Y\).'
  source: 'Poly Probabilités 5, ch. 3, p. 26 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [methode]
- id: proba-a-018-3
  notion: proba-n-0047
  recto: 'Prop. : fonctions tests \(\mathbf 1_{]-\infty,x]}\) et fonction de répartition'
  verso: 'Soit \(X\) une variable aléatoire réelle de fonction de répartition \(F_X\). Dans le schéma général des fonctions tests, l''ensemble \(\mathcal F=\{\mathbf 1_{]-\infty,x]},x\in\mathbb R\}\) conduira à l''étude des fonctions de répartition : \(H_X(x)=E[\mathbf 1_{]-\infty,x]}(X)]=F_X(x)\).'
  source: 'Poly Probabilités 5, ch. 3, p. 26-27 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [methode]
- id: proba-a-018-4
  notion: proba-n-0047
  recto: 'Prop. : fonctions tests \(x\mapsto x^n\) et moments'
  verso: 'Dans le schéma général des fonctions tests, l''ensemble \(\mathcal F=\{x\mapsto x^n,n\in\mathbb N\}\) conduira à l''étude des moments.'
  source: 'Poly Probabilités 5, ch. 3, p. 27 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [methode]
- id: proba-a-018-5
  notion: proba-n-0047
  recto: 'Prop. : fonctions tests \(x\mapsto e^{itx}\) et fonction caractéristique'
  verso: 'Soit \(X\) une variable aléatoire réelle. Dans le schéma général des fonctions tests, l''ensemble \(\mathcal F=\{x\mapsto e^{itx},t\in\mathbb R\}\) conduira à l''étude de la fonction caractéristique : \(H_X(t)=E[e^{itX}]\).'
  source: 'Poly Probabilités 5, ch. 3, p. 27 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [methode]
- id: proba-a-019-1
  notion: proba-n-0050
  recto: 'Cor. 3.8 : \(P(]a,b])\) et \(P(]a,+\infty[)\)'
  verso: 'Soit \(X\) une variable aléatoire réelle de loi \(P_X\) et de fonction de répartition \(F_X\) et \(a,b\in\mathbb R\) avec \(a\lt b\). Alors, avec les notations précédentes : \(P_X(]a,b])=F_X(b)-F_X(a)\) et \(P_X(]a,+\infty[)=1-F_X(a)\).'
  source: 'Poly Probabilités 5, ch. 3, p. 28 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-019-2
  notion: proba-n-0050
  recto: 'Cor. 3.8 : \(P(]-\infty,a[)\) et \(P([a,+\infty[)\)'
  verso: 'Soit \(X\) une variable aléatoire réelle de loi \(P_X\) et de fonction de répartition \(F_X\) et \(a\in\mathbb R\). Alors, avec les notations précédentes : \(P_X(]-\infty,a[)=\lim_{x\to a^-}F_X(x)\) et \(P_X([a,+\infty[)=1-\lim_{x\to a^-}F_X(x)\).'
  source: 'Poly Probabilités 5, ch. 3, p. 28 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-019-3
  notion: proba-n-0050
  recto: 'Cor. 3.8 : \(P([a,b])\)'
  verso: 'Soit \(X\) une variable aléatoire réelle de loi \(P_X\) et de fonction de répartition \(F_X\) et \(a,b\in\mathbb R\) avec \(a\lt b\). Alors, avec les notations précédentes : \(P_X([a,b])=F_X(b)-\lim_{x\to a^-}F_X(x)\).'
  source: 'Poly Probabilités 5, ch. 3, p. 28 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-019-4
  notion: proba-n-0050
  recto: 'Cor. 3.8 : \(P(]a,b[)\) et \(P([a,b[)\)'
  verso: 'Soit \(X\) une variable aléatoire réelle de loi \(P_X\) et de fonction de répartition \(F_X\) et \(a,b\in\mathbb R\) avec \(a\lt b\). Alors, avec les notations précédentes : \(P_X(]a,b[)=\lim_{x\to b^-}F_X(x)-F_X(a)\) et \(P_X([a,b[)=\lim_{x\to b^-}F_X(x)-\lim_{x\to a^-}F_X(x)\).'
  source: 'Poly Probabilités 5, ch. 3, p. 28 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-019-5
  notion: proba-n-0050
  recto: 'Prop. 3.7 (2) : saut de la fonction de répartition'
  verso: 'Soit \(X\) une variable aléatoire réelle de fonction de répartition \(F_X\). En tout point \(x\in\mathbb R\), \(F_X\) est continue à droite et possède une limite à gauche ; \(P(X=x)=F_X(x)-\lim_{y\to x^-}F_X(y)\).'
  source: 'Poly Probabilités 5, ch. 3, p. 27-28 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-020-1
  notion: proba-n-0051
  recto: 'Cor. 3.9 : discontinuités de la fonction de répartition'
  verso: 'Soit \(X\) une variable aléatoire réelle de fonction de répartition \(F_X\). Avec les notations précédentes, la fonction de répartition \(F_X\) admet au plus un nombre dénombrable de discontinuités. C''est d''ailleurs le cas de toutes les fonctions croissantes sur \(\mathbb R\).'
  source: 'Poly Probabilités 5, ch. 3, p. 28 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 2
  tags: [propriete]
- id: proba-a-020-2
  notion: proba-n-0051
  recto: 'Cor. 3.10 : fonction de répartition d''une variable à densité'
  verso: 'Si \(X\) est une variable à densité, sa fonction de répartition \(F_X\) est continue sur \(\mathbb R\).'
  source: 'Poly Probabilités 5, ch. 3, p. 28 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 2
  tags: [propriete]
- id: proba-a-020-3
  notion: proba-n-0051
  recto: 'Exemple : fonction de répartition continue sans densité'
  verso: 'Attention : une fonction de répartition peut être continue sans que la loi soit à densité. Il faut davantage pour que l''on puisse déduire de la régularité de la fonction de répartition le fait que la loi admet une densité (voir Prop. 3.11).'
  source: 'Poly Probabilités 5, ch. 3, p. 29 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 2
  tags: [propriete]
- id: proba-a-021-1
  notion: proba-n-0052
  recto: 'Prop. 3.11 (1) : fonction de répartition continue et \(C^1\) par morceaux'
  verso: 'Soit \(X\) une variable aléatoire réelle. Si sa fonction de répartition \(F_X\) est continue sur \(\mathbb R\), et continûment dérivable par morceaux, alors \(X\) est une variable aléatoire à densité et \(F_X^{\prime}\) est une densité de la loi de \(X\).'
  source: 'Poly Probabilités 5, ch. 3, p. 29 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-021-2
  notion: proba-n-0052
  recto: 'Prop. 3.11 (2) : dérivée de la fonction de répartition'
  verso: 'Soit \(X\) une variable aléatoire réelle de fonction de répartition \(F_X\). Si \(X\) est une variable aléatoire à densité, et si la densité \(f_X\) est continue en \(x_0\), alors \(F_X\) est dérivable en \(x_0\) et \(F_X^{\prime}(x_0)=f_X(x_0)\).'
  source: 'Poly Probabilités 5, ch. 3, p. 29 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-021-3
  notion: proba-n-0052
  recto: 'Prop. : fonction de répartition en fonction de la densité'
  verso: 'Soit \(X\) une variable aléatoire réelle de densité \(f_X\). Alors la fonction de répartition \(F_X\) de \(X\) vérifie \(F_X(x)=\int_{-\infty}^x f_X(y)\,dy\) (relation utilisée pour la Prop. 3.11).'
  source: 'Poly Probabilités 5, ch. 3, p. 29 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-022-1
  notion: proba-n-0053
  recto: 'Thm 3.12 : caractérisation des fonctions de répartition'
  verso: 'Soit \(F\) une fonction réelle. C''est la fonction de répartition d''une variable aléatoire réelle si et seulement si :<br>- elle est croissante ;<br>- \(\lim_{-\infty}F=0\) et \(\lim_{+\infty}F=1\) ;<br>- elle est continue à droite.<br>La condition nécessaire a été établie à la Prop. 3.7, la condition suffisante est admise (théorie de la mesure).'
  source: 'Poly Probabilités 5, ch. 3, p. 30 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 3
  tags: [theoreme]
- id: proba-a-023-1
  notion: proba-n-0054
  recto: 'Thm 3.13 : la fonction de répartition caractérise la loi'
  verso: 'Soient \(X\) et \(Y\) deux variables aléatoires réelles. Elles ont même loi si et seulement si leurs fonctions de répartition coïncident sur \(\mathbb R\).'
  source: 'Poly Probabilités 5, ch. 3, p. 30 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [theoreme]
- id: proba-a-023-2
  notion: proba-n-0054
  recto: 'Preuve : Thm 3.13, condition suffisante (schéma)'
  verso: 'Soient \(X,Y\) deux variables aléatoires réelles, de lois \(P_X,P_Y\) et de fonctions de répartition \(F_X,F_Y\), avec \(F_X=F_Y\). D''après le Cor. 3.8, \(P_X\) et \(P_Y\) coïncident sur tous les intervalles de \(\mathbb R\), fermés, ouverts ou non, bornés ou non. Grâce aux propriétés de \(P_X\) et \(P_Y\), cette coïncidence s''étend aux événements obtenus par réunion finie ou dénombrable d''intervalles disjoints, par passage au complémentaire et par réunion d''une suite croissante. Cet ensemble d''événements n''est pas exhaustif, mais il suffit à établir que les deux probabilités coïncident sur tous les événements. (Schéma de preuve seulement.)'
  source: 'Poly Probabilités 5, ch. 3, p. 31 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [theoreme]
- id: proba-a-024-1
  notion: proba-n-0056
  recto: 'Exemple : moments de la loi de Pareto'
  verso: 'Soit \(X\) une variable aléatoire admettant la densité \(x\mapsto\frac{3}{x^4}\mathbf 1_{x\ge1}\) (variable dite « de Pareto »), positive presque sûrement. Avec la formule de transfert, pour \(n\in\mathbb N^*\) :<br>\(E[|X|^n]=E[X^n]=\int_{\mathbb R}x^n\frac{3}{x^4}\mathbf 1_{x\ge1}dx=3\int_1^{+\infty}x^{n-4}dx\).<br>Cette intégrale vaut \(+\infty\) si \(n\ge3\), et \(3\left[\frac{x^{n-4+1}}{n-4+1}\right]_1^{+\infty}=\frac{3}{3-n}\) si \(n\lt3\).'
  source: 'Poly Probabilités 5, ch. 3, p. 31 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 3
  tags: [exemple]
- id: proba-a-024-2
  notion: proba-n-0056
  recto: 'Exemple : ordres des moments de la loi de Pareto'
  verso: 'Soit \(X\) une variable aléatoire de densité \(x\mapsto\frac{3}{x^4}\mathbf 1_{x\ge1}\) (variable de Pareto). Pour \(n\in\mathbb N^*\), \(E[|X|^n]=3\int_1^{+\infty}x^{n-4}dx=+\infty\) si \(n\ge3\) et \(\frac{3}{3-n}\) si \(n\lt3\). On conclut que \(X\) n''a pas de moment supérieur ou égal à \(3\).'
  source: 'Poly Probabilités 5, ch. 3, p. 31 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 3
  tags: [exemple]
- id: proba-a-025-1
  notion: proba-n-0057
  recto: 'Prop. 3.16 : moments d''ordres inférieurs'
  verso: 'Si une variable aléatoire possède un moment d''ordre \(q\in\mathbb N^*\), alors elle possède un moment d''ordre \(p\) pour tout \(p\in\mathbb N^*\) tel que \(p\lt q\). (Conséquence du Cor. 2.38.)'
  source: 'Poly Probabilités 5, ch. 3, p. 32 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-025-2
  notion: proba-n-0057
  recto: 'Prop. 3.16 : moments de tout ordre et moments d''ordre pair'
  verso: 'Ainsi, pour vérifier qu''une variable aléatoire possède des moments de tout ordre, il suffit de s''assurer qu''elle possède des moments d''ordre pair (c''est-à-dire d''ordre \(2k\) pour tout \(k\in\mathbb N^*\)).'
  source: 'Poly Probabilités 5, ch. 3, p. 32 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-025-3
  notion: proba-n-0057
  recto: 'Cor. 3.17 : moment de \(aX+b\)'
  verso: 'Soit \(X\) une variable aléatoire réelle et \(n\in\mathbb N^*\). Si \(X\) possède un moment d''ordre \(n\), alors \(aX+b\) aussi pour tous \(a,b\in\mathbb R\).'
  source: 'Poly Probabilités 5, ch. 3, p. 32 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-026-1
  notion: proba-n-0061
  recto: 'Déf : variable aléatoire bornée'
  verso: 'Soit \(X\) une variable aléatoire réelle. La variable \(X\) est dite bornée s''il existe \(\alpha,\beta\in\mathbb R\) tels que \(-\infty\lt\alpha\le\beta\lt+\infty\) et \(P(X\in[\alpha,\beta])=1\).'
  source: 'Poly Probabilités 5, ch. 3, p. 33 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 2
  tags: [definition]
- id: proba-a-026-2
  notion: proba-n-0061
  recto: 'Prop. : critère de support borné par la fonction de répartition'
  verso: 'Soit \(X\) une variable aléatoire réelle de fonction de répartition \(F_X\). S''il existe \(\alpha,\beta\in\mathbb R\) tels que \(-\infty\lt\alpha\le\beta\lt+\infty\), \(F_X(\alpha)=0\) et \(F_X(\beta)=1\), alors \(P(X\in]\alpha,\beta])=F_X(\beta)-F_X(\alpha)=1\).'
  source: 'Poly Probabilités 5, ch. 3, p. 33 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 2
  tags: [definition]
- id: proba-a-026-3
  notion: proba-n-0061
  recto: 'Prop. : critère de support borné par la densité'
  verso: 'Soit \(X\) une variable aléatoire réelle admettant la densité \(f_X\). S''il existe \(\alpha,\beta\in\mathbb R\) tels que \(-\infty\lt\alpha\le\beta\lt+\infty\) et \(f_X\) est nulle sur \(]-\infty,\alpha[\,\cup\,]\beta,+\infty[\), alors \(P(X\in[\alpha,\beta])=\int_\alpha^\beta f_X(x)\,dx=\int_{-\infty}^{+\infty}f_X(x)\,dx=1\).'
  source: 'Poly Probabilités 5, ch. 3, p. 33 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 2
  tags: [definition]
- id: proba-a-026-4
  notion: proba-n-0061
  recto: 'Exemple : lois à support borné ou non'
  verso: 'La loi uniforme sur \([0,1]\) ou sur \(\{1,\dots,n\}\), les lois binomiales sont des exemples de loi à support borné. Ni la loi géométrique, ni la loi gaussienne, ni la loi exponentielle ne sont à support borné.'
  source: 'Poly Probabilités 5, ch. 3, p. 33 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 2
  tags: [definition]
- id: proba-a-027-1
  notion: proba-n-0062
  recto: 'Thm 3.23 : support borné et moments'
  verso: 'Soit \(X\) une variable aléatoire réelle. Soit \(\alpha\ge0\). Les trois assertions suivantes sont équivalentes :<br>1. \(P(X\in[-\alpha,\alpha])=1\) ;<br>2. \(X\) possède des moments de tous ordres et \(E[|X|^n]\le\alpha^n\) pour tout \(n\ge1\) ;<br>3. \(X\) possède des moments de tous ordres et \(\lim_{n\to+\infty}E[|X|^n]^{1/n}\le\alpha\).'
  source: 'Poly Probabilités 5, ch. 3, p. 33 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 2
  tags: [theoreme]
- id: proba-a-027-2
  notion: proba-n-0062
  recto: 'Preuve : Thm 3.23, 3 \(\Rightarrow\) 1'
  verso: 'Hypothèse (assertion 3) : \(X\) possède des moments de tous ordres et \(\lim_{n\to+\infty}E[|X|^n]^{1/n}\le\alpha\). Posons \(m_n=E[|X|^n]^{1/n}\) pour \(n\ge1\). Par l''inégalité de Jensen (Cor. 2.38), \(m_n\le m_{n+1}\) : la suite \((m_n)\) admet une limite \(m_\infty\le\alpha\) et \(m_n\le m_\infty\) pour tout \(n\). Par le Cor. 2.34 de l''inégalité de Markov, pour \(\varepsilon\gt0\) et \(n\ge1\) : \(P(|X|\gt\alpha+\varepsilon)\le\frac{E[|X|^n]}{(\alpha+\varepsilon)^n}=\left(\frac{m_n}{\alpha+\varepsilon}\right)^n\le\left(\frac{m_\infty}{\alpha+\varepsilon}\right)^n\to0\) car \(m_\infty\le\alpha\lt\alpha+\varepsilon\), donc \(P(|X|\gt\alpha+\varepsilon)=0\). Par continuité monotone, \(P(|X|\gt\alpha)=\lim_n P(|X|\gt\alpha+1/n)=0\), donc \(P(|X|\le\alpha)=1\).'
  source: 'Poly Probabilités 5, ch. 3, p. 33-34 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 2
  tags: [theoreme]
- id: proba-a-028-1
  notion: proba-n-0063
  recto: 'Prop. 3.24 : moments d''une variable bornée'
  verso: 'Si \(X\) est une variable aléatoire bornée, alors ses moments caractérisent sa loi.'
  source: 'Poly Probabilités 5, ch. 3, p. 34 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 2
  tags: [propriete]
- id: proba-a-029-1
  notion: proba-n-0064
  recto: 'Déf 3.25 : fonction caractéristique'
  verso: 'Soit \(X\) une variable aléatoire réelle définie sur un espace de probabilité \((\Omega,P)\). Sa fonction caractéristique \(\varphi_X\) est définie par : \(\forall t\in\mathbb R,\ \varphi_X(t)=E[e^{itX}]=E[\cos(tX)]+iE[\sin(tX)]\in\mathbb C\).'
  source: 'Poly Probabilités 5, ch. 3, p. 34 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [definition]
- id: proba-a-029-2
  notion: proba-n-0064
  recto: 'Déf 3.25 : existence de \(E[e^{itX}]\)'
  verso: 'Soit \(t\in\mathbb R\). Les fonctions \(x\mapsto e^{itx}\) sont à valeurs complexes et bornées ; pour toute variable aléatoire réelle \(X\), \(E\big[|e^{itX}|\big]=E[1]=1\) et donc \(E[e^{itX}]\) est bien définie.'
  source: 'Poly Probabilités 5, ch. 3, p. 34 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [definition]
- id: proba-a-029-3
  notion: proba-n-0064
  recto: 'Prop. : calcul de la fonction caractéristique par la formule de transfert'
  verso: 'Soit \(X\) une variable aléatoire réelle, de fonction caractéristique \(\varphi_X\) (\(\forall t\in\mathbb R,\ \varphi_X(t)=E[e^{itX}]\)). Si \(X\) est discrète et que l''on connaît les probabilités des singletons \(\{X=x\}\) pour tout \(x\) dans le support \(S_X\), ou si elle est à densité \(f_X\), on peut calculer sa fonction caractéristique à l''aide de la formule de transfert : \(\varphi_X(t)=\sum_{x\in S_X}e^{itx}P(X=x)\) dans le cas discret, \(\varphi_X(t)=\int_{\mathbb R}e^{itx}f_X(x)\,dx\) dans le cas à densité.'
  source: 'Poly Probabilités 5, ch. 3, p. 35-36 et 38 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [definition]
- id: proba-a-030-1
  notion: proba-n-0065
  recto: 'Prop. 3.26 (1) et (2) : valeur en \(0\) et majoration'
  verso: 'Soit \(X\) une variable aléatoire réelle de fonction caractéristique \(\varphi_X\). Alors \(\varphi_X(0)=1\) et, pour tout \(t\in\mathbb R\), \(|\varphi_X(t)|\le1\). (Preuve : \(\varphi_X(0)=E[e^0]=1\) et \(|E[e^{itX}]|\le E[|e^{itX}|]=1\).)'
  source: 'Poly Probabilités 5, ch. 3, p. 34 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-030-2
  notion: proba-n-0065
  recto: 'Prop. 3.26 (3) : fonction caractéristique de \(aX+b\)'
  verso: 'Soit \(X\) une variable aléatoire réelle de fonction caractéristique \(\varphi_X\). Pour tous \(a,b,t\in\mathbb R\), \(\varphi_{aX+b}(t)=\varphi_X(at)\,e^{ibt}\). (Preuve : \(E[e^{it(aX+b)}]=E[e^{iatX}e^{itb}]=\varphi_X(at)e^{ibt}\).)'
  source: 'Poly Probabilités 5, ch. 3, p. 34 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-030-3
  notion: proba-n-0065
  recto: 'Prop. 3.26 (4) : continuité uniforme'
  verso: 'Soit \(X\) une variable aléatoire réelle de fonction caractéristique \(\varphi_X\). Alors \(\varphi_X\) est uniformément continue sur \(\mathbb R\).'
  source: 'Poly Probabilités 5, ch. 3, p. 34-35 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-030-4
  notion: proba-n-0065
  recto: 'Prop. 3.26 (5) : comportement à l''infini'
  verso: 'Soit \(X\) une variable aléatoire réelle de fonction caractéristique \(\varphi_X\). Si la loi de \(X\) admet une densité, alors \(\varphi_X\) tend vers \(0\) en \(\pm\infty\).'
  source: 'Poly Probabilités 5, ch. 3, p. 34-35 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-031-1
  notion: proba-n-0066
  recto: 'Prop. : fonction caractéristique de la loi de Bernoulli'
  verso: 'Soit \(X\) suivant une loi de Bernoulli de paramètre \(p\in[0,1]\) ; alors sa fonction caractéristique est égale à : pour tout \(t\in\mathbb R\), \(\varphi_X(t)=e^{it\times0}P(X=0)+e^{it\times1}P(X=1)=1-p+pe^{it}\).'
  source: 'Poly Probabilités 5, ch. 3, p. 35 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 3
  tags: [propriete]
- id: proba-a-031-2
  notion: proba-n-0066
  recto: 'Prop. : fonction caractéristique de la loi binomiale'
  verso: 'Soit \(X\) suivant une loi binomiale de paramètres \(p\in[0,1]\) et \(n\in\mathbb N\) ; alors sa fonction caractéristique est égale à : pour tout \(t\in\mathbb R\), \(\varphi_X(t)=\sum_{k=0}^ne^{itk}P(X=k)=\sum_{k=0}^n\binom nk p^k(1-p)^{n-k}e^{ikt}=(1-p+pe^{it})^n\).'
  source: 'Poly Probabilités 5, ch. 3, p. 35 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 3
  tags: [propriete]
- id: proba-a-032-1
  notion: proba-n-0067
  recto: 'Prop. : fonction caractéristique de la loi uniforme discrète'
  verso: 'Soit \(X\) suivant une loi uniforme sur \(\{1,\dots,n\}\). Pour tout \(t\notin2\pi\mathbb Z\), \(\varphi_X(t)=\sum_{k=1}^ne^{itk}P(X=k)=\dfrac{e^{it}}{n}\times\dfrac{1-e^{itn}}{1-e^{it}}=e^{it\frac{n+1}{2}}\times\dfrac{\sin\left(\frac{nt}{2}\right)}{n\sin\left(\frac t2\right)}\).'
  source: 'Poly Probabilités 5, ch. 3, p. 35 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 3
  tags: [propriete]
- id: proba-a-032-2
  notion: proba-n-0067
  recto: 'Prop. : valeur en \(2k\pi\) pour la loi uniforme discrète'
  verso: 'Soit \(X\) suivant une loi uniforme sur \(\{1,\dots,n\}\). Pour tout \(k\in\mathbb Z\), on a par ailleurs \(\varphi_X(2k\pi)=1\).'
  source: 'Poly Probabilités 5, ch. 3, p. 35 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 3
  tags: [propriete]
- id: proba-a-033-1
  notion: proba-n-0068
  recto: 'Prop. : fonction caractéristique de la loi géométrique'
  verso: 'Soit \(X\) suivant une loi géométrique de paramètre \(p\in]0,1[\) ; alors sa fonction caractéristique est égale à : pour tout \(t\in\mathbb R\), \(\varphi_X(t)=\sum_{k=1}^{+\infty}e^{itk}P(X=k)=\sum_{k=1}^{+\infty}e^{itk}p(1-p)^{k-1}=\dfrac{pe^{it}}{1-(1-p)e^{it}}\).'
  source: 'Poly Probabilités 5, ch. 3, p. 35 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-033-2
  notion: proba-n-0068
  recto: 'Prop. : fonction caractéristique de la loi de Poisson'
  verso: 'Soit \(X\) suivant une loi de Poisson de paramètre \(\lambda\gt0\) ; alors sa fonction caractéristique est égale à : pour tout \(t\in\mathbb R\), \(\varphi_X(t)=\sum_{k=0}^{+\infty}e^{itk}P(X=k)=\sum_{k=0}^{+\infty}e^{itk}\frac{\lambda^k}{k!}e^{-\lambda}=e^{\lambda e^{it}}e^{-\lambda}=e^{\lambda(e^{it}-1)}\).'
  source: 'Poly Probabilités 5, ch. 3, p. 36 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-034-1
  notion: proba-n-0069
  recto: 'Prop. : fonction caractéristique de la loi uniforme sur \([a,b]\)'
  verso: 'Soit \(X\) suivant une loi uniforme sur \([a,b]\), avec \(a\lt b\) ; alors sa fonction caractéristique est égale à : pour tout \(t\in\mathbb R^*\), \(\varphi_X(t)=\dfrac{1}{b-a}\int_a^be^{itx}dx=\dfrac{e^{itb}-e^{ita}}{it(b-a)}=e^{it\frac{a+b}{2}}\,\mathrm{sinc}\left(t\frac{b-a}{2}\right)\) avec \(\mathrm{sinc}(x)=\frac{\sin x}{x}\) la fonction sinus cardinal.'
  source: 'Poly Probabilités 5, ch. 3, p. 36 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-034-2
  notion: proba-n-0069
  recto: 'Prop. : fonction caractéristique de la loi exponentielle'
  verso: 'Soit \(X\) suivant une loi exponentielle de paramètre \(\theta\gt0\) ; alors sa fonction caractéristique est égale à : pour tout \(t\in\mathbb R\), \(\varphi_X(t)=\int_0^{+\infty}e^{itx}\theta e^{-\theta x}dx=\dfrac{\theta}{\theta-it}\).'
  source: 'Poly Probabilités 5, ch. 3, p. 36 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-034-3
  notion: proba-n-0069
  recto: 'Prop. : fonction caractéristique de la loi gamma'
  verso: 'Soit \(X\) suivant une loi gamma de paramètres \(\theta\gt0\) (paramètre de taux) et \(p\gt0\) (paramètre de forme), de densité \(f_{\theta,p}(x)=\frac{\theta^p}{\Gamma(p)}x^{p-1}e^{-\theta x}\mathbf 1_{x\gt0}\). Sa fonction caractéristique est \(\varphi_X(t)=\int_{\mathbb R}e^{itx}f_{\theta,p}(x)dx=\left(\dfrac{\theta}{\theta-it}\right)^p\). Cette formule, établie pour \(p\) entier, reste vraie pour tout \(p\in\mathbb R_+^*\) (admis). Si \(p=1\), on retrouve la loi exponentielle.'
  source: 'Poly Probabilités 5, ch. 3, p. 36 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-034-4
  notion: proba-n-0069
  recto: 'Preuve : fonction caractéristique de la loi gamma, \(p\) entier'
  verso: 'Pour tout \(q\gt0\), \(f_{\theta,q}(x)=\frac{\theta^q}{\Gamma(q)}x^{q-1}e^{-\theta x}\mathbf 1_{x\gt0}\) désigne la densité de la loi gamma de paramètres \(\theta\) et \(q\). Soit \(X\) suivant une loi gamma de paramètres \(\theta\gt0\) et \(p\), entier strictement supérieur à \(1\). Par une intégration par parties, sachant que \(\Gamma(p)=(p-1)!=(p-1)\Gamma(p-1)\), on vérifie que \(\varphi_X(t)=\dfrac{\theta}{\theta-it}\int_0^{+\infty}e^{itx}f_{\theta,p-1}(x)dx\). Par une récurrence immédiate, \(\varphi_X(t)=\left(\frac{\theta}{\theta-it}\right)^{p-1}\int_0^{+\infty}e^{itx}f_{\theta,1}(x)dx=\left(\frac{\theta}{\theta-it}\right)^p\).'
  source: 'Poly Probabilités 5, ch. 3, p. 36 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-035-1
  notion: proba-n-0070
  recto: 'Prop. : fonction caractéristique de la loi gaussienne'
  verso: 'Soit \(X\) suivant une loi gaussienne de moyenne \(\mu\) et de variance \(\sigma^2\) ; alors sa fonction caractéristique est égale à : pour tout \(t\in\mathbb R\), \(\varphi_X(t)=e^{i\mu t-\frac{\sigma^2t^2}{2}}\). (Établie dans le chapitre sur les lois gaussiennes.)'
  source: 'Poly Probabilités 5, ch. 3, p. 37 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-035-2
  notion: proba-n-0070
  recto: 'Prop. : fonction caractéristique de la loi de Cauchy'
  verso: 'Soit \(X\) suivant une loi de Cauchy, de densité \(x\mapsto\dfrac{a}{\pi\left(a^2+(x-x_0)^2\right)}\) avec un facteur d''échelle \(a\gt0\) et une médiane \(x_0\in\mathbb R\) ; alors sa fonction caractéristique est égale à : pour tout \(t\in\mathbb R\), \(\varphi_X(t)=e^{ix_0t-a|t|}\). C''est un résultat admis, qui peut se démontrer avec l''analyse complexe ou l''analyse de Fourier.'
  source: 'Poly Probabilités 5, ch. 3, p. 37 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [propriete]
- id: proba-a-036-1
  notion: proba-n-0071
  recto: 'Thm 3.27 : caractérisation des fonctions caractéristiques'
  verso: 'Soit \(\varphi\) une fonction définie sur \(\mathbb R\) et à valeurs dans \(\mathbb C\). Il existe une variable aléatoire réelle dont elle est la fonction caractéristique si et seulement si :<br>1. \(\varphi(0)=1\) ;<br>2. \(\varphi\) est continue en \(0\) ;<br>3. \(\varphi\) est symétrique au sens où \(\varphi(-t)=\overline{\varphi(t)}\) pour tout \(t\in\mathbb R\) ;<br>4. \(\varphi\) est « positive » au sens où : pour tout \(k\ge1\), tous \(t_1,\dots,t_k\in\mathbb R\), la matrice hermitienne \((\varphi(t_p-t_q))_{1\le p,q\le k}\) est positive.<br>(Seule la condition nécessaire est démontrée.)'
  source: 'Poly Probabilités 5, ch. 3, p. 37 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 3
  tags: [theoreme]
- id: proba-a-037-1
  notion: proba-n-0072
  recto: 'Thm 3.28 : la fonction caractéristique caractérise la loi'
  verso: 'Soient \(X\) et \(Y\) deux variables aléatoires. Elles ont même loi si et seulement si leurs fonctions caractéristiques sont égales. (La condition nécessaire est une simple conséquence de la formule de transfert ; la condition suffisante est admise.)'
  source: 'Poly Probabilités 5, ch. 3, p. 38 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 1
  tags: [theoreme]
- id: proba-a-038-1
  notion: proba-n-0073
  recto: 'Prop. 3.29 : formule d''inversion pour une variable à valeurs dans \(\mathbb Z\)'
  verso: 'Soit \(X\) une variable aléatoire à valeurs dans \(\mathbb Z\), de fonction caractéristique \(\varphi_X\). Alors \(\forall k\in\mathbb Z,\ P(X=k)=\dfrac1{2\pi}\int_0^{2\pi}\varphi_X(t)e^{-itk}\,dt\). Dans ce cas particulier, cela montre que la fonction caractéristique caractérise bien la loi de \(X\).'
  source: 'Poly Probabilités 5, ch. 3, p. 38 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 3
  tags: [theoreme]
- id: proba-a-038-2
  notion: proba-n-0073
  recto: 'Preuve : Prop. 3.29, formule d''inversion'
  verso: 'Soit \(X\) une variable aléatoire à valeurs dans \(\mathbb Z\), de fonction caractéristique \(\varphi_X\), et \(k\in\mathbb Z\). Notons \(p_n=P(X=n)\) pour tout \(n\in\mathbb Z\). Alors \(\varphi_X\) est continue bornée sur \([0,2\pi]\) et \(\int_0^{2\pi}\varphi_X(t)e^{-ikt}dt=\int_0^{2\pi}\Big(\sum_{n\in\mathbb Z}e^{itn}p_n\Big)e^{-ikt}dt\). Comme \(\int_0^{2\pi}\sum_{n\in\mathbb Z}|e^{it(n-k)}p_n|dt=\int_0^{2\pi}dt\lt+\infty\), on peut intervertir somme et intégrale : on obtient \(\sum_{n\in\mathbb Z}\int_0^{2\pi}e^{it(n-k)}p_ndt\). Si \(n\neq k\), cette intégrale vaut \(0\) ; si \(n=k\), elle vaut \(2\pi p_k\). D''où \(\int_0^{2\pi}\varphi_X(t)e^{-ikt}dt=2\pi p_k\).'
  source: 'Poly Probabilités 5, ch. 3, p. 38 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 3
  tags: [theoreme]
- id: proba-a-039-1
  notion: proba-n-0074
  recto: 'Thm 3.31 : formule d''inversion pour une densité'
  verso: 'Soit \(X\) une variable aléatoire réelle admettant une densité \(f_X\) et de fonction caractéristique \(\varphi_X\). Si \(\varphi_X\) est intégrable, i.e. si \(\int_{-\infty}^{+\infty}|\varphi_X(t)|dt\lt+\infty\), alors en tout point \(x_0\) où \(f_X\) est continue : \(f_X(x_0)=\dfrac1{2\pi}\int_{-\infty}^{+\infty}\varphi_X(t)e^{-itx_0}\,dt\). La preuve est admise.'
  source: 'Poly Probabilités 5, ch. 3, p. 39 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 3
  tags: [theoreme]
- id: proba-a-040-1
  notion: proba-n-0075
  recto: 'Prop. 3.32 : régularité de la fonction caractéristique'
  verso: 'Soit \(X\) une variable aléatoire réelle, de fonction caractéristique \(\varphi_X\) et possédant un moment d''ordre \(n\in\mathbb N^*\). Alors \(\varphi_X\) est continûment dérivable jusqu''à l''ordre \(n\) et pour tout \(p=1,\dots,n\) et \(t\in\mathbb R\) : \(\varphi_X^{(p)}(t)=i^pE\left[X^pe^{itX}\right]\).'
  source: 'Poly Probabilités 5, ch. 3, p. 39 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 3
  tags: [theoreme]
- id: proba-a-040-2
  notion: proba-n-0075
  recto: 'Prop. 3.32 : dérivées en \(0\) et moments'
  verso: 'Soit \(X\) une variable aléatoire réelle, de fonction caractéristique \(\varphi_X\) et possédant un moment d''ordre \(n\in\mathbb N^*\). En particulier, pour \(p=1,\dots,n\), \(\varphi_X^{(p)}(0)=i^pE[X^p]\).'
  source: 'Poly Probabilités 5, ch. 3, p. 39 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 3
  tags: [theoreme]
- id: proba-a-040-3
  notion: proba-n-0075
  recto: 'Prop. 3.32 : développement limité de la fonction caractéristique'
  verso: 'Soit \(X\) une variable aléatoire réelle, de fonction caractéristique \(\varphi_X\) et possédant un moment d''ordre \(n\in\mathbb N^*\). Alors \(\varphi_X(t)=1+itE[X]+\cdots+\dfrac{(it)^n}{n!}E[X^n]+o(t^n)\).'
  source: 'Poly Probabilités 5, ch. 3, p. 39 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 3
  tags: [theoreme]
- id: proba-a-040-4
  notion: proba-n-0075
  recto: 'Prop. 3.32 : la réciproque est fausse'
  verso: 'Attention : la réciproque de la Prop. 3.32 est fausse. Il existe des variables aléatoires dont la fonction caractéristique est continûment dérivable et qui n''ont pas de moment d''ordre \(1\). Exemple : si \(X\) suit la loi de densité \(f_X(x)=c\,\mathbf 1_{|x|\gt2}\dfrac{1}{x^2\ln|x|}\) (où \(c\gt0\) est une constante de normalisation), alors \(X\) ne possède aucun moment et sa fonction caractéristique est continûment dérivable.'
  source: 'Poly Probabilités 5, ch. 3, p. 40 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 3
  tags: [theoreme]
- id: proba-a-041-1
  notion: proba-n-0076
  recto: 'Prop. : développement en série entière de la fonction caractéristique'
  verso: 'Soit \(X\) une variable aléatoire réelle ayant des moments de tous ordres, \(\varphi_X\) sa fonction caractéristique. Pour tout \(t\in\mathbb R\), \(\varphi_X(t)=E[e^{itX}]=E\Big[\sum_{n\ge0}\frac{(it)^n}{n!}X^n\Big]\). À supposer que l''on puisse intervertir somme et espérance, au moins pour certaines valeurs de \(t\) dans un voisinage de \(0\), par exemple si \(\sum_{n\ge0}\frac{|t|^n}{n!}E[|X|^n]\) est fini, alors \(\varphi_X(t)=\sum_{n\ge0}\frac{(it)^n}{n!}E[X^n]\).'
  source: 'Poly Probabilités 5, ch. 3, p. 39 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 3
  tags: [propriete]
- id: proba-a-041-2
  notion: proba-n-0076
  recto: 'Prop. : moments et fonction caractéristique au voisinage de \(0\)'
  verso: 'Soit \(X\) une variable aléatoire réelle ayant des moments de tous ordres telle que \(\sum_{n\ge0}\frac{|t|^n}{n!}E[|X|^n]\) soit fini au voisinage de \(0\). Dans ce cas, les moments permettent de calculer la fonction caractéristique dans un voisinage de \(0\) et, réciproquement, l''unicité du développement en série entière de \(\varphi_X\) permet d''en déduire les moments.'
  source: 'Poly Probabilités 5, ch. 3, p. 39 (PDF)'
  chapitre: 'Chapitre 3 - Caractériser une loi'
  priorite: 3
  tags: [propriete]
- id: proba-a-042-1
  notion: proba-n-0077
  recto: 'Déf 4.1 : vecteur aléatoire à densité'
  verso: 'Soit \(X\) une variable aléatoire définie sur un espace de probabilité \((\Omega,P)\) et à valeurs dans \(\mathbb R^n\) (si \(n\gt1\), on parle de vecteur aléatoire). On note \(P_X\) sa loi : pour tout événement \(B\) de \(\mathbb R^n\), \(P_X(B)=P(X\in B)\). On dit que \(X\) est un vecteur aléatoire à densité s''il existe une fonction \(f\) définie sur \(\mathbb R^n\), positive, suffisamment régulière pour être localement intégrable, telle que pour tout événement \(B\) de \(\mathbb R^n\) : \(P_X(B)=\int_{\mathbb R^n}\mathbf 1_B(x_1,\dots,x_n)f(x_1,\dots,x_n)\,dx_1\cdots dx_n\).'
  source: 'Poly Probabilités 5, ch. 4, p. 41 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [definition]
- id: proba-a-042-2
  notion: proba-n-0077
  recto: 'Prop. 4.2 : densité de probabilité sur \(\mathbb R^n\)'
  verso: 'Une fonction \(f\) définie sur \(\mathbb R^n\) est une densité de probabilité si :<br>- \(f\) est suffisamment régulière pour être localement intégrable ;<br>- \(f\) est positive ;<br>- \(\int_{\mathbb R^n}f(x_1,\dots,x_n)\,dx_1\cdots dx_n=1\).'
  source: 'Poly Probabilités 5, ch. 4, p. 41 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [definition]
- id: proba-a-042-3
  notion: proba-n-0077
  recto: 'Prop. : unicité de la densité sur \(\mathbb R^n\) (Remarque 4.3)'
  verso: 'Comme pour les densités sur \(\mathbb R\), il n''y a pas unicité de la densité associée à une loi de probabilité sur \(\mathbb R^n\). Il suffit (et il faut) que deux densités soient égales presque partout pour qu''elles soient associées à la même loi. Comme dans le cas réel (Prop. 3.5), il suffit de montrer que deux densités prennent des valeurs distinctes en un point de \(\mathbb R^n\) où elles sont toutes les deux continues pour prouver qu''elles sont associées à des lois distinctes.'
  source: 'Poly Probabilités 5, ch. 4, p. 41 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [definition]
- id: proba-a-043-1
  notion: proba-n-0079
  recto: 'Exemple : bornes d''intégration pour Fubini-Tonelli'
  verso: 'Pour calculer \(\int\!\big(\int(x+y)\,dx\big)dy\) sur un domaine défini par des inégalités, en intégrant d''abord en \(x\) puis en \(y\), le calcul des bornes se fait dans l''ordre inverse : on détermine d''abord les bornes de \(y\), puis, à \(y\) fixé, on détermine les bornes de \(x\). Il faut déterminer avec soin les bornes, en utilisant des équivalences et en vérifiant que chaque inégalité dans le système initial est bien présente, éventuellement transformée, dans le système final. Il est utile de contrôler le résultat, et même de le prévoir, avec un dessin.'
  source: 'Poly Probabilités 5, ch. 4, p. 42 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [methode]
- id: proba-a-043-2
  notion: proba-n-0079
  recto: 'Exemple : bornes du domaine \(D\) (triangle)'
  verso: 'Soit \(D=\{(x,y)\in\mathbb R^2\mid x\ge0,\ y\ge0,\ x+y\le1\}\). En intégrant d''abord en \(x\) puis en \(y\) : \(\left\{\begin{array}{l}0\le x\\0\le y\\x+y\le1\end{array}\right.\iff0\le y\le x+y\le1\iff\left\{\begin{array}{l}0\le y\le1\\0\le x\le1-y\end{array}\right.\)'
  source: 'Poly Probabilités 5, ch. 4, p. 42 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [methode]
- id: proba-a-043-3
  notion: proba-n-0079
  recto: 'Exemple : \(f(x,y)=3(x+y)\mathbf 1_{(x,y)\in D}\) est une densité'
  verso: 'Soit la fonction définie par \(f(x,y)=3(x+y)\mathbf 1_{(x,y)\in D}\) avec \(D=\{(x,y)\in\mathbb R^2\mid x\ge0,y\ge0,x+y\le1\}\). C''est une fonction positive, suffisamment régulière. Son intégrale, par Fubini-Tonelli : \(\int_{\mathbb R^2}f=3\int_0^1\left(\int_0^{1-y}(x+y)dx\right)dy=3\int_0^1\frac12(1-y^2)dy=1\).'
  source: 'Poly Probabilités 5, ch. 4, p. 42-43 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [methode]
- id: proba-a-044-1
  notion: proba-n-0080
  recto: 'Déf 4.5 : formule de transfert (vecteur à densité)'
  verso: 'Soit \(X=(X_1,\dots,X_n)\) un vecteur aléatoire défini sur un espace de probabilité \((\Omega,P)\) et dont la loi admet la densité \(f\). Soit \(\varphi\) une fonction réelle définie sur \(\mathbb R^n\), et \(Y=\varphi(X)\). Supposons d''abord \(\varphi\ge0\). Alors \(Y\) admet une espérance finie ou infinie et \(E[Y]=E[\varphi(X)]=\int_{\mathbb R^n}\varphi(x_1,\dots,x_n)f(x_1,\dots,x_n)\,dx_1\cdots dx_n\), à valeurs dans \(\mathbb R_+\cup\{+\infty\}\). Si \(\varphi\) n''est pas de signe constant, mais si \(E[|Y|]\lt+\infty\), alors \(Y\) admet une espérance finie et on définit \(E[Y]\) avec la même formule ; cette fois, l''intégrale converge et est à valeurs dans \(\mathbb R\).'
  source: 'Poly Probabilités 5, ch. 4, p. 43 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [theoreme]
- id: proba-a-044-2
  notion: proba-n-0080
  recto: 'Rem. 4.6 : formule de transfert pour une indicatrice'
  verso: 'Soit \(X\) un vecteur aléatoire à valeurs dans \(\mathbb R^n\) de loi de densité \(f\), et \(\varphi\) une fonction réelle définie sur \(\mathbb R^n\). Si \(\varphi=\mathbf 1_B\), avec \(B\) un événement de \(\mathbb R^n\), alors \(E[\varphi(X)]=\int_Bf(x_1,\dots,x_n)\,dx_1\cdots dx_n=P(X\in B)\).'
  source: 'Poly Probabilités 5, ch. 4, p. 43 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [theoreme]
- id: proba-a-044-3
  notion: proba-n-0080
  recto: 'Exemple : calcul de \(E[XY]\) par la formule de transfert'
  verso: 'Soit \((X,Y)\) un couple de variables aléatoires dont la loi admet la densité \(f(x,y)=3(x+y)\mathbf 1_{0\le x,0\le y,x+y\le1}\). \(E[XY]\) est bien définie car \(XY\) est une variable positive presque sûrement. D''après la formule de transfert, et en utilisant le théorème de Fubini : \(E[XY]=\int_{\mathbb R^2}xyf(x,y)\,dx\,dy=3\int_0^1\left(\int_0^{1-y}xy(x+y)\,dx\right)dy=3\int_0^1y\left[\frac{x^3}{3}+\frac{x^2}{2}y\right]_0^{1-y}dy=3\int_0^1\left(\frac y3-\frac{y^2}{2}+\frac{y^4}{6}\right)dy=\frac1{10}\).'
  source: 'Poly Probabilités 5, ch. 4, p. 43 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [theoreme]
- id: proba-a-045-1
  notion: proba-n-0081
  recto: 'Prop. 4.7 : méthode de la fonction muette (vecteurs)'
  verso: 'Soit \(X\) un vecteur aléatoire à valeurs dans \(\mathbb R^n\). S''il existe une fonction \(g\) positive et suffisamment régulière définie sur \(\mathbb R^n\) telle que pour toute fonction réelle \(\varphi\) continue et bornée sur \(\mathbb R^n\) on ait \(E[\varphi(X)]=\int_{\mathbb R^n}\varphi(x_1,\dots,x_n)g(x_1,\dots,x_n)\,dx_1\cdots dx_n\), alors la loi de \(X\) admet \(g\) comme densité.'
  source: 'Poly Probabilités 5, ch. 4, p. 44 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [methode]
- id: proba-a-046-1
  notion: proba-n-0082
  recto: 'Prop. : changement de variables dans une intégrale multiple'
  verso: 'Soit \(I=\int_D\varphi(\psi(x_1,\dots,x_n))f(x_1,\dots,x_n)\,dx_1\cdots dx_n\) avec \(\varphi\) et \(f\) fonctions réelles définies sur \(\mathbb R^n\). On souhaite faire le changement de variables \((u_1,\dots,u_n)=\psi(x_1,\dots,x_n)\). On suppose que \(D\) est un ouvert et que \(\psi\) est un \(C^1\)-difféomorphisme de \(D\) sur \(\psi(D)\), c''est-à-dire que \(\psi\) est injective sur \(D\) et que \(\psi\) et sa réciproque \(\psi^{-1}\) de \(\psi(D)\) sur \(D\) sont \(C^1\) ; ou de façon équivalente, \(\psi\) est injective sur \(D\), \(\psi\) est \(C^1\) et son jacobien \(\mathcal J_\psi\) ne s''annule pas sur \(D\).<br>Alors \(I=\int_{\psi(D)}\varphi(u)\,f(\psi^{-1}(u))\,|\mathcal J_{\psi^{-1}}(u)|\,du=\int_{\psi(D)}\varphi(u)\,f(\psi^{-1}(u))\dfrac{1}{|\mathcal J_\psi\circ\psi^{-1}(u)|}\,du\), où \(\mathcal J_\psi\circ\psi^{-1}(u)=\mathcal J_\psi(\psi^{-1}(u))\).'
  source: 'Poly Probabilités 5, ch. 4, p. 44 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [methode]
- id: proba-a-046-2
  notion: proba-n-0082
  recto: 'Exemple : domaine \(D\) non ouvert'
  verso: 'Remarquons pour conclure que \(D=\{x\ge0,y\ge0,x+y\le1\}\) n''est pas un domaine ouvert, comme demandé dans le rappel qui précède l''exemple. Mais c''est sans importance, car on a pu le remplacer par son intérieur \(\mathring D\) sans modifier la valeur de l''intégrale.<br>(hors poly : c''est le cas dès que la frontière de \(D\) est de mesure de Lebesgue nulle)'
  source: 'Poly Probabilités 5, ch. 4, p. 45 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [methode]
- id: proba-a-047-1
  notion: proba-n-0083
  recto: 'Exemple : loi de \((U,V)=(X+Y,X-Y)\)'
  verso: 'Soit \((X,Y)\) un vecteur aléatoire de densité \(f(x,y)=3(x+y)\mathbf 1_{(x,y)\in D}\), avec \(D=\{(x,y)\in\mathbb R^2\mid x\ge0,y\ge0,x+y\le1\}\). Par la méthode de la fonction muette, la loi du vecteur aléatoire \((U,V)=(X+Y,X-Y)\) admet la densité \(\dfrac{3u}{2}\mathbf 1_{(u,v)\in D^{\prime}}\), avec \(D^{\prime}=\{(u,v)\in\mathbb R^2:|v|\le u\le1\}\).'
  source: 'Poly Probabilités 5, ch. 4, p. 44-45 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [exemple]
- id: proba-a-047-2
  notion: proba-n-0083
  recto: 'Exemple : étapes du changement \((u,v)=(x+y,x-y)\)'
  verso: 'Soit \((X,Y)\) de densité \(3(x+y)\mathbf 1_{(x,y)\in D}\), avec \(D=\{(x,y)\in\mathbb R^2\mid x\ge0,y\ge0,x+y\le1\}\), et \((U,V)=(X+Y,X-Y)\). Pour \(E[\varphi(U,V)]=\int_D\varphi(x+y,x-y)\times3(x+y)\,dx\,dy\), avec \(\varphi\) continue bornée sur \(\mathbb R^2\), on pose \((u,v)=\psi(x,y)=(x+y,x-y)\).<br>Première étape, inverser : \(\left\{\begin{array}{l}u=x+y\\v=x-y\end{array}\right.\iff\left\{\begin{array}{l}x=\frac{u+v}{2}\\y=\frac{u-v}{2}\end{array}\right.\) ; on remplace \(\varphi(x+y,x-y)\times3(x+y)\) par \(\varphi(u,v)\times3u\).<br>Deuxième étape, exprimer \(dx\,dy\) : \(dx\,dy=|J_{\psi^{-1}}(u,v)|\,du\,dv=\left|\det\begin{pmatrix}\frac12&amp;\frac12\\\frac12&amp;-\frac12\end{pmatrix}\right|du\,dv=\frac12du\,dv\).<br>Troisième étape, nouveau domaine : \((x,y)\in D\iff0\le\frac{u+v}{2},\ 0\le\frac{u-v}{2},\ u\le1\iff-v\le u,\ v\le u,\ u\le1\), donc \(D^{\prime}=\{|v|\le u\le1\}\).'
  source: 'Poly Probabilités 5, ch. 4, p. 44-45 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [exemple]
- id: proba-a-047-3
  notion: proba-n-0083
  recto: 'Exemple : précautions pour le nouveau domaine \(\psi(D)\)'
  verso: 'Soit \(\psi\) un changement de variables défini sur un domaine \(D\subset\mathbb R^n\) et \(D^{\prime}=\psi(D)\). Reste à calculer \(D^{\prime}=\psi(D)\), sans doute le point le plus délicat dans ce genre d''exercices. Il faut prendre garde à procéder par équivalence et non par implication (erreur tellement fréquente !). En particulier, lorsque le domaine \(D\) est défini par des inégalités, il importe de vérifier qu''elles trouvent toutes leur traduction dans le nouveau domaine \(\psi(D)\).'
  source: 'Poly Probabilités 5, ch. 4, p. 45 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [exemple]
- id: proba-a-048-1
  notion: proba-n-0084
  recto: 'Prop. 4.8 : densité d''une composante'
  verso: 'Soit \(X=(X_1,\dots,X_n)\) un vecteur aléatoire dont la loi admet la densité \(f\). Pour tout \(p\in\{1,\dots,n\}\), la loi de la variable aléatoire \(X_p\) admet la densité \(f_{X_p}(x_p)=\int_{\mathbb R^{n-1}}f(x_1,\dots,x_n)\,dx_1\cdots dx_{p-1}dx_{p+1}\cdots dx_n\).'
  source: 'Poly Probabilités 5, ch. 4, p. 46 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [propriete]
- id: proba-a-048-2
  notion: proba-n-0084
  recto: 'Prop. 4.8 : densité d''un sous-vecteur'
  verso: 'Soit \(X=(X_1,\dots,X_n)\) un vecteur aléatoire dont la loi admet la densité \(f\). Pour tout \(p\in\{1,\dots,n\}\), la loi du vecteur aléatoire \((X_1,\dots,X_p)\) admet la densité \(f_{(X_1,\dots,X_p)}(x_1,\dots,x_p)=\int_{\mathbb R^{n-p}}f(x_1,\dots,x_n)\,dx_{p+1}\cdots dx_n\).'
  source: 'Poly Probabilités 5, ch. 4, p. 46 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [propriete]
- id: proba-a-048-3
  notion: proba-n-0084
  recto: 'Prop. 4.8 : la réciproque est fausse (marginales à densité)'
  verso: 'Attention : si la loi jointe admet une densité, les lois marginales aussi. Mais l''inverse n''est pas vrai. Considérons par exemple \(X\) de loi uniforme sur \([0,1]\). Alors la loi jointe du vecteur \((X,X)\) n''admet pas de densité, à l''opposé de ses marginales strictes.'
  source: 'Poly Probabilités 5, ch. 4, p. 46-47 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [propriete]
- id: proba-a-048-4
  notion: proba-n-0084
  recto: 'Exemple : densité marginale de \(X\)'
  verso: 'Soit \((X,Y)\) un vecteur aléatoire dont la loi admet la densité \(f(x,y)=3(x+y)\mathbf 1_{0\le x,0\le y,x+y\le1}\). Par la méthode de la fonction muette, pour \(\varphi\) continue bornée sur \(\mathbb R\), \(E[\varphi(X)]=\int_{\mathbb R^2}\varphi(x)f(x,y)\,dx\,dy=\int_{\mathbb R}\varphi(x)\Big(\int_{\mathbb R}f(x,y)\,dy\Big)dx\) (Fubini) \(=\int_0^1\varphi(x)\Big(\int_0^{1-x}3(x+y)\,dy\Big)dx=\int_0^1\varphi(x)\frac32(1-x^2)\,dx\). La loi de \(X\) admet donc la densité \(f_X(x)=\int_{\mathbb R}f(x,y)\,dy=\frac32(1-x^2)\mathbf 1_{0\le x\le1}\).'
  source: 'Poly Probabilités 5, ch. 4, p. 46 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [propriete]
- id: proba-a-049-1
  notion: proba-n-0087
  recto: 'Prop. 4.12 : densité produit'
  verso: 'Soient \(f_1,\dots,f_n\) des densités de lois réelles. Soit \(f\) la fonction définie par \(f(x_1,\dots,x_n)=f_1(x_1)\cdots f_n(x_n)\) pour tout \((x_1,\dots,x_n)\in\mathbb R^n\). Alors \(f\) est une densité de probabilité sur \(\mathbb R^n\) dont \(f_1,\dots,f_n\) sont les densités des lois marginales unidimensionnelles associées. Elle est appelée densité produit ou densité de la loi produit et on la note \(f=f_1\otimes\cdots\otimes f_n\).'
  source: 'Poly Probabilités 5, ch. 4, p. 48 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [definition]
- id: proba-a-049-2
  notion: proba-n-0087
  recto: 'Preuve : Prop. 4.12, densité produit'
  verso: 'Soient \(f_1,\dots,f_n\) des densités de lois réelles et \(f(x_1,\dots,x_n)=f_1(x_1)\cdots f_n(x_n)\) pour tout \((x_1,\dots,x_n)\in\mathbb R^n\). Il est clair que \(f\) est positive. Le théorème de Fubini-Tonelli donne \(\int_{\mathbb R^n}f(x_1,\dots,x_n)\,dx_1\cdots dx_n=\prod_{i=1}^n\int_{\mathbb R}f_i(x_i)\,dx_i=1\) : \(f\) est une densité de probabilité. Pour les marginales, si \((X_1,\dots,X_n)\) est de densité \(f\), \(f_{X_1}(x_1)=\int_{\mathbb R^{n-1}}f\,dx_2\cdots dx_n=f_1(x_1)\prod_{i=2}^n\int_{\mathbb R}f_i(x_i)\,dx_i=f_1(x_1)\). De même, \(f_{X_i}=f_i\) pour tout \(i\).'
  source: 'Poly Probabilités 5, ch. 4, p. 48 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [definition]
- id: proba-a-050-1
  notion: proba-n-0088
  recto: 'Thm 4.14 (1) \(\Leftrightarrow\) (2) : indépendance et densité produit'
  verso: 'Soit \(X=(X_1,\dots,X_n)\) un vecteur aléatoire de densité \(f\). Soient \(f_{X_1},\dots,f_{X_n}\) les densités des lois marginales. Alors \(X_1,\dots,X_n\) sont indépendants si et seulement si \(f=f_{X_1}\otimes\cdots\otimes f_{X_n}\) presque partout.'
  source: 'Poly Probabilités 5, ch. 4, p. 48 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [theoreme]
- id: proba-a-050-2
  notion: proba-n-0088
  recto: 'Thm 4.14 (1) \(\Leftrightarrow\) (3) : indépendance et densité à variables séparées'
  verso: 'Soit \(X=(X_1,\dots,X_n)\) un vecteur aléatoire de densité \(f\). Alors \(X_1,\dots,X_n\) sont indépendants si et seulement s''il existe \(g_1,\dots,g_n\) fonctions positives telles que \(f=g_1\otimes\cdots\otimes g_n\) presque partout.'
  source: 'Poly Probabilités 5, ch. 4, p. 48-49 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [theoreme]
- id: proba-a-050-3
  notion: proba-n-0088
  recto: 'Thm 4.14 (1) \(\Leftrightarrow\) (4) : indépendance et espérance d''un produit'
  verso: 'Soit \(X=(X_1,\dots,X_n)\) un vecteur aléatoire de densité \(f\). Alors \(X_1,\dots,X_n\) sont indépendants si et seulement si, quelles que soient les fonctions réelles \(\varphi_1,\dots,\varphi_n\), toutes positives ou telles que \(\varphi_1(X_1),\dots,\varphi_n(X_n)\) admettent toutes une espérance finie : \(E[\varphi_1(X_1)\cdots\varphi_n(X_n)]=E[\varphi_1(X_1)]\cdots E[\varphi_n(X_n)]\).'
  source: 'Poly Probabilités 5, ch. 4, p. 48 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [theoreme]
- id: proba-a-050-4
  notion: proba-n-0088
  recto: 'Prop. (Remarque 4.15) : produit de variables indépendantes'
  verso: 'Il ressort du Thm 4.14 que si \(X_1,\dots,X_n\) sont des variables aléatoires réelles indépendantes d''espérance finie, alors \(X_1\cdots X_n\) est aussi d''espérance finie. Il est important de noter que c''est bien sûr faux si \(X_1,\dots,X_n\) ne sont pas indépendants. Pour \(n\ge2\), il suffit de choisir une variable intégrable \(X\) telle que \(E[|X|^n]=+\infty\), puis de poser \(X_1=\cdots=X_n=X\).'
  source: 'Poly Probabilités 5, ch. 4, p. 48 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [theoreme]
- id: proba-a-050-5
  notion: proba-n-0088
  recto: 'Prop. (Remarque 4.16) : indépendance de deux sous-vecteurs'
  verso: 'Soit \(X=(X_1,\dots,X_n)\) un vecteur aléatoire et \(p\in\{1,\dots,n-1\}\). Le Thm 4.14 se généralise sans difficulté si l''on considère des marginales de dimension supérieure à \(1\). En particulier, supposons que \((X_1,\dots,X_p)\) ait \(f_1\) pour densité, et \((X_{p+1},\dots,X_n)\) ait \(f_2\) pour densité. Alors les vecteurs aléatoires \((X_1,\dots,X_p)\) et \((X_{p+1},\dots,X_n)\) sont indépendants si et seulement si la loi du vecteur aléatoire \((X_1,\dots,X_n)\) admet \(f_1\otimes f_2\) pour densité.'
  source: 'Poly Probabilités 5, ch. 4, p. 50 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [theoreme]
- id: proba-a-050-6
  notion: proba-n-0088
  recto: 'Prop. (Remarque 4.16) : équivalence (1) \(\Leftrightarrow\) (4) sans densité'
  verso: 'Soit \(X=(X_1,\dots,X_n)\) un vecteur aléatoire. L''équivalence entre la première et la quatrième assertion du Thm 4.14 (indépendance de \(X_1,\dots,X_n\) et \(E[\varphi_1(X_1)\cdots\varphi_n(X_n)]=\prod_iE[\varphi_i(X_i)]\)) est valable pour tout vecteur aléatoire, qu''il soit à densité ou non.'
  source: 'Poly Probabilités 5, ch. 4, p. 50 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [theoreme]
- id: proba-a-051-1
  notion: proba-n-0093
  recto: 'Déf 4.24 : fonction de répartition d''un vecteur'
  verso: 'Soit \(X=(X_1,\dots,X_n)\) un vecteur aléatoire à valeurs dans \(\mathbb R^n\). On appelle fonction de répartition de \(X\) la fonction \(F_X\) définie par : \(\forall t=(t_1,\dots,t_n)\in\mathbb R^n,\ F_X(t)=P(X_1\le t_1,\dots,X_n\le t_n)\).'
  source: 'Poly Probabilités 5, ch. 4, p. 52 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 3
  tags: [definition]
- id: proba-a-051-2
  notion: proba-n-0093
  recto: 'Thm 4.25 : la fonction de répartition caractérise la loi (vecteurs)'
  verso: 'Soient \(X\) et \(Y\) deux vecteurs aléatoires à valeurs dans \(\mathbb R^n\), de fonctions de répartition \(F_X\) et \(F_Y\). Alors \(X\) et \(Y\) ont même loi \(\iff F_X=F_Y\).'
  source: 'Poly Probabilités 5, ch. 4, p. 52 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 3
  tags: [definition]
- id: proba-a-051-3
  notion: proba-n-0093
  recto: 'Prop. 4.26 : densité à partir de la fonction de répartition'
  verso: 'Soit \(X\) un vecteur aléatoire à valeurs dans \(\mathbb R^n\) ayant une densité \(f_X\) et une fonction de répartition \(F_X\). Si \(f_X\) est continue et suffisamment régulière pour que les dérivations successives soient permises, alors \(\dfrac{\partial}{\partial x_1}\cdots\dfrac{\partial}{\partial x_n}F_X(x)=f_X(x)\).'
  source: 'Poly Probabilités 5, ch. 4, p. 52 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 3
  tags: [definition]
- id: proba-a-052-1
  notion: proba-n-0094
  recto: 'Déf 4.28 : fonction caractéristique d''un vecteur aléatoire'
  verso: 'Soit \(X=(X_1,\dots,X_n)\) un vecteur aléatoire à valeurs dans \(\mathbb R^n\). Pour tout \(t=(t_1,\dots,t_n)\in\mathbb R^n\), la fonction caractéristique \(\varphi_X\) de \(X\) est définie par : \(\forall t\in\mathbb R^n,\ \varphi_X(t)=E\left[e^{i\langle t,X\rangle}\right]\), où \(\langle t,X\rangle=\sum_{k=1}^nt_kX_k\) désigne le produit scalaire usuel.'
  source: 'Poly Probabilités 5, ch. 4, p. 53 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [definition]
- id: proba-a-052-2
  notion: proba-n-0094
  recto: 'Prop. : propriétés de la fonction caractéristique d''un vecteur'
  verso: 'Soit \(X\) un vecteur aléatoire à valeurs dans \(\mathbb R^n\). Les propriétés vues dans le cas des variables aléatoires réelles s''étendent ici aussi facilement :<br>1. La fonction caractéristique est définie et uniformément continue sur \(\mathbb R^n\).<br>2. Elle est bornée par \(1\) qu''elle atteint en \(0\).'
  source: 'Poly Probabilités 5, ch. 4, p. 53 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [definition]
- id: proba-a-052-3
  notion: proba-n-0094
  recto: 'Thm 4.29 : la fonction caractéristique caractérise la loi (vecteurs)'
  verso: 'Deux vecteurs aléatoires ont même loi si et seulement s''ils ont même fonction caractéristique. (Si deux vecteurs ont même loi, la formule de transfert implique qu''ils aient même fonction caractéristique ; la réciproque est admise.)'
  source: 'Poly Probabilités 5, ch. 4, p. 53 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [definition]
- id: proba-a-053-1
  notion: proba-n-0095
  recto: 'Cor. 4.30 : indépendance et fonction caractéristique'
  verso: 'Soit \(X=(X_1,\dots,X_n)\) un vecteur aléatoire à valeurs dans \(\mathbb R^n\), de fonction caractéristique \(\varphi_X\) ; \(\varphi_{X_k}\) désigne la fonction caractéristique de \(X_k\). Les variables \(X_1,\dots,X_n\) sont indépendantes si et seulement si \(\forall(t_1,\dots,t_n)\in\mathbb R^n,\ \varphi_X(t_1,\dots,t_n)=\varphi_{X_1}(t_1)\cdots\varphi_{X_n}(t_n)\), autrement dit si et seulement si \(\varphi_X=\varphi_{X_1}\otimes\cdots\otimes\varphi_{X_n}\). Ce corollaire reste vrai si \(X_1,\dots,X_n\) sont eux-mêmes des vecteurs aléatoires.'
  source: 'Poly Probabilités 5, ch. 4, p. 53 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [theoreme]
- id: proba-a-053-2
  notion: proba-n-0095
  recto: 'Cor. 4.32 : fonction caractéristique d''une somme'
  verso: 'Soient \(X\) et \(Y\) deux vecteurs aléatoires indépendants et à valeurs dans \(\mathbb R^n\), de fonctions caractéristiques \(\varphi_X,\varphi_Y\) (\(\varphi_{X+Y}\) : celle de \(X+Y\)). Alors \(\forall t\in\mathbb R^n,\ \varphi_{X+Y}(t)=\varphi_X(t)\varphi_Y(t)\).<br>Preuve : \(\varphi_{X+Y}(t)=E\left[e^{i\langle t,X+Y\rangle}\right]=E\left[e^{i(\langle t,X\rangle+\langle t,Y\rangle)}\right]=\varphi_{(X,Y)}(t,t)=\varphi_X(t)\varphi_Y(t)\).'
  source: 'Poly Probabilités 5, ch. 4, p. 53 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [theoreme]
- id: proba-a-053-3
  notion: proba-n-0095
  recto: 'Exemple : \(\varphi_{X+Y}=\varphi_X\varphi_Y\) sans indépendance'
  verso: 'Attention, il ne s''agit pas d''une équivalence (Cor. 4.32). On peut avoir \(\varphi_{X+Y}=\varphi_X\varphi_Y\) sans que \(X\) et \(Y\) soient indépendants. Considérons par exemple \(X\) de loi de Cauchy de paramètre \(\lambda\), de fonction caractéristique \(\varphi_X(t)=e^{-\lambda|t|}\). Alors \(\varphi_X(t)^2=e^{-2\lambda|t|}=\varphi_X(2t)=\varphi_{2X}(t)=\varphi_{X+X}(t)\). Pour autant, \(X\) n''est pas indépendant de lui-même.'
  source: 'Poly Probabilités 5, ch. 4, p. 54 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [theoreme]
- id: proba-a-054-1
  notion: proba-n-0098
  recto: 'Exemple : covariance de \(X\) et \(Z=XY\)'
  verso: 'Soient \(X\) et \(Y\) deux variables aléatoires indépendantes, \(X\) suivant une loi de Bernoulli de paramètre \(\frac12\) et \(Y\) à valeurs dans \(\{-1,1\}\) telle que \(P(Y=1)=P(Y=-1)=\frac12\). Posons \(Z=XY\). Les variables \(X\) et \(Z\) sont décorrélées : \(\mathrm{cov}(X,Z)=E\left[\left(X-\frac12\right)Z\right]=E\left[\left(X-\frac12\right)XY\right]=E\left[\left(X-\frac12\right)X\right]E[Y]\) à cause de l''indépendance de \(X\) et \(Y\), \(=E\left[\left(X-\frac12\right)X\right]\times0=0\).'
  source: 'Poly Probabilités 5, ch. 4, p. 55 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 3
  tags: [exemple]
- id: proba-a-054-2
  notion: proba-n-0098
  recto: 'Exemple : décorrélées mais non indépendantes'
  verso: 'Soient \(X\) et \(Y\) deux variables aléatoires indépendantes, \(X\) suivant une loi de Bernoulli de paramètre \(\frac12\) et \(Y\) à valeurs dans \(\{-1,1\}\) telle que \(P(Y=1)=P(Y=-1)=\frac12\). Posons \(Z=XY\). On vérifie facilement que \(X\) et \(Z\) ne sont pas indépendants car la coïncidence des événements \(\{X=0\}=\{Z=0\}\) implique : \(P(X=0,Z=0)=\frac12\neq P(X=0)P(Z=0)=\left(\frac12\right)^2\).'
  source: 'Poly Probabilités 5, ch. 4, p. 55 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 3
  tags: [exemple]
- id: proba-a-055-1
  notion: proba-n-0100
  recto: 'Déf 4.38 : matrice de covariance'
  verso: 'Soit \(X=(X_1,\dots,X_n)\) un vecteur aléatoire à valeurs dans \(\mathbb R^n\) tel que \(E[X_1^2]\lt+\infty,\dots,E[X_n^2]\lt+\infty\). La matrice de covariance de \(X\) est définie par : \(\Gamma_X=(\mathrm{cov}(X_i,X_j))_{i,j=1}^n\) (matrice dont la diagonale porte \(\mathrm{var}(X_1),\dots,\mathrm{var}(X_n)\)).'
  source: 'Poly Probabilités 5, ch. 4, p. 56 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [definition]
- id: proba-a-055-2
  notion: proba-n-0100
  recto: 'Prop. 4.39 (1) : symétrie et positivité de \(\Gamma_X\)'
  verso: 'Soit \(X=(X_1,\dots,X_n)\) un vecteur aléatoire à valeurs dans \(\mathbb R^n\) tel que \(E[X_i^2]\lt+\infty\) pour tout \(i\), de matrice de covariance \(\Gamma_X=(\mathrm{cov}(X_i,X_j))_{i,j}\). Alors \(\Gamma_X\) est une matrice symétrique et positive.'
  source: 'Poly Probabilités 5, ch. 4, p. 56-57 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [definition]
- id: proba-a-055-3
  notion: proba-n-0100
  recto: 'Prop. 4.39 (2) : formules de variance et de covariance'
  verso: 'Soit \(X=(X_1,\dots,X_n)\) un vecteur aléatoire à valeurs dans \(\mathbb R^n\) tel que \(E[X_i^2]\lt+\infty\) pour tout \(i\), de matrice de covariance \(\Gamma_X\). Pour tous \((\alpha_1,\dots,\alpha_n),(\beta_1,\dots,\beta_n)\in\mathbb R^n\) :<br>\(\mathrm{var}\left(\sum_{i=1}^n\alpha_iX_i\right)=\sum_{i=1}^n\alpha_i^2\mathrm{var}(X_i)+2\sum_{i,j=1,\dots,n;\ i\lt j}\alpha_i\alpha_j\mathrm{cov}(X_i,X_j)\) ;<br>\(\mathrm{cov}\left(\sum_{i=1}^n\alpha_iX_i,\sum_{i=1}^n\beta_iX_i\right)=\sum_{i,j=1,\dots,n}\alpha_i\beta_j\mathrm{cov}(X_i,X_j)=(\alpha_1\ \cdots\ \alpha_n)\,\Gamma_X\,(\beta_1\ \cdots\ \beta_n)^T\).'
  source: 'Poly Probabilités 5, ch. 4, p. 56 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [definition]
- id: proba-a-056-1
  notion: proba-n-0101
  recto: 'Prop. (Remarque 4.40) : matrice de covariance non définie positive'
  verso: 'Soit \(X=(X_1,\dots,X_n)\) un vecteur aléatoire de carré intégrable, de matrice de covariance \(\Gamma_X\). La matrice de covariance de \((X_1,\dots,X_n)\) est positive, mais pas nécessairement définie positive. Si elle n''est pas définie positive, cela signifie qu''elle est de rang strictement inférieur à \(n\), que son noyau n''est pas trivial, et qu''il existe donc \((a_1,\dots,a_n)\in\mathbb R^n\setminus\{(0,\dots,0)\}\) tel que \(\Gamma_X(a_1,\dots,a_n)^T=0\). La matrice de covariance \(\Gamma_X\) n''est donc pas définie positive si et seulement s''il existe une liaison affine non triviale entre \(X_1,\dots,X_n\).'
  source: 'Poly Probabilités 5, ch. 4, p. 57 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [propriete]
- id: proba-a-056-2
  notion: proba-n-0101
  recto: 'Preuve : Remarque 4.40, liaison affine'
  verso: 'Soit \(X=(X_1,\dots,X_n)\) un vecteur aléatoire de carré intégrable, de matrice de covariance \(\Gamma_X\). Soit \(a=(a_1,\dots,a_n)\neq0\) tel que \(\Gamma_Xa=0\). Alors \(\mathrm{var}\left(\sum_{i=1}^na_iX_i\right)=(a_1\ \cdots\ a_n)\,\Gamma_X\,(a_1\ \cdots\ a_n)^T=0\). La variable aléatoire \(\sum_{i=1}^na_iX_i\) est donc constante presque sûrement : il existe \(b\in\mathbb R\) tel que \(a_1X_1+\cdots+a_nX_n=b\) p.s.'
  source: 'Poly Probabilités 5, ch. 4, p. 57 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [propriete]
- id: proba-a-057-1
  notion: proba-n-0102
  recto: 'Cor. 4.41 : moyenne et covariance de \(AX\)'
  verso: 'Soit \(X=(X_1,\dots,X_n)\) un vecteur aléatoire à valeurs dans \(\mathbb R^n\) tel que \(E[X_1^2]\lt+\infty,\dots,E[X_n^2]\lt+\infty\). On note \(\mu_X\) le vecteur moyenne et \(\Gamma_X\) la matrice de covariance. Soit \(A\) une matrice \(m\times n\) et \(Y=AX\). Alors : \(\mu_Y=A\mu_X\) et \(\Gamma_Y=A\Gamma_XA^T\).'
  source: 'Poly Probabilités 5, ch. 4, p. 57 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [propriete]
- id: proba-a-057-2
  notion: proba-n-0102
  recto: 'Preuve : Cor. 4.41, \(\Gamma_Y=A\Gamma_XA^T\)'
  verso: 'Soit \(X=(X_1,\dots,X_n)\) un vecteur aléatoire de carré intégrable, de matrice de covariance \(\Gamma_X\), \(A\) une matrice \(m\times n\) de coefficients \((a_{p,q})\) et \(Y=AX\). Soit \(i,j\in\{1,\dots,m\}\) et \((a_{p,q})\) les coefficients de \(A\). Alors \(\Gamma_Y(i,j)=\mathrm{cov}((AX)_i,(AX)_j)=\mathrm{cov}\left(\sum_{k=1}^na_{i,k}X_k,\sum_{l=1}^na_{j,l}X_l\right)=\sum_{k,l=1}^na_{i,k}a_{j,l}\mathrm{cov}(X_k,X_l)=\sum_{k,l=1}^na_{i,k}\Gamma_X(k,l)a_{j,l}=(A\Gamma_XA^T)(i,j)\). D''où le résultat attendu \(\Gamma_Y=A\Gamma_XA^T\).'
  source: 'Poly Probabilités 5, ch. 4, p. 58 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [propriete]
- id: proba-a-058-1
  notion: proba-n-0104
  recto: 'Prop. 4.46 : moments pairs de la gaussienne centrée réduite'
  verso: 'Soit \(f\) la fonction définie par \(f(x)=\dfrac{e^{-x^2/2}}{\sqrt{2\pi}}\) et \(X\) une variable aléatoire admettant la densité \(f\). Alors \(X\) admet des moments de tous ordres et pour tout \(k\ge0\) : \(E[X^{2k}]=\dfrac{(2k)!}{2^kk!}\).'
  source: 'Poly Probabilités 5, ch. 4, p. 59 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 3
  tags: [propriete]
- id: proba-a-058-2
  notion: proba-n-0104
  recto: 'Prop. 4.46 : moments impairs, espérance et variance'
  verso: 'Soit \(f\) la fonction définie par \(f(x)=\dfrac{e^{-x^2/2}}{\sqrt{2\pi}}\) et \(X\) une variable aléatoire admettant la densité \(f\). Alors \(X\) admet des moments de tous ordres et pour tout \(k\ge0\) : \(E[X^{2k+1}]=0\). En particulier, \(E[X]=0\) et \(\mathrm{var}(X)=1\).'
  source: 'Poly Probabilités 5, ch. 4, p. 59 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 3
  tags: [propriete]
- id: proba-a-058-3
  notion: proba-n-0104
  recto: 'Preuve : Prop. 4.46, récurrence sur \(E[X^{2k}]\)'
  verso: 'Soit \(k\ge1\) et \(X\) de densité \(f(x)=\frac{e^{-x^2/2}}{\sqrt{2\pi}}\). Comme \(X^{2k}\) est positive, elle admet une espérance finie ou infinie, calculée par récurrence grâce à une intégration par parties : \(E[X^{2k}]=\lim_{A\to+\infty}\frac{1}{\sqrt{2\pi}}\int_{-A}^Ax^{2k-1}\times xe^{-x^2/2}dx\). Le terme de bord s''annule et il reste \(E[X^{2k}]=(2k-1)\times E[X^{2k-2}]=(2k-1)(2k-3)\cdots3\times1\times E[X^0]=\frac{(2k)!}{2^kk!}\lt+\infty\). Comme \(X\) admet un moment d''ordre \(2k\) pour tout \(k\ge1\), elle en admet à tous les ordres inférieurs : elle admet des moments de tous ordres.'
  source: 'Poly Probabilités 5, ch. 4, p. 59 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 3
  tags: [propriete]
- id: proba-a-059-1
  notion: proba-n-0105
  recto: 'Preuve : Prop. 4.45, \(f\) est une densité de probabilité'
  verso: 'Soit \(f(x)=\dfrac{e^{-x^2/2}}{\sqrt{2\pi}}\). C''est une fonction positive et continue. Pour son intégrale : \(\left(\int_{\mathbb R}f(x)dx\right)^2=\int_{\mathbb R^2}f(x)f(y)\,dx\,dy\) (Fubini-Tonelli) \(=\frac1{2\pi}\int_{\mathbb R^2}e^{-\frac{x^2+y^2}{2}}dx\,dy=\frac1{2\pi}\int_{[0,2\pi]\times\mathbb R_+}e^{-\rho^2/2}\rho\,d\rho\,d\theta\) (changement de variables en polaires) \(=\frac1{2\pi}\int_0^{2\pi}d\theta\times\int_0^{+\infty}\rho e^{-\rho^2/2}d\rho=\left[-e^{-\rho^2/2}\right]_0^{+\infty}=1\). La fonction \(f\) est donc bien une densité de probabilité sur \(\mathbb R\).'
  source: 'Poly Probabilités 5, ch. 4, p. 59 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 3
  tags: [demonstration]
- id: proba-a-060-1
  notion: proba-n-0106
  recto: 'Prop. 4.47 : moment exponentiel de la gaussienne centrée réduite'
  verso: 'Soit \(X\) une variable aléatoire de densité \(f(x)=\frac{e^{-x^2/2}}{\sqrt{2\pi}}\). Pour tout \(\lambda\in\mathbb C\) : \(E\left[|e^{\lambda X}|\right]\lt+\infty\) et \(E\left[e^{\lambda X}\right]=e^{\lambda^2/2}\). On dit que \(X\) possède un moment exponentiel de tout ordre.'
  source: 'Poly Probabilités 5, ch. 4, p. 60 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 2
  tags: [propriete]
- id: proba-a-060-2
  notion: proba-n-0106
  recto: 'Prop. 4.47 : fonction caractéristique de la gaussienne centrée réduite'
  verso: 'Soit \(X\) une variable aléatoire de densité \(f(x)=\frac{e^{-x^2/2}}{\sqrt{2\pi}}\). En particulier, la fonction caractéristique de \(X\) est égale à : \(\forall t\in\mathbb R,\ \varphi_X(t)=e^{-t^2/2}\) (cas \(\lambda=it\) de \(E[e^{\lambda X}]=e^{\lambda^2/2}\)).'
  source: 'Poly Probabilités 5, ch. 4, p. 60 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 2
  tags: [propriete]
- id: proba-a-060-3
  notion: proba-n-0106
  recto: 'Preuve : Prop. 4.47, \(E[e^{\lambda X}]=e^{\lambda^2/2}\)'
  verso: 'Pour tous \(x\in\mathbb R\), \(\lambda\in\mathbb C\) : \(|e^{\lambda x}|\le e^{|\lambda x|}\le e^{|\lambda|x}+e^{-|\lambda|x}=2\sum_{k\ge0}\frac{|\lambda|^{2k}x^{2k}}{(2k)!}\). En intervertissant espérance et somme de termes positifs : \(E|e^{\lambda X}|\le2\sum_{k\ge0}\frac{|\lambda|^{2k}}{(2k)!}E[X^{2k}]=2\sum_{k\ge0}\frac{|\lambda|^{2k}}{2^kk!}=2e^{|\lambda|^2/2}\lt+\infty\). On en déduit \(E[e^{\lambda X}]=\sum_{n\ge0}\frac{\lambda^n}{n!}E[X^n]=\sum_{k\ge0}\frac{\lambda^{2k}}{2^kk!}=e^{\lambda^2/2}\).'
  source: 'Poly Probabilités 5, ch. 4, p. 60 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 2
  tags: [propriete]
- id: proba-a-061-1
  notion: proba-n-0107
  recto: 'Déf 4.48 : loi gaussienne \(\mathcal N(m,\sigma^2)\)'
  verso: 'Soit \(X\) de densité \(f(x)=\frac{e^{-x^2/2}}{\sqrt{2\pi}}\), \(m\in\mathbb R\) et \(\sigma\gt0\). Alors \(Y=m+\sigma X\) est une variable aléatoire d''espérance \(m\) et de variance \(\sigma^2\). Sa loi est dite gaussienne ou normale et est notée \(\mathcal N(m,\sigma^2)\).'
  source: 'Poly Probabilités 5, ch. 4, p. 60 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 3
  tags: [definition]
- id: proba-a-061-2
  notion: proba-n-0107
  recto: 'Déf 4.48 : moment exponentiel de \(\mathcal N(m,\sigma^2)\)'
  verso: 'Soient \(X\) de densité \(f(x)=\frac{e^{-x^2/2}}{\sqrt{2\pi}}\), \(m\in\mathbb R\) et \(\sigma\ge0\). Soit \(Y=m+\sigma X\) de loi \(\mathcal N(m,\sigma^2)\). Pour tout \(\lambda\in\mathbb C\), \(e^{\lambda Y}\) admet une espérance finie égale à \(e^{\lambda m+\lambda^2\sigma^2/2}\). En particulier, la fonction caractéristique vaut \(\forall t\in\mathbb R,\ \varphi_Y(t)=e^{imt-\sigma^2t^2/2}\).<br>Preuve : \(E[e^{\lambda Y}]=E\left[e^{\lambda m}e^{(\lambda\sigma)X}\right]=e^{\lambda m}e^{(\lambda\sigma)^2/2}=e^{\lambda m+\lambda^2\sigma^2/2}\).'
  source: 'Poly Probabilités 5, ch. 4, p. 60 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 3
  tags: [definition]
- id: proba-a-061-3
  notion: proba-n-0107
  recto: 'Déf 4.48 : variables constantes'
  verso: 'Notons que les variables aléatoires constantes font partie de la famille de variables aléatoires gaussiennes, celles de variance nulle.'
  source: 'Poly Probabilités 5, ch. 4, p. 60 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 3
  tags: [definition]
- id: proba-a-062-1
  notion: proba-n-0108
  recto: 'Prop. 4.49 : densité de \(\mathcal N(m,\sigma^2)\)'
  verso: 'Soient \(m\in\mathbb R\) et \(\sigma\ge0\). Soit \(Y=m+\sigma X\) de loi \(\mathcal N(m,\sigma^2)\), où \(X\) a pour densité \(f(x)=\frac{e^{-x^2/2}}{\sqrt{2\pi}}\). Si \(\sigma\) est strictement positive, alors la loi de \(Y\) admet la densité \(f_Y\) définie par : \(\forall y\in\mathbb R,\ f_Y(y)=\dfrac{e^{-\frac{(y-m)^2}{2\sigma^2}}}{\sqrt{2\pi\sigma^2}}\).'
  source: 'Poly Probabilités 5, ch. 4, p. 61 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 3
  tags: [propriete]
- id: proba-a-062-2
  notion: proba-n-0108
  recto: 'Preuve : Prop. 4.49, densité par la fonction de répartition'
  verso: 'Soit \(m\in\mathbb R\). Soit \(Y=m+\sigma X\), \(\sigma\gt0\), \(X\) de densité \(f\) et de fonction de répartition \(F_X\). Pour tout \(y\in\mathbb R\), \(F_Y(y)=P(Y\le y)=P(m+\sigma X\le y)=P\left(X\le\frac{y-m}{\sigma}\right)=F_X\left(\frac{y-m}{\sigma}\right)\) car \(\sigma\gt0\). \(F_X\) est \(C^1\) sur \(\mathbb R\) car la densité \(f\) est continue sur \(\mathbb R\). On en déduit que \(F_Y\) est \(C^1\) sur \(\mathbb R\), donc que la loi de \(Y\) admet la densité \(f_Y(y)=F_Y^{\prime}(y)=\frac1\sigma F_X^{\prime}\left(\frac{y-m}{\sigma}\right)=\frac1\sigma f\left(\frac{y-m}{\sigma}\right)=\frac{e^{-(y-m)^2/(2\sigma^2)}}{\sqrt{2\pi\sigma^2}}\).'
  source: 'Poly Probabilités 5, ch. 4, p. 61 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 3
  tags: [propriete]
- id: proba-a-063-1
  notion: proba-n-0109
  recto: 'Prop. 4.50 : somme de gaussiennes indépendantes'
  verso: 'Soit \((\Omega,P)\) un espace de probabilité, \(X_1,\dots,X_n\) des variables gaussiennes indépendantes telles que \(X_i\sim\mathcal N(\mu_i,\sigma_i^2)\) pour tout \(i=1,\dots,n\). Alors, pour tous \(\alpha_1,\dots,\alpha_n\in\mathbb R\) : \(\sum_{i=1}^n\alpha_iX_i\sim\mathcal N\left(\sum_{i=1}^n\alpha_i\mu_i,\ \sum_{i=1}^n\alpha_i^2\sigma_i^2\right)\).'
  source: 'Poly Probabilités 5, ch. 4, p. 61 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 3
  tags: [theoreme]
- id: proba-a-063-2
  notion: proba-n-0109
  recto: 'Preuve : Prop. 4.50 par fonctions caractéristiques'
  verso: 'Soient \(X_1,\dots,X_n\) des variables gaussiennes indépendantes, \(X_k\sim\mathcal N(\mu_k,\sigma_k^2)\), et \(\alpha_1,\dots,\alpha_n\in\mathbb R\). Soit \(t\in\mathbb R\). Comme les variables sont indépendantes, \(\varphi_{\sum_{k=1}^n\alpha_kX_k}(t)=\prod_{k=1}^n\varphi_{\alpha_kX_k}(t)=\prod_{k=1}^ne^{i\alpha_k\mu_kt-\frac{\alpha_k^2\sigma_k^2t^2}{2}}=e^{i\left(\sum_k\alpha_k\mu_k\right)t-\frac12\left(\sum_k\alpha_k^2\sigma_k^2\right)t^2}\). On reconnaît la fonction caractéristique d''une loi gaussienne de moyenne \(\sum_k\alpha_k\mu_k\) et de variance \(\sum_k\alpha_k^2\sigma_k^2\).'
  source: 'Poly Probabilités 5, ch. 4, p. 61 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 3
  tags: [theoreme]
- id: proba-a-064-1
  notion: proba-n-0110
  recto: 'Déf 4.51 : vecteur gaussien'
  verso: 'Un vecteur aléatoire \(X=(X_1,\dots,X_n)\) est dit « gaussien » si pour tout \(\alpha=(\alpha_1,\dots,\alpha_n)\in\mathbb R^n\) la variable aléatoire \(\langle\alpha,X\rangle=\sum_{i=1}^n\alpha_iX_i\) suit une loi gaussienne.'
  source: 'Poly Probabilités 5, ch. 4, p. 62 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [definition]
- id: proba-a-064-2
  notion: proba-n-0110
  recto: 'Rem. 4.52 : vecteurs constants'
  verso: 'Les vecteurs constants sont gaussiens (au sens de la Déf. 4.51).'
  source: 'Poly Probabilités 5, ch. 4, p. 62 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [definition]
- id: proba-a-064-3
  notion: proba-n-0110
  recto: 'Rem. 4.52 : existence de vecteurs gaussiens'
  verso: 'D''après la proposition précédente (Prop. 4.50, somme de gaussiennes indépendantes), il existe bien des vecteurs gaussiens : un vecteur dont les composantes sont des gaussiennes indépendantes est gaussien.'
  source: 'Poly Probabilités 5, ch. 4, p. 62 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [definition]
- id: proba-a-065-1
  notion: proba-n-0111
  recto: 'Prop. 4.53 : composantes d''un vecteur gaussien'
  verso: 'Si \(X=(X_1,\dots,X_n)\) est un vecteur gaussien, alors \(X_i\) suit une loi gaussienne pour tout \(i=1,\dots,n\). C''est évident d''après la définition car, quel que soit \(i\in\{1,\dots,n\}\), \(X_i\) est une combinaison linéaire (simple !) de \(X_1,\dots,X_n\). Plus généralement (Rem. 4.54), tout sous-vecteur \((X_{i_1},\dots,X_{i_k})\) d''un vecteur gaussien est un vecteur gaussien.'
  source: 'Poly Probabilités 5, ch. 4, p. 62 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [propriete]
- id: proba-a-065-2
  notion: proba-n-0111
  recto: 'Prop. 4.53 : la réciproque est fausse'
  verso: 'Attention, la réciproque est fausse. Considérons par exemple \(X\) variable gaussienne centrée réduite et \(Y\) variable aléatoire indépendante telle que \(P(Y=1)=P(Y=-1)=\frac12\). Posons \(Z=XY\). La variable \(Z\) suit une loi gaussienne centrée réduite (exercice). Pour autant, le vecteur \((X,Z)\) n''est pas un vecteur gaussien. En effet, la combinaison linéaire \(X+Z\) ne suit pas une loi gaussienne : \(P(X+Z=0)=P(X(1+Y)=0)=P(Y=-1)=\frac12\). La variable aléatoire \(X+Z\) n''est donc ni une constante, ni à densité : ce ne peut être une variable gaussienne.'
  source: 'Poly Probabilités 5, ch. 4, p. 62 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [propriete]
- id: proba-a-066-1
  notion: proba-n-0112
  recto: 'Prop. 4.55 : fonction caractéristique d''un vecteur gaussien'
  verso: 'La fonction caractéristique d''un vecteur gaussien \(X=(X_1,\dots,X_n)\), de vecteur moyenne \(\mu_X\) et de matrice de covariance \(\Gamma_X\), est égale à : \(\forall t=(t_1,\dots,t_n)\in\mathbb R^n,\ \varphi_X(t)=\exp\left(i\langle t,\mu_X\rangle-\frac12\langle t,\Gamma_Xt\rangle\right)\).'
  source: 'Poly Probabilités 5, ch. 4, p. 63 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [theoreme]
- id: proba-a-066-2
  notion: proba-n-0112
  recto: 'Cor. 4.56 : loi d''un vecteur gaussien'
  verso: 'La loi d''un vecteur gaussien \(X\) est caractérisée par sa moyenne \(\mu_X\) et sa matrice de covariance \(\Gamma_X\) ; elle est notée \(\mathcal N(\mu_X,\Gamma_X)\). (Simple conséquence du fait que la fonction caractéristique caractérise la loi d''un vecteur aléatoire.)'
  source: 'Poly Probabilités 5, ch. 4, p. 63 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [theoreme]
- id: proba-a-066-3
  notion: proba-n-0112
  recto: 'Preuve : Prop. 4.55, fonction caractéristique d''un vecteur gaussien'
  verso: 'Soit \(X=(X_1,\dots,X_n)\) un vecteur gaussien, de vecteur moyenne \(\mu_X\) et de matrice de covariance \(\Gamma_X\). Soit \(t\in\mathbb R^n\). \(\langle t,X\rangle=\sum_{k=1}^nt_kX_k\) est une variable gaussienne, d''après la définition d''un vecteur gaussien. Elle est de moyenne \(E\left[\sum_kt_kX_k\right]=\sum_kt_kE[X_k]=\langle t,\mu_X\rangle\) et de variance \(\mathrm{var}\left(\sum_kt_kX_k\right)=(t_1\ \cdots\ t_n)\,\Gamma_X\,(t_1\ \cdots\ t_n)^T=\langle t,\Gamma_Xt\rangle\). On en déduit : \(\varphi_X(t)=E\left[e^{i\langle t,X\rangle}\right]=\varphi_{\langle t,X\rangle}(1)=e^{i\langle t,\mu_X\rangle-\frac12\langle t,\Gamma_Xt\rangle}\).'
  source: 'Poly Probabilités 5, ch. 4, p. 63 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [theoreme]
- id: proba-a-067-1
  notion: proba-n-0113
  recto: 'Prop. 4.57 : image affine d''un vecteur gaussien'
  verso: 'Soit \(X=(X_1,\dots,X_n)\sim\mathcal N(\mu_X,\Gamma_X)\). Soit \(A\) une matrice de dimensions \(p\times n\) et \(b\in\mathbb R^p\). Alors \(AX+b\) est un vecteur gaussien, de vecteur moyenne \(A\mu_X+b\) et de matrice de covariance \(A\Gamma_XA^T\).'
  source: 'Poly Probabilités 5, ch. 4, p. 63 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [propriete]
- id: proba-a-067-2
  notion: proba-n-0113
  recto: 'Preuve : Prop. 4.57, image affine d''un vecteur gaussien'
  verso: 'Soient \(X=(X_1,\dots,X_n)\) un vecteur gaussien, \(A\) une matrice \(p\times n\) et \(b\in\mathbb R^p\). Toute combinaison linéaire de \(AX+b\) est la somme d''une combinaison linéaire de \(X\) (qui est une gaussienne car \(X\) est un vecteur gaussien) et d''une constante : c''est donc une gaussienne, ce qui montre que \(AX+b\) est un vecteur gaussien. Ne reste qu''à déterminer sa moyenne et sa matrice de covariance pour finir de caractériser sa loi : leur calcul découle directement du Cor. 4.41.'
  source: 'Poly Probabilités 5, ch. 4, p. 63 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [propriete]
- id: proba-a-068-1
  notion: proba-n-0114
  recto: 'Prop. 4.58 : existence d''un vecteur gaussien'
  verso: 'Soit \(\mu\in\mathbb R^n\) et \(\Gamma\) une matrice symétrique positive de dimensions \(n\times n\). Alors il existe un vecteur gaussien de moyenne \(\mu\) et de matrice de covariance \(\Gamma\).'
  source: 'Poly Probabilités 5, ch. 4, p. 63 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 3
  tags: [propriete]
- id: proba-a-068-2
  notion: proba-n-0114
  recto: 'Preuve : Prop. 4.58, construction d''un vecteur gaussien'
  verso: 'Soient \(\mu\in\mathbb R^n\) et \(\Gamma\) une matrice symétrique positive \(n\times n\) ; on construit un vecteur gaussien de moyenne \(\mu\) et de covariance \(\Gamma\). \(\Gamma\) est symétrique, donc diagonalisable : \(D=\mathrm{diag}(\lambda_1,\dots,\lambda_n)\) la matrice diagonale des valeurs propres et \(O\) orthogonale telle que \(\Gamma=ODO^{-1}\). Comme \(\Gamma\) est positive, ses valeurs propres sont positives. On définit \(X_1,\dots,X_n\) gaussiennes centrées indépendantes de variances \(\lambda_1,\dots,\lambda_n\) : le vecteur \(X\) est de moyenne nulle et de matrice de covariance \(D\) car les variables sont décorrélées. Posons \(Y=OX+\mu\) : d''après la Prop. 4.57, \(Y\) est un vecteur gaussien de vecteur moyenne \(O\times E[X]+\mu=\mu\) et de matrice de covariance \(O\Gamma_XO^T=ODO^{-1}=\Gamma\).'
  source: 'Poly Probabilités 5, ch. 4, p. 63 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 3
  tags: [propriete]
- id: proba-a-069-1
  notion: proba-n-0115
  recto: 'Prop. 4.60 : densité d''un vecteur gaussien'
  verso: 'Soit \(X\sim\mathcal N(\mu_X,\Gamma_X)\) un vecteur gaussien à valeurs dans \(\mathbb R^n\). Si \(\Gamma_X\) est définie positive, alors la loi de \(X\) admet la densité : \(\forall x\in\mathbb R^n,\ f_X(x)=\dfrac{1}{\sqrt{(2\pi)^n\det\Gamma_X}}\exp\left(-\frac12\langle x-\mu_X,\Gamma_X^{-1}(x-\mu_X)\rangle\right)\).'
  source: 'Poly Probabilités 5, ch. 4, p. 64 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [theoreme]
- id: proba-a-069-2
  notion: proba-n-0115
  recto: 'Prop. (Remarque 4.59) : rang de \(\Gamma\) strictement inférieur à \(n\)'
  verso: 'Soient \(\mu\in\mathbb R^n\) et \(\Gamma\) une matrice symétrique positive \(n\times n\) de rang \(k\lt n\), \(\Gamma=ODO^{-1}\) avec \(O\) orthogonale et \(D\) diagonale, \(X\) un vecteur gaussien centré de matrice de covariance \(D\) et de support \(S_X\). Dans la construction de la Prop. 4.58 (\(Y=OX+\mu\)), si le rang de \(\Gamma\) est strictement inférieur à \(n\), alors \(Y\) est à valeurs dans un sous-ensemble de volume (ou mesure de Lebesgue) nul et sa loi ne peut être à densité. (Le support de \(Y\) est \(OS_X+\mu=\mathrm{Im}(\Gamma)+\mu\), sous-espace affine de dimension \(k\), le rang de \(\Gamma\).)'
  source: 'Poly Probabilités 5, ch. 4, p. 64 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [theoreme]
- id: proba-a-069-3
  notion: proba-n-0115
  recto: 'Preuve : Prop. 4.60, densité d''un vecteur gaussien'
  verso: 'Soit \(X\sim\mathcal N(\mu_X,\Gamma_X)\) un vecteur gaussien à valeurs dans \(\mathbb R^n\), avec \(\Gamma_X\) définie positive, et \(\varphi\) une fonction continue bornée sur \(\mathbb R^n\). On reprend la décomposition \(\Gamma_X=ODO^{-1}\) (\(O\) orthogonale, \(D=\mathrm{diag}(\lambda_1,\dots,\lambda_n)\)) avec \(\lambda_i\gt0\). Soit \(U_1,\dots,U_n\) gaussiennes centrées indépendantes de variances \(\lambda_1,\dots,\lambda_n\) : \(U\) admet \(f_U=f_{U_1}\otimes\cdots\otimes f_{U_n}\) pour densité (Thm 4.14) et \(X\) est égale en loi à \(OU+\mu_X\). Par la méthode de la fonction muette, \(E[\varphi(X)]=\int_{\mathbb R^n}\varphi(Ou+\mu_X)f_{U_1}(u_1)\cdots f_{U_n}(u_n)\,du_1\cdots du_n\). Changement de variables affine \(x=Ou+\mu_X\iff u=O^{-1}(x-\mu_X)\), \(C^1\)-difféomorphisme de \(\mathbb R^n\) sur \(\mathbb R^n\) : \(du_1\cdots du_n=|\det(O^{-1})|dx_1\cdots dx_n=dx_1\cdots dx_n\). De plus \(\lambda_1\cdots\lambda_n=\det D=\det\Gamma_X\) et \(\frac{u_1^2}{\lambda_1}+\cdots+\frac{u_n^2}{\lambda_n}=\langle x-\mu_X,\Gamma_X^{-1}(x-\mu_X)\rangle\). D''où \(E[\varphi(X)]=\int_{\mathbb R^n}\varphi(x)\frac{e^{-\frac12\langle x-\mu_X,\Gamma_X^{-1}(x-\mu_X)\rangle}}{\sqrt{(2\pi)^n\det\Gamma_X}}dx\) : la loi de \(X\) admet bien la densité annoncée.'
  source: 'Poly Probabilités 5, ch. 4, p. 64-65 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [theoreme]
- id: proba-a-070-1
  notion: proba-n-0116
  recto: 'Prop. 4.61 : indépendance et décorrélation d''un vecteur gaussien'
  verso: 'Soit \(X=(X_1,\dots,X_n)\) un vecteur gaussien. Alors les variables \(X_1,\dots,X_n\) sont indépendantes si et seulement si elles sont décorrélées.'
  source: 'Poly Probabilités 5, ch. 4, p. 65 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [theoreme]
- id: proba-a-070-2
  notion: proba-n-0116
  recto: 'Rem. 4.62 : indépendance de sous-vecteurs gaussiens'
  verso: 'Ce résultat (Prop. 4.61) se généralise aux sous-vecteurs d''un vecteur gaussien : si \((X_1,\dots,X_n)\) est un vecteur gaussien, alors \((X_1,\dots,X_p)\) et \((X_{p+1},\dots,X_n)\) sont indépendants si et seulement si \(\forall k\in\{1,\dots,p\},\ \forall l\in\{p+1,\dots,n\},\ \mathrm{cov}(X_k,X_l)=0\).'
  source: 'Poly Probabilités 5, ch. 4, p. 65 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [theoreme]
- id: proba-a-070-3
  notion: proba-n-0116
  recto: 'Preuve : Prop. 4.61, décorrélées \(\Rightarrow\) indépendantes'
  verso: 'Soit \(X=(X_1,\dots,X_n)\) un vecteur gaussien de vecteur moyenne \(\mu_X\), de matrice de covariance \(\Gamma_X\) et de fonction caractéristique \(\varphi_X\) ; \(t\in\mathbb R^n\). Notons \(\mu_i=E[X_i]\) et \(\sigma_i^2=\mathrm{var}(X_i)\). Si \(X_1,\dots,X_n\) sont décorrélées, la matrice de covariance de \(X\) est diagonale : \(\Gamma_X=\mathrm{diag}(\sigma_1^2,\dots,\sigma_n^2)\). La fonction caractéristique de \(X\) s''écrit comme le produit des fonctions caractéristiques de \(X_1,\dots,X_n\) : \(\varphi_X(t)=e^{i\langle t,\mu_X\rangle-\frac12\langle t,\Gamma_Xt\rangle}=e^{i\sum_kt_k\mu_k-\frac12\sum_kt_k^2\sigma_k^2}=\prod_{k=1}^ne^{it_k\mu_k-\frac{t_k^2\sigma_k^2}{2}}=\prod_{k=1}^n\varphi_{X_k}(t_k)\). D''après le Cor. 4.30, \(X_1,\dots,X_n\) sont indépendantes. La réciproque a déjà été établie dans la section sur la covariance.'
  source: 'Poly Probabilités 5, ch. 4, p. 65 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [theoreme]
- id: proba-a-070-4
  notion: proba-n-0116
  recto: 'Prop. 4.61 : fausse pour des gaussiennes non jointes'
  verso: 'Attention : c''est faux si l''on suppose seulement que \(X_1,\dots,X_n\) sont des variables aléatoires gaussiennes. Reprenons l''exemple avec \(X\) variable normale centrée réduite, \(Y\) indépendante et uniforme sur \(\{-1,1\}\), et \(Z=XY\). \(Z\) est également une variable gaussienne centrée réduite, mais \((X,Z)\) n''est pas un vecteur gaussien. Elles ne sont donc pas indépendantes d''après la Prop. 4.50 (si elles l''étaient, toute combinaison \(\alpha X+\beta Z\) serait gaussienne, donc \((X,Z)\) serait un vecteur gaussien, Déf. 4.51). Elles sont néanmoins décorrélées : \(\mathrm{cov}(X,Z)=E[XZ]-E[X]E[Z]=E[X^2Y]=E[X^2]E[Y]=0\).'
  source: 'Poly Probabilités 5, ch. 4, p. 65-66 (PDF)'
  chapitre: 'Chapitre 4 - Vecteurs aléatoires'
  priorite: 1
  tags: [theoreme]
- id: proba-a-071-1
  notion: proba-n-0117
  recto: 'Prop. 5.1 : lemme de Borel-Cantelli'
  verso: 'Soit \((A_n)_{n\in\mathbb N}\) une suite d''événements d''un espace de probabilité \((\Omega,P)\). Si \(\sum_{n\in\mathbb N}P(A_n)\lt+\infty\), alors \(P\left(\limsup_{n\in\mathbb N}A_n\right)=0\). Rappelons que \(\limsup_{n\in\mathbb N}A_n=\bigcap_{n=0}^{+\infty}\bigcup_{k=n}^{+\infty}A_k\) est l''événement « une infinité des événements \(A_n\) ont lieu ».'
  source: 'Poly Probabilités 5, ch. 5, p. 67 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [theoreme]
- id: proba-a-071-2
  notion: proba-n-0117
  recto: 'Preuve : Prop. 5.1, lemme de Borel-Cantelli'
  verso: 'Soit \((A_n)_{n\in\mathbb N}\) une suite d''événements de \((\Omega,P)\). Pour tout \(N\ge1\) : \(P\left(\bigcap_{n=0}^{+\infty}\bigcup_{k=n}^{+\infty}A_k\right)\le P\left(\bigcup_{k=N}^{+\infty}A_k\right)\le\sum_{n=N}^{+\infty}P(A_n)\). Si la série \(\sum P(A_n)\) est convergente, alors \(\lim_{N\to+\infty}\sum_{n=N}^{+\infty}P(A_n)=0\), d''où \(P\left(\bigcap_n\bigcup_{k\ge n}A_k\right)=0\).'
  source: 'Poly Probabilités 5, ch. 5, p. 67 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [theoreme]
- id: proba-a-071-3
  notion: proba-n-0117
  recto: 'Prop. 5.2 : lemme de Borel-Cantelli (2ème partie)'
  verso: 'Soit \((A_n)_{n\in\mathbb N}\) une suite d''événements de \((\Omega,P)\). Si les ensembles \(A_n\), \(n\in\mathbb N\), sont indépendants et si \(\sum_{n\in\mathbb N}P(A_n)=+\infty\), alors \(P\left(\limsup_{n\in\mathbb N}A_n\right)=P\left(\bigcap_{n=0}^{+\infty}\bigcup_{k=n}^{+\infty}A_k\right)=1\).'
  source: 'Poly Probabilités 5, ch. 5, p. 67 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [theoreme]
- id: proba-a-071-4
  notion: proba-n-0117
  recto: 'Prop. 5.2 : contre-exemple sans indépendance (Remarque 5.3)'
  verso: 'Soit \((A_n)_{n\in\mathbb N}\) une suite d''événements de \((\Omega,P)\) telle que \(\sum_nP(A_n)=+\infty\). Si les événements ne sont pas indépendants, cette réciproque est fausse. Pour un contre-exemple élémentaire, il suffit de prendre \(A_n=A\) avec \(P(A)\in]0,1[\).'
  source: 'Poly Probabilités 5, ch. 5, p. 67 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [theoreme]
- id: proba-a-072-1
  notion: proba-n-0118
  recto: 'Preuve : Prop. 5.2, majoration de \(\prod(1-P(A_k))\)'
  verso: 'Soit \((A_n)_{n\in\mathbb N}\) une suite d''événements de \((\Omega,P)\). Supposons les \(A_n\) indépendants avec \(\sum_nP(A_n)=+\infty\). Soit \(n\in\mathbb N\) et \(m\ge n\). Par indépendance, \(P\left(\bigcup_{k=n}^mA_k\right)=1-P\left(\bigcap_{k=n}^mA_k^c\right)=1-\prod_{k=n}^mP(A_k^c)=1-\prod_{k=n}^m(1-P(A_k))\). Étant donné que pour tout \(x\in[0,1]\), \(0\le1-x\le e^{-x}\), alors \(\prod_{k=n}^m(1-P(A_k))\le\exp\left(-\sum_{k=n}^mP(A_k)\right)\).'
  source: 'Poly Probabilités 5, ch. 5, p. 68 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [demonstration]
- id: proba-a-072-2
  notion: proba-n-0118
  recto: 'Preuve : Prop. 5.2, conclusion'
  verso: 'Soit \((A_n)_{n\in\mathbb N}\) une suite d''événements de \((\Omega,P)\). Avec \(P\left(\bigcup_{k=n}^mA_k\right)\ge1-\exp\left(-\sum_{k=n}^mP(A_k)\right)\), en faisant tendre \(m\) vers \(+\infty\), on obtient par continuité monotone de \(P\) : \(\forall n\in\mathbb N,\ P\left(\bigcup_{k=n}^{+\infty}A_k\right)\ge1\), donc \(=1\). Par ailleurs, la suite \(\left(\bigcup_{k=n}^{+\infty}A_k,n\in\mathbb N\right)\) est une suite décroissante d''événements. Donc par continuité monotone (décroissante) de \(P\) : \(P\left(\bigcap_{n=0}^{+\infty}\bigcup_{k=n}^{+\infty}A_k\right)=\lim_{n\to+\infty}P\left(\bigcup_{k=n}^{+\infty}A_k\right)=1\).'
  source: 'Poly Probabilités 5, ch. 5, p. 68 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [demonstration]
- id: proba-a-073-1
  notion: proba-n-0120
  recto: 'Prop. 5.5 : unicité presque sûre de la limite en probabilité'
  verso: 'Si la suite de variables aléatoires \((X_n)_{n\in\mathbb N}\) converge en probabilité vers la variable aléatoire \(X\) et vers la variable aléatoire \(Y\), alors \(X=Y\) presque sûrement.'
  source: 'Poly Probabilités 5, ch. 5, p. 69 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [propriete]
- id: proba-a-073-2
  notion: proba-n-0120
  recto: 'Preuve : Prop. 5.5, unicité presque sûre de la limite'
  verso: 'Soient \((X_n)_{n\in\mathbb N}\), \(X\) et \(Y\) des variables aléatoires à valeurs dans \(\mathbb R^d\) (norme \(\|\cdot\|\)), avec \(X_n\xrightarrow{P}X\) et \(X_n\xrightarrow{P}Y\). Pour tout \(\varepsilon\gt0\), \(P(\|X-Y\|\gt\varepsilon)\le P(\|X_n-X\|\gt\varepsilon/2)+P(\|X_n-Y\|\gt\varepsilon/2)\) car, en raison de l''inégalité triangulaire, \(\{\|X-Y\|\gt\varepsilon\}\subset\{\|X_n-X\|\gt\varepsilon/2\}\cup\{\|X_n-Y\|\gt\varepsilon/2\}\). Vu que \(X_n\xrightarrow{P}X\) et \(X_n\xrightarrow{P}Y\), \(\forall\varepsilon\gt0,\ P(\|X-Y\|\gt\varepsilon)=0\). La continuité de \(P\) appliquée à la suite croissante des ensembles \(A_p=\{\|X-Y\|\gt1/p\}\), \(p\in\mathbb N^*\), implique \(P(\|X-Y\|\gt0)=\lim_{p\to+\infty}P(A_p)=0\) : \(X=Y\) presque sûrement.'
  source: 'Poly Probabilités 5, ch. 5, p. 69 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [propriete]
- id: proba-a-073-3
  notion: proba-n-0120
  recto: 'Prop. 5.6 : convergence en probabilité d''un couple'
  verso: 'Soit \((X_n,n\ge1)\) et \((Y_n,n\ge1)\) deux suites de variables aléatoires à valeurs dans \(\mathbb R^d\) et \(\mathbb R^l\) respectivement, et convergeant en probabilité vers \(X\) et \(Y\). Alors la suite \(((X_n,Y_n),n\ge1)\) converge en probabilité vers \((X,Y)\).'
  source: 'Poly Probabilités 5, ch. 5, p. 69 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [propriete]
- id: proba-a-073-4
  notion: proba-n-0120
  recto: 'Prop. 5.7 : image continue d''une suite convergeant en probabilité'
  verso: 'Soit \((X_n,n\ge1)\) une suite de variables aléatoires qui converge en probabilité vers \(X\), et \(f\) une fonction continue sur \(\mathbb R^d\) à valeurs dans \(\mathbb R^l\). Alors \((f(X_n),n\ge1)\) converge en probabilité vers \(f(X)\).'
  source: 'Poly Probabilités 5, ch. 5, p. 70 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [propriete]
- id: proba-a-073-5
  notion: proba-n-0120
  recto: 'Cor. 5.8 : combinaison linéaire et convergence en probabilité'
  verso: 'Soit \((X_n,n\ge1)\) et \((Y_n,n\ge1)\) deux suites à valeurs dans \(\mathbb R^d\) et convergeant en probabilité vers \(X\) et \(Y\) respectivement. Alors la suite \((\alpha X_n+\beta Y_n,n\ge1)\) converge en probabilité vers \(\alpha X+\beta Y\), pour tous \(\alpha,\beta\in\mathbb R\).'
  source: 'Poly Probabilités 5, ch. 5, p. 70 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [propriete]
- id: proba-a-074-1
  notion: proba-n-0121
  recto: 'Déf 5.9 : convergence presque sûre'
  verso: 'Une suite de vecteurs aléatoires \((X_n)_{n\in\mathbb N}\) définis sur \((\Omega,P)\) et à valeurs dans \(\mathbb R^d\) converge \(P\)-presque sûrement vers le vecteur aléatoire \(X\) s''il existe un ensemble négligeable \(N\subset\Omega\) tel que \(\forall\omega\in\Omega\setminus N,\ \lim_{n\to+\infty}X_n(\omega)=X(\omega)\). On note \(X_n\xrightarrow[n\to+\infty]{p.s.}X\).'
  source: 'Poly Probabilités 5, ch. 5, p. 70 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [definition]
- id: proba-a-074-2
  notion: proba-n-0121
  recto: 'Exemple : convergence presque sûre de \(\mathbf 1_{[0,1/n]}(X)\)'
  verso: 'Soit \(X\) une variable aléatoire de loi uniforme sur \([0,1]\). Pour tout \(n\in\mathbb N^*\), \(X_n=\mathbf 1_{[0,1/n]}(X)\) est une variable aléatoire à valeurs réelles. Par ailleurs, si \(X(\omega)\neq0\), \(\lim_{n\to+\infty}X_n(\omega)=0\). Or \(P(X\neq0)=1\) car \(X\) suit une loi uniforme sur \([0,1]\). Par conséquent, \(X_n\xrightarrow{p.s.}0\).'
  source: 'Poly Probabilités 5, ch. 5, p. 70 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [definition]
- id: proba-a-075-1
  notion: proba-n-0122
  recto: 'Prop. 5.10 (1) : unicité presque sûre de la limite p.s.'
  verso: 'Soit \((\Omega,P)\) un espace de probabilité, \((X_n,n\ge0)\) une suite de vecteurs aléatoires à valeurs dans \(\mathbb R^d\). Si \((X_n,n\ge0)\) converge \(P\)-presque sûrement vers \(X\) et vers \(Y\), alors \(X=Y\) \(P\)-presque sûrement.<br>Preuve : hors de l''ensemble négligeable \(N_X\cup N_Y\), \(\lim_nX_n(\omega)=X(\omega)=Y(\omega)\).'
  source: 'Poly Probabilités 5, ch. 5, p. 71 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [propriete]
- id: proba-a-075-2
  notion: proba-n-0122
  recto: 'Prop. 5.10 (2) : image continue et convergence p.s.'
  verso: 'Soit \((\Omega,P)\) un espace de probabilité, \((X_n,n\ge0)\) une suite de vecteurs aléatoires à valeurs dans \(\mathbb R^d\) qui converge \(P\)-presque sûrement vers \(X\). Si \(f\) est une fonction continue sur \(\mathbb R^d\), alors \((f(X_n),n\ge0)\) converge \(P\)-presque sûrement vers \(f(X)\).'
  source: 'Poly Probabilités 5, ch. 5, p. 71 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [propriete]
- id: proba-a-075-3
  notion: proba-n-0122
  recto: 'Prop. 5.10 (3) : couple et convergence p.s.'
  verso: 'Soit \((\Omega,P)\) un espace de probabilité, \((X_n,n\ge0)\), \((Y_n,n\ge0)\) deux suites de vecteurs aléatoires à valeurs dans \(\mathbb R^d\) et \(\mathbb R^l\) respectivement. Si \((X_n)\) et \((Y_n)\) convergent \(P\)-presque sûrement vers \(X\) et vers \(Y\), alors \(((X_n,Y_n),n\ge0)\) converge \(P\)-presque sûrement vers \((X,Y)\).'
  source: 'Poly Probabilités 5, ch. 5, p. 71 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [propriete]
- id: proba-a-075-4
  notion: proba-n-0122
  recto: 'Prop. 5.10 (4) : combinaison linéaire et convergence p.s.'
  verso: 'Soit \((\Omega,P)\) un espace de probabilité, \((X_n,n\ge0)\), \((Y_n,n\ge0)\) deux suites de vecteurs aléatoires à valeurs dans \(\mathbb R^d\) et \(\mathbb R^l\) respectivement, convergeant \(P\)-presque sûrement vers \(X\) et \(Y\). Si \(d=l\), alors la suite \((\alpha X_n+\beta Y_n,n\ge0)\) converge \(P\)-presque sûrement vers \(\alpha X+\beta Y\) pour tous \(\alpha,\beta\in\mathbb R\).'
  source: 'Poly Probabilités 5, ch. 5, p. 71 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [propriete]
- id: proba-a-076-1
  notion: proba-n-0123
  recto: 'Prop. 5.11 : convergence p.s. et convergence en probabilité'
  verso: 'Une suite de vecteurs aléatoires \((X_n)_{n\in\mathbb N}\) qui converge presque sûrement vers \(X\) converge en probabilité vers \(X\).'
  source: 'Poly Probabilités 5, ch. 5, p. 71 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [propriete]
- id: proba-a-076-2
  notion: proba-n-0123
  recto: 'Preuve : Prop. 5.11, p.s. implique probabilité'
  verso: 'Supposons que \((X_n)_{n\in\mathbb N}\) converge presque sûrement vers \(X\). Soit \(\varepsilon\gt0\) et \(Y_n=\mathbf 1_{\|X-X_n\|\gt\varepsilon}\). La suite \((Y_n)\) converge presque sûrement vers \(0\) et les \(Y_n\) sont uniformément bornées par \(1\) : par le théorème de convergence dominée 2.29, \(\lim_{n\to+\infty}P(\|X-X_n\|\gt\varepsilon)=\lim_{n\to+\infty}E[Y_n]=E\left[\lim_{n\to+\infty}Y_n\right]=0\). C''est établi pour tout \(\varepsilon\gt0\) : \(X_n\) converge en probabilité vers \(X\).'
  source: 'Poly Probabilités 5, ch. 5, p. 71 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [propriete]
- id: proba-a-076-3
  notion: proba-n-0123
  recto: 'Prop. : pas de réciproque entre probabilité et p.s.'
  verso: 'Il n''existe pas à proprement parler de réciproque à la Prop. 5.11. Il existe des suites de variables aléatoires qui convergent en probabilité, mais pas presque sûrement. Mais il existe des réciproques partielles comme la Prop. 5.12 : une suite qui converge en probabilité « suffisamment vite » converge presque sûrement. « Suffisamment vite » signifie ici que pour tout \(\varepsilon\gt0\), non seulement \(P(\|X_n-X\|\gt\varepsilon)\) tend vers \(0\), mais la série l''ayant pour terme général converge.'
  source: 'Poly Probabilités 5, ch. 5, p. 72 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [propriete]
- id: proba-a-077-1
  notion: proba-n-0124
  recto: 'Prop. 5.12 : conséquence du lemme de Borel-Cantelli'
  verso: 'Soient \((X_n)_{n\in\mathbb N}\) et \(X\) des variables aléatoires à valeurs dans \(\mathbb R^d\). Si pour tout \(\varepsilon\gt0\), \(\sum_{n\in\mathbb N}P(\|X_n-X\|\ge\varepsilon)\lt+\infty\), alors la suite \((X_n,n\ge0)\) converge presque sûrement vers \(X\).'
  source: 'Poly Probabilités 5, ch. 5, p. 72 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [propriete]
- id: proba-a-077-2
  notion: proba-n-0124
  recto: 'Preuve : Prop. 5.12, conséquence de Borel-Cantelli'
  verso: 'Soient \((X_n)_{n\in\mathbb N}\) et \(X\) des variables aléatoires à valeurs dans \(\mathbb R^d\) (norme \(\|\cdot\|\)) telles que, pour tout \(\varepsilon\gt0\), \(\sum_nP(\|X_n-X\|\ge\varepsilon) < +\infty\). Soit \(p\in\mathbb N^*\). Pour tout \(n\in\mathbb N\), posons \(A_{n,p}=\{\|X_n-X\|\ge\frac1p\}\). D''après le lemme de Borel-Cantelli 5.1 appliqué à la suite \((A_{n,p})_{n\in\mathbb N}\), \(P(A_p)=0\) avec \(A_p=\bigcap_{n=0}^{+\infty}\bigcup_{k=n}^{+\infty}A_{k,p}\). Alors \(P\left(\bigcup_{p\in\mathbb N^*}A_p\right)=0\), autrement dit \(1=P\left(\bigcap_{p\in\mathbb N^*}\bigcup_{n=0}^{+\infty}\bigcap_{k=n}^{+\infty}\{\|X_k-X\|\lt\frac1p\}\right)\). Traduisons : pour presque tout \(\omega\), pour tout \(p\in\mathbb N^*\), il existe \(n\in\mathbb N\) tel que pour tout \(k\ge n\), \(\|X_k(\omega)-X(\omega)\|\lt\frac1p\). Par conséquent, la suite \((X_n)\) converge presque sûrement vers \(X\).'
  source: 'Poly Probabilités 5, ch. 5, p. 72 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [propriete]
- id: proba-a-078-1
  notion: proba-n-0125
  recto: 'Déf 5.13 : convergence en moyenne d''ordre \(p\)'
  verso: 'Soit \((\Omega,P)\) un espace de probabilité, \((X_n,n\ge1)\) et \(X\) des vecteurs aléatoires définis sur \(\Omega\) et à valeurs dans \(\mathbb R^k\). Soit \(p\ge1\). Si \(\|X\|\) et \(\|X_n\|\) pour tout \(n\ge0\) possèdent un moment d''ordre \(p\), alors on dit que la suite \((X_n,n\ge1)\) converge en moyenne d''ordre \(p\) vers \(X\) si \(\lim_{n\to+\infty}E[\|X_n-X\|^p]=0\).'
  source: 'Poly Probabilités 5, ch. 5, p. 72 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [definition]
- id: proba-a-078-2
  notion: proba-n-0125
  recto: 'Déf 5.13 : cas \(p=1\) et \(p=2\)'
  verso: 'Soient \((X_n,n\ge1)\) et \(X\) des vecteurs aléatoires à valeurs dans \(\mathbb R^k\) et \(p\ge1\). Pour la convergence en moyenne d''ordre \(p\) (\(\lim_nE[\|X_n-X\|^p]=0\)) : si \(p=1\), on parle simplement de convergence en moyenne. Si \(p=2\), on parle de convergence en moyenne quadratique.'
  source: 'Poly Probabilités 5, ch. 5, p. 72 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [definition]
- id: proba-a-079-1
  notion: proba-n-0126
  recto: 'Prop. 5.14 : unicité presque sûre de la limite en moyenne'
  verso: 'Soit \(p\ge1\) et \(X,Y\) des vecteurs aléatoires à valeurs dans \(\mathbb R^d\). Soit \((X_n,n\ge0)\) une suite de vecteurs aléatoires à valeurs dans \(\mathbb R^d\). Si \((X_n,n\ge0)\) converge en moyenne d''ordre \(p\) vers \(X\) et vers \(Y\), alors \(X=Y\) \(P\)-presque sûrement.<br>Preuve : par Minkowski, \(E[\|X-Y\|^p]^{1/p}\le E[\|X-X_n\|^p]^{1/p}+E[\|X_n-Y\|^p]^{1/p}\to0\), donc \(\|X-Y\|=0\) p.s. (espérance nulle d''une variable positive).'
  source: 'Poly Probabilités 5, ch. 5, p. 73 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [propriete]
- id: proba-a-079-2
  notion: proba-n-0126
  recto: 'Prop. 5.15 : image uniformément continue et convergence en moyenne'
  verso: 'Soit \(p\ge1\) et \(X\) un vecteur aléatoire à valeurs dans \(\mathbb R^d\). Soit \((X_n,n\ge0)\) une suite de vecteurs aléatoires à valeurs dans \(\mathbb R^d\). Si \((X_n,n\ge0)\) converge en moyenne d''ordre \(p\) vers \(X\), et si \(f\) est une fonction uniformément continue sur \(\mathbb R^d\), alors \((f(X_n),n\ge0)\) converge en moyenne d''ordre \(p\) vers \(f(X)\). Remarquons que c''est faux si l''on suppose \(f\) continue car rien ne garantirait alors que \(\|f(X_n)-f(X)\|\) ait un moment d''ordre \(p\).'
  source: 'Poly Probabilités 5, ch. 5, p. 73 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [propriete]
- id: proba-a-079-3
  notion: proba-n-0126
  recto: 'Prop. 5.16 (1) : couple et convergence en moyenne'
  verso: 'Soit \(p\ge1\) et \(X\), \(Y\) des vecteurs aléatoires à valeurs dans \(\mathbb R^d\) et \(\mathbb R^l\). Soit \((\Omega,P)\) un espace de probabilité, \((X_n,n\ge0)\), \((Y_n,n\ge0)\) deux suites de vecteurs aléatoires à valeurs dans \(\mathbb R^d\) et \(\mathbb R^l\) respectivement. Si \((X_n)\) et \((Y_n)\) convergent en moyenne d''ordre \(p\) vers \(X\) et vers \(Y\) respectivement, alors \(((X_n,Y_n),n\ge0)\) converge en moyenne d''ordre \(p\) vers \((X,Y)\).'
  source: 'Poly Probabilités 5, ch. 5, p. 73 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [propriete]
- id: proba-a-079-4
  notion: proba-n-0126
  recto: 'Prop. 5.16 (2) : combinaison linéaire et convergence en moyenne'
  verso: 'Soit \(p\ge1\) et \(X\), \(Y\) des vecteurs aléatoires à valeurs dans \(\mathbb R^d\) et \(\mathbb R^l\). Soit \((\Omega,P)\) un espace de probabilité, \((X_n,n\ge0)\), \((Y_n,n\ge0)\) deux suites de vecteurs aléatoires à valeurs dans \(\mathbb R^d\) et \(\mathbb R^l\) respectivement, convergeant en moyenne d''ordre \(p\) vers \(X\) et vers \(Y\). Si \(d=l\), alors la suite \((\alpha X_n+\beta Y_n,n\ge0)\) converge en moyenne d''ordre \(p\) vers \(\alpha X+\beta Y\) pour tous \(\alpha,\beta\in\mathbb R\).'
  source: 'Poly Probabilités 5, ch. 5, p. 73 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [propriete]
- id: proba-a-080-1
  notion: proba-n-0127
  recto: 'Prop. 5.17 (1) : ordres inférieurs'
  verso: 'Soit \((X_n,n\ge1)\) une suite de vecteurs aléatoires convergeant en moyenne d''ordre \(p\ge1\) vers \(X\). Alors pour tout \(q\in[1,p]\), la suite \((X_n,n\ge1)\) converge en moyenne d''ordre \(q\) vers \(X\).'
  source: 'Poly Probabilités 5, ch. 5, p. 74 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [propriete]
- id: proba-a-080-2
  notion: proba-n-0127
  recto: 'Prop. 5.17 (2) : convergence des moments d''ordre \(p\) des normes'
  verso: 'Soit \((X_n,n\ge1)\) une suite de vecteurs aléatoires convergeant en moyenne d''ordre \(p\ge1\) vers \(X\). Alors la suite \((E[\|X_n\|^p],n\ge1)\) converge vers \(E[\|X\|^p]\).'
  source: 'Poly Probabilités 5, ch. 5, p. 74 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [propriete]
- id: proba-a-080-3
  notion: proba-n-0127
  recto: 'Prop. 5.17 (3) : convergence des moments d''ordre \(p\)'
  verso: 'Soit \((X_n,n\ge1)\) une suite de vecteurs aléatoires convergeant en moyenne d''ordre \(p\ge1\) vers \(X\). Si les variables aléatoires sont réelles et si \(p\in\mathbb N^*\), la suite \((E[X_n^p],n\ge1)\) converge vers \(E[X^p]\).'
  source: 'Poly Probabilités 5, ch. 5, p. 74 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [propriete]
- id: proba-a-081-1
  notion: proba-n-0128
  recto: 'Prop. 5.18 : convergence en moyenne et en probabilité'
  verso: 'Soient \(p\ge1\) et \(X\) un vecteur aléatoire. Soit \((X_n,n\ge1)\) une suite de vecteurs aléatoires convergeant en moyenne d''ordre \(p\) vers \(X\). Alors elle converge aussi en probabilité vers \(X\).'
  source: 'Poly Probabilités 5, ch. 5, p. 74 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [propriete]
- id: proba-a-081-2
  notion: proba-n-0128
  recto: 'Preuve : Prop. 5.18, moyenne implique probabilité'
  verso: 'Soit \((X_n,n\ge1)\) une suite de vecteurs aléatoires convergeant en moyenne d''ordre \(p\ge1\) vers \(X\) (norme \(\|\cdot\|\)). Soit \(\varepsilon\gt0\). D''après l''inégalité de Markov, \(P(\|X-X_n\|\gt\varepsilon)\le\dfrac{E[\|X-X_n\|^p]}{\varepsilon^p}\). Sous les hypothèses de l''énoncé, cela implique que \(P(\|X-X_n\|\gt\varepsilon)\) tend vers \(0\) quand \(n\) tend vers l''infini, et permet d''établir la convergence en probabilité.'
  source: 'Poly Probabilités 5, ch. 5, p. 74 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [propriete]
- id: proba-a-082-1
  notion: proba-n-0129
  recto: 'Prop. 5.19 : probabilité et suites uniformément bornées'
  verso: 'Soit \((X_n,n\ge1)\) une suite de vecteurs aléatoires convergeant en probabilité vers \(X\). Si ces vecteurs aléatoires sont uniformément bornés, autrement dit s''il existe \(A\ge0\) tel que \(\forall n\ge1,\ \|X_n\|\le A\) p.s., alors la suite \((X_n,n\ge1)\) converge vers \(X\) en moyenne d''ordre \(p\), pour tout \(p\ge1\).'
  source: 'Poly Probabilités 5, ch. 5, p. 74 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [propriete]
- id: proba-a-082-2
  notion: proba-n-0129
  recto: 'Preuve : Prop. 5.19, convergence en moyenne d''ordre \(p\)'
  verso: 'Soit \((X_n,n\ge1)\) une suite de vecteurs aléatoires convergeant en probabilité vers \(X\), avec \(A\ge0\) tel que \(\|X_n\|\le A\) p.s. pour tout \(n\). \(X\) est aussi bornée p.s. par \(A\) : \(\|X\|\le\|X-X_n\|+A\) p.s., d''où \(P(\|X\|\ge A+\varepsilon)\le P(\|X-X_n\|\ge\varepsilon)\to0\), et par continuité \(P(\|X\|\gt A)=\lim_kP(\|X\|\ge A+\frac1k)=0\). Les \(X_n\) et \(X\) possèdent donc des moments de tous ordres. Pour \(p\ge1\) et \(\varepsilon\gt0\), on découpe \(\|X_n-X\|=\|X_n-X\|\mathbf 1_{\|X_n-X\|\le\varepsilon}+\|X_n-X\|\mathbf 1_{\|X_n-X\|\gt\varepsilon}\) et l''inégalité de Minkowski donne \(E[\|X_n-X\|^p]^{1/p}\le\varepsilon P(\|X_n-X\|\le\varepsilon)^{1/p}+2A\,P(\|X_n-X\|\gt\varepsilon)^{1/p}\). On en déduit \(\limsup_nE[\|X_n-X\|^p]^{1/p}\le\varepsilon\) pour tout \(\varepsilon\gt0\), donc \(\lim_nE[\|X_n-X\|^p]=0\).'
  source: 'Poly Probabilités 5, ch. 5, p. 74-75 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [propriete]
- id: proba-a-083-1
  notion: proba-n-0131
  recto: 'Déf : variables aléatoires i.i.d.'
  verso: 'Notation : les variables aléatoires \(X_n\), \(n\in\mathbb N\), sont i.i.d. (indépendantes identiquement distribuées) si elles sont indépendantes et si elles ont toutes même loi.'
  source: 'Poly Probabilités 5, ch. 5, p. 76 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [definition]
- id: proba-a-084-1
  notion: proba-n-0132
  recto: 'Prop. 5.21 : loi forte des grands nombres'
  verso: 'Soit \((X_n)_{n\in\mathbb N}\) une suite de variables aléatoires réelles i.i.d. Posons \(\bar X_n=\frac1n\sum_{i=1}^nX_i\). Si \(E[|X_1|]\lt+\infty\), c''est-à-dire si les variables aléatoires \(X_n\) ont un moment d''ordre \(1\), alors \((\bar X_n)_{n\in\mathbb N^*}\) converge presque sûrement vers \(E[X_1]\).'
  source: 'Poly Probabilités 5, ch. 5, p. 76 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [theoreme]
- id: proba-a-084-2
  notion: proba-n-0132
  recto: 'Prop. (Remarque 5.22) : loi forte avec \(E[|X_1|]=+\infty\)'
  verso: 'Soit \((X_n)_{n\in\mathbb N}\) une suite de variables aléatoires réelles i.i.d. et \(\bar X_n=\frac1n\sum_{i=1}^nX_i\). On peut montrer que si \(E[|X_1|]=+\infty\), alors la suite \((\bar X_n)_{n\in\mathbb N^*}\) ne converge presque sûrement vers aucune limite finie.'
  source: 'Poly Probabilités 5, ch. 5, p. 77 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [theoreme]
- id: proba-a-084-3
  notion: proba-n-0132
  recto: 'Prop. 5.20 : loi faible des grands nombres'
  verso: 'Soit \((X_n)_{n\in\mathbb N}\) une suite de variables aléatoires réelles ayant un moment d''ordre \(2\). On suppose qu''elles ont toutes même moyenne \(\mu\), que leurs variances sont (uniformément) bornées, et qu''elles sont deux à deux décorrélées : \(\forall n,m\in\mathbb N,\ n\neq m\Rightarrow\mathrm{cov}(X_n,X_m)=0\). Posons \(\bar X_n=\frac1n\sum_{i=1}^nX_i\). Alors la suite \((\bar X_n,n\ge1)\) converge en moyenne quadratique vers \(\mu\).'
  source: 'Poly Probabilités 5, ch. 5, p. 75-76 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [theoreme]
- id: proba-a-084-4
  notion: proba-n-0132
  recto: 'Preuve : Prop. 5.20, loi faible des grands nombres'
  verso: 'Soit \((X_n)_{n\in\mathbb N}\) une suite de variables aléatoires réelles de moment d''ordre \(2\), de même moyenne \(\mu\), deux à deux décorrélées, et \(\bar X_n=\frac1n\sum_{i=1}^nX_i\). Soit \(M\gt0\) tel que \(\forall n,\ \mathrm{var}(X_n)\le M\). \(\bar X_n\) est une combinaison linéaire de variables ayant un moment d''ordre \(2\), donc possède un moment d''ordre \(2\), et son espérance est constante : \(E[\bar X_n]=\frac1n\sum_{i=1}^nE[X_i]=\mu\). Les \(X_n\) étant deux à deux décorrélées, \(\mathrm{var}(\bar X_n)=\frac1{n^2}\sum_{i=1}^n\mathrm{var}(X_i)\le\frac{nM}{n^2}=\frac Mn\). Comme par définition \(\mathrm{var}(\bar X_n)=E\left[|\bar X_n-E[\bar X_n]|^2\right]=E\left[|\bar X_n-\mu|^2\right]\), on a bien \(\lim_{n\to+\infty}E\left[|\bar X_n-\mu|^2\right]=0\) : convergence en moyenne quadratique de \(\bar X_n\) vers \(\mu\).'
  source: 'Poly Probabilités 5, ch. 5, p. 76 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [theoreme]
- id: proba-a-085-1
  notion: proba-n-0133
  recto: 'Déf 5.23 : convergence en loi'
  verso: 'Soit \((X_n,n\ge1)\) et \(X\) des vecteurs aléatoires à valeurs dans \(\mathbb R^d\). On dit que la suite \((X_n,n\ge1)\) « converge en loi » vers \(X\) si pour toute fonction continue bornée \(f\) de \(\mathbb R^d\) dans \(\mathbb R\) : \(\lim_{n\to+\infty}E[f(X_n)]=E[f(X)]\). On note \(X_n\xrightarrow[n\to+\infty]{L}X\).'
  source: 'Poly Probabilités 5, ch. 5, p. 77 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [definition]
- id: proba-a-085-2
  notion: proba-n-0133
  recto: 'Rem. 5.24 : unicité de la loi limite'
  verso: 'Il y a unicité de la loi limite, mais pas de la variable aléatoire limite. Plus précisément, si la suite de variables aléatoires \((X_n)_{n\in\mathbb N}\) converge en loi vers la variable aléatoire \(X\), alors elle converge aussi en loi vers la variable aléatoire \(Y\) si et seulement si \(X\) et \(Y\) ont même loi.'
  source: 'Poly Probabilités 5, ch. 5, p. 77 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [definition]
- id: proba-a-085-3
  notion: proba-n-0133
  recto: 'Rem. 5.24 et 5.25 : ce que mesure la convergence en loi'
  verso: 'Pour la convergence en loi, il n''est plus nécessaire de supposer que toutes les variables aléatoires soient définies sur un même espace de probabilité ; elles restent à valeurs dans un même espace vectoriel \(\mathbb R^d\). La convergence en loi n''affirme pas que \(X\) et \(X_n\) sont proches dans \(\mathbb R^d\) mais que la loi de \(X_n\) est proche de celle de \(X\) pour \(n\) grand. Elle est improprement nommée : il s''agit en réalité de la convergence de lois définies sur \(\mathbb R^d\), et non de la convergence des variables aléatoires.'
  source: 'Poly Probabilités 5, ch. 5, p. 77 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [definition]
- id: proba-a-085-4
  notion: proba-n-0133
  recto: 'Exemple : convergence en loi vers une Bernoulli'
  verso: 'Soit \(\delta_a\) la mesure de Dirac en \(a\). Soit \(X_n\) une variable aléatoire de loi \(P_{X_n}=\frac12\delta_{1/n}+\frac12\delta_{n/(n+1)}\). Alors, pour toute fonction \(f\) continue bornée sur \(\mathbb R\), \(E[f(X_n)]=\frac12f\left(\frac1n\right)+\frac12f\left(\frac n{n+1}\right)\). Par conséquent, pour toute fonction \(f\) continue bornée sur \(\mathbb R\), \(\lim_{n\to+\infty}E[f(X_n)]=\frac12f(0)+\frac12f(1)=E[f(X)]\) avec \(X\) de loi de Bernoulli de paramètre \(p=1/2\). Par conséquent, \(X_n\xrightarrow{L}X\).'
  source: 'Poly Probabilités 5, ch. 5, p. 77 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 1
  tags: [definition]
- id: proba-a-086-1
  notion: proba-n-0134
  recto: 'Prop. 5.26 : image continue et convergence en loi'
  verso: 'Soit \((X_n,n\ge0)\) une suite de vecteurs aléatoires, à valeurs dans \(\mathbb R^d\), qui converge en loi vers \(X\). Soit \(f\) une fonction continue sur \(\mathbb R^d\), à valeurs dans \(\mathbb R^k\). Alors la suite \((f(X_n),n\ge0)\) converge en loi vers \(f(X)\).'
  source: 'Poly Probabilités 5, ch. 5, p. 77 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [propriete]
- id: proba-a-087-1
  notion: proba-n-0136
  recto: 'Prop. 5.29 : lemme de Scheffé (1)'
  verso: 'Si les variables aléatoires \(X,X_1,X_2,\dots\) sont à valeurs dans \(\mathbb Z\), alors \(X_n\xrightarrow[n\to+\infty]{L}X\) si et seulement si \(\lim_{n\to+\infty}P(X_n=k)=P(X=k)\) en tout \(k\in\mathbb Z\).'
  source: 'Poly Probabilités 5, ch. 5, p. 78 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [theoreme]
- id: proba-a-087-2
  notion: proba-n-0136
  recto: 'Prop. 5.29 : attention, la famille limite doit être de somme \(1\)'
  verso: 'Il ne suffit pas que chacune des probabilités \(P(X_n=k)\), \(k\in\mathbb Z\), converge pour obtenir la convergence en loi : la famille limite doit encore être de somme égale à \(1\). Considérons la suite de variables constantes \(X_n=n\). Pour tout \(k\in\mathbb Z\), on a \(P(X_n=k)\to0\), mais il n''existe aucune variable aléatoire \(X\) à valeurs dans \(\mathbb Z\) telle que \(P(X=k)=0\) pour tout \(k\in\mathbb Z\).'
  source: 'Poly Probabilités 5, ch. 5, p. 78-79 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [theoreme]
- id: proba-a-088-1
  notion: proba-n-0138
  recto: 'Prop. 5.31 : lemme de Scheffé (2)'
  verso: 'Si les vecteurs aléatoires \(X,X_1,X_2,\dots\) sont à densité, de densité \(f,f_1,f_2,\dots\), alors \(X_n\xrightarrow[n\to+\infty]{L}X\) si \(\lim_{n\to+\infty}f_n(x)=f(x)\) en tout point \(x\in\mathbb R^d\) sauf éventuellement sur un ensemble négligeable. Bien noter qu''il s''agit ici d''une condition suffisante et non nécessaire.'
  source: 'Poly Probabilités 5, ch. 5, p. 79 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [theoreme]
- id: proba-a-088-2
  notion: proba-n-0138
  recto: 'Exemple : densités qui convergent sans convergence en loi'
  verso: 'Attention : des variables à densité peuvent converger en loi vers une variable qui n''en a pas, et la convergence ponctuelle des densités ne suffit pas à assurer la convergence en loi. Considérons \(X_n=X/n\) et \(X^{\prime}_n=nX\), où \(X\) est gaussienne centrée réduite. Pour tout \(n\ge1\), \(X_n\) et \(X^{\prime}_n\) sont à densité. La suite \((X_n)\) converge presque sûrement vers \(0\). En revanche, pour tout \(M\gt0\), \(P(|X^{\prime}_n|\le M)=P(|X|\le M/n)\to0\). La masse de la loi de \(X^{\prime}_n\) s''échappe donc de tout intervalle borné ; cette suite ne peut pas converger en loi vers une probabilité sur \(\mathbb R\).'
  source: 'Poly Probabilités 5, ch. 5, p. 79-80 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [theoreme]
- id: proba-a-089-1
  notion: proba-n-0139
  recto: 'Prop. 5.32 : convergence en loi et fonctions de répartition'
  verso: 'Soit \(F,F_1,F_2,\dots\) les fonctions de répartition des vecteurs aléatoires \(X,X_1,X_2,\dots\) ; alors \(X_n\xrightarrow[n\to+\infty]{L}X\) si et seulement si \(\lim_{n\to+\infty}F_n(x)=F(x)\) en tout \(x\in\mathbb R^d\) où \(F\) est continue.'
  source: 'Poly Probabilités 5, ch. 5, p. 80 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [theoreme]
- id: proba-a-089-2
  notion: proba-n-0139
  recto: 'Exemple : \(X_n=1/n\) et fonctions de répartition'
  verso: 'Considérons la suite des variables aléatoires constantes \(X_n=\frac1n\) dont on voit aisément, d''après la définition de la convergence en loi, qu''elles convergent en loi vers \(X=0\) (elles convergent d''ailleurs aussi presque sûrement). Qu''en est-il de leurs fonctions de répartition ? Soit \(t\in\mathbb R\) : \(\lim_{n\to+\infty}F_{X_n}(t)=\lim_{n\to+\infty}\mathbf 1_{t\ge\frac1n}=\mathbf 1_{t\gt0}\). Elles convergent bien vers la fonction de répartition \(F_X(t)=\mathbf 1_{t\ge0}\) sauf en \(0\), point de discontinuité de \(F_X\).'
  source: 'Poly Probabilités 5, ch. 5, p. 80 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [theoreme]
- id: proba-a-089-3
  notion: proba-n-0139
  recto: 'Prop. 5.32 : attention, convergence simple sans convergence en loi'
  verso: 'Attention : les fonctions de répartition peuvent converger simplement sans qu''il y ait convergence en loi. On peut reprendre un exemple précédent en considérant la suite des variables constantes \(X_n=n\), dont les fonctions de répartition convergent partout vers la fonction nulle, qui n''est pas une fonction de répartition.'
  source: 'Poly Probabilités 5, ch. 5, p. 80 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [theoreme]
- id: proba-a-090-1
  notion: proba-n-0140
  recto: 'Exemple : minimum de variables uniformes'
  verso: 'Soit \(X_1,X_2,\dots\) une suite de variables aléatoires indépendantes, de loi uniforme sur \([0,1]\). On pose \(Y_n=n\min(X_1,\dots,X_n)\). Soit \(t\in\mathbb R\) : \(F_{Y_n}(t)=P(Y_n\le t)=1-P\left(X_1\gt\frac tn,\dots,X_n\gt\frac tn\right)=1-P\left(X_1\gt\frac tn\right)^n\) (indépendance et même loi) \(=1-\left(1-F_{X_1}\left(\frac tn\right)\right)^n\), qui vaut \(0\) si \(t\le0\), \(1-\left(1-\frac tn\right)^n\) si \(\frac tn\in[0,1]\), \(1\) si \(\frac tn\ge1\). Quand \(n\to+\infty\), cela tend vers \(0\) si \(t\le0\) et \(1-e^{-t}\) si \(t\ge0\), soit \(F_Y(t)\) avec \(Y\) exponentielle de paramètre \(1\). La suite \((Y_n,n\ge1)\) converge donc en loi vers \(Y\).'
  source: 'Poly Probabilités 5, ch. 5, p. 80 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [exemple]
- id: proba-a-091-1
  notion: proba-n-0141
  recto: 'Thm 5.33 : théorème de Lévy'
  verso: 'Soit \(\varphi,\varphi_1,\varphi_2,\dots\) les fonctions caractéristiques des vecteurs aléatoires \(X,X_1,X_2,\dots\) ; alors \(X_n\xrightarrow[n\to+\infty]{L}X\) si et seulement si \(\lim_{n\to+\infty}\varphi_n(x)=\varphi(x)\) en tout \(x\in\mathbb R^d\). (Admis.)'
  source: 'Poly Probabilités 5, ch. 5, p. 81 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [theoreme]
- id: proba-a-091-2
  notion: proba-n-0141
  recto: 'Thm 5.33 : attention, convergence simple sans convergence en loi'
  verso: 'Attention : les fonctions caractéristiques peuvent converger simplement sans qu''il y ait convergence en loi. On peut considérer la suite des fonctions caractéristiques de \(X_n=nX\), avec \(X\) gaussienne centrée réduite, pour s''en convaincre (ici \(\varphi_{X_n}(t)=e^{-n^2t^2/2}\to\mathbf 1_{t=0}\)).'
  source: 'Poly Probabilités 5, ch. 5, p. 81 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [theoreme]
- id: proba-a-092-1
  notion: proba-n-0143
  recto: 'Preuve : Thm 5.34, théorème central limite'
  verso: 'Soit \((X_n)_{n\in\mathbb N^*}\) réelles indépendantes, de même loi, de moment d''ordre \(2\), \(\mu=E[X_1]\), \(\sigma^2=\mathrm{var}(X_1)\), \(\bar X_n=\frac1n\sum_{i=1}^nX_i\). Posons \(Z_k=X_k-\mu\) : les \(Z_k\) sont indépendantes, de même loi, centrées et de variance \(\sigma^2\), et \(\sqrt n(\bar X_n-\mu)=\frac{Z_1+\cdots+Z_n}{\sqrt n}\). Comme \(Z_1\) possède un moment d''ordre \(2\), \(\varphi_{Z_1}(s)=1-\frac{\sigma^2}{2}s^2+o(s^2)\) quand \(s\to0\). Pour tout \(t\in\mathbb R\), l''indépendance donne \(\varphi_{\sqrt n(\bar X_n-\mu)}(t)=\varphi_{Z_1}\left(\frac t{\sqrt n}\right)^n=\left(1-\frac{\sigma^2t^2}{2n}+o\left(\frac1n\right)\right)^n\to\exp\left(-\frac{\sigma^2t^2}{2}\right)\) : fonction caractéristique d''une variable gaussienne centrée de variance \(\sigma^2\). Le théorème de Lévy permet de conclure.'
  source: 'Poly Probabilités 5, ch. 5, p. 81-82 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [demonstration]
- id: proba-a-093-1
  notion: proba-n-0144
  recto: 'Thm 5.35 : théorème central limite vectoriel'
  verso: 'Soit \(\left(X^{(n)}\right)_{n\in\mathbb N^*}\) une suite de vecteurs aléatoires indépendants, de même loi et à valeurs dans \(\mathbb R^d\). On suppose que leurs coordonnées possèdent un moment d''ordre \(2\). On note \(\mu\) le vecteur moyenne de \(X^{(1)}\) et \(\Gamma\) sa matrice de covariance. Alors \(\sqrt n\left(\frac1n\sum_{i=1}^nX^{(i)}-\mu\right)\xrightarrow[n\to+\infty]{L}Z\), où \(Z\) est un vecteur aléatoire gaussien centré de matrice de covariance \(\Gamma\).'
  source: 'Poly Probabilités 5, ch. 5, p. 82 (PDF)'
  chapitre: 'Chapitre 5 - Convergences'
  priorite: 3
  tags: [theoreme]
- id: proba-a-094-1
  notion: proba-p-0001
  recto: 'Définir \(\limsup A_n\) pour une suite d''événements \((A_n)_{n\ge1}\), par réunions et intersections puis en mots.'
  verso: '\(\limsup A_n=\bigcap_{n\ge1}\bigcup_{j\ge n}A_j=\{\omega:\ \forall n\ge1,\ \exists j\ge n,\ \omega\in A_j\}\) : l''ensemble des \(\omega\) qui appartiennent à une infinité de \(A_j\).'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans pro-td1-ex05, pro-td1-ex10'
  chapitre: 'Chapitre 1 - Rappels sur le modèle probabiliste'
  priorite: 2
  tags: [prerequis-l1l2, definition]
- id: proba-a-094-2
  notion: proba-p-0001
  recto: 'Définir \(\liminf A_n\) pour une suite d''événements \((A_n)_{n\ge1}\), par réunions et intersections puis en mots.'
  verso: '\(\liminf A_n=\bigcup_{n\ge1}\bigcap_{j\ge n}A_j=\{\omega:\ \exists n\ge1,\ \forall j\ge n,\ \omega\in A_j\}\) : l''ensemble des \(\omega\) qui appartiennent à tous les \(A_j\) sauf un nombre fini.'
