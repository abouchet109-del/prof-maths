- id: proba-a-098-3
  notion: proba-p-0006
  recto: 'Prop. : exponentielle complexe d''une somme'
  verso: 'Pour tous \(z,w\in\mathbb C\) : \(e^{z+w}=e^ze^w\). De plus \(|e^z|=e^{\mathrm{Re}\,z}\), donc \(e^z\neq0\). En particulier \(e^{i(s+t)}=e^{is}e^{it}\) et \(e^{itX}e^{itY}=e^{it(X+Y)}\).'
