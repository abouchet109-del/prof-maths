  recto: 'Théorème de Cesàro pour les suites réelles : énoncer avec ses hypothèses.'
  verso: 'Si \((u_k)_{k\ge1}\) est une suite de réels qui converge vers \(\ell\in\mathbb R\), alors \(\frac1n\sum_{k=1}^nu_k\to\ell\) quand \(n\to+\infty\). (Reste vrai pour \(\ell=\pm\infty\) ; la réciproque est fausse : \(u_k=(-1)^k\).)'
