  recto: 'En R, quelle est la signature de <code>rpois</code> ? Écrire une fonction <code>S(N, lambda)</code> qui simule la somme de \(N\) variables de Poisson indépendantes de paramètre \(\lambda\).'
  verso: '<code>rpois(n, lambda)</code> renvoie un vecteur de <code>n</code> réalisations indépendantes de \(\mathcal P(\texttt{lambda})\). Donc :<br><code>S <- function(N, lambda) { sum(rpois(N, lambda)) }</code><br>(Cette somme suit \(\mathcal P(N\lambda)\), donc <code>rpois(1, N*lambda)</code> donne la même loi.)'
