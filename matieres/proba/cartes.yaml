  recto: 'Pour une suite d''événements \((A_n)\) : quelle inclusion entre \(\liminf A_n\) et \(\limsup A_n\), et que valent \((\limsup A_n)^c\) et \((\liminf A_n)^c\) ?'
  verso: '\(\liminf A_n\subset\limsup A_n\). De plus \((\limsup A_n)^c=\liminf A_n^c\) et \((\liminf A_n)^c=\limsup A_n^c\) (lois de De Morgan).'
