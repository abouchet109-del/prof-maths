# Cartes de topologie (Paris Cité L3). Pages = repères "--- page N ---" du PDF.
- id: topo-a-001-1
  notion: topo-n-0007
  recto: 'Sur un ensemble \(X\), quelles sont la topologie grossière et la topologie discrète ?'
  verso: 'Grossière : \(\{\emptyset, X\}\). Discrète : \(\mathcal P(X)\) (toute partie est ouverte).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 2'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [exemple]
- id: topo-a-001-2
  notion: topo-n-0007
  recto: 'L''espace \((X,\mathcal P(X))\) (topologie discrète) est-il séparé ? Pourquoi ?'
  verso: 'Oui : pour \(x \neq y\), prendre \(U=\{x\}\) et \(V=\{y\}\), ouverts disjoints.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 3'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [exemple]
- id: topo-a-001-3
  notion: topo-n-0007
  recto: 'L''espace \((X,\{\emptyset, X\})\) (topologie grossière) est-il séparé ?'
  verso: 'Non dès que \(X\) a deux points distincts \(x, y\) : le seul ouvert contenant \(x\) (ou \(y\)) est \(X\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 3'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [exemple]
- id: topo-a-001-4
  notion: topo-n-0007
  recto: 'Quelle propriété surprenante peut avoir une suite convergente dans un espace topologique non séparé ?'
  verso: 'Elle peut avoir plusieurs limites.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 3'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [exemple]

- id: topo-a-002-1
  notion: topo-n-0009
  recto: 'Énoncer la seconde inégalité triangulaire dans un espace métrique \((X,d)\).'
  verso: 'Pour tous \(x,y,z\in X\) : \(|d(x,y)-d(y,z)|\le d(x,z)\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 3'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]

- id: topo-a-003-1
  notion: topo-n-0010
  recto: 'Définir la distance \(d_\infty\) sur \(\mathbb R^n\).'
  verso: '\(d_\infty(x,y)=\max_{k\in\{1,\dots,n\}}|x_k-y_k|\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 3'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [exemple]
- id: topo-a-003-2
  notion: topo-n-0010
  recto: 'Définir la distance \(d_p\) sur \(\mathbb R^n\) pour \(p\in[1,+\infty[\). Quel cas particulier est la distance euclidienne ?'
  verso: '\(d_p(x,y)=\left(\sum_{k=1}^n|x_k-y_k|^p\right)^{1/p}\) ; \(d_2\) est la distance euclidienne.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 3'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [exemple]
- id: topo-a-003-3
  notion: topo-n-0010
  recto: 'Définir la distance discrète sur un ensemble non vide \(X\).'
  verso: '\(d(x,y)=1\) si \(x\neq y\), \(d(x,y)=0\) si \(x=y\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 3'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [exemple]

- id: topo-a-004-1
  notion: topo-n-0014
  recto: 'Dans un espace métrique, une boule ouverte \(B(x,r)\) est-elle ouverte ? une boule fermée \(\overline B(x,r)\) est-elle fermée ?'
  verso: 'Oui aux deux : \(B(x,r)\) est ouverte et \(\overline B(x,r)\) est fermée.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 4'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]
- id: topo-a-004-2
  notion: topo-n-0014
  recto: 'Comment montrer qu''une boule ouverte \(B(x,r)\) est ouverte ?'
  verso: 'Pour \(y\in B(x,r)\), poser \(\epsilon=r-d(x,y) > 0\). Si \(z\in B(y,\epsilon)\) : \(d(x,z)\le d(x,y)+d(y,z) < (r-\epsilon)+\epsilon=r\), donc \(B(y,\epsilon)\subset B(x,r)\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 5'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]
- id: topo-a-004-3
  notion: topo-n-0014
  recto: 'Comment montrer qu''une boule fermée \(\overline B(x,r)\) est fermée ?'
  verso: 'Son complémentaire est \(\{z : d(x,z) > r\}\). Pour \(y\) dedans, poser \(\epsilon=d(x,y)-r > 0\). Si \(z\in B(y,\epsilon)\) : \(d(x,z)\ge d(x,y)-d(y,z) > (r+\epsilon)-\epsilon=r\). Le complémentaire est ouvert.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 5'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]

- id: topo-a-005-1
  notion: topo-n-0015
  recto: 'Dans un espace métrique, définir la distance \(d(A,B)\) entre deux parties \(A\) et \(B\).'
  verso: 'Avec \(d(a,B)=\inf_{b\in B}d(a,b)\) : \(d(A,B)=\inf_{a\in A}d(a,B)=\inf_{(a,b)\in A\times B}d(a,b)\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 5'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [definition]

- id: topo-a-006-1
  notion: topo-n-0019
  recto: 'Caractériser l''intérieur \(\mathring A\) d''une partie \(A\) par une propriété de maximalité.'
  verso: '\(\mathring A\) est le plus grand ouvert inclus dans \(A\) (réunion de tous les ouverts inclus dans \(A\)).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 6'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]
- id: topo-a-006-2
  notion: topo-n-0019
  recto: 'Caractériser les parties ouvertes à l''aide de l''intérieur.'
  verso: '\(A\) est ouverte si et seulement si \(A=\mathring A\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 6'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]

- id: topo-a-007-1
  notion: topo-n-0031
  recto: 'Soit \((X,d)\) un espace métrique et \(Y\subset X\) non vide. Qu''appelle-t-on distance induite et sous-espace métrique ?'
  verso: 'La restriction de \(d\) à \(Y\times Y\) est une distance sur \(Y\), dite distance induite ; \((Y,d_{Y\times Y})\) est un sous-espace métrique de \((X,d)\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 9'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [definition]
- id: topo-a-007-2
  notion: topo-n-0031
  recto: 'Dans le sous-espace métrique \((Y,d)\) de \((X,d)\), comment s''écrit la boule ouverte \(B_Y(x,r)\) de centre \(x\in Y\) ?'
  verso: '\(B_Y(x,r)=\{y\in Y : d(x,y) < r\}=B(x,r)\cap Y\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 9'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [definition]

- id: topo-a-008-1
  notion: topo-n-0034
  recto: 'Définir : deux distances \(d\) et \(\delta\) sur \(X\) sont uniformément équivalentes.'
  verso: 'Pour tout \(\epsilon > 0\) il existe \(\alpha > 0\) tel que pour tous \(x,y\in X\) : \(d(x,y) < \alpha\Rightarrow\delta(x,y) < \epsilon\) et \(\delta(x,y) < \alpha\Rightarrow d(x,y) < \epsilon\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 11'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [definition]
- id: topo-a-008-2
  notion: topo-n-0034
  recto: 'Quelle différence entre distances topologiquement équivalentes et uniformément équivalentes ?'
  verso: 'Topologiquement : \(\forall x\,\forall\epsilon\,\exists\alpha\,\forall y\ldots\) (\(\alpha\) dépend de \(x\) et \(\epsilon\)). Uniformément : \(\forall\epsilon\,\exists\alpha\,\forall x,y\ldots\) (\(\alpha\) ne dépend que de \(\epsilon\)).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 11'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [definition]

- id: topo-a-009-1
  notion: topo-n-0036
  recto: 'Quelles implications relient distances Lipschitz équivalentes, uniformément équivalentes et topologiquement équivalentes ?'
  verso: 'Lipschitz équivalentes \(\Rightarrow\) uniformément équivalentes \(\Rightarrow\) topologiquement équivalentes.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 12'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]

- id: topo-a-010-1
  notion: topo-n-0038
  recto: 'Sur un produit dénombrable \(X=\prod_{k=0}^{+\infty}X_k\) d''espaces métriques \((X_k,d_k)\), quelle distance utilise-t-on ?'
  verso: '\(d(x,y)=\sum_{k=0}^{+\infty}2^{-k}\dfrac{d_k(x_k,y_k)}{1+d_k(x_k,y_k)}\) (série convergente car \(\sum_k 2^{-k}\) converge).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 13'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]
- id: topo-a-010-2
  notion: topo-n-0038
  recto: 'Pourquoi ne peut-on pas définir la distance d''un produit dénombrable par \(\sum_k d_k(x_k,y_k)\) comme pour un produit fini ?'
  verso: 'Cette série n''est pas convergente en général.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 11'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]

- id: topo-a-011-1
  notion: topo-n-0045
  recto: 'Dans un espace métrique, caractériser une valeur d''adhérence \(x\) d''une suite \((u_n)\) à l''aide des suites extraites.'
  verso: '\(x\) est valeur d''adhérence de \((u_n)\) si et seulement si \((u_n)\) possède une suite extraite qui converge vers \(x\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 15'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]

- id: topo-a-012-1
  notion: topo-n-0046
  recto: 'Dans un espace métrique, donner l''ensemble des valeurs d''adhérence d''une suite \((u_n)\) comme intersection.'
  verso: 'C''est le fermé \(\bigcap_{n\in\mathbb N}\overline{\{u_m : m\ge n\}}\) (intersection des adhérences des queues de la suite).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 15'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]

- id: topo-a-013-1
  notion: topo-n-0050
  recto: 'Définir un homéomorphisme entre deux espaces métriques \((X,d)\) et \((Y,\delta)\).'
  verso: 'Une bijection \(f:X\to Y\) continue dont la bijection réciproque est continue (bijection bicontinue). On dit alors que \(X\) et \(Y\) sont homéomorphes.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 17'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [definition]

- id: topo-a-014-1
  notion: topo-n-0051
  recto: 'Quelle chaîne d''implications relie isométrie, application lipschitzienne, uniformément continue et continue ?'
  verso: 'Isométrie \(\Rightarrow\) lipschitzienne \(\Rightarrow\) uniformément continue \(\Rightarrow\) continue.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 18'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]
- id: topo-a-014-2
  notion: topo-n-0051
  recto: 'Qu''est-ce qu''une isométrie surjective entre espaces métriques ? Pourquoi ?'
  verso: 'C''est un homéomorphisme : une isométrie est injective, donc surjective implique bijective, et \(\delta(y,y'')=d(f^{-1}(y),f^{-1}(y''))\) prouve que \(f^{-1}\) est continue.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 18'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]

- id: topo-a-015-1
  notion: topo-n-0052
  recto: 'Caractériser « \(d\) et \(\delta\) topologiquement équivalentes » avec les applications identité.'
  verso: 'Si et seulement si \(\mathrm{id}:(X,d)\to(X,\delta)\) et \(\mathrm{id}:(X,\delta)\to(X,d)\) sont continues.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 18'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]
- id: topo-a-015-2
  notion: topo-n-0052
  recto: 'Caractériser « \(d\) et \(\delta\) uniformément équivalentes » avec les applications identité.'
  verso: 'Si et seulement si \(\mathrm{id}:(X,d)\to(X,\delta)\) et \(\mathrm{id}:(X,\delta)\to(X,d)\) sont uniformément continues.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 18'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]
- id: topo-a-015-3
  notion: topo-n-0052
  recto: 'Caractériser « \(d\) et \(\delta\) Lipschitz équivalentes » avec les applications identité.'
  verso: 'Si et seulement si \(\mathrm{id}:(X,d)\to(X,\delta)\) et \(\mathrm{id}:(X,\delta)\to(X,d)\) sont lipschitziennes.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 18'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]

- id: topo-a-016-1
  notion: topo-n-0058
  recto: 'Définir une partie bornée \(A\) d''un espace métrique \((X,d)\).'
  verso: 'Il existe \(M > 0\) tel que \(d(x,y)\le M\) pour tous \(x,y\in A\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 2'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [definition]
- id: topo-a-016-2
  notion: topo-n-0058
  recto: 'Définir le diamètre d''une partie bornée \(A\) d''un espace métrique.'
  verso: '\(\operatorname{diam}(A)=\sup_{x,y\in A}d(x,y)\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 2'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [definition]
- id: topo-a-016-3
  notion: topo-n-0058
  recto: 'Caractériser une partie bornée \(A\) avec une boule, pour \(x\in X\) fixé.'
  verso: '\(A\) est bornée si et seulement s''il existe \(r > 0\) tel que \(A\subset B(x,r)\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 2'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [definition]
- id: topo-a-016-4
  notion: topo-n-0058
  recto: 'Comparer \(\operatorname{diam}(\mathring A)\), \(\operatorname{diam}(A)\) et \(\operatorname{diam}(\overline A)\).'
  verso: '\(\operatorname{diam}(\mathring A)\le\operatorname{diam}(A)=\operatorname{diam}(\overline A)\) (le diamètre est croissant pour l''inclusion).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 2'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [definition]

- id: topo-a-017-1
  notion: topo-n-0061
  recto: 'Un produit fini d''espaces métriques complets \((X_k,d_k)\), \(1\le k\le n\), est-il complet ? Pour quelle distance ?'
  verso: 'Oui, pour \(D(x,y)=\sum_{k=1}^n d_k(x_k,y_k)\) (aussi pour \(D_p\), \(p\in[1,+\infty]\)). Donc \(\mathbb R^n\), \(\mathbb C\) et \(\mathbb C^n\) sont complets.'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 3-4'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 3
  tags: [propriete]

- id: topo-a-018-1
  notion: topo-n-0064
  recto: 'Énoncer le théorème de prolongement des applications uniformément continues.'
  verso: 'Soient \((X,d)\), \((Y,\delta)\) métriques, \(A\subset X\) dense, \(f:A\to Y\) uniformément continue, \(Y\) complet. Alors \(f\) a un unique prolongement continu à \(X\), lui-même uniformément continu.'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 5'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 3
  tags: [theoreme]
- id: topo-a-018-2
  notion: topo-n-0064
  recto: 'Dans le théorème de prolongement des applications uniformément continues, comment définit-on \(\tilde f(x)\) pour \(x\in X\) ?'
  verso: 'Prendre \((u_n)\) dans \(A\) avec \(u_n\to x\) (\(A\) dense). \((u_n)\) est de Cauchy, donc \((f(u_n))\) aussi, donc converge (\(Y\) complet) : \(\tilde f(x)=\lim f(u_n)\), indépendante du choix de la suite.'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 5'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 3
  tags: [theoreme]

- id: topo-a-019-1
  notion: topo-n-0066
  recto: 'Soit \(f(x)=\sqrt{1+x^2}-1\) et \(M > 0\). \(f\) est-elle contractante sur \([-M,M]\) ? sur \(\mathbb R\) ?'
  verso: 'Contractante sur \([-M,M]\) : \(|f''(x)|=\dfrac{|x|}{\sqrt{1+x^2}}\le\dfrac{M}{\sqrt{1+M^2}} < 1\), donc \(|f(x)-f(y)|\le\dfrac{M}{\sqrt{1+M^2}}|x-y|\) (accroissements finis). Pas contractante sur \(\mathbb R\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 6'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 3
  tags: [exemple]
- id: topo-a-019-2
  notion: topo-n-0066
  recto: 'Pourquoi \(f(x)=\sqrt{1+x^2}-1\) n''est-elle pas contractante sur \(\mathbb R\) ?'
  verso: 'Si \(C\) convenait : \(\left|\dfrac{f(x)-f(y)}{x-y}\right|\le C\). En faisant tendre \(y\to+\infty\), le quotient tend vers \(1\), d''où \(1\le C\) : aucun \(C < 1\) ne convient.'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 6'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 3
  tags: [exemple]

- id: topo-a-020-1
  notion: topo-n-0068
  recto: 'Théorème de Picard : comment construit-on le point fixe d''une contraction \(f\) d''un espace complet \(X\) ?'
  verso: 'Prendre \(u_0\in X\) et poser \(u_{n+1}=f(u_n)\) : la suite converge vers le point fixe (la preuve donne une méthode de calcul).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 7'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [methode]
- id: topo-a-020-2
  notion: topo-n-0068
  recto: 'Méthode de point fixe (\(f\) de rapport \(C < 1\)) : quelle estimation prouve que \((u_n)\), \(u_{n+1}=f(u_n)\), est de Cauchy ?'
  verso: '\(d(u_{n+1},u_n)\le C^n d(u_1,u_0)\), d''où pour \(p > q\) : \(d(u_p,u_q)\le\sum_{n=q}^{p-1}C^n d(u_1,u_0)\le\dfrac{C^q}{1-C}d(u_1,u_0)\to 0\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 7'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [methode]
- id: topo-a-020-3
  notion: topo-n-0068
  recto: 'Méthode de point fixe : pourquoi la limite \(a\) de \((u_n)\) est-elle un point fixe de \(f\) ?'
  verso: '\(X\) complet donc \(u_n\to a\) ; \(f\) est continue, donc en passant à la limite dans \(u_{n+1}=f(u_n)\) : \(f(a)=a\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 7'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [methode]
- id: topo-a-020-4
  notion: topo-n-0068
  recto: 'Méthode de point fixe : comment prouver l''unicité du point fixe d''une contraction de rapport \(C < 1\) ?'
  verso: 'Si \(f(a_1)=a_1\) et \(f(a_2)=a_2\) : \(d(a_1,a_2)=d(f(a_1),f(a_2))\le C\,d(a_1,a_2)\) avec \(C < 1\), donc \(d(a_1,a_2)=0\) et \(a_1=a_2\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 7'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [methode]

- id: topo-a-021-1
  notion: topo-n-0069
  recto: 'Le théorème de point fixe reste-t-il vrai avec l''hypothèse \(|f(x)-f(y)| < |x-y|\) (\(x\neq y\)) à la place de « \(f\) contractante » ? Contre-exemple.'
  verso: 'Non. \(f(x)=\sqrt{1+x^2}\) sur \(\mathbb R\) : \(|f''(x)|=\dfrac{|x|}{\sqrt{1+x^2}} < 1\) donc \(|f(x)-f(y)| < |x-y|\), mais \(f(a)=a\) donnerait \(1+a^2=a^2\) : aucun point fixe.'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 7'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 2
  tags: [exemple]

- id: topo-a-022-1
  notion: topo-n-0070
  recto: 'Énoncer le théorème de Baire dans un espace métrique complet.'
  verso: 'Dans un espace métrique complet \((X,d)\), toute intersection dénombrable d''ouverts denses est dense : si les \(O_n\) (\(n\in\mathbb N\)) sont des ouverts denses, \(\bigcap_n O_n\) est dense dans \(X\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 8'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [theoreme]

- id: topo-a-023-1
  notion: topo-n-0071
  recto: 'Démonstration de Baire (1) : que faut-il montrer et comment démarre-t-on ?'
  verso: 'Montrer \(\left(\bigcap_n O_n\right)\cap V\neq\emptyset\) pour tout ouvert non vide \(V\). \(O_0\) dense donne \(u_0\in O_0\cap V\) ; cet ensemble est ouvert, donc il existe \(r_0 > 0\) avec \(\overline B(u_0,r_0)\subset O_0\cap V\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 8'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 3
  tags: [demonstration]
- id: topo-a-023-2
  notion: topo-n-0071
  recto: 'Démonstration de Baire (2) : comment construit-on \(u_n\) et \(r_n\) à partir de \(u_{n-1}\) et \(r_{n-1}\) ?'
  verso: '\(O_n\) dense donc \(O_n\cap B(u_{n-1},r_{n-1})\neq\emptyset\), et c''est un ouvert : choisir \(u_n\) dedans, puis \(r_n\in\,]0,\frac1n]\) avec \(\overline B(u_n,r_n)\subset O_n\cap B(u_{n-1},r_{n-1})\). Les boules fermées sont emboîtées.'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 8'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 3
  tags: [demonstration]
- id: topo-a-023-3
  notion: topo-n-0071
  recto: 'Démonstration de Baire (3) : comment conclut-on avec les boules fermées emboîtées \(\overline B(u_n,r_n)\) ?'
  verso: '\(\operatorname{diam}\overline B(u_n,r_n)\le 2r_n\to 0\) et \(X\) est complet, donc \(\bigcap_n\overline B(u_n,r_n)\neq\emptyset\) (fermés emboîtés de diamètre tendant vers 0). Comme \(\overline B(u_n,r_n)\subset O_n\cap V\), un point de cette intersection est dans \(\left(\bigcap_n O_n\right)\cap V\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 8'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 3
  tags: [demonstration]

- id: topo-a-024-1
  notion: topo-n-0072
  recto: 'Baire, version fermés : que dire d''une union dénombrable de fermés d''intérieur vide dans un espace métrique complet ?'
  verso: 'Elle est d''intérieur vide : si les \(F_n\) sont des fermés d''intérieur vide, \(\left(\bigcup_n F_n\right)^\circ=\emptyset\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 9'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [propriete]
- id: topo-a-024-2
  notion: topo-n-0072
  recto: 'Comment déduit-on du théorème de Baire qu''une union dénombrable de fermés d''intérieur vide est d''intérieur vide ?'
  verso: 'Poser \(O_n=X\setminus F_n\). Comme \(\mathring F_n=\emptyset\), \(O_n\) est un ouvert dense. Baire : \(\bigcap_n O_n\) est dense ; son complémentaire \(\bigcup_n F_n\) est donc d''intérieur vide.'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 9'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [propriete]

- id: topo-a-025-1
  notion: topo-n-0073
  recto: 'Baire : si un espace métrique complet non vide \(X\) est union dénombrable de fermés \(F_n\), que peut-on dire des \(F_n\) ?'
  verso: 'Il existe \(n\) tel que \(\mathring F_n\neq\emptyset\) (l''un des fermés est d''intérieur non vide).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 9'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [propriete]
- id: topo-a-025-2
  notion: topo-n-0073
  recto: 'Comment démontre-t-on que, si \(X=\bigcup_n F_n\) avec \(X\) complet et \(F_n\) fermés, l''un des \(F_n\) est d''intérieur non vide ?'
  verso: 'Par contraposée : si tous les \(\mathring F_n\) sont vides, \(\bigcup_n F_n\) est d''intérieur vide (version précédente de Baire) ; or \(\mathring X=X\neq\emptyset\), donc l''union ne vaut pas \(X\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 9'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [propriete]

- id: topo-a-026-1
  notion: topo-n-0074
  recto: 'Définir un recouvrement d''un ensemble \(X\).'
  verso: 'Une famille \((A_i)_{i\in I}\) de parties de \(X\) telle que \(X=\bigcup_{i\in I}A_i\).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 1'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [definition]
- id: topo-a-026-2
  notion: topo-n-0074
  recto: 'Définir un sous-recouvrement d''un recouvrement \((A_i)_{i\in I}\) de \(X\).'
  verso: 'Une sous-famille \((A_i)_{i\in J}\) avec \(J\subset I\) et \(X=\bigcup_{i\in J}A_i\).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 1'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [definition]

- id: topo-a-027-1
  notion: topo-n-0076
  recto: '\(\mathbb R\) usuel est-il compact ? Quel recouvrement le montre ?'
  verso: 'Non : \(\mathbb R=\bigcup_{n\in\mathbb Z}]n-1,n+1[\) est un recouvrement ouvert dont on ne peut extraire aucun sous-recouvrement fini.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 1'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [exemple]
- id: topo-a-027-2
  notion: topo-n-0076
  recto: 'Un espace métrique de cardinal fini est-il compact ?'
  verso: 'Oui.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 1'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [exemple]
- id: topo-a-027-3
  notion: topo-n-0076
  recto: 'Un espace métrique discret est-il compact ?'
  verso: 'Si et seulement s''il est de cardinal fini.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 1'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [exemple]

- id: topo-a-028-1
  notion: topo-n-0078
  recto: 'Soit \(A\) une partie d''un espace séparé \(X\). Caractériser la compacité de \(A\) avec des recouvrements par des ouverts de \(X\).'
  verso: '\(A\) est compacte si et seulement si, pour toute famille \((U_i)_{i\in I}\) d''ouverts de \(X\) avec \(A\subset\bigcup_{i\in I}U_i\), il existe \(J\subset I\) fini tel que \(A\subset\bigcup_{i\in J}U_i\).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 2'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [propriete]

- id: topo-a-029-1
  notion: topo-n-0079
  recto: 'Caractériser la compacité d''un espace séparé \(X\) à l''aide des fermés.'
  verso: '\(X\) est compact si et seulement si, pour toute famille \((F_i)_{i\in I}\) de fermés dont toute sous-famille finie a une intersection non vide, \(\bigcap_{i\in I}F_i\neq\emptyset\).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 2'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [propriete]

- id: topo-a-030-1
  notion: topo-n-0080
  recto: 'Que dire d''une partie compacte \(A\) d''un espace séparé \(X\) ?'
  verso: '\(A\) est fermée dans \(X\).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 2'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [propriete]
- id: topo-a-030-2
  notion: topo-n-0080
  recto: 'Si \(X\) est un espace séparé compact, que dire d''une partie fermée \(A\) de \(X\) ? Comment le prouver ?'
  verso: '\(A\) est compacte (donc dans un compact : compacte \(\Leftrightarrow\) fermée). Preuve : à un recouvrement ouvert de \(A\) ajouter l''ouvert \(A^c\) pour recouvrir \(X\), puis extraire un sous-recouvrement fini.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 2-3'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [propriete]
- id: topo-a-030-3
  notion: topo-n-0080
  recto: 'Comment démontre-t-on qu''une partie compacte \(A\) d''un espace séparé \(X\) est fermée ?'
  verso: 'Pour \(x\notin A\) et \(y\in A\), séparer : ouverts disjoints \(U_y\ni y\), \(V_y\ni x\). Compacité : \(A\subset\bigcup_{k=1}^n U_{y_k}\). Alors \(V=\bigcap_{k=1}^n V_{y_k}\) est ouvert, contient \(x\) et \(V\cap A=\emptyset\) : \(A^c\) est ouvert.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 2-3'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [propriete]

- id: topo-a-031-1
  notion: topo-n-0081
  recto: 'Que dire d''une partie compacte d''un espace métrique ? La réciproque est-elle vraie ?'
  verso: 'Elle est bornée (donc fermée et bornée). La réciproque est fausse en général.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 3'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [propriete]
- id: topo-a-031-2
  notion: topo-n-0081
  recto: 'Comment démontre-t-on qu''une partie compacte \(A\) d''un espace métrique \(X\) est bornée ?'
  verso: 'Fixer \(x\in X\) : \(A\subset X=\bigcup_{n\ge 1}B(x,n)\). Borel-Lebesgue donne un sous-recouvrement fini, donc \(A\subset B(x,N)\) pour un \(N\).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 3-4'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [propriete]

- id: topo-a-032-1
  notion: topo-n-0083
  recto: 'Énoncer le lemme (théorème) de Lebesgue.'
  verso: 'Si l''espace métrique \((X,d)\) vérifie la propriété de Bolzano-Weierstrass (toute suite a une valeur d''adhérence), alors pour tout recouvrement de \(X\) par des ouverts \((U_i)_{i\in I}\), il existe \(\epsilon > 0\) tel que pour tout \(x\in X\), il existe \(i\in I\) avec \(B(x,\epsilon)\subset U_i\).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 4'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [theoreme]
- id: topo-a-032-2
  notion: topo-n-0083
  recto: 'Comment démontre-t-on le lemme de Lebesgue ?'
  verso: 'Par l''absurde : pour tout \(n\) il existe \(u_n\) avec \(B(u_n,\frac1n)\) dans aucun \(U_i\). Une valeur d''adhérence \(x\) de \((u_n)\), une sous-suite \(u_{\varphi(n)}\to x\), \(x\in U_i\), \(B(x,\epsilon)\subset U_i\) : pour \(N\) grand, \(B(u_{\varphi(N)},\frac1{\varphi(N)})\subset B(x,\epsilon)\subset U_i\), contradiction.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 5'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [theoreme]

- id: topo-a-033-1
  notion: topo-n-0085
  recto: 'Que dire d''une suite d''un espace métrique compact ayant au plus une valeur d''adhérence ?'
  verso: 'Elle converge (vers son unique valeur d''adhérence).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 6'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [propriete]
- id: topo-a-033-2
  notion: topo-n-0085
  recto: 'Comment démontre-t-on qu''une suite d''un compact avec une unique valeur d''adhérence \(x\) converge vers \(x\) ?'
  verso: 'Pour \(\epsilon > 0\), poser \(F_n=\overline{\{u_m : m\ge n\}}\setminus B(x,\epsilon)\) : fermés décroissants d''intersection \(\{x\}\setminus B(x,\epsilon)=\emptyset\). Par compacité (fermés), un \(F_N\) est vide : \(u_n\in B(x,\epsilon)\) pour \(n\ge N\).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 6'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [propriete]

- id: topo-a-034-1
  notion: topo-n-0086
  recto: 'Un espace métrique compact est-il complet ?'
  verso: 'Oui, tout espace métrique compact est complet.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 7'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [propriete]
- id: topo-a-034-2
  notion: topo-n-0086
  recto: 'Comment démontre-t-on qu''un espace métrique compact est complet ?'
  verso: 'Une suite de Cauchy d''un compact a une valeur d''adhérence (Bolzano-Weierstrass), et une suite de Cauchy ayant une valeur d''adhérence converge.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 7'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [propriete]
- id: topo-a-034-3
  notion: topo-n-0086
  recto: 'Un espace métrique complet est-il compact ? Contre-exemple.'
  verso: 'Non : \(\mathbb R\) usuel est complet mais n''est pas compact (ni même borné).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 7'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [propriete]

- id: topo-a-035-1
  notion: topo-n-0088
  recto: 'Sur \(\mathbb R\), avec \(d(x,y)=\dfrac{|x-y|}{1+|x-y|}\), l''espace \((\mathbb R,d)\) est-il fermé borné ? compact ? Que montre cet exemple sur « borné » ?'
  verso: 'Fermé et borné (\(\operatorname{diam}(\mathbb R)=1\)) mais pas compact : la suite \((n)\) n''a pas de valeur d''adhérence. \(d\) est topologiquement équivalente à la distance usuelle : « borné » est une propriété métrique, pas topologique.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 8'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [exemple]
- id: topo-a-035-2
  notion: topo-n-0088
  recto: 'L''espace \(]0,1[\) (distance usuelle) est-il compact ? Qu''illustre-t-il sur « fermé borné » ?'
  verso: 'Non : \(]0,1[\) est fermé et borné dans lui-même, mais la suite \((\frac1n)\) n''y a pas de valeur d''adhérence.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 8'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [exemple]

- id: topo-a-036-1
  notion: topo-n-0094
  recto: 'Que dire d''une bijection continue \(f:X\to Y\) entre espaces métriques avec \(X\) compact ?'
  verso: '\(f\) est un homéomorphisme (sa réciproque est continue).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 11'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 3
  tags: [propriete]
- id: topo-a-036-2
  notion: topo-n-0094
  recto: 'Comment démontre-t-on qu''une bijection continue \(f:X\to Y\) avec \(X\) compact est bicontinue ?'
  verso: '\(f^{-1}\) continue revient à : \(f(F)\) fermé pour tout fermé \(F\) de \(X\). Or \(F\) fermé dans le compact \(X\) est compact, \(f(F)\) est compact (image continue), donc fermé.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 11'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 3
  tags: [propriete]
- id: topo-a-037-1
  notion: null
  recto: 'Extraction diagonale : \(X\) est un espace métrique compact et \((x^p)_{p\in\mathbb N}\) une suite d''éléments de \(X^{\mathbb N}\), \(x^p=(x^p_n)_{n}\). Quel est le but et comment construit-on la sous-suite ?'
  verso: 'But : une extractrice \(\psi\) telle que, pour tout \(n\), \((x^{\psi(p)}_n)_p\) converge. Construction : \(X\) compact donc séquentiellement compact ; on prend \(\varphi_0\) avec \((x^{\varphi_0(p)}_0)_p\) convergente, puis \(\varphi_1\) avec \((x^{\varphi_0\circ\varphi_1(p)}_1)_p\) convergente, etc. Avec \(\theta_n=\varphi_0\circ\dots\circ\varphi_n\), on pose \(\psi(p)=\theta_p(p)\).'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans topo-td4-ex08'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [prerequis-l1l2, methode]
- id: topo-a-037-2
  notion: null
  recto: 'Extraction diagonale \(\psi(p)=\theta_p(p)\) (avec \(\theta_n=\varphi_0\circ\dots\circ\varphi_n\)) : pourquoi \(\psi\) est-elle strictement croissante et pourquoi la coordonnée \(n\) converge-t-elle ?'
  verso: '\(\psi(p+1)=\theta_p(\varphi_{p+1}(p+1))\ge\theta_p(p+1)>\theta_p(p)=\psi(p)\) (car \(\varphi(k)\ge k\) et \(\theta_p\) strictement croissante). Pour \(p\ge n\), \(\psi(p)\) est un indice de la suite extraite par \(\theta_n\) : \((x^{\psi(p)}_n)_{p\ge n}\) est une sous-suite de \((x^{\theta_n(q)}_n)_q\), qui converge ; donc elle converge aussi.'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans topo-td4-ex08'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [prerequis-l1l2, demonstration]
- id: topo-a-038-1
  notion: null
  recto: 'Identité du parallélogramme : énoncer dans un espace préhilbertien réel (\(\|x\|^2=\langle x,x\rangle\)).'
  verso: 'Pour tous \(x,y\) : \(\|x+y\|^2+\|x-y\|^2=2\left(\|x\|^2+\|y\|^2\right)\). Preuve : on développe les deux carrés, les termes croisés \(\pm2\langle x,y\rangle\) s''annulent.'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans topo-dm2022-23-ex02'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [prerequis-l1l2, propriete]
- id: topo-a-038-2
  notion: null
  recto: 'Norme euclidienne sur \(\mathbb R^d\) : \(\|b-x\|\le r\) et \(\|b-x''\|\le r\). Majorer \(\|b-m\|\), où \(m=\frac{x+x''}2\), à l''aide de l''identité du parallélogramme.'
  verso: 'Avec \(u=b-x\), \(v=b-x''\) (\(u+v=2(b-m)\), \(u-v=x''-x\)) : \(\|b-m\|^2=\tfrac12\|b-x\|^2+\tfrac12\|b-x''\|^2-\tfrac14\|x-x''\|^2\le r^2-\tfrac14\|x-x''\|^2\). Si \(x\ne x''\), c''est strictement inférieur à \(r^2\) : un borné contenu dans deux boules fermées distinctes de rayon minimal \(r_0\) tiendrait dans une boule de rayon \(< r_0\), absurde.'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans topo-dm2022-23-ex02'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [prerequis-l1l2, methode]
