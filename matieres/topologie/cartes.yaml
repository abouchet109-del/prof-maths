# Cartes de topologie (Paris Cité L3). Pages = repères "--- page N ---" du PDF.
- id: topo-a-001-1
  notion: topo-n-0007
  recto: 'Exemple : topologie discrète et topologie grossière'
  verso: 'Soit \(X\) un ensemble non vide. \(\mathcal P(X)\) et \(\{\emptyset,X\}\) sont des topologies sur \(X\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 2'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [exemple]
- id: topo-a-001-2
  notion: topo-n-0007
  recto: 'Exemple : \((X,\mathcal P(X))\) est séparé'
  verso: 'Soit \(X\) un ensemble non vide ; \(x\neq y\) sont deux points de \(X\). \((X,\mathcal P(X))\) est un espace topologique séparé (prendre \(U=\{x\}\) et \(V=\{y\}\)).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 3'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [exemple]
- id: topo-a-001-3
  notion: topo-n-0007
  recto: 'Exemple : \((X,\{\emptyset,X\})\) n''est pas séparé'
  verso: 'Soit \(X\) un ensemble non vide ; \(x\neq y\) sont deux points de \(X\). \((X,\{\emptyset,X\})\) n''est pas séparé (le seul ouvert contenant \(x\) ou \(y\) est \(X\)).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 3'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [exemple]
- id: topo-a-001-4
  notion: topo-n-0007
  recto: 'Exemple : suite à plusieurs limites'
  verso: 'Un espace topologique non séparé peut avoir des propriétés surprenantes. Par exemple, une suite convergente peut avoir plusieurs limites.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 3'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [exemple]

- id: topo-a-002-1
  notion: topo-n-0009
  recto: 'Rem. 2 : seconde inégalité triangulaire'
  verso: 'Soit \((X,d)\) un espace métrique. On déduit facilement de l''inégalité triangulaire que \(|d(x,y)-d(y,z)|\le d(x,z)\), \(\forall x,y,z\in X\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 3'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]

- id: topo-a-003-1
  notion: topo-n-0010
  recto: 'Exemple : distance \(d_\infty\)'
  verso: 'Soit \(n\in\mathbb N^*\). \(d_\infty:(x,y)\mapsto\max_{k\in\{1,\dots,n\}}|x_k-y_k|\) est une distance sur \(\mathbb R^n\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 3'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [exemple]
- id: topo-a-003-2
  notion: topo-n-0010
  recto: 'Exemple : distances \(d_p\)'
  verso: 'Soit \(n\in\mathbb N^*\). Pour tout \(p\in[1,+\infty[\), \(d_p:(x,y)\mapsto\left(\sum_{k=1}^n|x_k-y_k|^p\right)^{1/p}\) est une distance sur \(\mathbb R^n\). En particulier, \(d_2\) est la distance euclidienne.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 3'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [exemple]
- id: topo-a-003-3
  notion: topo-n-0010
  recto: 'Exemple : distance discrète'
  verso: 'Soit \(X\) un ensemble non vide. L''application \(d:(x,y)\mapsto 1\) si \(x\neq y\), \(0\) si \(x=y\), est une distance sur \(X\) appelée distance discrète.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 3'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [exemple]

- id: topo-a-004-1
  notion: topo-n-0014
  recto: 'Prop. 5 : boule ouverte et boule fermée'
  verso: 'Soit \((X,d)\) un espace métrique. Une boule ouverte est ouverte et une boule fermée est fermée.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 4'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]
- id: topo-a-004-2
  notion: topo-n-0014
  recto: 'Preuve : une boule ouverte est ouverte (Prop. 5)'
  verso: 'Soit \((X,d)\) un espace métrique, \(x\in X\) et \(r > 0\). Soit \(y\in B(x,r)\), donc \(d(x,y) < r\). Posons \(\epsilon=r-d(x,y) > 0\).<br>Pour tout \(z\in B(y,\epsilon)\) : \(d(x,z)\le d(x,y)+d(y,z) < (r-\epsilon)+\epsilon=r\).<br>Donc \(B(y,\epsilon)\subset B(x,r)\) et la boule \(B(x,r)\) est ouverte.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 5'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]
- id: topo-a-004-3
  notion: topo-n-0014
  recto: 'Preuve : une boule fermée est fermée (Prop. 5)'
  verso: 'Soit \((X,d)\) un espace métrique, \(x\in X\) et \(r > 0\). Si \(\overline B(x,r)=X\), c''est immédiat. Sinon, soit \(y\in(\overline B(x,r))^c=\{z\in X / d(x,z) > r\}\). Posons \(\epsilon=d(x,y)-r > 0\).<br>Pour tout \(z\in B(y,\epsilon)\) : \(d(x,z)\ge d(x,y)-d(y,z) > (r+\epsilon)-\epsilon=r\). Donc \(B(y,\epsilon)\subset(\overline B(x,r))^c\), qui est ouvert : la boule fermée est fermée.<br>(le poly écrit \((r-\epsilon)-\epsilon\) : coquille, car \(d(x,y)=r+\epsilon\))'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 5'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]

- id: topo-a-005-1
  notion: topo-n-0015
  recto: 'Déf : distance entre deux parties'
  verso: 'Soient \((X,d)\) un espace métrique et \(A,B\in\mathcal P(X)\) non vides. On pose, pour tout \(a\in A\), \(d(a,B)=\inf_{b\in B}d(a,b)\) et \(d(A,B)=\inf_{a\in A}d(a,B)=\inf_{(a,b)\in A\times B}d(a,b)\).<br>(le poly écrit seulement \(A,B\in\mathcal P(X)\) ; il faut des parties non vides pour que ces bornes inférieures soient finies)'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 5'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [definition]

- id: topo-a-006-1
  notion: topo-n-0019
  recto: 'Prop. 7 (i) : intérieur, plus grand ouvert'
  verso: 'Soit \((X,\tau)\) un espace topologique et \(A\in\mathcal P(X)\). \(\mathring A\) est le plus grand ouvert inclus dans \(A\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 6'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]
- id: topo-a-006-2
  notion: topo-n-0019
  recto: 'Prop. 7 (ii) : ouvert et intérieur'
  verso: 'Soit \((X,\tau)\) un espace topologique et \(A\in\mathcal P(X)\). \(A\) est ouvert si et seulement si \(A=\mathring A\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 6'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]

- id: topo-a-007-1
  notion: topo-n-0031
  recto: 'Prop. 14 : distance induite, sous-espace métrique'
  verso: 'Soient \((X,d)\) un espace métrique et \(Y\in\mathcal P(X)\) une partie non vide. La restriction de \(d\) à \(Y\times Y\) est une distance sur \(Y\) appelée distance induite par \(d\). On dit que \((Y,d_{Y\times Y})\) est un sous-espace métrique de \((X,d)\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 9'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [definition]
- id: topo-a-007-2
  notion: topo-n-0031
  recto: 'Preuve : boule d''un sous-espace métrique (Prop. 15)'
  verso: 'Soient \((X,d)\) un espace métrique, \(Y\in\mathcal P(X)\) non vide, \(x\in Y\) et \(r_x > 0\). La boule de centre \(x\) et de rayon \(r_x\) dans \((Y,d)\) est \(B_Y(x,r_x)=\{y\in Y / d(x,y) < r_x\}=B(x,r_x)\cap Y\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 9'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [definition]

- id: topo-a-008-1
  notion: topo-n-0034
  recto: 'Déf : distances uniformément équivalentes'
  verso: 'Soient \(d\) et \(\delta\) deux distances sur un même ensemble \(X\). On dit que \(d\) et \(\delta\) sont uniformément équivalentes si et seulement si, pour tout \(\epsilon > 0\), il existe \(\alpha > 0\) tel que, pour tous \(x,y\in X\),<br>\(d(x,y) < \alpha\Rightarrow\delta(x,y) < \epsilon\)<br>\(\delta(x,y) < \alpha\Rightarrow d(x,y) < \epsilon\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 11'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [definition]
- id: topo-a-008-2
  notion: topo-n-0034
  recto: 'Déf : distances topologiquement équivalentes'
  verso: 'Soient \(d\) et \(\delta\) deux distances sur un même ensemble \(X\). On dit que \(d\) et \(\delta\) sont topologiquement équivalentes si et seulement si, pour tous \(x\in X\) et \(\epsilon > 0\), il existe \(\alpha > 0\) tel que, pour tout \(y\in X\),<br>\(d(x,y) < \alpha\Rightarrow\delta(x,y) < \epsilon\)<br>\(\delta(x,y) < \alpha\Rightarrow d(x,y) < \epsilon\).<br>(différence avec l''équivalence uniforme : ici \(\alpha\) dépend de \(x\) et \(\epsilon\) ; là, \(\alpha\) ne dépend que de \(\epsilon\))'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 11'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [definition]

- id: topo-a-009-1
  notion: topo-n-0036
  recto: 'Prop. 18 : équivalences Lipschitz, uniforme, topologique'
  verso: 'Soient \(d\) et \(\delta\) deux distances sur un même ensemble \(X\).<br>Lipschitz équivalentes \(\Rightarrow\) uniformément équivalentes \(\Rightarrow\) topologiquement équivalentes.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 12'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]

- id: topo-a-010-1
  notion: topo-n-0038
  recto: 'Prop. 19 : distance sur un produit dénombrable'
  verso: 'Soient \(((X_k,d_k))_{k\in\mathbb N}\) une famille dénombrable d''espaces métriques et \(X=\prod_{k=0}^{+\infty}X_k\) l''ensemble produit. Posons \(d(x,y)=\sum_{k=0}^{+\infty}2^{-k}\dfrac{d_k(x_k,y_k)}{1+d_k(x_k,y_k)}\), \(\forall x,y\in X\). La fonction \(d\) est bien définie car la série \(\sum_k2^{-k}\) est convergente.<br>La fonction \(d\) est une distance sur l''espace produit \(X\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 13'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]
- id: topo-a-010-2
  notion: topo-n-0038
  recto: 'Rem. : pas de somme simple sur un produit dénombrable'
  verso: 'Soient \(((X_k,d_k))_k\) des espaces métriques. On ne peut pas étendre directement la distance \(D(x,y)=\sum_{k=1}^nd_k(x_k,y_k)\) du produit fini à un produit dénombrable d''espaces métriques, car la série \(\sum_kd_k(x_k,y_k)\) n''est pas convergente, en général.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 11'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]

- id: topo-a-011-1
  notion: topo-n-0045
  recto: 'Prop. 24 : valeur d''adhérence et suite extraite'
  verso: 'Soit \((u_n)_{n\in\mathbb N}\) une suite d''un espace métrique \((X,d)\). Un point \(x\in X\) est valeur d''adhérence de la suite \((u_n)_{n\in\mathbb N}\) si et seulement si \((u_n)_{n\in\mathbb N}\) possède une suite extraite qui converge vers \(x\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 15'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]

- id: topo-a-012-1
  notion: topo-n-0046
  recto: 'Prop. 25 : ensemble des valeurs d''adhérence'
  verso: 'Soit \((u_n)_{n\in\mathbb N}\) une suite d''un espace métrique \((X,d)\). L''ensemble des valeurs d''adhérence de la suite \((u_n)_{n\in\mathbb N}\) est le fermé \(\bigcap_{n\in\mathbb N}\overline{\{u_m / m\ge n\}}\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 15'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]

- id: topo-a-013-1
  notion: topo-n-0050
  recto: 'Déf : homéomorphisme'
  verso: 'Soit \(f\) une application entre deux espaces métriques \((X,d)\) et \((Y,\delta)\). On dit que \(f\) est un homéomorphisme (ou un isomorphisme d''espace topologique) si et seulement si \(f\) est une bijection continue dont la bijection réciproque est continue (i.e. \(f\) est une bijection bi-continue). On dit alors que \((X,d)\) et \((Y,\delta)\) sont homéomorphes.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 17'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [definition]

- id: topo-a-014-1
  notion: topo-n-0051
  recto: 'Rem. 1 : isométrie, lipschitzienne, uniformément continue, continue'
  verso: 'Soit \(f\) une application entre deux espaces métriques \((X,d)\) et \((Y,\delta)\).<br>\(f\) est une isométrie \(\Rightarrow\) \(f\) est lipschitzienne \(\Rightarrow\) \(f\) est uniformément continue \(\Rightarrow\) \(f\) est continue.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 18'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]
- id: topo-a-014-2
  notion: topo-n-0051
  recto: 'Rem. 2 : une isométrie surjective est un homéomorphisme'
  verso: 'Soit \(f:(X,d)\to(Y,\delta)\) une isométrie entre deux espaces métriques. Une isométrie surjective est un homéomorphisme. En effet, une isométrie est injective, donc une isométrie surjective est bijective. L''égalité \(\delta(f(x),f(x''))=d(x,x'')\), \(\forall x,x''\in X\), est alors équivalente à \(\delta(y,y'')=d(f^{-1}(y),f^{-1}(y''))\), \(\forall y,y''\in Y\), ce qui prouve que \(f^{-1}\) est continue.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 18'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]

- id: topo-a-015-1
  notion: topo-n-0052
  recto: 'Rem. 3 (i) : équivalence topologique et applications identité'
  verso: 'Deux distances \(d\) et \(\delta\) sur un même ensemble \(X\) sont topologiquement équivalentes ssi les applications identité de \((X,d)\) dans \((X,\delta)\) et de \((X,\delta)\) dans \((X,d)\) sont continues.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 18'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]
- id: topo-a-015-2
  notion: topo-n-0052
  recto: 'Rem. 3 (ii) : équivalence uniforme et applications identité'
  verso: 'Deux distances \(d\) et \(\delta\) sur un même ensemble \(X\) sont uniformément équivalentes ssi les applications identité de \((X,d)\) dans \((X,\delta)\) et de \((X,\delta)\) dans \((X,d)\) sont uniformément continues.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 18'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]
- id: topo-a-015-3
  notion: topo-n-0052
  recto: 'Rem. 3 (iii) : équivalence Lipschitz et applications identité'
  verso: 'Deux distances \(d\) et \(\delta\) sur un même ensemble \(X\) sont Lipschitz équivalentes ssi les applications identité de \((X,d)\) dans \((X,\delta)\) et de \((X,\delta)\) dans \((X,d)\) sont lipschitziennes.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 18'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]

- id: topo-a-016-1
  notion: topo-n-0058
  recto: 'Déf : partie bornée'
  verso: 'Soit \((X,d)\) un espace métrique. On dit qu''une partie \(A\in\mathcal P(X)\) est bornée s''il existe \(M > 0\) tel que \(d(x,y)\le M\), pour tous \(x,y\in A\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 2'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [definition]
- id: topo-a-016-2
  notion: topo-n-0058
  recto: 'Déf : diamètre d''une partie bornée'
  verso: 'Soit \(A\) une partie bornée d''un espace métrique \((X,d)\). On définit le diamètre de \(A\) en posant \(\operatorname{diam}(A)=\sup_{x,y\in A}d(x,y)\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 2'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [definition]
- id: topo-a-016-3
  notion: topo-n-0058
  recto: 'Rem. 1 : partie bornée et boule'
  verso: 'Soient \((X,d)\) un espace métrique et \(x\in X\). On montre facilement que une partie \(A\in\mathcal P(X)\) est bornée si et seulement si il existe \(r > 0\) tel que \(A\subset B(x,r)\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 2'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [definition]
- id: topo-a-016-4
  notion: topo-n-0058
  recto: 'Rem. 2 : diamètre de l''intérieur et de l''adhérence'
  verso: 'Soient \((X,d)\) un espace métrique et \(A,B\in\mathcal P(X)\). Dans un espace métrique, on vérifie que \(A\subset B\Rightarrow\operatorname{diam}(A)\le\operatorname{diam}(B)\). En particulier, \(\operatorname{diam}(\mathring A)\le\operatorname{diam}(A)=\operatorname{diam}(\overline A)\), avec la convention \(\operatorname{diam}(\emptyset)=0\).<br>(le poly ne donne pas cette convention, nécessaire si \(\mathring A=\emptyset\))'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 2'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [definition]

- id: topo-a-017-1
  notion: topo-n-0061
  recto: 'Prop. 32 : produit fini d''espaces complets'
  verso: 'Soit \(((X_k,d_k))_{k=1}^n\) une famille finie d''espaces métriques complets. On note \(X=\prod_{k=1}^nX_k\) l''espace produit et \(D\) la distance définie par \(D(x,y)=\sum_{k=1}^nd_k(x_k,y_k)\), \(\forall x,y\in X\). L''espace métrique \((X,D)\) est alors complet.<br>Remarques : on montre de même que, pour tout \(p\in[1,+\infty]\), \((X,D_p)\) est complet ; on en déduit que \(\mathbb R^n\), \(\mathbb C\) et \(\mathbb C^n\) sont complets, pour tout \(n\in\mathbb N^*\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 3-4'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 3
  tags: [propriete]

- id: topo-a-018-1
  notion: topo-n-0064
  recto: 'Thm 1 : prolongement des applications uniformément continues'
  verso: 'Soient \((X,d)\) et \((Y,\delta)\) deux espaces métriques, \(A\in\mathcal P(X)\) et \(f\) une application uniformément continue de \((A,d)\) dans \((Y,\delta)\). Si \(Y\) est complet et \(A\) est dense dans \(X\), alors \(f\) possède un unique prolongement continu sur \(X\). De plus, ce prolongement est uniformément continu.'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 5'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 3
  tags: [theoreme]
- id: topo-a-018-2
  notion: topo-n-0064
  recto: 'Preuve : définition du prolongement \(\tilde f\) (Thm 1)'
  verso: 'Soient \((X,d)\) et \((Y,\delta)\) deux espaces métriques, \(Y\) complet, \(A\) une partie dense de \(X\) et \(f:A\to Y\) uniformément continue. Soit \(x\in X\). Comme \(A\) est dense, il existe une suite \((u_n)\) de \(A\) avec \(u_n\to x\). Cette suite est de Cauchy, donc \((f(u_n))\) est de Cauchy dans \((Y,\delta)\) (\(f\) uniformément continue), donc converge vers un \(y\in Y\) complet.<br>Ce \(y\) ne dépend pas du choix de la suite (deux suites convergeant vers \(x\) ont des images de même limite). On pose \(\tilde f(x)=y\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 5'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 3
  tags: [theoreme]

- id: topo-a-019-1
  notion: topo-n-0066
  recto: 'Exemple : \(\sqrt{1+x^2}-1\) contractante sur \([-M,M]\)'
  verso: 'Pour tout \(M > 0\), la fonction \(f:x\mapsto\sqrt{1+x^2}-1\) est contractante sur \([-M,M]\), mais ne l''est pas sur \(\mathbb R\). En effet, pour tout \(x\in[-M,M]\), on a \(|f''(x)|=\left|\dfrac{x}{\sqrt{1+x^2}}\right|\le\dfrac{M}{\sqrt{1+M^2}} < 1\). Donc, par l''inégalité des accroissements finis, \(|f(x)-f(y)|\le\dfrac{M}{\sqrt{1+M^2}}|x-y|\), \(\forall x,y\in[-M,M]\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 6'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 3
  tags: [exemple]
- id: topo-a-019-2
  notion: topo-n-0066
  recto: 'Exemple : \(\sqrt{1+x^2}-1\) non contractante sur \(\mathbb R\)'
  verso: 'Soit \(f:x\mapsto\sqrt{1+x^2}-1\). Il n''existe pas de \(C < 1\) tel que \(|f(x)-f(y)|\le C|x-y|\), \(\forall x,y\in\mathbb R\). En effet, si une constante \(C\) vérifie cette inégalité, en faisant tendre \(y\) vers \(+\infty\) (\(x\) fixé) dans \(\left|\dfrac{f(x)-f(y)}{x-y}\right|\le C\), on obtient \(1\le C\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 6'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 3
  tags: [exemple]

- id: topo-a-020-1
  notion: topo-n-0068
  recto: 'Thm 2 : point fixe de Picard'
  verso: 'Toute application contractante d''un espace métrique complet non vide dans lui-même possède un unique point fixe.<br>Remarque du poly : la démonstration construit \(u_{n+1}=f(u_n)\) à partir d''un \(u_0\in X\) (méthode de point fixe) : le théorème dit que la solution existe, sa démonstration dit comment la calculer.<br>(le poly omet « non vide » : la preuve part d''un \(u_0\in X\), et sur \(X=\emptyset\) il n''y a pas de point fixe)'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 7'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [methode]
- id: topo-a-020-2
  notion: topo-n-0068
  recto: 'Preuve : la suite \((u_n)\) est de Cauchy (Thm 2)'
  verso: 'Soit \((X,d)\) un espace métrique complet non vide et \(f:X\to X\) contractante de rapport \(C\in]0,1[\). Étant donné \(u_0\in X\), on pose \(u_{n+1}=f(u_n)\). Alors \(d(u_{n+1},u_n)\le C\,d(u_n,u_{n-1})\le\dots\le C^nd(u_1,u_0)\), puis pour \(p > q\) : \(d(u_p,u_q)\le\sum_{n=q}^{p-1}C^nd(u_1,u_0)\le\dfrac{C^q}{1-C}d(u_1,u_0)\).<br>Comme \(C^q\to0\), la suite \((u_n)\) est de Cauchy.'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 7'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [methode]
- id: topo-a-020-3
  notion: topo-n-0068
  recto: 'Preuve : la limite est un point fixe (Thm 2)'
  verso: 'Soit \(f:X\to X\) contractante sur l''espace métrique complet \((X,d)\), \(u_0\in X\) et \(u_{n+1}=f(u_n)\). La suite \((u_n)\) est de Cauchy et \(X\) est complet, donc il existe \(a\in X\) tel que \(u_n\to a\). Comme \(f\) est continue, en faisant tendre \(n\) vers \(+\infty\) dans l''identité \(f(u_n)=u_{n+1}\), on obtient \(f(a)=a\) : \(a\) est un point fixe de \(f\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 7'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [methode]
- id: topo-a-020-4
  notion: topo-n-0068
  recto: 'Preuve : unicité du point fixe (Thm 2)'
  verso: 'Soit \(f:X\to X\) contractante de rapport \(C\in]0,1[\) sur un espace métrique \((X,d)\). Supposons que \(f\) possède deux points fixes \(a_1\) et \(a_2\). On a alors \(d(a_1,a_2)=d(f(a_1),f(a_2))\le C\,d(a_1,a_2)\) où \(C < 1\), ce qui conduit à \(d(a_1,a_2)=0\), i.e. \(a_1=a_2\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 7'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [methode]

- id: topo-a-021-1
  notion: topo-n-0069
  recto: 'Rem. : Picard faux avec \(|f(x)-f(y)| < |x-y|\)'
  verso: 'Dans le théorème de point fixe de Picard, on ne peut pas remplacer l''hypothèse « \(f\) est contractante » par « \(|f(x)-f(y)| < |x-y|\), \(\forall x,y\in X\), \(x\neq y\) ». En effet, considérons la fonction \(f:x\mapsto\sqrt{1+x^2}\). Elle vérifie l''inégalité \(|f(x)-f(y)| < |x-y|\) pour \(x\neq y\) car \(|f''(x)|=\dfrac{|x|}{\sqrt{1+x^2}} < 1\), \(\forall x\in\mathbb R\). Mais il n''existe pas de \(a\in\mathbb R\) tel que \(f(a)=a\) (élevée au carré, cette identité devient \(1+a^2=a^2\)).<br>(le poly écrit « \(\forall x,y\in X\) » : l''inégalité stricte est fausse pour \(x=y\))'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 7'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 2
  tags: [exemple]

- id: topo-a-022-1
  notion: topo-n-0070
  recto: 'Thm 3 : théorème de Baire'
  verso: 'Pour toute famille dénombrable \((O_n)_{n\in\mathbb N}\) d''ouverts denses dans un espace métrique complet \((X,d)\), l''ensemble \(\bigcap_{n\in\mathbb N}O_n\) est dense dans \(X\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 8'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [theoreme]

- id: topo-a-023-1
  notion: topo-n-0071
  recto: 'Preuve : Baire, début de la construction (Thm 3)'
  verso: 'Soit \((O_n)_{n\in\mathbb N}\) une famille d''ouverts denses d''un espace métrique complet \((X,d)\) et \(V\) un ouvert non vide. Il s''agit de montrer \(\left(\bigcap_nO_n\right)\cap V\neq\emptyset\) pour tout ouvert \(V\). Comme \(O_0\) est dense, \(O_0\cap V\neq\emptyset\) ; soit \(u_0\in O_0\cap V\). Comme \(O_0\cap V\) est ouvert, il existe \(r_0 > 0\) tel que \(\overline B(u_0,r_0)\subset O_0\cap V\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 8'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 3
  tags: [demonstration]
- id: topo-a-023-2
  notion: topo-n-0071
  recto: 'Preuve : Baire, récurrence sur les boules (Thm 3)'
  verso: 'Soit \((O_n)_{n\ge0}\) une famille d''ouverts denses d''un espace métrique complet \((X,d)\), \(V\) un ouvert non vide, et \(u_{n-1}\in X\), \(r_{n-1} > 0\) le point et le rayon déjà construits. Comme \(O_n\) est dense dans \(X\), \(O_n\cap B(u_{n-1},r_{n-1})\neq\emptyset\) et on peut choisir \(u_n\) dedans. Cet ensemble étant ouvert, on peut aussi choisir \(r_n\in]0,\frac1n]\) tel que \(\overline B(u_n,r_n)\subset O_n\cap B(u_{n-1},r_{n-1})\).<br>La suite \(\left(\overline B(u_n,r_n)\right)_n\) est ainsi décroissante.'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 8'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 3
  tags: [demonstration]
- id: topo-a-023-3
  notion: topo-n-0071
  recto: 'Preuve : Baire, conclusion (Thm 3)'
  verso: 'Soit \((O_n)_{n\in\mathbb N}\) une famille d''ouverts denses d''un espace métrique complet \((X,d)\) et \(V\) un ouvert non vide. On note \(\overline B(u_n,r_n)\) les boules fermées emboîtées construites, avec \(r_n\to0\). On a \(\operatorname{diam}\overline B(u_n,r_n)\le2r_n\to0\). \(X\) étant complet, la proposition 30 donne \(\bigcap_n\overline B(u_n,r_n)\neq\emptyset\). Comme \(\overline B(u_n,r_n)\subset O_n\cap V\), on en déduit \(\left(\bigcap_nO_n\right)\cap V=\bigcap_n(O_n\cap V)\neq\emptyset\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 8'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 3
  tags: [demonstration]

- id: topo-a-024-1
  notion: topo-n-0072
  recto: 'Cor. 3 : union dénombrable de fermés d''intérieur vide'
  verso: 'Pour toute famille dénombrable \((F_n)_{n\in\mathbb N}\) de fermés d''intérieur vide d''un espace métrique complet \((X,d)\), l''ensemble \(\bigcup_{n\in\mathbb N}F_n\) est d''intérieur vide.'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 9'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [propriete]
- id: topo-a-024-2
  notion: topo-n-0072
  recto: 'Preuve : Cor. 3 à partir de Baire'
  verso: 'Soit \((F_n)_{n\in\mathbb N}\) une famille de fermés d''intérieur vide d''un espace métrique complet \((X,d)\). Pour tout \(n\in\mathbb N\), notons \(O_n\) le complémentaire de \(F_n\) dans \(X\). On a \(\overline{O_n}=(\mathring F_n)^c=\emptyset^c=X\). Donc \(O_n\) est un ouvert dense dans \(X\), et par le théorème de Baire \(\bigcap_nO_n\) est dense. En passant au complémentaire, \(\left(\bigcup_nF_n\right)^\circ=\emptyset\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 9'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [propriete]

- id: topo-a-025-1
  notion: topo-n-0073
  recto: 'Cor. 4 : union dénombrable de fermés égale à \(X\)'
  verso: 'Soit \((F_n)_{n\in\mathbb N}\) une famille dénombrable de fermés d''un espace métrique complet non vide \((X,d)\) telle que \(\bigcup_{n\in\mathbb N}F_n=X\). Il existe \(n\in\mathbb N\) tel que \(\mathring F_n\neq\emptyset\).<br>(le poly ne suppose pas \(X\neq\emptyset\) ; pour \(X=\emptyset\) la conclusion est fausse)'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 9'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [propriete]
- id: topo-a-025-2
  notion: topo-n-0073
  recto: 'Preuve : Cor. 4 par contraposée'
  verso: 'Soit \((F_n)_{n\in\mathbb N}\) une famille de fermés d''un espace métrique complet non vide \((X,d)\) telle que \(\bigcup_nF_n=X\). Par contraposée : si \(\mathring F_n=\emptyset\) pour tout \(n\), alors, par le corollaire précédent, \(\left(\bigcup_nF_n\right)^\circ=\emptyset\neq X=\mathring X\) (car \(X\neq\emptyset\)), donc \(\bigcup_nF_n\neq X\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 9'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [propriete]

- id: topo-a-026-1
  notion: topo-n-0074
  recto: 'Déf : recouvrement'
  verso: 'Soit \(X\) un ensemble non vide. Une famille \((A_i)_{i\in I}\) de parties de \(X\) est appelée recouvrement de \(X\) si et seulement si \(X=\bigcup_{i\in I}A_i\).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 1'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [definition]
- id: topo-a-026-2
  notion: topo-n-0074
  recto: 'Déf : sous-recouvrement'
  verso: 'Soit \((A_i)_{i\in I}\) un recouvrement de \(X\). Si \(J\subset I\) et \(X=\bigcup_{i\in J}A_i\), on dit que \((A_i)_{i\in J}\) est un sous-recouvrement de \((A_i)_{i\in I}\).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 1'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [definition]

- id: topo-a-027-1
  notion: topo-n-0076
  recto: 'Exemple : \(\mathbb R\) n''est pas compact'
  verso: '\(\mathbb R\) usuel n''est pas compact (\(\mathbb R=\bigcup_{n\in\mathbb Z}]n-1,n+1[\)).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 1'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [exemple]
- id: topo-a-027-2
  notion: topo-n-0076
  recto: 'Exemple : espace métrique de cardinal fini'
  verso: 'Un espace métrique de cardinal fini est compact.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 1'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [exemple]
- id: topo-a-027-3
  notion: topo-n-0076
  recto: 'Exemple : espace métrique discret'
  verso: 'Un espace métrique discret est compact si et seulement s''il est de cardinal fini (en exercice).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 1'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [exemple]

- id: topo-a-028-1
  notion: topo-n-0078
  recto: 'Prop. 34 : compacité d''une partie par des ouverts de \(X\)'
  verso: 'Soient \((X,\tau)\) un espace topologique séparé et \(A\in\mathcal P(X)\). La partie \(A\) est un compact de \(X\) si et seulement si, pour toute famille \((U_i)_{i\in I}\) d''ouverts de \(X\) telle que \(A\subset\bigcup_{i\in I}U_i\), il existe \(J\subset I\) de cardinal fini tel que \(A\subset\bigcup_{i\in J}U_i\).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 2'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [propriete]

- id: topo-a-029-1
  notion: topo-n-0079
  recto: 'Prop. 35 : compacité et fermés'
  verso: 'Un espace topologique séparé \((X,\tau)\) est compact si et seulement si, pour toute famille \((F_i)_{i\in I}\) de fermés de \(X\) telle que, pour tout \(J\subset I\) de cardinal fini, on a \(\bigcap_{i\in J}F_i\neq\emptyset\), l''intersection \(\bigcap_{i\in I}F_i\) est non vide.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 2'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [propriete]

- id: topo-a-030-1
  notion: topo-n-0080
  recto: 'Prop. 36 (1) : un compact d''un séparé est fermé'
  verso: 'Soient \((X,\tau)\) un espace topologique séparé et \(A\in\mathcal P(X)\). Si \(A\) est compact, alors \(A\) est fermé dans \(X\).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 2'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [propriete]
- id: topo-a-030-2
  notion: topo-n-0080
  recto: 'Prop. 36 (2) : fermé d''un compact'
  verso: 'Soient \((X,\tau)\) un espace topologique séparé et \(A\in\mathcal P(X)\). Si de plus \(X\) est compact, alors \(A\) est compact si et seulement si \(A\) est fermé dans \(X\).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 2-3'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [propriete]
- id: topo-a-030-3
  notion: topo-n-0080
  recto: 'Preuve : un compact d''un séparé est fermé (Prop. 36)'
  verso: 'Soient \((X,\tau)\) un espace séparé et \(A\) un compact de \(X\). Soit \(x\in A^c\). Comme \(X\) est séparé, pour tout \(y\in A\), il existe \(U_y\) et \(V_y\) ouverts disjoints avec \(y\in U_y\), \(x\in V_y\). Par compacité de \(A\), \(A\subset\bigcup_{k=1}^nU_{y_k}\) pour des \(y_1,\dots,y_n\in A\).<br>Alors \(V=\bigcap_{k=1}^nV_{y_k}\) est un ouvert (intersection finie) qui contient \(x\), et \(V\cap A=\emptyset\), donc \(V\subset A^c\) : \(A^c\) est ouvert.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 2-3'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [propriete]

- id: topo-a-031-1
  notion: topo-n-0081
  recto: 'Prop. 37 : un compact d''un métrique est borné'
  verso: 'Toute partie compacte d''un espace métrique est bornée. En particulier, un espace métrique compact est borné. Un compact est donc fermé et borné, mais la réciproque est fausse, en général.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 3'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [propriete]
- id: topo-a-031-2
  notion: topo-n-0081
  recto: 'Preuve : un compact d''un métrique est borné (Prop. 37)'
  verso: 'Soit \((X,d)\) un espace métrique. Soient \(A\) une partie compacte et \(x\in X\). Comme \(A\subset X=\bigcup_{n\in\mathbb N^*}B(x,n)\), la propriété de Borel-Lebesgue donne \(J\subset\mathbb N\) fini tel que \(A\subset\bigcup_{n\in J}B(x,n)=B(x,\max(J))\). Donc \(A\) est bornée.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 3-4'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [propriete]

- id: topo-a-032-1
  notion: topo-n-0083
  recto: 'Lemme 1 : théorème de Lebesgue'
  verso: 'Si l''espace métrique \((X,d)\) satisfait la propriété de Bolzano-Weierstrass (toute suite de l''espace possède une valeur d''adhérence), alors, pour tout recouvrement de \(X\) par des ouverts \((U_i)_{i\in I}\), il existe \(\epsilon > 0\) tel que, pour tout \(x\in X\), il existe un \(i\in I\) pour lequel \(B(x,\epsilon)\subset U_i\).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 4'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [theoreme]
- id: topo-a-032-2
  notion: topo-n-0083
  recto: 'Preuve : lemme de Lebesgue (Lemme 1)'
  verso: 'Soit \((X,d)\) un espace métrique vérifiant Bolzano-Weierstrass et \((U_i)_{i\in I}\) un recouvrement de \(X\) par des ouverts. Par l''absurde : pour tout \(n\), il existe \(u_n\in X\) tel que, pour tout \(i\in I\), \(B(u_n,\frac1n)\not\subset U_i\). Par Bolzano-Weierstrass, \((u_n)\) a une valeur d''adhérence \(x\) et une sous-suite \((u_{\varphi(n)})\) converge vers \(x\). Il existe \(i\) avec \(x\in U_i\), puis \(\epsilon > 0\) avec \(B(x,\epsilon)\subset U_i\).<br>Pour \(N\) tel que \(\varphi(N) > \frac2\epsilon\) et \(d(u_{\varphi(N)},x) < \frac\epsilon2\), on a \(B(u_{\varphi(N)},\frac1{\varphi(N)})\subset B(x,\epsilon)\subset U_i\), contradiction.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 5'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [theoreme]

- id: topo-a-033-1
  notion: topo-n-0085
  recto: 'Cor. 5 : suite d''un compact avec au plus une valeur d''adhérence'
  verso: 'Soient \((X,d)\) un espace métrique compact et \((u_n)_{n\in\mathbb N}\) une suite de \(X\). Si \((u_n)_{n\in\mathbb N}\) possède au plus une valeur d''adhérence, alors \((u_n)_{n\in\mathbb N}\) converge.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 6'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [propriete]
- id: topo-a-033-2
  notion: topo-n-0085
  recto: 'Preuve : Cor. 5'
  verso: 'La suite possède au moins une valeur d''adhérence par compacité, donc une unique, notée \(x\). Pour \(\epsilon > 0\), on définit les fermés \(F_n=\overline{\{u_m / m\ge n\}}\cap(B(x,\epsilon))^c\). Par la Prop. 25, \(\bigcap_nF_n=\emptyset\).<br>Par la Prop. 35, \(F_N=\emptyset\) pour un \(N\) (la suite des \(F_n\) est décroissante). Ainsi \(u_n\in B(x,\epsilon)\) pour tout \(n\ge N\) : la suite tend vers \(x\).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 6'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [propriete]

- id: topo-a-034-1
  notion: topo-n-0086
  recto: 'Cor. 6 : un compact métrique est complet'
  verso: 'Un espace métrique compact est complet.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 7'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [propriete]
- id: topo-a-034-2
  notion: topo-n-0086
  recto: 'Preuve : Cor. 6'
  verso: 'Soit \((u_n)_{n\in\mathbb N}\) une suite de Cauchy de l''espace métrique compact \((X,d)\). Cet espace étant compact, la suite possède une valeur d''adhérence. Comme la suite est de Cauchy, elle est alors convergente.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 7'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [propriete]
- id: topo-a-034-3
  notion: topo-n-0086
  recto: 'Exemple : complet non compact'
  verso: 'La réciproque du Cor. 6 est fausse. Par exemple, \(\mathbb R\) usuel est complet, mais n''est pas compact (ni même borné).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 7'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [propriete]

- id: topo-a-035-1
  notion: topo-n-0088
  recto: 'Rem. 1 : Prop. 38 fausse pour une autre distance sur \(\mathbb R\)'
  verso: 'La Prop. 38 (les compacts de \(\mathbb R\) usuel sont les parties fermées et bornées de \(\mathbb R\)) n''est pas vraie pour toutes les distances sur \(\mathbb R\). Par exemple, si \(d:(x,y)\mapsto\dfrac{|x-y|}{1+|x-y|}\), alors \((\mathbb R,d)\) est fermé et borné (car \(\operatorname{diam}(\mathbb R)=1\)), mais la suite \((n)_{n\in\mathbb N}\) n''a pas de valeur d''adhérence. La distance \(d\) est pourtant topologiquement équivalente à la distance usuelle sur \(\mathbb R\). Mais la bornitude n''est pas une propriété topologique, c''est une propriété métrique.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 8'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [exemple]
- id: topo-a-035-2
  notion: topo-n-0088
  recto: 'Rem. 2 : Prop. 38 fausse pour une partie de \(\mathbb R\)'
  verso: 'La Prop. 38 n''est pas vraie, non plus, pour toute partie de \(\mathbb R\) usuel. Par exemple, \(]0,1[\) est fermé et borné dans \(]0,1[\), mais la suite \((\frac1n)_n\) n''a pas de valeur d''adhérence.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 8'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [exemple]

- id: topo-a-036-1
  notion: topo-n-0094
  recto: 'Prop. 40 : bijection continue sur un compact'
  verso: 'Soit \(f:X\to Y\) une application continue et bijective entre deux espaces métriques. Si \(X\) est compact, alors \(f\) est un homéomorphisme.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 11'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 3
  tags: [propriete]
- id: topo-a-036-2
  notion: topo-n-0094
  recto: 'Preuve : Prop. 40'
  verso: 'Soit \(f:X\to Y\) continue bijective entre deux espaces métriques, \(X\) compact. Il suffit de montrer que \(f^{-1}\) est continue, c''est-à-dire que \(f(F)\) est fermé pour tout fermé \(F\) de \(X\). Comme \(X\) est compact et \(F\) fermé, \(F\) est compact. Son image \(f(F)\) par l''application continue \(f\) est donc compacte, et ainsi fermée.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 11'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 3
  tags: [propriete]
- id: topo-a-037-1
  notion: topo-p-0001
  recto: 'Extraction diagonale : \(X\) est un espace métrique compact et \((x^p)_{p\in\mathbb N}\) une suite d''éléments de \(X^{\mathbb N}\), \(x^p=(x^p_n)_{n}\). Quel est le but et comment construit-on la sous-suite ?'
  verso: 'But : une extractrice \(\psi\) telle que, pour tout \(n\), \((x^{\psi(p)}_n)_p\) converge. Construction : \(X\) compact donc séquentiellement compact ; on prend \(\varphi_0\) avec \((x^{\varphi_0(p)}_0)_p\) convergente, puis \(\varphi_1\) avec \((x^{\varphi_0\circ\varphi_1(p)}_1)_p\) convergente, etc. Avec \(\theta_n=\varphi_0\circ\dots\circ\varphi_n\), on pose \(\psi(p)=\theta_p(p)\).'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans topo-td4-ex08'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [prerequis-l1l2, methode]
- id: topo-a-037-2
  notion: topo-p-0001
  recto: 'Extraction diagonale \(\psi(p)=\theta_p(p)\) (avec \(\theta_n=\varphi_0\circ\dots\circ\varphi_n\)) : pourquoi \(\psi\) est-elle strictement croissante et pourquoi la coordonnée \(n\) converge-t-elle ?'
  verso: 'Les \(\varphi_n\) sont des extractrices (applications strictement croissantes de \(\mathbb N\) dans \(\mathbb N\)). \(\psi(p+1)=\theta_p(\varphi_{p+1}(p+1))\ge\theta_p(p+1)>\theta_p(p)=\psi(p)\) (car \(\varphi(k)\ge k\) et \(\theta_p\) strictement croissante). Pour \(p\ge n\), \(\psi(p)\) est un indice de la suite extraite par \(\theta_n\) : \((x^{\psi(p)}_n)_{p\ge n}\) est une sous-suite de \((x^{\theta_n(q)}_n)_q\), qui converge ; donc elle converge aussi.'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans topo-td4-ex08'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [prerequis-l1l2, demonstration]
- id: topo-a-038-1
  notion: topo-p-0002
  recto: 'Identité du parallélogramme : énoncer dans un espace préhilbertien réel (\(\|x\|^2=\langle x,x\rangle\)).'
  verso: 'Pour tous \(x,y\) : \(\|x+y\|^2+\|x-y\|^2=2\left(\|x\|^2+\|y\|^2\right)\). Preuve : on développe les deux carrés, les termes croisés \(\pm2\langle x,y\rangle\) s''annulent.'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans topo-dm2022-23-ex02'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [prerequis-l1l2, propriete]
- id: topo-a-038-2
  notion: topo-p-0002
  recto: 'Norme euclidienne sur \(\mathbb R^d\) : \(\|b-x\|\le r\) et \(\|b-x''\|\le r\). Majorer \(\|b-m\|\), où \(m=\frac{x+x''}2\), à l''aide de l''identité du parallélogramme.'
  verso: 'Avec \(u=b-x\), \(v=b-x''\) (\(u+v=2(b-m)\), \(u-v=x''-x\)) : \(\|b-m\|^2=\tfrac12\|b-x\|^2+\tfrac12\|b-x''\|^2-\tfrac14\|x-x''\|^2\le r^2-\tfrac14\|x-x''\|^2\). Si \(x\ne x''\), c''est strictement inférieur à \(r^2\) : un borné contenu dans deux boules fermées distinctes de rayon minimal \(r_0\) tiendrait dans une boule de rayon \(< r_0\), absurde.'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans topo-dm2022-23-ex02'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [prerequis-l1l2, methode]
- id: topo-e001
  notion: topo-n-0006
  recto: 'Définir un espace topologique séparé, avec les quantificateurs. Pourquoi « il existe deux ouverts disjoints » seul ne suffit-il pas ?'
  verso: '\((X,\tau)\) est séparé si \(\forall x\neq y\), \(\exists U,V\in\tau\) avec \(x\in U\), \(y\in V\), \(U\cap V=\emptyset\). Sans « \(\forall x\neq y\) » ni \(x\in U\), \(y\in V\), le choix \(U=V=\emptyset\) rendrait la condition toujours vraie. Conséquence (unicité de la limite) : si \(x_n\to x\), \(x_n\to y\) et \(x\neq y\), on prend \(U\ni x\), \(V\ni y\) ouverts disjoints ; alors \(x_n\in U\cap V=\emptyset\) pour \(n\) grand, absurde. Donc \(x=y\).'
  source: 'Poly de topologie chap. 1, déf. 3 p. 3 ; séance 2026-11-04 (question 4 du debrief)'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [erreur]
- id: topo-e002
  notion: topo-n-0005
  recto: 'Une réunion infinie de fermés est-elle fermée ? Que dire de \(A=[1,2]\cup\bigcup_{n\ge1}\{1/n\}\) dans \(\mathbb R\) ?'
  verso: 'Non en général : une réunion **finie** de fermés est fermée, mais pas forcément une réunion infinie (une intersection quelconque de fermés, elle, est fermée). Ici chaque \(\{1/n\}\) et \([1,2]\) sont fermés, mais \(0\notin A\) est limite des \(1/n\in A\) : \(A\) n''est pas fermé (ni ouvert). Avec \(0\) ajouté, \(A\cup\{0\}\) est fermé.'
  source: 'topo-td1-ex04, cas 6 ; séance 2026-11-04'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [erreur]
- id: topo-e003
  notion: topo-n-0004
  recto: '\(]0,1]\) est-il ouvert ? fermé ? dans \(\mathbb R\), puis dans \(X=[-1,1]\) (distance usuelle).'
  verso: 'Soit \(A=]0,1]\). Dans \(\mathbb R\) : ni ouvert (\(1\) n''a pas de boule dans \(A\)) ni fermé (\(0\notin A\) est adhérent à \(A\)). Dans \(X=[-1,1]\) : ouvert (\(]0,1]=X\cap]0,2[\)) mais pas fermé (le complémentaire \([-1,0]\) n''est pas ouvert dans \(X\) : \(0\) n''a pas de boule). Ouvert et fermé ne sont pas des contraires, et dépendent de l''espace ambiant \(X\).'
  source: 'topo-td1-ex04, cas 2 et 5 ; séance 2026-11-04'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [erreur]
- id: topo-e004
  notion: topo-n-0018
  recto: 'Quel est l''intérieur de \(\mathbb Q\) dans \(\mathbb R\) ? Pourquoi \(\{0\}\) n''est-il pas ouvert dans \(\mathbb R\) ?'
  verso: '\(x\in\mathring A\iff\exists r>0,\ B(x,r)\subset A\) : c''est la **boule entière** qui doit être dans \(A\), pas seulement son centre. Toute boule \(]x-r,x+r[\) de \(\mathbb R\) contient un irrationnel (\(\mathbb R\setminus\mathbb Q\) est dense), donc n''est jamais incluse dans \(\mathbb Q\) : \(\mathring{\mathbb Q}=\emptyset\) (et \(\mathbb Q\) n''est pas ouvert). De même \(]-\lambda,\lambda[\ni\lambda/2\neq0\) n''est jamais inclus dans \(\{0\}\) : \(\{0\}\) est fermé mais pas ouvert dans \(\mathbb R\) (il l''est pour la distance discrète).'
  source: 'topo-td1-ex06 Q1 ; cours séance 2026-11-07'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [erreur]
- id: ex-topo-td1-ex04
  exercice: topo-td1-ex04
  notion: topo-n-0004
  recto: |-
    <b>Exo topo-td1-ex04 : Ouvert et/ou fermé : onze exemples</b><br>
    Déterminer si \(A\) est ouvert et/ou fermé <b>dans \(X\)</b> (distance usuelle de \(\mathbb R\), distance euclidienne sur \(\mathbb R^2\)) :<br>
    1. \(A=\emptyset\), \(X=\mathbb R\) ; 2. \(A=]0,1]\), \(X=\mathbb R\) ; 3. \(A=]-\infty,1]\), \(X=\mathbb R\) ; 4. \(A=[0,2[\,\cup\,]1,3]\), \(X=\mathbb R\) ; 5. \(A=]0,1]\), \(X=[-1,1]\) ;<br>
    6. \(A=[1,2]\cup\bigcup_{n\ge1}\{1/n\}\), \(X=\mathbb R\) ; 7. \(A=[-1,0]\cup\bigcup_{n\ge1}\{1/n\}\), \(X=\mathbb R\) ;<br>
    8. \(A=]0,+\infty[\times\{0\}\), \(X=\mathbb R^2\) ; 9. \(A=[0,+\infty[\times\{0\}\), \(X=\mathbb R^2\) ;<br>
    10. \(A=\{(x,y)\mid x>0,\ y>0,\ xy<1\}\), \(X=\mathbb R^2\) ; 11. \(A=\{(x,y)\mid x>0,\ y\ge0,\ xy<1/2\}\), \(X=\mathbb R^2\).<br>
    <b>Méthode ? Étape clé ?</b>
  verso: |-
    <b>Idée clé :</b> « ouvert » et « fermé » se testent dans l'espace \(X\), et ne sont pas des contraires. Ouvert : chaque point de \(A\) a une boule de \(X\) incluse dans \(A\). Fermé : \(X\setminus A\) est ouvert, ou toute suite de \(A\) qui converge a sa limite dans \(A\).<br>
    <b>Correction :</b> dans \(X\), la boule est \(B_X(x,r)=B(x,r)\cap X\).<br>
    1. \(\emptyset\) est ouvert (condition vide) et fermé (\(\mathbb R\setminus\emptyset=\mathbb R\) est ouvert).<br>
    2. \(A=]0,1]\) dans \(\mathbb R\). Pas ouvert : \(1\in A\) et, pour tout \(r>0\), \(1+r/2\in B(1,r)\) n'est pas dans \(A\). Pas fermé : \(1/n\in A\) et \(1/n\to0\notin A\).<br>
    3. \(A=]-\infty,1]\). Fermé : \(\mathbb R\setminus A=]1,+\infty[\) est ouvert (pour \(x>1\), \(B(x,x-1)\subset\,]1,+\infty[\)). Pas ouvert : \(1\in A\) et \(1+r/2\notin A\).<br>
    4. \(A=[0,2[\,\cup\,]1,3]=[0,3]\) (les deux intervalles se recouvrent car \(1<2\)). Fermé : \(\mathbb R\setminus A=]-\infty,0[\,\cup\,]3,+\infty[\) est ouvert. Pas ouvert : \(0\in A\) et \(-r/2\notin A\).<br>
    5. \(A=]0,1]\) dans \(X=[-1,1]\). Ouvert dans \(X\) : pour \(x\in A\), \(B_X(x,x)=\,]0,2x[\,\cap[-1,1]\subset A\) (c'est aussi \(A=X\cap\,]0,2[\)). Pas fermé dans \(X\) : \(X\setminus A=[-1,0]\) n'est pas ouvert dans \(X\), car pour tout \(r>0\), \(B_X(0,r)\) contient des points de \(]0,1]\) (par exemple \(\min(r,1)/2\)).<br>
    6. \(A=[1,2]\cup\bigcup_n\{1/n\}\). Pas ouvert : \(2\in A\) et \(2+r/2\notin A\). Pas fermé : \(1/n\in A\), \(1/n\to0\), et \(0\notin A\) (\(0\notin[1,2]\) et \(0\ne1/n\)).<br>
    7. \(A=[-1,0]\cup\bigcup_n\{1/n\}\). Pas ouvert : \(-1\in A\) et \(-1-r/2\notin A\). Fermé : \(\mathbb R\setminus A=\,]-\infty,-1[\,\cup\,]1,+\infty[\,\cup\bigcup_{n\ge1}\left]\frac1{n+1},\frac1n\right[\), réunion d'ouverts, donc ouvert (un \(x\in]0,1[\) qui n'est pas de la forme \(1/n\) est dans l'intervalle \(\left]\frac1{n+1},\frac1n\right[\) avec \(n=\lfloor1/x\rfloor\)). La différence avec le cas 6 : ici \(0\in A\).<br>
    8. \(A=]0,+\infty[\times\{0\}\). Pas ouvert : \((1,0)\in A\) et \((1,r/2)\in B((1,0),r)\) n'est pas dans \(A\). Pas fermé : \((1/n,0)\in A\) et \((1/n,0)\to(0,0)\notin A\).<br>
    9. \(A=[0,+\infty[\times\{0\}\). Fermé : \(\mathbb R^2\setminus A=\{y\ne0\}\cup\{x<0\}\), réunion de deux ouverts (images réciproques d'ouverts de \(\mathbb R\) par les projections, continues). Pas ouvert : \((0,0)\in A\) et \((0,r/2)\notin A\).<br>
    10. \(A=\{x>0\}\cap\{y>0\}\cap\{xy<1\}\) : intersection finie d'ouverts (images réciproques d'ouverts par \((x,y)\mapsto x\), \(y\), \(xy\), continues), donc ouvert. Pas fermé : \(\left(\frac1{n+1},1\right)\in A\) et converge vers \((0,1)\notin A\) (car \(x=0\)).<br>
    11. \(A=\{x>0,\ y\ge0,\ xy<1/2\}\). Pas ouvert : \((1,0)\in A\) et \((1,-r/2)\in B((1,0),r)\) n'est pas dans \(A\) (\(y<0\)). Pas fermé : \((1/n,0)\in A\) et converge vers \((0,0)\notin A\) (\(x=0\)).<br>
    <b>Piège :</b> cas 3 : \(]-\infty,1]\) est fermé, pas ouvert. Cas 5 : l'ambiant est \([-1,1]\), pas \(\mathbb R\). Cas 6 contre 7 : tout tient à \(0\in A\) ou non. Cas 8-9 : une boule de \(\mathbb R^2\) sort toujours de l'axe \(y=0\).
  source: 'Énoncé : topologie/td/td1.pdf p.1 (Ex 4). Pas de corrigé officiel : solution vérifiée par Claude, à confirmer. Erreurs de la séance du 2026-11-07 (cas 3, 5, 8-9).'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [exercice]
- id: ex-topo-td1-ex06
  exercice: topo-td1-ex06
  notion: topo-n-0018
  recto: |-
    <b>Exo topo-td1-ex06 : Intérieur : ℚ, disque pointé, graphe</b><br>
    Déterminer l'intérieur \(\mathring A\) de la partie \(A\) de l'espace métrique \((X,d)\) :<br>
    1. \(X=\mathbb R\), \(d(x,y)=|x-y|\), \(A=\mathbb Q\) ;<br>
    2. \(X=\mathbb C\), \(d(z_1,z_2)=|z_1-z_2|\), \(A=\{z\in\mathbb C\mid 0<|z|\le1\}\) ;<br>
    3. \(X=\mathbb R\), \(d(x,y)=|x-y|\), \(A=\mathbb R\setminus\{1/n\mid n\in\mathbb N^*\}\) ;<br>
    4. \(X=\mathbb R^2\), distance euclidienne, \(A=\{x\in\mathbb R^2\mid x_2=f(x_1)\}\), où \(f:\mathbb R\to\mathbb R\) est quelconque.<br>
    <b>Méthode ? Étape clé ?</b>
  verso: |-
    <b>Idée clé :</b> \(x\in\mathring A\iff\exists r>0,\ B(x,r)\subset A\). C'est la boule entière qui doit être dans \(A\), pas seulement son centre. Pour exclure un point : trouver, dans toute boule autour de lui, un point hors de \(A\).<br>
    <b>Correction :</b><br>
    1. Soit \(x\in\mathbb R\) et \(r>0\). L'intervalle \(]x-r,x+r[\) contient un irrationnel (\(\mathbb R\setminus\mathbb Q\) est dense), donc n'est pas inclus dans \(\mathbb Q\). Aucun point n'est intérieur : \(\mathring{\mathbb Q}=\emptyset\).<br>
    2. Posons \(B=\{z\mid0<|z|<1\}\). \(B\subset\mathring A\) : pour \(z\in B\), soit \(r=\min(|z|,1-|z|)>0\) ; si \(|w-z|<r\), alors \(|w|\ge|z|-|w-z|>0\) et \(|w|\le|z|+|w-z|<1\), donc \(w\in B\subset A\). Réciproquement, \(0\notin A\), et si \(|z|=1\) : pour tout \(r>0\), \(w=(1+r/2)z\) vérifie \(|w-z|=r/2<r\) et \(|w|=1+r/2>1\), donc \(w\in B(z,r)\setminus A\) et \(z\) n'est pas intérieur. Donc \(\mathring A=B\).<br>
    3. Posons \(F=\{1/n\mid n\ge1\}\), \(A=\mathbb R\setminus F\). Un point \(x\) est intérieur à \(A\) si et seulement si une boule autour de \(x\) ne rencontre pas \(F\), c'est-à-dire si \(x\notin\overline F\). Or \(\overline F=F\cup\{0\}\) : \(0\) est limite de \(1/n\) (toute boule \(]-r,r[\) contient \(1/n\) dès que \(n>1/r\)), et tout autre \(x\notin F\) a un voisinage sans point de \(F\) (si \(x<0\) ou \(x>1\), évident ; si \(0<x<1\) et \(x\ne1/n\), l'intervalle \(\left]\frac1{n+1},\frac1n\right[\ni x\) ne rencontre pas \(F\)). Donc \(\mathring A=\mathbb R\setminus(\{0\}\cup F)\) : le point \(0\) est dans \(A\) mais n'est pas intérieur.<br>
    4. Soit \(x=(x_1,f(x_1))\in A\) et \(r>0\). Le point \(y=(x_1,f(x_1)+r/2)\) vérifie \(d(x,y)=r/2<r\), donc \(y\in B(x,r)\), mais \(y_2\ne f(y_1)=f(x_1)\), donc \(y\notin A\). Aucun point n'est intérieur : \(\mathring A=\emptyset\), quelle que soit \(f\).<br>
    <b>Piège :</b> conclure « \(\mathbb Q\) est ouvert » en ne regardant que les rationnels. Il faut penser à \(\mathbb R\setminus\mathbb Q\), dense.
  source: 'Énoncé : topologie/td/td1.pdf p.1 (Ex 6). Pas de corrigé officiel : solution vérifiée par Claude, à confirmer. Erreur de la séance du 2026-11-07 (Q1) ; Q3 et Q4 non faites.'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [exercice]
- id: topo-a-039-1
  notion: topo-p-0003
  recto: 'Déf : ensemble au plus dénombrable'
  verso: 'Un ensemble \(E\) est au plus dénombrable s''il est fini ou dénombrable (en bijection avec \(\mathbb N\)). De façon équivalente, il existe une injection de \(E\) dans \(\mathbb N\) ; si \(E\neq\emptyset\), cela équivaut aussi à l''existence d''une surjection de \(\mathbb N\) sur \(E\). Attention : certains cours appellent « dénombrable » ce qui est ici « au plus dénombrable » (injection dans \(\mathbb N\)).'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans topo-n-0029, topo-td3-ex09, topo-partiel2022-23-ex04, mes-td2-ex03'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [prerequis-l1l2, definition]
- id: topo-a-039-2
  notion: topo-p-0003
  recto: 'Preuve : \(\mathbb R\) n''est pas dénombrable (segments emboîtés)'
  verso: 'Soit \((x_n)_{n\ge0}\) une suite de réels. On pose \(I_0=[0,1]\) ; \(I_n\) étant construit, on le coupe en trois segments de même longueur et on prend pour \(I_{n+1}\) le premier ou le dernier tiers (ils sont disjoints), celui qui ne contient pas \(x_n\). Les \(I_n=[a_n,b_n]\) sont emboîtés, de longueur \(3^{-n}\) : \((a_n)\) et \((b_n)\) sont adjacentes, de limite commune \(c\in\bigcap_nI_n\), et \(c\neq x_n\) pour tout \(n\) car \(c\in I_{n+1}\not\ni x_n\). Aucune suite ne prend toutes les valeurs réelles : pas de surjection \(\mathbb N\to\mathbb R\), donc \(\mathbb R\) n''est pas au plus dénombrable. (topo-td3-ex09 le redémontre par Baire.)'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans topo-td3-ex09, topo-n-0070'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [prerequis-l1l2, theoreme]
- id: topo-a-040-1
  notion: topo-p-0004
  recto: 'Prop. : caractérisation de la borne inférieure'
  verso: 'Soient \(A\) une partie non vide et minorée de \(\mathbb R\) et \(m\in\mathbb R\). Alors \(m=\inf A\) si et seulement si : (i) \(\forall x\in A,\ m\le x\) et (ii) \(\forall\varepsilon>0,\ \exists x\in A,\ m\le x<m+\varepsilon\).'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans topo-n-0015, topo-n-0058, topo-td4-ex09'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [prerequis-l1l2, propriete]
- id: topo-a-040-2
  notion: topo-p-0004
  recto: 'Prop. : caractérisation séquentielle de la borne supérieure et de la borne inférieure'
  verso: 'Soient \(A\) une partie non vide et majorée de \(\mathbb R\) et \(M\) un majorant de \(A\). Alors \(M=\sup A\) si et seulement s''il existe une suite \((a_n)\) d''éléments de \(A\) qui converge vers \(M\). De même, si \(A\) est non vide et minorée et \(m\) un minorant de \(A\) : \(m=\inf A\) si et seulement si \(m\) est limite d''une suite d''éléments de \(A\). Usage : \(d(x,B)=\inf_{b\in B}d(x,b)\) est la limite de \(d(x,b_n)\) pour une suite \((b_n)\) de \(B\).'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans topo-n-0015, topo-n-0058, topo-td4-ex09'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [prerequis-l1l2, propriete]
- id: topo-a-041-1
  notion: topo-p-0005
  recto: 'Prop. : convergence uniforme et convergence simple'
  verso: 'Soient \(D\) un ensemble, \((Y,\delta)\) un espace métrique et \(f_n,f:D\to Y\). Si \((f_n)\) converge uniformément vers \(f\) sur \(D\) (\(\sup_{x\in D}\delta(f_n(x),f(x))\to0\)), alors \((f_n)\) converge simplement vers \(f\) sur \(D\) (\(\forall x\in D,\ f_n(x)\to f(x)\)). La réciproque est fausse en général.'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans topo-n-0063, mesure-n-0022, mesure-n-0025'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 2
  tags: [prerequis-l1l2, propriete]
- id: topo-a-041-2
  notion: topo-p-0005
  recto: 'Exemple : convergence simple mais non uniforme de \(f_n(x)=x^n\) sur \([0,1]\)'
  verso: 'Sur \([0,1]\), \(f_n(x)=x^n\) converge simplement vers \(f=\mathbf 1_{\{1\}}\) (\(x^n\to0\) si \(0\le x<1\), et \(1^n=1\)). La convergence n''est pas uniforme : \(\sup_{x\in[0,1]}|f_n(x)-f(x)|=\sup_{x\in[0,1[}x^n=1\) ne tend pas vers \(0\). Cohérent avec le cours : les \(f_n\) sont continues mais la limite \(f\) ne l''est pas.'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans topo-n-0063, mesure-n-0022, mesure-n-0025'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 2
  tags: [prerequis-l1l2, exemple]
- id: topo-a-041-3
  notion: topo-p-0005
  recto: 'Déf : convergence simple, écrite avec quantificateurs'
  verso: 'Soient \(D\) un ensemble, \((Y,\delta)\) un espace métrique et \(f_n,f:D\to Y\). La suite \((f_n)\) converge simplement vers \(f\) sur \(D\) si \[\forall x\in D,\ \forall\varepsilon>0,\ \exists N\in\mathbb N,\ \forall n\ge N,\ \delta(f_n(x),f(x))<\varepsilon.\] Le rang \(N\) dépend de \(x\) et de \(\varepsilon\). Pour la convergence uniforme, \(N\) ne dépend que de \(\varepsilon\) : \(\forall\varepsilon>0,\ \exists N\in\mathbb N,\ \forall n\ge N,\ \forall x\in D,\ \delta(f_n(x),f(x))<\varepsilon\).'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans mesure-n-0022, mesure-n-0025, mes-td5-ex03, mes-cc1-2324-ex05'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 2
  tags: [prerequis-l1l2, definition]
- id: topo-a-041-4
  notion: topo-p-0005
  recto: 'Thm : critère de Cauchy uniforme'
  verso: 'Soient \(D\) un ensemble, \((Y,\delta)\) un espace métrique <b>complet</b> et \(f_n:D\to Y\). La suite \((f_n)\) converge uniformément sur \(D\) vers une fonction \(f:D\to Y\) si et seulement si \[\forall\varepsilon>0,\ \exists N\in\mathbb N,\ \forall p,q\ge N,\ \forall x\in D,\ \delta(f_p(x),f_q(x))\le\varepsilon.\] Preuve de \(\Leftarrow\) : pour chaque \(x\), \((f_n(x))\) est de Cauchy dans \(Y\) complet, donc converge vers un \(f(x)\) ; en faisant \(q\to\infty\), \(\delta(f_p(x),f(x))\le\varepsilon\) pour tous \(p\ge N\) et \(x\in D\). (\(\Rightarrow\) : inégalité triangulaire.)'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans topo-n-0063'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 2
  tags: [prerequis-l1l2, theoreme]
- id: topo-a-041-5
  notion: topo-p-0005
  recto: 'Thm : interversion limite et intégrale sur un segment'
  verso: 'Soient \(a<b\) deux réels et \(f_n:[a,b]\to\mathbb R\) (ou \(\mathbb C\)) des fonctions continues. Si \((f_n)\) converge uniformément vers \(f\) sur \([a,b]\), alors \(f\) est continue et \[\int_a^bf_n(t)\,dt\to\int_a^bf(t)\,dt\quad(n\to\infty).\] Preuve : \(\left|\int_a^bf_n-\int_a^bf\right|\le(b-a)\sup_{t\in[a,b]}|f_n(t)-f(t)|\to0\).'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans mes-td5-ex03'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 2
  tags: [prerequis-l1l2, theoreme]
- id: topo-a-041-6
  notion: topo-p-0005
  recto: 'Prop. : prouver une convergence uniforme par une majoration indépendante de \(x\)'
  verso: 'Soient \(D\) un ensemble, \((Y,\delta)\) un espace métrique et \(f_n,f:D\to Y\). S''il existe une suite réelle \((\varepsilon_n)\) de limite \(0\) et un rang \(n_0\) tels que \(\forall n\ge n_0,\ \forall x\in D,\ \delta(f_n(x),f(x))\le\varepsilon_n\), alors \((f_n)\) converge uniformément vers \(f\) sur \(D\), car \(\sup_{x\in D}\delta(f_n(x),f(x))\le\varepsilon_n\). Usage (Th. 1.17 du poly de mesure) : si \(f:X\to\mathbb R\) est mesurable avec \(0\le f\le M\), \(f_n=\min\big(n,2^{-n}\lfloor2^nf\rfloor\big)\) vérifie \(0\le f-f_n<2^{-n}\) sur \(X\) pour tout \(n>M\).'
  source: 'Prérequis L1-L2 (énoncé standard), utilisé dans mesure-n-0025'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 2
  tags: [prerequis-l1l2, propriete]
- id: ex-topo-td1-ex05
  exercice: topo-td1-ex05
  notion: topo-n-0014
  recto: |-
    <b>Exo topo-td1-ex05 : Complémentaire d'un point ouvert ; tout ensemble est intersection d'ouverts</b><br>
    Soient \((X,d)\) un espace métrique et \(a\in X\). Montrer que \(X\setminus\{a\}\) est un ouvert et que \(\{a\}\) est un fermé. En déduire que tout ensemble \(A\in\mathcal P(X)\) est une intersection d'ouverts.<br>
    <b>Méthode ? Étape clé ?</b>
  verso: |-
    <b>Idée clé :</b> pour \(x\ne a\), la boule \(B(x,d(x,a))\) est dans \(X\setminus\{a\}\) (inégalité stricte). Ensuite, \(A=\bigcap_{a\notin A}(X\setminus\{a\})\) : on retire un à un les points qui ne sont pas dans \(A\).<br>
    <b>Correction :</b><br>
    1. <u>\(X\setminus\{a\}\) est ouvert.</u> Soit \(x\in X\setminus\{a\}\) et \(r=d(x,a)\). Comme \(x\ne a\), \(r>0\). Montrons \(B(x,r)\subset X\setminus\{a\}\) : si \(y\in B(x,r)\), alors \(d(x,y)<r=d(x,a)\), donc \(y\ne a\) (sinon on aurait \(d(x,a)<d(x,a)\)). Chaque point de \(X\setminus\{a\}\) a donc une boule ouverte incluse dans \(X\setminus\{a\}\) : c'est un ouvert.<br>
    2. <u>\(\{a\}\) est fermé</u> car son complémentaire \(X\setminus\{a\}\) est ouvert.<br>
    3. <u>Tout \(A\subset X\) est une intersection d'ouverts.</u> Posons \(I=X\setminus A\) et montrons \(A=\bigcap_{a\in I}\left(X\setminus\{a\}\right)\) (chaque \(X\setminus\{a\}\) est ouvert par 1).<br>
    \(\subset\) : soit \(x\in A\) et \(a\in I\). Alors \(x\ne a\) (car \(x\in A\), \(a\notin A\)), donc \(x\in X\setminus\{a\}\). Ainsi \(x\) est dans tous les \(X\setminus\{a\}\), \(a\in I\).<br>
    \(\supset\) : soit \(x\) dans l'intersection. Si \(x\notin A\), alors \(x\in I\) et \(x\in X\setminus\{x\}\), ce qui est absurde. Donc \(x\in A\).<br>
    Cas \(A=X\) : alors \(I=\emptyset\) et l'intersection vide vaut \(X\) par convention ; de toute façon \(X\) est un ouvert, donc c'est l'intersection de la famille \(\{X\}\). Le résultat reste vrai.<br>
    <b>Piège :</b> ne pas oublier le cas \(A=X\) (famille d'indices vide), ni l'inclusion \(\bigcap\subset A\) (c'est elle qui utilise que \(x\) lui-même est exclu quand \(x\notin A\)). Une intersection <i>infinie</i> d'ouverts n'est pas ouverte en général : par exemple \(\{a\}=\bigcap_{b\ne a}(X\setminus\{b\})\) n'est pas ouvert dans \(\mathbb R\).
  source: 'Énoncé : topologie/td/td1.pdf p.1 (Ex 5). Pas de corrigé officiel : solution vérifiée par Claude, à confirmer (aucune étape douteuse). Erreurs de la séance du 2026-11-04.'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [exercice]
- id: ex-topo-td1-ex08
  exercice: topo-td1-ex08
  notion: topo-n-0011
  recto: |-
    <b>Exo topo-td1-ex08 : Métrique discrète</b><br>
    Soit \(X\) un ensemble non vide et \(d(x,y)=0\) si \(x=y\), \(1\) si \(x\neq y\).<br>
    1. Montrer que \(d\) est une distance sur \(X\).<br>
    2. Décrire les boules ouvertes, les boules fermées, les ouverts et les fermés de \((X,d)\).<br>
    3. A-t-on \(\bar B(a,r)=\overline{B(a,r)}\) pour tous \(a\in X\), \(r>0\) ?<br>
    <b>Méthode ? Étape clé ?</b>
  verso: |-
    <b>Idée clé :</b> les seules distances sont 0 et 1, donc tout se joue sur \(r<1\), \(r=1\), \(r>1\). Le singleton \(\{a\}=B(a,1)\) est ouvert, donc toute partie est ouverte et fermée.<br>
    <b>Correction :</b><br>
    1. Positivité, séparation (\(d(x,y)=0\Leftrightarrow x=y\) par définition) et symétrie sont immédiates. Triangulaire \(d(x,y)\le d(x,z)+d(z,y)\) : si \(x=y\), le membre de gauche vaut 0. Si \(x\ne y\) : soit \(z\ne x\), alors \(d(x,z)=1\ge d(x,y)\) ; soit \(z=x\), alors \(d(x,z)+d(z,y)=0+d(x,y)\).<br>
    2. <u>Boules ouvertes.</u> Le centre est toujours dans sa boule : \(d(a,a)=0<r\). Si \(y\ne a\), \(d(a,y)=1\). Donc \(B(a,r)=\{a\}\) si \(0<r\le1\) et \(B(a,r)=X\) si \(r>1\). <u>Boules fermées</u> : \(\bar B(a,r)=\{a\}\) si \(r<1\) et \(\bar B(a,r)=X\) si \(r\ge1\) (en particulier \(\bar B(a,1)=X\)). <u>Ouverts</u> : \(\{x\}=B(x,1)\) est ouvert, et toute partie \(A=\bigcup_{x\in A}\{x\}\) est ouverte (réunion d'ouverts). <u>Fermés</u> : le complémentaire d'une partie est une partie, donc toute partie est fermée.<br>
    3. Une partie étant fermée, \(\overline{B(a,r)}=B(a,r)\). Si \(r<1\) : \(B=\{a\}=\bar B\), égalité. Si \(r>1\) : \(B=\bar B=X\), égalité. Si \(r=1\) : \(\overline{B(a,1)}=\{a\}\) et \(\bar B(a,1)=X\) : égalité si et seulement si \(X=\{a\}\) ; si \(b\ne a\), \(b\in\bar B(a,1)\) mais \(b\notin\{a\}\).<br>
    <b>Piège :</b> un ouvert n'est pas une boule ouverte (c'est une réunion de boules) : les ouverts sont toutes les parties, pas \(\{\{a\},X,\emptyset\}\). Le centre est toujours dans sa boule, donc une boule n'est jamais vide. \(\bar B(a,1)=X\), pas \(\{a\}\).
  source: 'Énoncé : topologie/td/td1.pdf p.2 (Ex 8). Pas de corrigé officiel : solution vérifiée par Claude, à confirmer (aucune étape douteuse). Erreurs de la séance du 2026-11-08.'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [exercice]
- id: ex-topo-td1-ex09
  exercice: topo-td1-ex09
  notion: topo-n-0015
  recto: |-
    <b>Exo topo-td1-ex09 : Deux fermés disjoints à distance nulle</b><br>
    Avec \(d(A,B)=\inf_{a\in A}\inf_{b\in B}d(a,b)\) :<br>
    1. Construire dans \(\mathbb R^2\) deux fermés disjoints \(A\) et \(B\) tels que \(d(A,B)=0\).<br>
    2. Même question dans \(\mathbb R\).<br>
    <b>Méthode ? Étape clé ?</b>
  verso: |-
    <b>Idée clé :</b> une courbe et son asymptote (ou deux suites qui partent à l'infini sans s'accumuler). Pour \(\inf=0\), on n'a pas besoin de calculer l'inf : \(d\ge0\) donne \(\inf\ge0\), et on exhibe des couples à distance \(1/n\to0\).<br>
    <b>Correction :</b><br>
    1. \(A=\{(x,y):xy=1\}\), \(B=\{(x,0):x\in\mathbb R\}\). <u>Fermés :</u> \(A\) est l'image réciproque de \(\{1\}\) par \((x,y)\mapsto xy\) continue, \(B\) celle de \(\{0\}\) par \((x,y)\mapsto y\). <u>Disjoints :</u> \(xy=1\) impose \(y\ne0\). <u>Distance :</u> \((n,1/n)\in A\), \((n,0)\in B\), à distance \(1/n\), donc \(0\le d(A,B)\le1/n\) pour tout \(n\) : \(d(A,B)=0\).<br>
    2. \(A=\mathbb N^*\), \(B=\{n+1/n:n\ge2\}\). <u>Disjoints :</u> \(0<1/n<1\), donc \(n+1/n\in\,]n,n+1[\) n'est pas entier. <u>Fermés :</u> deux points distincts de \(A\) sont à distance \(\ge1\), deux points de \(B\) à distance \(\ge5/6\) (car \((n+1)+\frac1{n+1}-n-\frac1n=1-\frac1{n(n+1)}\ge\frac56\)). Soit \(\delta\) cet écart et \(x_k\to\ell\) dans l'ensemble : pour \(k\ge N\), \(|x_k-\ell|<\delta/2\), donc \(|x_k-x_m|<\delta\), donc \(x_k=x_m\). La suite est stationnaire et \(\ell\) est dans l'ensemble : il est fermé. <u>Distance :</u> \(d(n,n+1/n)=1/n\to0\).<br>
    <b>Piège :</b> \(\{(1/n,0)\}\) n'est pas fermé (\(0\) est dans l'adhérence mais pas dans l'ensemble) : les points qui se rapprochent ne doivent pas s'accumuler. Un fermé se prouve par image réciproque d'un fermé par une application continue, ou par suites. L'écart minimal \(\delta>0\) fait défaut pour \(\{1/n\}\).
  source: 'Énoncé : topologie/td/td1.pdf p.2 (Ex 9). Pas de corrigé officiel : solution vérifiée par Claude, à confirmer (aucune étape douteuse). Erreurs de la séance du 2026-11-08.'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [exercice]
- id: ex-topo-uvsq-td1-ex03q1
  exercice: topo-uvsq-td1-ex03q1
  notion: topo-n-0008
  recto: |-
    <b>Exo topo-uvsq-td1-ex03q1 : N(f)=||fg|| est une norme : CNS sur g</b><br>
    Soit \(E=\mathcal C([0,1],\mathbb R)\) et \(g\in E\). Pour \(f\in E\), \(N(f)=\|fg\|_\infty\). Donner une condition nécessaire et suffisante sur \(g\) pour que \(N\) soit une norme sur \(E\).<br>
    <b>Méthode ? Étape clé ?</b>
  verso: |-
    <b>Idée clé :</b> homogénéité et inégalité triangulaire sont vraies pour tout \(g\) ; seule la séparation (\(N(f)=0\Rightarrow f=0\)) impose une condition : \(\{g\ne0\}\) dense dans \([0,1]\), c'est-à-dire \(g\) n'est identiquement nulle sur aucun intervalle \(]a,b[\) (\(a<b\)).<br>
    <b>Correction :</b><br>
    1. \(N(\lambda f)=|\lambda|N(f)\) et \(N(f+h)\le N(f)+N(h)\) car \(\|\cdot\|_\infty\) est une norme.<br>
    2. Posons \(U=\{g\ne0\}\). \(N(f)=0\Leftrightarrow fg=0\Leftrightarrow f=0\) sur \(U\). <u>Si \(U\) est dense :</u> pour \(t_0\in[0,1]\), il existe \(t_n\in U\), \(t_n\to t_0\) ; \(f(t_n)=0\) et \(f\) est continue, donc \(f(t_0)=0\) : \(f=0\).<br>
    3. <u>Si \(g=0\) sur \(]a,b[\)</u> : \(f(t)=\max(0,\min(t-a,b-t))\) est continue, non nulle, et \(fg=0\). Alors \(N(f)=0\) avec \(f\ne0\) : séparation en échec.<br>
    Exemples : \(g(t)=t\), \((t-\frac12)^2\), \(\sin(2\pi t)\) donnent des normes ; \(g(t)=\max(0,t-\frac12)\) non.<br>
    <b>Piège :</b> la séparation est \(N(f)=0\Rightarrow f=0\) (pas \(f=0\Rightarrow N(f)=0\), vrai pour tout \(g\)). « \(g\) non nulle » ne suffit pas ; « \(g\) ne s'annule jamais » n'est pas nécessaire. La continuité de \(f\) sert à rattraper les points de l'adhérence de \(U\) où \(g=0\).
  source: 'Énoncé : uvsq/topologie/Topologie/TD1_Topologie.pdf p.2 (Ex 3.1). Pas de corrigé officiel : solution vérifiée par Claude, à confirmer (aucune étape douteuse). Erreurs de la séance du 2026-11-08.'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [exercice]
- id: ex-topo-td1-ex07
  exercice: topo-td1-ex07
  notion: topo-n-0022
  recto: |-
    <b>Exo topo-td1-ex07 : Adhérence dans les trois premiers exemples de l'exercice 6</b><br>
    Déterminer l'adhérence \(\bar A\) de \(A\) : 1. \(X=\mathbb R\), \(A=\mathbb Q\). 2. \(X=\mathbb C\), \(A=\{z:0<|z|\le1\}\). 3. \(X=\mathbb R\), \(A=\mathbb R\setminus\{1/n:n\in\mathbb N^*\}\).<br>
    <b>Méthode ? Étape clé ?</b>
  verso: |-
    <b>Idée clé :</b> pour montrer \(x\in\bar A\), construire une suite d'éléments de \(A\) qui tend vers \(x\) (ou tester les boules : \(B(x,r)\cap A\ne\emptyset\) pour tout \(r\)).<br>
    <b>Correction :</b><br>
    1. \(\mathbb Q\) est dense dans \(\mathbb R\) : \(\bar A=\mathbb R\).<br>
    2. \(A\subset D=\{|z|\le1\}\), fermé, donc \(\bar A\subset D\). Et \(0=\lim 1/n\) avec \(1/n\in A\), donc \(0\in\bar A\). Comme \(D=A\cup\{0\}\), \(\bar A=D\).<br>
    3. \(A\subset\bar A\) (dont \(0\), car \(0\ne1/n\)). Pour \(x=1/n\notin A\) : \(x_k=\frac1n+\frac{\sqrt2}{k}\) est irrationnel (rationnel + irrationnel), donc différent de tous les \(1/m\), donc dans \(A\), et \(x_k\to1/n\). Donc \(1/n\in\bar A\) et \(\bar A=\mathbb R\). Raccourci : \(A\) contient tous les irrationnels, qui sont denses.<br>
    <b>Piège :</b> \(0<|z|\) est une inégalité <i>stricte</i> : \(A\) est le disque fermé privé de \(0\), il n'est pas fermé. \(1/n\to0\) montre que \(0\) est adhérent à \(\{1/n\}\), pas que \(1/n\in\bar A\). On a \(A\subset\bar A\), jamais l'inverse en général.
  source: 'Énoncé : topologie/td/td1.pdf p.2 (Ex 7, exemples de l''Ex 6). Pas de corrigé officiel : solution vérifiée par Claude, à confirmer (aucune étape douteuse). Erreurs de la séance du 2026-11-08.'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [exercice]
- id: ex-topo-td1-ex13
  exercice: topo-td1-ex13
  notion: topo-n-0028
  recto: |-
    <b>Exo topo-td1-ex13 : A ∪ int(A^c) est dense</b><br>
    Soient \((X,d)\) un espace métrique et \(A\in\mathcal P(X)\). Montrer que \(A\cup\mathring{(A^c)}\) est dense dans \(X\).<br>
    <b>Méthode ? Étape clé ?</b>
  verso: |-
    <b>Idée clé :</b> \(\mathring{(A^c)}=X\setminus\bar A\), donc \(S=A\cup(X\setminus\bar A)\) et \(\bar S\supset\bar A\cup(X\setminus\bar A)=X\).<br>
    <b>Correction :</b><br>
    1. \(x\in\mathring{(A^c)}\Leftrightarrow\exists r>0,\ B(x,r)\subset A^c\Leftrightarrow\exists r>0,\ B(x,r)\cap A=\emptyset\Leftrightarrow x\notin\bar A\). Donc \(\mathring{(A^c)}=X\setminus\bar A\).<br>
    2. Posons \(S=A\cup(X\setminus\bar A)\). \(A\subset S\) donne \(\bar A\subset\bar S\) (croissance de l'adhérence). \(X\setminus\bar A\subset S\subset\bar S\). Donc \(\bar S\supset\bar A\cup(X\setminus\bar A)=X\).<br>
    Variante par les boules : soit \(x\in X\), \(r>0\). Si \(B(x,r)\cap A\ne\emptyset\), c'est fini. Sinon \(B(x,r)\subset A^c\) ; la boule étant ouverte, \(B(x,r)\subset\mathring{(A^c)}\), et \(x\in B(x,r)\) (car \(d(x,x)=0<r\)), donc \(B(x,r)\cap S\ne\emptyset\).<br>
    <b>Piège :</b> le test de densité est \(B(x,r)\cap S\ne\emptyset\) (pas \(B(x,r)\cap\bar S\)). \(A\subset\bar A\) (jamais l'inverse). Un point d'une boule ouverte n'est pas intérieur à \(A\) pour autant : la boule n'est pas incluse dans \(A\).
  source: 'Énoncé : topologie/td/td1.pdf p.2 (Ex 13). Pas de corrigé officiel : solution vérifiée par Claude, à confirmer (aucune étape douteuse). Erreurs de la séance du 2026-11-08.'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [exercice]
- id: topo-a-042-1
  notion: topo-p-0006
  recto: 'Thm : application linéaire continue, continue en \(0\), majoration \(\|\varphi(x)\|\le M\|x\|\)'
  verso: 'Soient \((E,\|\cdot\|_E)\) et \((F,\|\cdot\|_F)\) deux evn et \(\varphi\in\mathcal L(E,F)\). Sont équivalents : \(\varphi\) est continue ; \(\varphi\) est continue en \(0\) ; \(\exists M>0,\ \forall x\in E,\ \|\varphi(x)\|_F\le M\|x\|_E\).'
  source: 'Poly L2 Analyse 4 (Univ. Lorraine), Thm 4, p. 24 ; cours EVN de G. Skandalis (Paris Cité), §4.1, p. 1 du PDF'
  chapitre: 'Chapitre 5 - Espace vectoriel normé'
  priorite: 1
  tags: [prerequis-l1l2, theoreme]
- id: topo-a-042-2
  notion: topo-p-0006
  recto: 'Thm : application linéaire continue, bornée sur la boule unité, lipschitzienne'
  verso: 'Soient \(E,F\) deux evn et \(\varphi\in\mathcal L(E,F)\). La continuité de \(\varphi\) équivaut aussi à chacune des propriétés : \(\varphi\) est bornée sur \(B_E(0,1)\) ; \(\varphi\) est bornée sur la sphère \(\{x\in E:\|x\|_E=1\}\) ; \(\varphi\) est lipschitzienne ; \(\varphi\) est uniformément continue sur \(E\).'
  source: 'Poly L2 Analyse 4 (Univ. Lorraine), Thm 4, p. 24'
  chapitre: 'Chapitre 5 - Espace vectoriel normé'
  priorite: 1
  tags: [prerequis-l1l2, theoreme]
- id: topo-a-042-3
  notion: topo-p-0006
  recto: 'Preuve : \(\varphi\) linéaire continue en \(0\) implique \(\|\varphi(x)\|\le M\|x\|\), puis lipschitzienne'
  verso: 'Continuité en \(0\) avec \(\varepsilon=1\) : il existe \(\alpha>0\) tel que \(\|x\|_E\le\alpha\Rightarrow\|\varphi(x)\|_F\le1\). Pour \(x\ne0\), on applique cela à \(\alpha x/\|x\|_E\) ; par linéarité, \(\|\varphi(x)\|_F\le\frac1\alpha\|x\|_E\) (vrai aussi pour \(x=0\)). Puis \(\|\varphi(x)-\varphi(y)\|_F=\|\varphi(x-y)\|_F\le\frac1\alpha\|x-y\|_E\).'
  source: 'Poly L2 Analyse 4 (Univ. Lorraine), preuve du Thm 4, p. 24'
  chapitre: 'Chapitre 5 - Espace vectoriel normé'
  priorite: 1
  tags: [prerequis-l1l2, demonstration]
- id: topo-a-042-4
  notion: topo-p-0006
  recto: 'Déf : norme subordonnée (norme d''opérateur) \(|||\varphi|||\)'
  verso: 'Soient \(E,F\) deux evn et \(\varphi:E\to F\) linéaire continue. Les trois bornes supérieures suivantes sont égales : \[|||\varphi|||=\sup_{x\ne0}\frac{\|\varphi(x)\|_F}{\|x\|_E}=\sup_{\|x\|_E=1}\|\varphi(x)\|_F=\sup_{\|x\|_E\le1}\|\varphi(x)\|_F.\] L''application \(\varphi\mapsto|||\varphi|||\) est une norme sur \(\mathcal L_c(E,F)\), appelée norme subordonnée.'
  source: 'Poly L2 Analyse 4 (Univ. Lorraine), Thm 5, p. 24 ; cours EVN de G. Skandalis (Paris Cité), §4.1, p. 1 du PDF'
  chapitre: 'Chapitre 5 - Espace vectoriel normé'
  priorite: 1
  tags: [prerequis-l1l2, definition]
- id: topo-a-042-5
  notion: topo-p-0006
  recto: 'Prop. : \(|||\varphi|||\) est la meilleure constante dans \(\|\varphi(x)\|\le k\|x\|\)'
  verso: 'Soient \(E,F\) deux evn et \(\varphi:E\to F\) linéaire continue. Pour \(k\in\mathbb R_+\) : \[\big(\forall x\in E,\ \|\varphi(x)\|_F\le k\|x\|_E\big)\iff k\ge|||\varphi|||.\] En particulier \(\|\varphi(x)\|_F\le|||\varphi|||\,\|x\|_E\) pour tout \(x\in E\).'
  source: 'Cours EVN de G. Skandalis (Paris Cité), §4.1, p. 1 du PDF'
  chapitre: 'Chapitre 5 - Espace vectoriel normé'
  priorite: 1
  tags: [prerequis-l1l2, propriete]
- id: topo-a-042-6
  notion: topo-p-0006
  recto: 'Prop. : norme subordonnée d''une composée'
  verso: 'Si \(f:E\to F\) et \(g:F\to G\) sont des applications linéaires continues entre evn, alors \(g\circ f\) est linéaire continue et \[|||g\circ f|||\le|||g|||\cdot|||f|||.\]'
  source: 'Cours EVN de G. Skandalis (Paris Cité), §4.1, p. 1 du PDF'
  chapitre: 'Chapitre 5 - Espace vectoriel normé'
  priorite: 1
  tags: [prerequis-l1l2, propriete]
- id: topo-a-042-7
  notion: topo-p-0006
  recto: 'Prop. : l''espace \(\mathcal L(E,F)\) des applications linéaires continues, normé par \(|||\cdot|||\)'
  verso: 'Soient \(E,F\) deux evn. L''ensemble \(\mathcal L(E,F)\) des applications linéaires continues de \(E\) dans \(F\) est un sous-espace vectoriel de l''espace de toutes les applications linéaires de \(E\) dans \(F\) ; \(|||\cdot|||\) est une norme sur \(\mathcal L(E,F)\). <b>Si \(F\) est complet</b>, \((\mathcal L(E,F),|||\cdot|||)\) est complet.'
  source: 'Cours EVN de G. Skandalis (Paris Cité), §4.1, p. 1 du PDF'
  chapitre: 'Chapitre 5 - Espace vectoriel normé'
  priorite: 1
  tags: [prerequis-l1l2, propriete]
- id: topo-a-042-8
  notion: topo-p-0006
  recto: 'Méthode : calculer \(|||\varphi|||\)'
  verso: '1) Majorer : trouver \(M\) avec \(\|\varphi(x)\|_F\le M\|x\|_E\) pour tout \(x\) (ou \(\le M\) pour \(\|x\|_E\le1\)) ; donc \(|||\varphi|||\le M\). 2) Atteindre : chercher \(x\ne0\) avec \(\|\varphi(x)\|_F=M\|x\|_E\) ; sinon une suite \((x_n)\) avec \(\|x_n\|_E=1\) et \(\|\varphi(x_n)\|_F\to M\) (définition de la borne supérieure). Alors \(|||\varphi|||=M\).'
  source: 'Poly L2 Analyse 4 (Univ. Lorraine), Remarque 7, p. 26 ; suite qui approche la borne : définition du sup (Thm 5, p. 24)'
  chapitre: 'Chapitre 5 - Espace vectoriel normé'
  priorite: 1
  tags: [prerequis-l1l2, methode]
- id: topo-a-042-9
  notion: topo-p-0006
  recto: 'Exemple : \(|||\varphi|||\) pour \(\varphi(x,y)=x+y\) sur \(\mathbb R^2\), selon la norme'
  verso: 'Avec \(\|\cdot\|_\infty\) : \(|x+y|\le|x|+|y|\le2\|(x,y)\|_\infty\), et \(|\varphi(1,1)|=2=2\|(1,1)\|_\infty\), donc \(|||\varphi|||=2\). Avec \(\|\cdot\|_1\) : \(|x+y|\le\|(x,y)\|_1\), et \(|\varphi(1,1)|=2=\|(1,1)\|_1\), donc \(|||\varphi|||=1\). La continuité ne dépend pas des normes (dimension finie) ; la norme subordonnée, si.'
  source: 'Poly L2 Analyse 4 (Univ. Lorraine), Exemple 26.1, p. 26 (coquille du poly : il écrit la norme infinie au lieu de la norme 1 dans le second cas)'
  chapitre: 'Chapitre 5 - Espace vectoriel normé'
  priorite: 1
  tags: [prerequis-l1l2, exemple]
- id: topo-a-042-10
  notion: topo-p-0006
  recto: 'Exemple : la dérivation \(f\mapsto f''\) de \((\mathcal C^1([0,1]),\|\cdot\|_\infty)\) dans \((\mathcal C^0([0,1]),\|\cdot\|_\infty)\) est-elle continue ?'
  verso: 'Non. Elle est linéaire, mais pour \(f_n(x)=x^n\) : \(\|f_n\|_\infty=1\) et \(\|f_n''\|_\infty=\sup_{[0,1]}nx^{n-1}=n\). Elle n''est donc pas bornée sur la boule unité fermée (\(|||\varphi|||\ge n\) pour tout \(n\)) : elle n''est pas continue. En dimension infinie, une application linéaire n''est pas forcément continue.'
  source: 'Poly L2 Analyse 4 (Univ. Lorraine), Exemple 26.3, p. 26'
  chapitre: 'Chapitre 5 - Espace vectoriel normé'
  priorite: 1
  tags: [prerequis-l1l2, exemple]
- id: topo-a-042-11
  notion: topo-p-0006
  recto: 'Déf : normes équivalentes'
  verso: 'Deux normes \(N_1\) et \(N_2\) sur un même espace vectoriel \(E\) sont équivalentes s''il existe des constantes \(\alpha,\beta>0\) telles que \[\forall x\in E,\quad\alpha N_1(x)\le N_2(x)\le\beta N_1(x).\] Elles ont alors les mêmes parties bornées, les mêmes ouverts et les mêmes suites convergentes (avec la même limite).'
  source: 'Poly L2 Analyse 4 (Univ. Lorraine), Déf 4 et Prop. 4, p. 14 ; Prop. 6, p. 15 ; Prop. 12, p. 17'
  chapitre: 'Chapitre 5 - Espace vectoriel normé'
  priorite: 1
  tags: [prerequis-l1l2, definition]
- id: topo-a-042-12
  notion: topo-p-0006
  recto: 'Prop. : continuité de \(\mathrm{id}_E:(E,N_1)\to(E,N_2)\)'
  verso: 'Soient \(N_1,N_2\) deux normes sur \(E\). L''identité \(\mathrm{id}_E:(E,N_1)\to(E,N_2)\) est continue si et seulement s''il existe \(c>0\) tel que \(\forall x\in E,\ N_2(x)\le cN_1(x)\). Elle est donc bicontinue si et seulement si \(N_1\) et \(N_2\) sont équivalentes.'
  source: 'Poly L2 Analyse 4 (Univ. Lorraine), Exemple 22.4, p. 22'
  chapitre: 'Chapitre 5 - Espace vectoriel normé'
  priorite: 1
  tags: [prerequis-l1l2, propriete]
- id: topo-a-042-13
  notion: topo-p-0006
  recto: 'Thm : en dimension finie, normes et applications linéaires'
  verso: 'Soit \(E\) un espace vectoriel normé de dimension finie. Toutes les normes sur \(E\) sont équivalentes, et toute application linéaire de \(E\) dans un espace vectoriel normé est continue. C''est faux en dimension infinie.'
  source: 'Cours EVN de G. Skandalis (Paris Cité), §4.2, Théorème, p. 2 du PDF ; poly L2 Analyse 4 (Univ. Lorraine), Thm 12, p. 31 et Remarque 4, p. 15'
  chapitre: 'Chapitre 5 - Espace vectoriel normé'
  priorite: 1
  tags: [prerequis-l1l2, theoreme]
- id: topo-a-042-14
  notion: topo-p-0006
  recto: 'Méthode : montrer que deux normes ne sont pas équivalentes'
  verso: 'Trouver une suite \((f_n)\) bornée pour \(N_1\) mais pas pour \(N_2\) : impossible si \(N_2\le\beta N_1\). Exemple sur \(\mathcal C([0,1])\) : \(f_n(x)=n^2\big(\frac1n-x\big)\mathbf 1_{[0,1/n]}(x)\) vérifie \(N_1(f_n)=\int_0^1|f_n|=\frac12\) et \(N_\infty(f_n)=n\) ; donc \(N_1\) et \(N_\infty\) ne sont pas équivalentes.'
  source: 'Poly L2 Analyse 4 (Univ. Lorraine), Prop. 4, p. 14 et Remarque 4, p. 15'
  chapitre: 'Chapitre 5 - Espace vectoriel normé'
  priorite: 1
  tags: [prerequis-l1l2, methode]
- id: topo-a-042-15
  notion: topo-p-0006
  recto: 'Prop. : comparaison des normes \(1\), \(2\) et \(\infty\) sur \(\mathbb R^n\)'
  verso: 'Pour tout \(x\in\mathbb R^n\) : \[\|x\|_\infty\le\|x\|_2\le\|x\|_1\le n\|x\|_\infty.\] Les trois normes sont donc équivalentes.'
  source: 'Poly L2 Analyse 4 (Univ. Lorraine), Exemple 7, p. 14 ; cours EVN de G. Skandalis (Paris Cité), §4.2, p. 2 du PDF'
  chapitre: 'Chapitre 5 - Espace vectoriel normé'
  priorite: 1
  tags: [prerequis-l1l2, propriete]
# Cartes nouvelles de topologie, chapitre 1 (demandes topo-a-043 à topo-a-073). Pages = pages du PDF (repères "--- page N ---").

- id: topo-a-043-1
  notion: topo-n-0003
  recto: 'Déf : topologie, espace topologique, ouverts'
  verso: 'On note \(X\) un ensemble non vide. Une topologie sur \(X\) est un sous-ensemble \(\tau\subset\mathcal P(X)\) tel que :<br>- \(X\in\tau\) et \(\emptyset\in\tau\) ;<br>- \(\tau\) est stable par intersection finie : \(A_k\in\tau,\ \forall k\in\{1,\cdots,n\}\Rightarrow\bigcap_{k=1}^nA_k\in\tau\) ;<br>- \(\tau\) est stable par union quelconque : \(A_i\in\tau,\ \forall i\in I\Rightarrow\bigcup_{i\in I}A_i\in\tau\).<br>Les éléments de \(\tau\) sont appelés les ouverts de \(X\) pour la topologie \(\tau\). Le couple \((X,\tau)\) est appelé espace topologique.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 2'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [definition]

- id: topo-a-044-1
  notion: topo-n-0008
  recto: 'Déf : distance, espace métrique'
  verso: 'On appelle distance ou métrique, sur un ensemble non vide \(X\), une fonction \(d:X\times X\to\mathbb R\) telle que :<br>- \(d(x,y)\ge0,\ \forall x,y\in X\) (axiome de positivité) ;<br>- \(d(x,y)=0\Leftrightarrow x=y\) (axiome de séparation) ;<br>- \(d(x,y)=d(y,x),\ \forall x,y\in X\) (axiome de symétrie) ;<br>- \(d(x,y)\le d(x,z)+d(z,y),\ \forall x,y,z\in X\) (inégalité triangulaire).<br>On appelle espace métrique le couple \((X,d)\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 3'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [definition]

- id: topo-a-045-1
  notion: topo-n-0011
  recto: 'Déf : boule (ouverte)'
  verso: 'Soient \((X,d)\) un espace métrique, \(a\in X\) et \(r>0\). La boule (ouverte) de centre \(a\) et de rayon \(r\) est \(B(a,r)=\{x\in X\ /\ d(a,x)<r\}\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 4'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [definition]
- id: topo-a-045-2
  notion: topo-n-0011
  recto: 'Déf : boule fermée'
  verso: 'Soient \((X,d)\) un espace métrique, \(a\in X\) et \(r>0\). La boule fermée de centre \(a\) et de rayon \(r\) est \(\overline B(a,r)=\{x\in X\ /\ d(a,x)\le r\}\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 4'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [definition]
- id: topo-a-045-3
  notion: topo-n-0011
  recto: 'Déf : sphère'
  verso: 'Soient \((X,d)\) un espace métrique, \(a\in X\) et \(r>0\). La sphère de centre \(a\) et de rayon \(r\) est \(S(a,r)=\{x\in X\ /\ d(a,x)=r\}=\overline B(a,r)\setminus B(a,r)\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 4'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [definition]
- id: topo-a-045-4
  notion: topo-n-0011
  recto: 'Exemple : boules et sphère de \(\mathbb R\) usuel'
  verso: 'Sur \(\mathbb R\) usuel, \(B(0,1)=]-1,1[\), \(\overline B(0,1)=[-1,1]\) et \(S(0,1)=\{-1,1\}\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 4'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [definition]
- id: topo-a-045-5
  notion: topo-n-0011
  recto: 'Exemple : boule de \((\mathbb R^2,d_\infty)\)'
  verso: 'Sur \((\mathbb R^2,d_\infty)\), \(B(0,1)=]-1,1[\times]-1,1[\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 4'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [definition]

- id: topo-a-046-1
  notion: topo-n-0012
  recto: 'Prop. 4 : topologie associée à une distance'
  verso: 'Soit \((X,d)\) un espace métrique. On définit \(\tau=\{A\in\mathcal P(X)\ /\ A=\emptyset\text{ ou},\forall x\in A,\exists r>0\text{ tel que }B(x,r)\subset A\}\).<br>L''ensemble \(\tau\) est une topologie séparée sur \(X\) appelée topologie associée à la distance \(d\). Les éléments de \(\tau\) sont appelés ouverts de \(X\) pour la distance \(d\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 4'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]
- id: topo-a-046-2
  notion: topo-n-0012
  recto: 'Preuve : \(\tau\) est stable par intersection finie et par union quelconque (Prop. 4)'
  verso: 'Soit \((X,d)\) un espace métrique. On remarque que \(\emptyset\) et \(X\in\tau\).<br>Intersection finie : soient \(A_k\in\tau,\ \forall k\in\{1,\cdots,n\}\) et \(x\in\bigcap_kA_k\). Pour tout \(k\), il existe \(r_k>0\) tel que \(B(x,r_k)\subset A_k\). Posons \(r=\min_kr_k\), \(r>0\) car \(\{1,\cdots,n\}\) est fini ; \(B(x,r)\subset B(x,r_k)\subset A_k\) pour tout \(k\), donc \(B(x,r)\subset\bigcap_kA_k\).<br>Union quelconque : soient \((A_i)_{i\in I}\) dans \(\tau\) et \(x\in\bigcup_iA_i\). Il existe \(i_0\) tel que \(x\in A_{i_0}\), donc \(r>0\) tel que \(B(x,r)\subset A_{i_0}\subset\bigcup_iA_i\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 4'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]

- id: topo-a-047-1
  notion: topo-n-0013
  recto: 'Preuve : la topologie associée à une distance est séparée (Prop. 4)'
  verso: 'Soit \((X,d)\) un espace métrique. On considère deux points distincts \(x\) et \(y\in X\). Posons \(r=\frac{d(x,y)}{2}>0\). Alors \(B(x,r)\cap B(y,r)=\emptyset\) : si \(z\in B(x,r)\), alors \(d(x,z)<r=\frac{d(x,y)}{2}\) et, par l''inégalité triangulaire, \(d(y,z)\ge d(x,y)-d(x,z)>\frac{d(x,y)}{2}=r\), donc \(z\notin B(y,r)\). On montre de même que si \(z\in B(y,r)\), alors \(z\notin B(x,r)\).<br>Comme \(B(x,r)\) et \(B(y,r)\) sont ouverts (Prop. 5), l''espace est séparé.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 4'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [demonstration]

- id: topo-a-048-1
  notion: topo-n-0016
  recto: 'Déf : voisinage'
  verso: 'Soient \((X,\tau)\) un espace topologique, \(x\in X\) et \(V\in\mathcal P(X)\). On dit que \(V\) est un voisinage de \(x\) si et seulement s''il existe un ouvert \(O\in\tau\) tel que \(x\in O\subset V\). On note \(\mathcal V_x\subset\mathcal P(X)\) l''ensemble des voisinages de \(x\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 5'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [definition]
- id: topo-a-048-2
  notion: topo-n-0016
  recto: 'Rem. 1 : un ouvert est voisinage de tous ses points'
  verso: 'Soit \((X,\tau)\) un espace topologique. Un ouvert est un voisinage de tous ses points.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 5'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [definition]
- id: topo-a-048-3
  notion: topo-n-0016
  recto: 'Rem. 2 : voisinage dans un espace métrique'
  verso: 'Dans un espace métrique \((X,d)\), \(V\) est un voisinage de \(x\) si et seulement s''il existe \(r>0\) tel que \(B(x,r)\subset V\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 5'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [definition]

- id: topo-a-049-1
  notion: topo-n-0017
  recto: 'Prop. 6 (i) : intersection et union de voisinages'
  verso: 'Soient \((X,\tau)\) un espace topologique et \(x\in X\). \(\forall V_1,V_2\in\mathcal V_x,\ V_1\cap V_2\in\mathcal V_x\) et \(V_1\cup V_2\in\mathcal V_x\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 5'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [propriete]
- id: topo-a-049-2
  notion: topo-n-0017
  recto: 'Prop. 6 (ii) : partie contenant un voisinage'
  verso: 'Soient \((X,\tau)\) un espace topologique et \(x\in X\). \(\forall V\in\mathcal V_x,\ \forall A\in\mathcal P(X),\ V\subset A\Rightarrow A\in\mathcal V_x\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 5'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [propriete]
- id: topo-a-049-3
  notion: topo-n-0017
  recto: 'Preuve : propriétés des voisinages (Prop. 6)'
  verso: '(i) Par définition d''un voisinage, il existe \(O_1\) et \(O_2\in\tau\) tels que \(x\in O_1\subset V_1\) et \(x\in O_2\subset V_2\). Donc \(x\in O_1\cap O_2\subset V_1\cap V_2\) où \(O_1\cap O_2\) est ouvert. Et \(x\in O_1\subset V_1\cup V_2\).<br>(ii) Il existe \(O\in\tau\) tel que \(x\in O\subset V\). Donc \(x\in O\subset A\) où \(O\) est ouvert.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 5'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [propriete]

- id: topo-a-050-1
  notion: topo-n-0020
  recto: 'Prop. 8 (i) : croissance de l''intérieur'
  verso: 'Soient \((X,\tau)\) un espace topologique et \(A,B\in\mathcal P(X)\). \(A\subset B\Rightarrow\mathring A\subset\mathring B\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 6'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]
- id: topo-a-050-2
  notion: topo-n-0020
  recto: 'Prop. 8 (ii) : intérieur de l''intérieur'
  verso: 'Soient \((X,\tau)\) un espace topologique et \(A\in\mathcal P(X)\). \(\mathring{\mathring A}=\mathring A\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 6'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]
- id: topo-a-050-3
  notion: topo-n-0020
  recto: 'Prop. 8 (iii) : intérieur d''une intersection'
  verso: 'Soient \((X,\tau)\) un espace topologique et \(A,B\in\mathcal P(X)\). \((A\cap B)^\circ=\mathring A\cap\mathring B\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 6'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]
- id: topo-a-050-4
  notion: topo-n-0020
  recto: 'Prop. 8 (iv) : intérieur d''une union'
  verso: 'Soient \((X,\tau)\) un espace topologique et \(A,B\in\mathcal P(X)\). \(\mathring A\cup\mathring B\subset(A\cup B)^\circ\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 6'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]
- id: topo-a-050-5
  notion: topo-n-0020
  recto: 'Preuve : \((A\cap B)^\circ=\mathring A\cap\mathring B\) (Prop. 8 (iii))'
  verso: '\(A\cap B\subset A\Rightarrow(A\cap B)^\circ\subset\mathring A\) et \(A\cap B\subset B\Rightarrow(A\cap B)^\circ\subset\mathring B\), donc \((A\cap B)^\circ\subset\mathring A\cap\mathring B\).<br>Réciproquement, si \(x\in\mathring A\cap\mathring B\), il existe \(O_1\) et \(O_2\in\tau\) tels que \(x\in O_1\subset A\) et \(x\in O_2\subset B\). Posons \(O=O_1\cap O_2\in\tau\). On a alors \(x\in O\subset A\cap B\), d''où \(x\in(A\cap B)^\circ\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 6'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]

- id: topo-a-051-1
  notion: topo-n-0021
  recto: 'Exemple : l''intérieur d''une union n''est pas l''union des intérieurs'
  verso: 'Soient \(A,B\) deux parties de \(X\). Attention, on n''a pas toujours \(\mathring A\cup\mathring B=(A\cup B)^\circ\). Par exemple, dans \(\mathbb R\) usuel, \(([-1,0]\cup[0,1])^\circ=[-1,1]^\circ=]-1,1[\ \neq\ ]-1,0[\cup]0,1[=[-1,0]^\circ\cup[0,1]^\circ\).<br>(le poly écrit \((A\cap B)^\circ\) à la place de \((A\cup B)^\circ\) dans l''énoncé, et \(]0,-1[\) à la place de \(]0,1[\) : coquilles)'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 7'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [exemple]

- id: topo-a-052-1
  notion: topo-n-0022
  recto: 'Déf : point adhérent, adhérence'
  verso: 'Soient \((X,\tau)\) un espace topologique, \(A\in\mathcal P(X)\) et \(x\in X\). On dit que \(x\) est adhérent à \(A\) si tout voisinage de \(x\) a une intersection non vide avec \(A\). On appelle adhérence de \(A\) l''ensemble \(\overline A\) des points adhérents à \(A\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 7'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [definition]
- id: topo-a-052-2
  notion: topo-n-0022
  recto: 'Rem. : adhérence dans un espace métrique'
  verso: 'Dans un espace métrique \((X,d)\), on a donc \(x\in\overline A\) si et seulement si, \(\forall\epsilon>0,\ B(x,\epsilon)\cap A\neq\emptyset\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 7'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [definition]
- id: topo-a-052-3
  notion: topo-n-0022
  recto: 'Exemples : adhérences dans \(\mathbb R\) usuel'
  verso: 'Dans \(\mathbb R\) usuel, \(\overline{]0,1[}=[0,1]\) et \(\overline{\mathbb Q}=\mathbb R=\overline{\mathbb Q^c}\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 7'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [definition]

- id: topo-a-053-1
  notion: topo-n-0023
  recto: 'Prop. 9 : complémentaire de l''adhérence'
  verso: 'Soient \((X,\tau)\) un espace topologique et \(A\in\mathcal P(X)\). \((\overline A)^c=(A^c)^\circ\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 7'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]
- id: topo-a-053-2
  notion: topo-n-0023
  recto: 'Prop. 9 : complémentaire de l''intérieur'
  verso: 'Soient \((X,\tau)\) un espace topologique et \(A\in\mathcal P(X)\). \((\mathring A)^c=\overline{A^c}\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 7'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]
- id: topo-a-053-3
  notion: topo-n-0023
  recto: 'Preuve : \((\overline A)^c=(A^c)^\circ\) (Prop. 9)'
  verso: '\(x\in(\overline A)^c\Leftrightarrow x\notin\overline A\Leftrightarrow(\exists V\in\mathcal V_x\ /\ V\cap A=\emptyset)\Leftrightarrow(\exists V\in\mathcal V_x\ /\ V\subset A^c)\Leftrightarrow x\in(A^c)^\circ\).<br>On applique la propriété démontrée à \(A^c\) pour montrer l''autre identité.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 7'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]

- id: topo-a-054-1
  notion: topo-n-0024
  recto: 'Cor. 1 (i) : croissance de l''adhérence'
  verso: 'Soient \((X,\tau)\) un espace topologique et \(A,B\in\mathcal P(X)\). \(A\subset B\Rightarrow\overline A\subset\overline B\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 7'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]
- id: topo-a-054-2
  notion: topo-n-0024
  recto: 'Cor. 1 (ii) : adhérence de l''adhérence'
  verso: 'Soient \((X,\tau)\) un espace topologique et \(A,B\in\mathcal P(X)\). \(\overline{\overline A}=\overline A\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 7'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]
- id: topo-a-054-3
  notion: topo-n-0024
  recto: 'Cor. 1 (iii) : adhérence d''une union'
  verso: 'Soient \((X,\tau)\) un espace topologique et \(A,B\in\mathcal P(X)\). \(\overline{A\cup B}=\overline A\cup\overline B\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 7'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]
- id: topo-a-054-4
  notion: topo-n-0024
  recto: 'Cor. 1 (iv) : adhérence d''une intersection'
  verso: 'Soient \((X,\tau)\) un espace topologique et \(A,B\in\mathcal P(X)\). \(\overline{A\cap B}\subset\overline A\cap\overline B\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 7'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]
- id: topo-a-054-5
  notion: topo-n-0024
  recto: 'Cor. 1 (v) : adhérence, plus petit fermé'
  verso: 'Soient \((X,\tau)\) un espace topologique et \(A,B\in\mathcal P(X)\). \(\overline A\) est le plus petit fermé contenant \(A\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 7'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]
- id: topo-a-054-6
  notion: topo-n-0024
  recto: 'Cor. 1 (vi) : fermé et adhérence'
  verso: 'Soient \((X,\tau)\) un espace topologique et \(A,B\in\mathcal P(X)\). \(A\) est fermé si et seulement si \(A=\overline A\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 7'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]
- id: topo-a-054-7
  notion: topo-n-0024
  recto: 'Rem. : \(\overline{A\cap B}\neq\overline A\cap\overline B\) en général'
  verso: 'Attention, on n''a pas, en général, \(\overline{A\cap B}=\overline A\cap\overline B\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 7'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]

- id: topo-a-055-1
  notion: topo-n-0025
  recto: 'Déf : frontière'
  verso: 'Soient \((X,\tau)\) un espace topologique et \(A\in\mathcal P(X)\). On appelle frontière de \(A\) l''ensemble \(\partial A=\overline A\setminus\mathring A\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 7'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [definition]
- id: topo-a-055-2
  notion: topo-n-0025
  recto: 'Exemples : frontières dans \(\mathbb R\) usuel'
  verso: 'Dans \(\mathbb R\) usuel, \(\partial([0,1[)=[0,1]\setminus]0,1[=\{0,1\}\) et \(\partial\mathbb Q=\mathbb R\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 7'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [definition]

- id: topo-a-056-1
  notion: topo-n-0026
  recto: 'Prop. 10 : frontière de \(A\) et de son complémentaire'
  verso: 'Soient \((X,\tau)\) un espace topologique et \(A\in\mathcal P(X)\). \(\partial A=\partial(A^c)\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 8'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [propriete]
- id: topo-a-056-2
  notion: topo-n-0026
  recto: 'Preuve : \(\partial A=\partial(A^c)\) (Prop. 10)'
  verso: '\(\partial(A^c)=\overline{A^c}\setminus(A^c)^\circ=(\mathring A)^c\setminus(\overline A)^c=(\mathring A)^c\cap\overline A=\overline A\setminus\mathring A=\partial A\) (Prop. 9).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 8'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [propriete]
- id: topo-a-056-3
  notion: topo-n-0026
  recto: 'Prop. 11 : partition de \(X\) en intérieur, extérieur et frontière'
  verso: 'Soient \((X,\tau)\) un espace topologique et \(A\in\mathcal P(X)\). \(X=\mathring A\cup(A^c)^\circ\cup\partial A\) où les trois ensembles sont disjoints.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 8'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [propriete]
- id: topo-a-056-4
  notion: topo-n-0026
  recto: 'Preuve : \(X=\mathring A\cup(A^c)^\circ\cup\partial A\) (Prop. 11)'
  verso: '\(X=\overline A\cup(\overline A)^c=\big((\overline A\setminus\mathring A)\cup\mathring A\big)\cup(A^c)^\circ\) où les unions sont disjointes (Prop. 9 : \((\overline A)^c=(A^c)^\circ\)).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 8'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [propriete]

- id: topo-a-057-1
  notion: topo-n-0027
  recto: 'Déf : point d''accumulation'
  verso: 'Soient \(A\) une partie non vide de \(X\) et \(x\in\overline A\). On dit que \(x\) est un point d''accumulation de \(A\) si, pour tout voisinage \(V\) de \(x\), \((V\setminus\{x\})\cap A\neq\emptyset\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 8'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [definition]
- id: topo-a-057-2
  notion: topo-n-0027
  recto: 'Déf : point isolé'
  verso: 'Soient \(A\) une partie non vide de \(X\) et \(x\in\overline A\). On dit que \(x\) est un point isolé de \(A\) s''il existe un voisinage \(V\) de \(x\) tel que \((V\setminus\{x\})\cap A=\emptyset\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 8'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [definition]
- id: topo-a-057-3
  notion: topo-n-0027
  recto: 'Rem. 1 : points d''accumulation et points isolés'
  verso: 'Un point de \(\overline A\) est soit un point d''accumulation de \(A\), soit un point isolé de \(A\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 8'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [definition]
- id: topo-a-057-4
  notion: topo-n-0027
  recto: 'Rem. 2 : point d''accumulation et adhérence de \(A\setminus\{x\}\)'
  verso: '\(x\) est un point d''accumulation de \(A\) si et seulement si \(x\in\overline{A\setminus\{x\}}\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 8'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [definition]
- id: topo-a-057-5
  notion: topo-n-0027
  recto: 'Rem. 3 : un point isolé appartient à \(A\)'
  verso: 'Un point isolé de \(A\) appartient à \(A\) (car \(x\in\overline A\), mais \(x\notin\overline{A\setminus\{x\}}\)).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 8'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [definition]
- id: topo-a-057-6
  notion: topo-n-0027
  recto: 'Rem. 4 : points d''accumulation et isolés dans un espace métrique'
  verso: 'Dans un espace métrique \((X,d)\), \(x\) est donc un point d''accumulation de \(A\) si, pour tout \(\epsilon>0\), \((B(x,\epsilon)\setminus\{x\})\cap A\neq\emptyset\), et un point isolé s''il existe un \(\epsilon>0\) tel que \((B(x,\epsilon)\setminus\{x\})\cap A=\emptyset\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 8'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [definition]
- id: topo-a-057-7
  notion: topo-n-0027
  recto: 'Exemple : point d''accumulation et point isolé'
  verso: 'Dans \(\mathbb R\) usuel, tout point de \([0,1]\) est un point d''accumulation de \([0,1[\cup\{2\}\), mais \(2\) est un point isolé.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 8'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [definition]

- id: topo-a-058-1
  notion: topo-n-0028
  recto: 'Déf : partie dense'
  verso: 'Soient \((X,\tau)\) un espace topologique et \(A\in\mathcal P(X)\). On dit que \(A\) est dense dans \(X\) si et seulement si \(\overline A=X\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 8'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [definition]
- id: topo-a-058-2
  notion: topo-n-0028
  recto: 'Exemple : parties denses de \(\mathbb R\)'
  verso: '\(\mathbb Q\) et \(\mathbb Q^c\) sont denses dans \(\mathbb R\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 8'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [definition]

- id: topo-a-059-1
  notion: topo-n-0029
  recto: 'Déf : espace séparable'
  verso: 'On dit qu''un espace topologique est séparable s''il contient un sous-ensemble au plus dénombrable et dense.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 8'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [definition]
- id: topo-a-059-2
  notion: topo-n-0029
  recto: 'Exemple : \(\mathbb R\) est séparable'
  verso: '\(\mathbb R\) est séparable car \(\mathbb Q\) est dénombrable.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 8'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [definition]
- id: topo-a-059-3
  notion: topo-n-0029
  recto: 'Rem. : séparable et séparé'
  verso: 'Attention, ne pas confondre les espaces séparables et les espaces séparés.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 8'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [definition]

- id: topo-a-060-1
  notion: topo-n-0030
  recto: 'Prop. 12 : topologie induite, sous-espace topologique'
  verso: 'Soient \((X,\tau)\) un espace topologique et \(Y\in\mathcal P(X)\) une partie non vide. L''ensemble \(\tau_Y=\{A\cap Y\ /\ A\in\tau\}\) est une topologie sur \(Y\) appelée topologie induite par celle de \(X\). \((Y,\tau_Y)\) est appelé sous-espace topologique de \((X,\tau)\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 8'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]
- id: topo-a-060-2
  notion: topo-n-0030
  recto: 'Prop. 13 : fermés d''un sous-espace topologique'
  verso: 'Soient \((X,\tau)\) un espace topologique et \(Y\in\mathcal P(X)\). Une partie \(A\in\mathcal P(Y)\) est fermée dans \((Y,\tau_Y)\) si et seulement s''il existe \(B\in\mathcal P(X)\), un fermé de \((X,\tau)\), tel que \(A=B\cap Y\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 9'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]
- id: topo-a-060-3
  notion: topo-n-0030
  recto: 'Preuve : \(\tau_Y\) est une topologie sur \(Y\) (Prop. 12)'
  verso: 'Il suffit de montrer les trois axiomes d''une topologie. \(\emptyset=\emptyset\cap Y\in\tau_Y\) et \(Y=X\cap Y\in\tau_Y\).<br>Intersection finie : si \(A_k=B_k\cap Y\) avec \(B_k\in\tau\), alors \(\bigcap_{k=1}^n(B_k\cap Y)=\big(\bigcap_{k=1}^nB_k\big)\cap Y\in\tau_Y\) car \(\bigcap_kB_k\in\tau\).<br>Union quelconque : si \(A_i=B_i\cap Y\) avec \(B_i\in\tau\), alors \(\bigcup_{i\in I}(B_i\cap Y)=\big(\bigcup_{i\in I}B_i\big)\cap Y\in\tau_Y\) car \(\bigcup_iB_i\in\tau\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 8'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]

- id: topo-a-061-1
  notion: topo-n-0032
  recto: 'Prop. 15 : topologie de la distance induite'
  verso: 'Soient \((X,d)\) un espace métrique et \(Y\in\mathcal P(X)\) non vide. La topologie associée à la distance induite par \(d\) sur \(Y\) est la topologie induite par celle associée à \(d\) sur \(X\).<br>En d''autres termes, un ensemble \(A\in\mathcal P(Y)\) est ouvert dans \((Y,d)\) si et seulement s''il existe \(B\) un ouvert de \((X,d)\) tel que \(A=B\cap Y\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 9'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [propriete]
- id: topo-a-061-2
  notion: topo-n-0032
  recto: 'Preuve : topologie de la distance induite (Prop. 15)'
  verso: 'Soit \(A\) ouvert dans \((Y,d)\). Pour tout \(x\in A\), il existe \(r_x>0\) tel que \(B_Y(x,r_x)\subset A\), où \(B_Y(x,r_x)=B(x,r_x)\cap Y\). Ainsi \(A=\bigcup_{x\in A}B_Y(x,r_x)=\big(\bigcup_{x\in A}B(x,r_x)\big)\cap Y\), où \(\bigcup_{x\in A}B(x,r_x)\) est un ouvert de \((X,d)\) (union d''ouverts).<br>Réciproquement, soit \(A=B\cap Y\) où \(B\) est un ouvert de \((X,d)\) et soit \(x\in A\subset B\). Il existe \(r>0\) tel que \(B(x,r)\subset B\), d''où \(B_Y(x,r)=B(x,r)\cap Y\subset B\cap Y=A\) : \(A\) est ouvert dans \((Y,d)\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 9'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [propriete]
- id: topo-a-061-3
  notion: topo-n-0032
  recto: 'Cor. 2 : fermés de la distance induite'
  verso: 'Soient \((X,d)\) un espace métrique et \(Y\in\mathcal P(X)\) non vide. Un ensemble \(A\in\mathcal P(Y)\) est fermé dans \((Y,d)\) si et seulement s''il existe \(B\), un fermé de \((X,d)\), tel que \(A=B\cap Y\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 10'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [propriete]
- id: topo-a-061-4
  notion: topo-n-0032
  recto: 'Exemple : \(]0,1]\) ouvert dans \([-1,1]\) et fermé dans \(]0,2[\)'
  verso: '\(]0,1]\) est ouvert dans \([-1,1]\) et fermé dans \(]0,2[\) munis de la distance usuelle.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 10'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [propriete]
- id: topo-a-061-5
  notion: topo-n-0032
  recto: 'Exemple : topologie de \(\mathbb R\) usuel et de \(\mathbb R^2\) euclidien'
  verso: 'La topologie de \(\mathbb R\) usuel est la topologie induite par celle de \(\mathbb R^2\) euclidien.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 10'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [propriete]

- id: topo-a-062-1
  notion: topo-n-0033
  recto: 'Prop. 16 : espace métrique produit (produit fini)'
  verso: 'Soit \(((X_k,d_k))_{k\in\{1,\cdots,n\}}\) une famille finie d''espaces métriques. On note \(X=\prod_{k=1}^nX_k\) l''espace produit et on définit \(d:X\times X\to\mathbb R\) en posant \(d(x,y)=\sum_{k=1}^nd_k(x_k,y_k),\ \forall x=(x_1,\cdots,x_n),\ y=(y_1,\cdots,y_n)\in X\).<br>La fonction \(d\) est alors une distance sur \(X\). Le couple \((X,d)\) est appelé espace métrique produit.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 10'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]
- id: topo-a-062-2
  notion: topo-n-0033
  recto: 'Preuve : \(d=\sum_kd_k\) est une distance sur le produit (Prop. 16)'
  verso: 'On montre les 4 axiomes.<br>Positivité : tous les termes de la somme sont positifs ou nuls.<br>Séparation : \(d(x,y)=0\Leftrightarrow d_k(x_k,y_k)=0,\ \forall k\) (termes positifs) \(\Leftrightarrow x_k=y_k,\ \forall k\Leftrightarrow x=y\).<br>Symétrie : \(\sum_kd_k(x_k,y_k)=\sum_kd_k(y_k,x_k)\).<br>Inégalité triangulaire : \(d(x,y)\le\sum_k\big(d_k(x_k,z_k)+d_k(z_k,y_k)\big)=d(x,z)+d(z,y)\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 10'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [propriete]

- id: topo-a-063-1
  notion: topo-n-0035
  recto: 'Prop. 17 : équivalence topologique et même topologie'
  verso: 'Deux distances sont topologiquement équivalentes si et seulement si elles sont associées à la même topologie.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 11'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [theoreme]
- id: topo-a-063-2
  notion: topo-n-0035
  recto: 'Preuve : équivalence topologique et même topologie (Prop. 17)'
  verso: 'Soient \(\tau_d\) et \(\tau_\delta\) les topologies associées à deux distances topologiquement équivalentes \(d\) et \(\delta\). Si \(A\in\tau_d\), alors, pour tout \(x\in A\), il existe \(\epsilon>0\) tel que \(B_d(x,\epsilon)\subset A\). Les distances étant équivalentes, il existe \(\alpha>0\) tel que \(B_\delta(x,\alpha)\subset B_d(x,\epsilon)\subset A\). Ainsi \(A\in\tau_\delta\) et \(\tau_d\subset\tau_\delta\). Par symétrie, \(\tau_\delta\subset\tau_d\), d''où \(\tau_\delta=\tau_d\).<br>Réciproquement, si \(\tau_d=\tau_\delta\), soient \(x\in X\) et \(\epsilon>0\). On a \(B_d(x,\epsilon)\in\tau_d=\tau_\delta\) : \(x\) est intérieur à la boule pour \(\tau_\delta\) et il existe \(\alpha_1>0\) tel que \(B_\delta(x,\alpha_1)\subset B_d(x,\epsilon)\), i.e. \(\forall y\in X,\ \delta(x,y)<\alpha_1\Rightarrow d(x,y)<\epsilon\). Par symétrie, il existe \(\alpha_2>0\) pour l''autre implication. On prend \(\alpha=\min(\alpha_1,\alpha_2)\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 11'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [theoreme]

- id: topo-a-064-1
  notion: topo-n-0037
  recto: 'Exemple : distance bornée \(\delta=\frac{d}{1+d}\)'
  verso: 'La fonction \(\delta:(x,y)\mapsto\frac{d(x,y)}{1+d(x,y)}\) est une distance uniformément équivalente à \(d\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 12'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [exemple]
- id: topo-a-064-2
  notion: topo-n-0037
  recto: 'Preuve : \(\delta=\frac{d}{1+d}\) est une distance'
  verso: '\(\delta\) est clairement positive et symétrique. De plus \(\delta(x,y)=0\Leftrightarrow d(x,y)=0\Leftrightarrow x=y\) (séparation).<br>Inégalité triangulaire : \(f:t\mapsto\frac{t}{1+t}\) est croissante car \(f''(t)=\frac{1}{(1+t)^2}\). Ainsi \(\delta(x,y)=f(d(x,y))\le f(d(x,z)+d(z,y))=\frac{d(x,z)}{1+d(x,z)+d(z,y)}+\frac{d(z,y)}{1+d(x,z)+d(z,y)}\le\frac{d(x,z)}{1+d(x,z)}+\frac{d(z,y)}{1+d(z,y)}=\delta(x,z)+\delta(z,y)\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 12'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [exemple]
- id: topo-a-064-3
  notion: topo-n-0037
  recto: 'Preuve : \(\delta=\frac{d}{1+d}\) est uniformément équivalente à \(d\)'
  verso: '\(f:t\mapsto\frac{t}{1+t}\) est une bijection strictement croissante de \(\mathbb R_+\) dans \([0,1[\), d''inverse \(f^{-1}:t\mapsto\frac{t}{1-t}\). Ainsi, pour tout \(\epsilon>0\), il existe \(\alpha=\min\big(f(\epsilon),f^{-1}(\min(\epsilon,0.9))\big)\) tel que, pour tous \(x,y\in X\), \(d(x,y)<\alpha\Rightarrow\delta(x,y)<\epsilon\) et \(\delta(x,y)<\alpha\Rightarrow d(x,y)<\epsilon\) (on prend \(\min(\epsilon,0.9)\) au lieu de \(\epsilon\) car \(f^{-1}(\epsilon)\) n''est défini que si \(\epsilon<1\)).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 12'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [exemple]

- id: topo-a-065-1
  notion: topo-n-0039
  recto: 'Déf : suite convergente'
  verso: 'Une suite \((u_n)_{n\in\mathbb N}\) dans un espace topologique \((X,\tau)\) est dite convergente s''il existe un point \(x\in X\), appelé limite, tel que \(\forall V\in\mathcal V_x,\ \exists N\in\mathbb N\ /\ \forall n\in\mathbb N,\ (n\ge N\Rightarrow u_n\in V)\).<br>On écrit \(x=\lim_{n\to+\infty}u_n\) ou \(u_n\to x\) et on dit que \((u_n)_{n\in\mathbb N}\) converge vers \(x\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 13'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [definition]

- id: topo-a-066-1
  notion: topo-n-0040
  recto: 'Prop. 20 : convergence dans un espace métrique'
  verso: 'Une suite \((u_n)_{n\in\mathbb N}\) dans un espace métrique \((X,d)\) converge vers un point \(x\in X\) si et seulement si \(\forall\epsilon>0,\ \exists N\in\mathbb N\ /\ \forall n\in\mathbb N,\ (n\ge N\Rightarrow d(u_n,x)<\epsilon)\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 13'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]
- id: topo-a-066-2
  notion: topo-n-0040
  recto: 'Preuve : convergence dans un espace métrique (Prop. 20)'
  verso: 'Pour tout \(\epsilon>0\), \(B(x,\epsilon)\) est un voisinage de \(x\). Donc, si la suite converge, ses éléments \(u_n\) appartiennent à \(B(x,\epsilon)\) à partir d''un certain rang, i.e. \(d(u_n,x)<\epsilon\).<br>Réciproquement, supposons la condition satisfaite et considérons un voisinage \(V\) de \(x\). Il existe \(\epsilon>0\) tel que \(B(x,\epsilon)\subset V\). Par hypothèse, \(u_n\) appartient à \(B(x,\epsilon)\), donc à \(V\), à partir d''un certain rang : la suite converge vers \(x\).<br>(le poly écrit « supposons que la suite converge » pour la réciproque : coquille)'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 13'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [propriete]

- id: topo-a-067-1
  notion: topo-n-0041
  recto: 'Déf : suite extraite, sous-suite'
  verso: 'On dit qu''une suite \((v_n)_{n\in\mathbb N}\) est extraite d''une suite \((u_n)_{n\in\mathbb N}\) ou que \((v_n)_{n\in\mathbb N}\) est une sous-suite de \((u_n)_{n\in\mathbb N}\) s''il existe une fonction \(\varphi\) strictement croissante de \(\mathbb N\) dans \(\mathbb N\) telle que \(v_n=u_{\varphi(n)},\ \forall n\in\mathbb N\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 14'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [definition]

- id: topo-a-068-1
  notion: topo-n-0042
  recto: 'Prop. 21 : convergence d''une suite et de ses suites extraites'
  verso: 'Une suite \((u_n)_{n\in\mathbb N}\) converge si et seulement si toute suite extraite de \((u_n)_{n\in\mathbb N}\) converge.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 14'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [propriete]
- id: topo-a-068-2
  notion: topo-n-0042
  recto: 'Preuve : suite et suites extraites (Prop. 21)'
  verso: 'Par définition, \((u_n)\) converge vers \(x\) si et seulement si \(\forall V\in\mathcal V_x,\ \exists N\in\mathbb N\ /\ \forall n\in\mathbb N,\ (n\ge N\Rightarrow u_n\in V)\). Alors, pour toute suite extraite \((u_{\varphi(n)})\), on a \(\forall n\ge N,\ u_{\varphi(n)}\in V\) car \(\varphi(n)\ge n\). Donc \((u_{\varphi(n)})\) converge.<br>Réciproquement, si toute suite extraite de \((u_n)\) converge, alors \((u_n)\) converge car c''est aussi une suite extraite (pour \(\varphi(n)=n,\ \forall n\in\mathbb N\)).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 14'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [propriete]

- id: topo-a-069-1
  notion: topo-n-0043
  recto: 'Prop. 22 (i) : caractérisation séquentielle de l''adhérence'
  verso: 'Soient \((X,d)\) un espace métrique et \(A\in\mathcal P(X)\). Pour tout \(x\in X\) : \(x\) appartient à \(\overline A\Leftrightarrow\) il existe une suite \((u_n)_{n\in\mathbb N}\) dans \(A\) telle que \(x=\lim_{n\to+\infty}u_n\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 14'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [theoreme]
- id: topo-a-069-2
  notion: topo-n-0043
  recto: 'Prop. 22 (ii) : caractérisation séquentielle des fermés'
  verso: 'Soient \((X,d)\) un espace métrique et \(A\in\mathcal P(X)\). \(A\) est fermé \(\Leftrightarrow\) toute suite convergente d''éléments de \(A\) a sa limite dans \(A\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 14'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [theoreme]
- id: topo-a-069-3
  notion: topo-n-0043
  recto: 'Preuve : caractérisation séquentielle de l''adhérence (Prop. 22 (i))'
  verso: 'Si \(x\in\overline A\), alors \(\forall n\in\mathbb N^*,\ B\big(x,\frac1n\big)\cap A\neq\emptyset\). Pour tout \(n\in\mathbb N^*\), il existe donc un \(u_n\in B\big(x,\frac1n\big)\cap A\). La suite \((u_n)\) ainsi construite est dans \(A\) et converge vers \(x\) car \(d(x,u_n)<\frac1n,\ \forall n\in\mathbb N^*\).<br>Réciproquement, si \((u_n)\) dans \(A\) converge vers \(x\) : pour tout \(\epsilon>0\), il existe \(n\) tel que \(d(x,u_n)<\epsilon\). Donc \(B(x,\epsilon)\cap A\neq\emptyset\) et \(x\in\overline A\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 14'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [theoreme]
- id: topo-a-069-4
  notion: topo-n-0043
  recto: 'Preuve : caractérisation séquentielle des fermés (Prop. 22 (ii))'
  verso: '(\(\Rightarrow\)) \(A\) fermé et \((u_n)\) dans \(A\) converge vers \(x\in X\). D''après (i), \(x\in\overline A\). Mais, comme \(A\) est fermé, \(\overline A=A\). Donc \(x\in A\).<br>(\(\Leftarrow\)) Soit \(x\in\overline A\). D''après (i), il existe une suite \((u_n)\) de \(A\) qui converge vers \(x\). Or toute suite convergente d''éléments de \(A\) a sa limite dans \(A\). Donc \(x\in A\) et \(A=\overline A\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 14'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [theoreme]

- id: topo-a-070-1
  notion: topo-n-0044
  recto: 'Déf : valeur d''adhérence d''une suite'
  verso: 'Soient \((u_n)_{n\in\mathbb N}\) une suite d''un espace topologique \((X,\tau)\) et \(x\in X\). On dit que \(x\) est valeur d''adhérence de la suite \((u_n)_{n\in\mathbb N}\) si et seulement si \(\forall V\in\mathcal V_x,\ \forall N\in\mathbb N,\ \exists n\ge N\) tel que \(u_n\in V\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 14'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [definition]
- id: topo-a-070-2
  notion: topo-n-0044
  recto: 'Prop. 23 : valeur d''adhérence dans un espace métrique'
  verso: 'Soit \((u_n)_{n\in\mathbb N}\) une suite d''un espace métrique \((X,d)\). Un point \(x\in X\) est valeur d''adhérence de la suite \((u_n)_{n\in\mathbb N}\) si et seulement si \(\forall\epsilon>0,\ \forall N\in\mathbb N,\ \exists n\ge N\) tel que \(d(x,u_n)<\epsilon\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 15'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 2
  tags: [definition]

- id: topo-a-071-1
  notion: topo-n-0047
  recto: 'Déf : continuité en un point (espaces topologiques)'
  verso: 'Soient \((X,\tau)\) et \((Y,\theta)\) deux espaces topologiques et \(f:X\to Y\) une application. On dit que \(f\) est continue au point \(x\in X\) si et seulement si \(\forall V\in\mathcal V_{f(x)},\ \exists U\in\mathcal V_x\ /\ f(U)\subset V\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 16'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [definition]
- id: topo-a-071-2
  notion: topo-n-0047
  recto: 'Déf : application continue (espaces topologiques)'
  verso: 'Soient \((X,\tau)\) et \((Y,\theta)\) deux espaces topologiques et \(f:X\to Y\) une application. \(f\) est continue si et seulement si \(f\) est continue en tout point \(x\in X\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 16'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 3
  tags: [definition]

- id: topo-a-072-1
  notion: topo-n-0048
  recto: 'Prop. 26 : continuité en un point, \(\epsilon\)-\(\alpha\) et séquentielle'
  verso: 'Soient \((X,d)\) et \((Y,\delta)\) deux espaces métriques, \(f:X\to Y\) une application et \(x\in X\). Les propriétés suivantes sont équivalentes.<br>(i) \(f\) est continue en \(x\) (pour les topologies associées à \(d\) et \(\delta\)).<br>(ii) \(\forall\epsilon>0,\ \exists\alpha>0\ /\ \forall x''\in X,\ \big(d(x,x'')<\alpha\Rightarrow\delta(f(x),f(x''))<\epsilon\big)\).<br>(iii) Pour toute suite \((u_n)_{n\in\mathbb N}\) de \(X\) telle que \(\lim_{n\to+\infty}u_n=x\), on a \(\lim_{n\to+\infty}f(u_n)=f(x)\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 16'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [theoreme]
- id: topo-a-072-2
  notion: topo-n-0048
  recto: 'Preuve : (i) \(\Leftrightarrow\) (ii) (Prop. 26)'
  verso: 'L''équivalence (i) \(\Leftrightarrow\) (ii) vient du fait que \(B(x,\epsilon)\) est un voisinage de \(x\) et réciproquement que tout voisinage de \(x\) contient une boule de centre \(x\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 16'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [theoreme]
- id: topo-a-072-3
  notion: topo-n-0048
  recto: 'Preuve : (ii) \(\Leftrightarrow\) (iii) (Prop. 26)'
  verso: '(ii) \(\Rightarrow\) (iii) : soit \((u_n)\) qui converge vers \(x\) et \(\epsilon>0\). Il existe \(N\) tel que, pour tout \(n\ge N\), \(d(x,u_n)<\alpha\) où \(\alpha\) est donné dans (ii) en fonction de \(\epsilon\). Donc, pour tout \(n\ge N\), \(\delta(f(x),f(u_n))<\epsilon\) : \(f(u_n)\to f(x)\).<br>(iii) \(\Rightarrow\) (ii), par contraposée : supposons qu''il existe \(\epsilon>0\) tel que, pour tout \(\alpha>0\), il existe \(x''\in X\) avec \(d(x,x'')<\alpha\) mais \(\delta(f(x),f(x''))\ge\epsilon\). Avec \(\alpha=\frac1n\), on obtient \(u_n\in B\big(x,\frac1n\big)\) tel que \(\delta(f(x),f(u_n))\ge\epsilon\). La suite \((u_n)\) converge vers \(x\), mais \((f(u_n))\) ne converge pas vers \(f(x)\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 16'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [theoreme]

- id: topo-a-073-1
  notion: topo-n-0049
  recto: 'Prop. 27 : caractérisations de la continuité'
  verso: 'Soient \((X,d)\) et \((Y,\delta)\) deux espaces métriques et \(f:X\to Y\) une application. Les propriétés suivantes sont équivalentes.<br>(i) \(f\) est continue.<br>(ii) Pour tout ouvert \(U\) de \(Y\), \(f^{-1}(U)\) est un ouvert de \(X\).<br>(iii) Pour tout fermé \(F\) de \(Y\), \(f^{-1}(F)\) est un fermé de \(X\).<br>(iv) Pour toute partie \(A\in\mathcal P(X)\), on a \(f(\overline A)\subset\overline{f(A)}\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 16'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [theoreme]
- id: topo-a-073-2
  notion: topo-n-0049
  recto: 'Preuve : (i) \(\Rightarrow\) (ii) \(\Rightarrow\) (iii) (Prop. 27)'
  verso: '(i) \(\Rightarrow\) (ii) : soit \(U\) ouvert de \(Y\) ; si \(f^{-1}(U)=\emptyset\), il est ouvert. Sinon, soit \(x\in f^{-1}(U)\). Comme \(U\) est ouvert et \(f(x)\in U\), il existe \(\epsilon>0\) tel que \(B(f(x),\epsilon)\subset U\). Par continuité, il existe \(\alpha>0\) tel que \(d(x,x'')<\alpha\Rightarrow\delta(f(x),f(x''))<\epsilon\). Pour tout \(x''\in B_d(x,\alpha)\), \(f(x'')\in B_\delta(f(x),\epsilon)\subset U\), donc \(B_d(x,\alpha)\subset f^{-1}(U)\).<br>(ii) \(\Rightarrow\) (iii) : si \(F\) est fermé, \(Y\setminus F\) est ouvert, donc \(f^{-1}(Y\setminus F)=X\setminus f^{-1}(F)\) est ouvert d''après (ii) : \(f^{-1}(F)\) est fermé.'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 17'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [theoreme]
- id: topo-a-073-3
  notion: topo-n-0049
  recto: 'Preuve : (iii) \(\Rightarrow\) (iv) (Prop. 27)'
  verso: 'Soit \(A\in\mathcal P(X)\). On a \(A\subset f^{-1}(f(A))\subset f^{-1}\big(\overline{f(A)}\big)\), donc \(\overline A\subset\overline{f^{-1}\big(\overline{f(A)}\big)}\). Or \(f^{-1}\big(\overline{f(A)}\big)\) est fermé car \(\overline{f(A)}\) est fermé. Donc \(\overline A\subset f^{-1}\big(\overline{f(A)}\big)\) et \(f(\overline A)\subset f\big(f^{-1}(\overline{f(A)})\big)=f(X)\cap\overline{f(A)}\subset\overline{f(A)}\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 17'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [theoreme]
- id: topo-a-073-4
  notion: topo-n-0049
  recto: 'Preuve : (iv) \(\Rightarrow\) (i) (Prop. 27)'
  verso: 'Par contraposée. Supposons qu''il existe un point \(x\) en lequel \(f\) n''est pas continue : \(\exists\epsilon>0\ /\ \forall\alpha>0,\ \exists x''\in X\) tel que \(d(x,x'')<\alpha\) et \(\delta(f(x),f(x''))\ge\epsilon\). Pour tout \(n\), il existe \(u_n\in B\big(x,\frac1n\big)\) tel que \(\delta(f(x),f(u_n))\ge\epsilon\). Posons \(A=\{u_n\ /\ n\in\mathbb N\}\). Le point \(x\) appartient à \(\overline A\) car \(u_n\to x\). Mais \(f(x)\) n''appartient pas à \(\overline{f(A)}\) car \(B(f(x),\epsilon)\cap f(A)=\emptyset\). \(f(\overline A)\) n''est donc pas inclus dans \(\overline{f(A)}\).'
  source: 'Poly de topologie Paris Cité, ch. 1, p. 17'
  chapitre: 'Chapitre 1 - Espace métrique'
  priorite: 1
  tags: [theoreme]
- id: topo-a-074-1
  notion: topo-n-0053
  recto: 'Déf 21 : suite de Cauchy'
  verso: 'Soit \((X,d)\) un espace métrique. Une suite \((u_n)_{n\in\mathbb N}\) dans \(X\) est dite de Cauchy si et seulement si<br>\[\forall\epsilon>0,\exists n\in\mathbb N\ /\ \forall p,q\in\mathbb N,\ (p\ge n\text{ et }q\ge n\ \Rightarrow\ d(u_p,u_q)<\epsilon).\]'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 1'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [definition]
- id: topo-a-075-1
  notion: topo-n-0054
  recto: 'Prop. 28 : toute suite convergente est de Cauchy'
  verso: 'Soit \((X,d)\) un espace métrique. Toute suite convergente est de Cauchy.<br>(le poly ajoute : on verra plus tard que la réciproque n''est pas nécessairement vraie)'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 1'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 3
  tags: [propriete]
- id: topo-a-075-2
  notion: topo-n-0054
  recto: 'Preuve : Prop. 28'
  verso: 'Soit \((u_n)\) une suite qui converge vers \(x\) et \(\epsilon>0\). Par définition de la limite, il existe \(n\) tel que, pour tout \(p\ge n\), \(d(u_p,x)<\frac\epsilon2\). Pour \(p,q\ge n\), par l''inégalité triangulaire : \(d(u_p,u_q)\le d(u_p,x)+d(x,u_q)<\frac\epsilon2+\frac\epsilon2=\epsilon\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 1'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 3
  tags: [propriete]
- id: topo-a-076-1
  notion: topo-n-0055
  recto: 'Prop. 29 : suite de Cauchy ayant une valeur d''adhérence'
  verso: 'Soit \((X,d)\) un espace métrique. Toute suite de Cauchy ayant une valeur d''adhérence \(x\) converge vers \(x\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 1'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 2
  tags: [propriete]
- id: topo-a-076-2
  notion: topo-n-0055
  recto: 'Preuve : Prop. 29'
  verso: 'Soit \(\epsilon>0\). Suite de Cauchy : il existe \(n\) tel que \(d(u_p,u_q)<\frac\epsilon2\) pour tous \(p,q\ge n\). Cet entier \(n\) étant fixé, \(x\) valeur d''adhérence : il existe \(m\ge n\) tel que \(d(u_m,x)<\frac\epsilon2\). Pour tout \(p\ge n\) : \(d(u_p,x)\le d(u_p,u_m)+d(u_m,x)<\frac\epsilon2+\frac\epsilon2=\epsilon\), donc \((u_n)\) converge vers \(x\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 1'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 2
  tags: [propriete]
- id: topo-a-077-1
  notion: topo-n-0056
  recto: 'Déf 22 : espace métrique complet'
  verso: 'Un espace métrique \((X,d)\) est dit complet si et seulement si toute suite de Cauchy de cet espace est convergente.<br>Remarque du poly : cette notion est très importante car elle permet de montrer qu''une suite est convergente sans connaître sa limite.'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 2'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [definition]
- id: topo-a-078-1
  notion: topo-n-0057
  recto: 'Exemple : \(\mathbb R\) usuel est complet'
  verso: '\(\mathbb R\) (usuel) est complet. Le fait que toute suite de Cauchy de \(\mathbb R\) est convergente a été vu en L2.'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 2'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 3
  tags: [exemple]
- id: topo-a-078-2
  notion: topo-n-0057
  recto: 'Exemple : \(\mathbb Q\) n''est pas complet'
  verso: '\(\mathbb Q\) n''est pas complet. Pour le montrer, on peut considérer la suite \(10^{-n}\lfloor10^n\sqrt2\rfloor\) où \(\lfloor\cdot\rfloor\) désigne la partie entière. Cette suite de \(\mathbb Q\) converge dans \(\mathbb R\) vers \(\sqrt2\). C''est donc une suite de Cauchy pour la distance usuelle sur \(\mathbb R\) et la distance induite sur \(\mathbb Q\). Mais elle ne converge pas dans \(\mathbb Q\) car \(\sqrt2\notin\mathbb Q\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 2'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 3
  tags: [exemple]
- id: topo-a-078-3
  notion: topo-n-0057
  recto: 'Exemple : \(\mathbb R\setminus\mathbb Q\) n''est pas complet'
  verso: '\(\mathbb R\setminus\mathbb Q\) n''est pas complet. Pour le montrer, on peut prendre la suite \(\left(\frac{\sqrt2}{n}\right)_{n\in\mathbb N}\) de \(\mathbb R\setminus\mathbb Q\) qui tend vers \(0\in\mathbb Q\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 2'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 3
  tags: [exemple]
- id: topo-a-078-4
  notion: topo-n-0057
  recto: 'Exemple : ensemble muni de la distance discrète'
  verso: 'Si \(X\) est un ensemble non vide, alors \(X\), muni de la distance discrète, est un espace métrique complet (la justification est en exercice).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 2'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 3
  tags: [exemple]
- id: topo-a-079-1
  notion: topo-n-0059
  recto: 'Déf 24 : suite décroissante (resp. croissante) de parties'
  verso: 'On dit qu''une suite \((A_n)_{n\in\mathbb N}\) de \(\mathcal P(X)\) est décroissante (resp. croissante) si et seulement si \(A_{n+1}\subset A_n\) (resp. \(A_n\subset A_{n+1}\)), \(\forall n\in\mathbb N\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 2'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 2
  tags: [theoreme]
- id: topo-a-079-2
  notion: topo-n-0059
  recto: 'Prop. 30 : complétude et suites décroissantes de fermés'
  verso: 'Un espace métrique \(X\) est complet si et seulement si, pour toute suite décroissante \((A_n)_{n\in\mathbb N}\) de fermés non vides de \(X\) telle que \(\lim_{n\to+\infty}\operatorname{diam}(A_n)=0\), on a \(\bigcap_{n\in\mathbb N}A_n\neq\emptyset\). Il existe alors \(x\in X\) tel que \(\bigcap_{n\in\mathbb N}A_n=\{x\}\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 2'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 2
  tags: [theoreme]
- id: topo-a-079-3
  notion: topo-n-0059
  recto: 'Preuve : Prop. 30, \(X\) complet \(\Rightarrow\) intersection non vide'
  verso: 'On suppose \((X,d)\) complet et \((A_n)\) décroissante de fermés non vides avec \(\operatorname{diam}(A_n)\to0\). On choisit \(u_n\in A_n\). Pour \(\epsilon>0\), il existe \(n\) tel que \(\operatorname{diam}(A_n)<\epsilon\) ; pour \(p,q\ge n\), \(u_p,u_q\in A_n\), donc \(d(u_p,u_q)\le\operatorname{diam}(A_n)<\epsilon\) : \((u_n)\) est de Cauchy, donc converge vers \(x\in X\). Pour \(p\ge n\), \(u_p\in A_n\) fermé, donc \(x\in A_n\), \(\forall n\) : \(\bigcap_nA_n\neq\emptyset\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 2'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 2
  tags: [theoreme]
- id: topo-a-079-4
  notion: topo-n-0059
  recto: 'Preuve : Prop. 30, réciproque (et singleton)'
  verso: 'Soit \((u_n)\) de Cauchy. On pose \(r_n=\max_{p\ge n}d(u_n,u_p)\) ; pour \(p\ge n\), \(u_p\in\bar B(u_n,r_n)\), et \(r_n\to0\) car \((u_n)\) est de Cauchy. On pose \(A_0=\bar B(u_0,r_0)\) et \(A_n=\bar B(u_n,r_n)\cap A_{n-1}\) : suite décroissante avec \(\operatorname{diam}(A_n)\le2r_n\to0\). Par hypothèse \(\bigcap_nA_n\neq\emptyset\) ; pour \(x\) dans cette intersection, \(d(x,u_n)\le r_n\to0\), donc \(u_n\to x\) et \(X\) est complet. Singleton : si \(x,y\in\bigcap_nA_n\), \(d(x,y)\le2r_n\to0\), donc \(x=y\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 2'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 2
  tags: [theoreme]
- id: topo-a-080-1
  notion: topo-n-0060
  recto: 'Prop. 31 (1) : un sous-espace complet est fermé'
  verso: 'Soient \((X,d)\) un espace métrique et \(Y\) une partie non vide de \(X\). Si le sous-espace métrique \((Y,d)\) est complet, alors \(Y\) est fermé dans \(X\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 3'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [propriete]
- id: topo-a-080-2
  notion: topo-n-0060
  recto: 'Prop. 31 (2) : \(X\) complet, \(Y\) complet si et seulement si \(Y\) fermé'
  verso: 'Soient \((X,d)\) un espace métrique et \(Y\) une partie non vide de \(X\). Si de plus \(X\) est complet, alors \(Y\) est complet si et seulement si \(Y\) est fermé dans \(X\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 3'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [propriete]
- id: topo-a-080-3
  notion: topo-n-0060
  recto: 'Preuve : Prop. 31 (1)'
  verso: 'On utilise la caractérisation séquentielle d''une partie fermée. Soit \((u_n)\) une suite de \(Y\) qui converge vers \(x\in X\). Cette suite est de Cauchy. Elle converge donc dans \((Y,d)\) car on a supposé cet espace complet. On en déduit que \(x\in Y\) et que \(Y\) est fermé.'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 3'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [propriete]
- id: topo-a-080-4
  notion: topo-n-0060
  recto: 'Preuve : Prop. 31 (2), \(Y\) fermé \(\Rightarrow\) \(Y\) complet'
  verso: 'Soit \((u_n)\) une suite de Cauchy de \(Y\). C''est aussi une suite de Cauchy de \(X\) qui est complet. Elle converge donc dans \(X\) ; on note \(x\) sa limite. Par la caractérisation séquentielle d''un fermé, \(x\in Y\) : on a montré que \(Y\) était complet.'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 3'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [propriete]
- id: topo-a-081-1
  notion: topo-n-0063
  recto: 'Déf 25 : application bornée'
  verso: 'Soit \(f\) une application entre deux espaces métriques \((X,d)\) et \((Y,\delta)\). On dit que \(f\) est bornée si \(f(X)\) est une partie bornée de \(Y\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 4'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [theoreme]
- id: topo-a-081-2
  notion: topo-n-0063
  recto: 'Prop. 33 (1) : complétude de \(\mathcal B(X,Y)\)'
  verso: 'Soient \((X,d)\) et \((Y,\delta)\) deux espaces métriques. Désignons par \(\mathcal B(X,Y)\) l''ensemble des applications bornées de \(X\) dans \(Y\) et \(\mathcal C_b(X,Y)\) l''ensemble des applications continues et bornées de \(X\) dans \(Y\). On définit sur \(\mathcal B(X,Y)\) la distance \(D\) en posant \[D(f,g)=\sup_{x\in X}\delta(f(x),g(x)),\quad\forall f,g\in\mathcal B(X,Y)\] et on munit \(\mathcal C_b(X,Y)\) de la distance induite par \(D\).<br>Si l''espace \((Y,\delta)\) est complet, alors \((\mathcal B(X,Y),D)\) est complet.'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 4'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [theoreme]
- id: topo-a-081-3
  notion: topo-n-0063
  recto: 'Prop. 33 (2) : complétude de \(\mathcal C_b(X,Y)\)'
  verso: 'Soient \((X,d)\) et \((Y,\delta)\) deux espaces métriques. Désignons par \(\mathcal B(X,Y)\) l''ensemble des applications bornées de \(X\) dans \(Y\) et \(\mathcal C_b(X,Y)\) l''ensemble des applications continues et bornées de \(X\) dans \(Y\). On définit sur \(\mathcal B(X,Y)\) la distance \(D\) en posant \[D(f,g)=\sup_{x\in X}\delta(f(x),g(x)),\quad\forall f,g\in\mathcal B(X,Y)\] et on munit \(\mathcal C_b(X,Y)\) de la distance induite par \(D\).<br>Si l''espace \((Y,\delta)\) est complet, alors \((\mathcal C_b(X,Y),D)\) est complet.'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 4'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [theoreme]
- id: topo-a-081-4
  notion: topo-n-0063
  recto: 'Preuve : Prop. 33 (1), \(\mathcal B(X,Y)\) est complet'
  verso: 'Soit \((f_n)\) de Cauchy dans \((\mathcal B(X,Y),D)\) : \(\forall\epsilon>0,\exists n\ /\ \forall p,q\ge n,\ \sup_{x\in X}\delta(f_p(x),f_q(x))<\epsilon\). Pour tout \(x\), \((f_n(x))\) est de Cauchy dans \(Y\) complet : il existe \(f(x)\in Y\) avec \(f_n(x)\to f(x)\). Par l''inégalité triangulaire, \(\delta(f_p(x),f(x))<\epsilon+\delta(f(x),f_q(x))\) pour tous \(p,q\ge n\), \(x\in X\). En faisant tendre \(q\to+\infty\) : \(\delta(f_p(x),f(x))\le\epsilon\) pour tous \(p\ge n\), \(x\in X\), donc \(D(f,f_p)\to0\) et \(f\in\mathcal B(X,Y)\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 4'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [theoreme]
- id: topo-a-081-5
  notion: topo-n-0063
  recto: 'Preuve : Prop. 33 (2), \(\mathcal C_b(X,Y)\) est fermé dans \(\mathcal B(X,Y)\)'
  verso: 'Il suffit de montrer que \(\mathcal C_b(X,Y)\) est fermé dans \((\mathcal B(X,Y),D)\) (caractérisation séquentielle). Soit \((f_n)\) dans \(\mathcal C_b(X,Y)\) qui converge vers \(f\in\mathcal B(X,Y)\), \(x\in X\) et \(\epsilon>0\). Il existe \(n\) tel que \(D(f_n,f)<\frac\epsilon3\), et \(\alpha>0\) tel que \(d(x,x'')<\alpha\Rightarrow\delta(f_n(x),f_n(x''))<\frac\epsilon3\) (continuité de \(f_n\)). Alors \(\delta(f(x),f(x''))\le\delta(f(x),f_n(x))+\delta(f_n(x),f_n(x''))+\delta(f_n(x''),f(x''))<\frac\epsilon3+\frac\epsilon3+\frac\epsilon3=\epsilon\) : \(f\) est continue.'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 5'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 1
  tags: [theoreme]
- id: topo-a-082-1
  notion: topo-n-0065
  recto: 'Déf 26 : point fixe'
  verso: 'Soit \(f:X\to X\) une application. On dit que \(f\) possède un point fixe s''il existe \(a\in X\) tel que \(f(a)=a\).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 6'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 2
  tags: [definition]
- id: topo-a-082-2
  notion: topo-n-0065
  recto: 'Déf 27 : application contractante'
  verso: 'Soient \((X,d)\) un espace métrique et \(f:X\to X\) une application. On dit que \(f\) est contractante s''il existe \(C\in]0,1[\) tel que, pour tout \(x,y\in X\),<br>\[d(f(x),f(y))\le C\,d(x,y)\]<br>(i.e. \(f\) est lipschitzienne de rapport \(C<1\)).'
  source: 'Poly de topologie Paris Cité, ch. 2, p. 6'
  chapitre: 'Chapitre 2 - Espace complet'
  priorite: 2
  tags: [definition]
- id: topo-a-084-1
  notion: topo-n-0075
  recto: 'Déf 29 : espace compact (propriété de Borel-Lebesgue)'
  verso: 'La compacité est une notion topologique indépendante de la notion de distance : on donne donc la définition sur un espace topologique.<br>Soit \((X,\tau)\) un espace topologique séparé. On dit que \(X\) est compact si et seulement si, de tout recouvrement de \(X\) par des ouverts, on peut extraire un sous-recouvrement fini :<br>\[\left.\begin{array}{l}U_i\in\tau,\ \forall i\in I\\ X=\bigcup_{i\in I}U_i\end{array}\right\}\Rightarrow\exists J\subset I\ /\ \operatorname{card}(J)<+\infty\text{ et }X=\bigcup_{i\in J}U_i\]Remarques :<br>1. On dit aussi que \((X,\tau)\) satisfait la propriété de Borel-Lebesgue.<br>2. On rappelle que tout espace métrique est un espace topologique séparé.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 1'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [definition]
- id: topo-a-085-1
  notion: topo-n-0077
  recto: 'Déf 30 : partie compacte'
  verso: 'Soient \((X,\tau)\) un espace topologique séparé et \(A\in\mathcal P(X)\). On dit que \(A\) est une partie compacte de \(X\) si et seulement si \(A\) est compact pour la topologie induite.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 1'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [definition]
- id: topo-a-086-1
  notion: topo-n-0082
  recto: 'Thm 4 : théorème de Bolzano-Weierstrass'
  verso: 'Un espace métrique est compact si et seulement si toute suite de cet espace possède une valeur d''adhérence.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 4'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [theoreme]
- id: topo-a-086-2
  notion: topo-n-0082
  recto: 'Rem. : propriété de Bolzano-Weierstrass'
  verso: 'La propriété « toute suite de l''espace possède une valeur d''adhérence » est appelée propriété de Bolzano-Weierstrass. Elle est souvent utilisée comme définition de la compacité sur un espace métrique car elle peut être plus facile à utiliser que la propriété de Borel-Lebesgue. Dans un espace topologique séparé, la compacité (propriété de Borel-Lebesgue) implique la propriété de Bolzano-Weierstrass, mais la réciproque est fausse.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 4'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [theoreme]
- id: topo-a-086-3
  notion: topo-n-0082
  recto: 'Preuve : Thm 4, compact \(\Rightarrow\) toute suite a une valeur d''adhérence'
  verso: 'Soit \((u_n)\) une suite de \((X,d)\) compact. On pose \(F_n=\overline{\{u_m\ /\ m\ge n\}}\) : fermés non vides, et pour \(J\subset\mathbb N\) fini, \(\bigcap_{n\in J}F_n=F_{\max(J)}\neq\emptyset\). Par la Prop. 35, \(\bigcap_nF_n\neq\emptyset\) ; or cette intersection est l''ensemble des valeurs d''adhérence de \((u_n)\) (Prop. 25).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 4'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [theoreme]
- id: topo-a-086-4
  notion: topo-n-0082
  recto: 'Preuve : Thm 4, Bolzano-Weierstrass \(\Rightarrow\) compact'
  verso: 'Preuve fondée sur deux lemmes (Lemme 1 : théorème de Lebesgue, Lemme 2 : précompacité). Soit \(X=\bigcup_{i\in I}U_i\) un recouvrement par des ouverts. Lemme 1 : il existe \(\epsilon>0\) tel que \(\forall x\in X,\exists i_x\in I\ /\ B(x,\epsilon)\subset U_{i_x}\). Lemme 2 : il existe \(x_1,\dots,x_n\in X\) tels que \(X=\bigcup_{k=1}^nB(x_k,\epsilon)\). Comme \(B(x_k,\epsilon)\subset U_{i_{x_k}}\), \(X=\bigcup_{k=1}^nU_{i_{x_k}}\) : on a extrait un sous-recouvrement fini.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 5'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [theoreme]
- id: topo-a-087-1
  notion: topo-n-0084
  recto: 'Déf : espace métrique précompact'
  verso: 'On dit qu''un espace métrique \(X\) est précompact si<br>\[\forall\epsilon>0,\ \exists x_1,\dots,x_n\in X\ /\ X=\bigcup_{k=1}^nB(x_k,\epsilon).\]Le lemme 2 signifie donc que si \(X\) satisfait la propriété de Bolzano-Weierstrass, il est alors précompact. Comme on a montré que la propriété de Bolzano-Weierstrass était équivalente à celle de compacité, la propriété de précompacité en est plus faible (d''après le poly).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 6'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 3
  tags: [definition]
- id: topo-a-087-2
  notion: topo-n-0084
  recto: 'Lemme 2 : Bolzano-Weierstrass \(\Rightarrow\) précompact'
  verso: 'Si l''espace métrique \((X,d)\) satisfait la propriété de Bolzano-Weierstrass, alors, pour tout \(\epsilon>0\), il existe un ensemble fini \(\{x_1,\dots,x_n\}\subset X\) tel que<br>\[X=\bigcup_{k=1}^nB(x_k,\epsilon).\]'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 4'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 3
  tags: [theoreme]
- id: topo-a-087-3
  notion: topo-n-0084
  recto: 'Preuve : Lemme 2'
  verso: 'Par contraposée : on suppose qu''il existe \(\epsilon>0\) tel que, pour tous \(x_1,\dots,x_n\in X\), \(X\neq\bigcup_{k=1}^nB(x_k,\epsilon)\). On construit \((u_n)\) par récurrence : \(u_0\in X\) arbitraire ; \(u_1,\dots,u_n\) fixés, on choisit \(u_{n+1}\in X\setminus\bigcup_{k=1}^nB(u_k,\epsilon)\). Alors \(n\neq m\Rightarrow d(u_n,u_m)\ge\epsilon\) : on ne peut extraire aucune suite de Cauchy, donc la suite n''a aucune valeur d''adhérence et \(X\) ne satisfait pas la propriété de Bolzano-Weierstrass.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 5'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 3
  tags: [demonstration]
- id: topo-a-088-1
  notion: topo-n-0087
  recto: 'Prop. 38 : compacts de \(\mathbb R\)'
  verso: 'Les compacts de \(\mathbb R\) usuel sont les parties fermées et bornées de \(\mathbb R\).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 7'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 3
  tags: [propriete]
- id: topo-a-088-2
  notion: topo-n-0087
  recto: 'Preuve : Prop. 38'
  verso: 'Sens direct (compact \(\Rightarrow\) fermé et borné) : traité en section 3.1. Réciproque : soit \(F\) fermée bornée de \(\mathbb R\) et \((u_n)\) une suite de \(F\). On pose \(M_n=\sup_{m\ge n}u_m\) : suite décroissante et minorée (car \((u_n)\) est bornée), qui converge vers \(x\in\mathbb R\). On construit \(\phi\) par récurrence : \(\phi(0)=0\) ; il existe \(m\ge\phi(n-1)+1\) tel que \(0\le M_{\phi(n-1)+1}-u_m\le\frac1n\), et on pose \(\phi(n)=m\). Alors \(u_{\phi(n)}\to x\), et \(x\in F\) car \(F\) est fermé.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 7'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 3
  tags: [propriete]
- id: topo-a-089-1
  notion: topo-n-0089
  recto: 'Prop. 39 : produit fini d''espaces métriques compacts'
  verso: 'Soit \(((X_k,d_k))_{k\in\{1,\dots,d\}}\) une famille finie d''espaces métriques compacts. On munit l''espace produit \(X=\prod_{k=1}^dX_k\) de l''une des distances \(D_p\) pour \(p\in[1,+\infty]\) où, \(\forall x,y\in X\),<br>\[D_p(x,y)=\begin{cases}\left(\sum_{k=1}^d(d_k(x_k,y_k))^p\right)^{\frac1p}&\text{si }p<+\infty,\\ \max_{k\in\{1,\dots,n\}}d_k(x_k,y_k)&\text{si }p=+\infty.\end{cases}\]L''espace métrique produit \((X,D_p)\) est alors compact.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 8'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [propriete]
- id: topo-a-089-2
  notion: topo-n-0089
  recto: 'Preuve : Prop. 39'
  verso: 'On prend une suite \((u^n)\) de \(X\) et on montre qu''elle a une valeur d''adhérence (Bolzano-Weierstrass). Par récurrence sur \(k\) : \(X_k\) compact, donc la suite \((u_k^{\phi_1\circ\dots\circ\phi_{k-1}(n)})_n\) a une valeur d''adhérence \(x_k\), d''où \(\phi_k\) avec \(u_k^{\phi_1\circ\dots\circ\phi_k(n)}\to x_k\) ; les coordonnées précédentes convergent encore (sous-suite d''une suite convergente). Avec \(\psi=\phi_1\circ\dots\circ\phi_d\), \(u_l^{\psi(n)}\to x_l\), \(\forall l\), et \(D_p(u^{\psi(n)},x)\le d^{\frac1p}D_\infty(u^{\psi(n)},x)\to0\).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 8'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [propriete]
- id: topo-a-090-1
  notion: topo-n-0090
  recto: 'Cor. 7 : compacts de \(\mathbb R^d\) et \(\mathbb C^d\)'
  verso: 'Ces distances \(D_p\) peuvent être définies sur \(\mathbb R^d\) ou \(\mathbb C^d\) en remplaçant les \(d_k\) par la distance usuelle sur \(\mathbb R\) ou la distance associée au module sur \(\mathbb C\) respectivement.<br>Les compacts de \(\mathbb R^d\) (respectivement \(\mathbb C^d\)) sont les parties fermées et bornées de \(\mathbb R^d\) (respectivement \(\mathbb C^d\)).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 9'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 3
  tags: [theoreme]
- id: topo-a-090-2
  notion: topo-n-0090
  recto: 'Preuve : Cor. 7'
  verso: 'Soit \(A\) une partie fermée et bornée de \(\mathbb R^d\) (le sens direct est la Prop. 37 et la Prop. 36). Étant bornée, il existe \(x_1,\dots,x_d,y_1,\dots,y_d\in\mathbb R\) tels que \(A\subset\prod_{k=1}^d[x_k,y_k]\). Chaque \([x_k,y_k]\) est compact car fermé et borné dans \(\mathbb R\) ; le produit \(\prod_{k=1}^d[x_k,y_k]\) est donc compact (Prop. 39). \(A\) étant fermée dans un compact, elle est compacte. Avec \(d=p=2\) on obtient les compacts de \(\mathbb C\) ; même raisonnement pour \(\mathbb C^d\).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 9'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 3
  tags: [theoreme]
- id: topo-a-091-1
  notion: topo-n-0091
  recto: 'Thm 5 : image d''un compact par une application continue'
  verso: 'L''image d''un compact par une application continue est compacte.<br>Remarque du poly : cette propriété est vérifiée sur les espaces topologiques car elle repose sur la propriété de Borel-Lebesgue.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 9'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [theoreme]
- id: topo-a-091-2
  notion: topo-n-0091
  recto: 'Preuve : Thm 5'
  verso: 'Soient \(X\) compact, \(Y\) un autre espace et \(f:X\to Y\) continue. On se donne un recouvrement de \(f(X)\) par des ouverts : \(f(X)\subset\bigcup_{i\in I}U_i\). Les \(V_i=f^{-1}(U_i)\) sont des ouverts de \(X\) et \(X=\bigcup_{i\in I}V_i\). \(X\) étant compact, il existe \(J\subset I\) fini tel que \(X=\bigcup_{i\in J}V_i\). Alors \(f(X)=\bigcup_{i\in J}f(V_i)\) avec \(f(V_i)\subset U_i\), donc \(f(X)\subset\bigcup_{i\in J}U_i\) : \(f(X)\) est compact.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 9'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 1
  tags: [theoreme]
- id: topo-a-092-1
  notion: topo-n-0092
  recto: 'Cor. 8 : fonction continue sur un compact, bornée et atteint ses bornes'
  verso: 'Toute fonction continue sur un espace métrique compact est bornée et atteint ses bornes.<br>En d''autres termes, si \((X,d)\) est un espace métrique compact et \(f:X\to\mathbb R\) est une fonction continue, alors il existe \(x_m\) et \(x_M\in X\) tels que<br>\[f(x_m)\le f(x)\le f(x_M),\quad\forall x\in X.\]'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 10'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [propriete]
- id: topo-a-092-2
  notion: topo-n-0092
  recto: 'Preuve : Cor. 8'
  verso: 'D''après le théorème précédent (image d''un compact par une application continue), \(f(X)\) est une partie compacte de \(\mathbb R\), donc fermée et bornée. Bornée : \(-\infty<\inf_{x\in X}f(x)\le\sup_{x\in X}f(x)<+\infty\). On montre facilement que \(\inf f\) et \(\sup f\) sont des points adhérents à \(f(X)\) ; comme \(f(X)\) est fermé, il existe \(x_m\) et \(x_M\) tels que \(f(x_m)=\inf_{x\in X}f(x)\) et \(f(x_M)=\sup_{x\in X}f(x)\).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 10'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [propriete]
- id: topo-a-093-1
  notion: topo-n-0093
  recto: 'Thm 6 : théorème de Heine'
  verso: 'Si \((X,d)\) est un espace métrique compact, alors toute application continue sur \(X\) est uniformément continue.'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 10'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [theoreme]
- id: topo-a-093-2
  notion: topo-n-0093
  recto: 'Preuve : théorème de Heine (Thm 6)'
  verso: 'Soient \((Y,\delta)\) un espace métrique, \(f:X\to Y\) continue et \(\epsilon>0\). Pour tout \(x\in X\), il existe \(\alpha_x>0\) tel que \(d(x,x'')<\alpha_x\Rightarrow\delta(f(x),f(x''))<\epsilon\). Les boules \(B(x,\frac{\alpha_x}2)\) recouvrent \(X\) : par Borel-Lebesgue, \(X=\bigcup_{k=1}^nB(x_k,\frac{\alpha_{x_k}}2)\). On pose \(\alpha=\min_{k}\frac{\alpha_{x_k}}2>0\) (minimum sur un ensemble fini). Si \(d(x,x'')<\alpha\) et \(x\in B(x_k,\frac{\alpha_{x_k}}2)\), alors \(d(x'',x_k)<\alpha_{x_k}\), donc \(\delta(f(x),f(x_k))<\epsilon\) et \(\delta(f(x''),f(x_k))<\epsilon\), d''où \(\delta(f(x),f(x''))<2\epsilon\).'
  source: 'Poly de topologie Paris Cité, ch. 3, p. 10'
  chapitre: 'Chapitre 3 - Espace compact'
  priorite: 2
  tags: [theoreme]
