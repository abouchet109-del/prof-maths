- id: topo-td1-ex08
  titre: Métrique discrète
  enonce: |
    Soit $X$ un ensemble non vide. On définit la fonction la métrique discrète $d:X\times X\to\mathbb R_+$ en posant, pour tous $x,y\in X$,
    $$d(x,y)=\begin{cases}0 & \text{si } x=y,\ 1 & \text{si } x\neq y.\end{cases}$$
    1. Montrer que $d$ est une distance sur $X$.
    2. Décrire les boules ouvertes, les boules fermées, les ouverts et les fermés de $(X,d)$.
    3. A-t-on $\bar B(a,r)=\overline{B(a,r)}$, pour tous $a\in X$ et $r>0$ ?
