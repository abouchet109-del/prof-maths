- id: topo-exam2020-21-ex01
  titre: 'Opérateur T intégral sur C([0,1]) : norme, équation T(f)=f'
  enonce: |
    On munit l'espace $E=\mathcal C([0,1],\mathbb K)$ de la norme $f\mapsto\|f\|_\infty=\sup_{t\in[0,1]}|f(t)|$ et, pour tous $f\in E$, $x\in[0,1]$, on pose
    $$T(f)(x)=\int_0^x t\,f(t)\,dt+x\int_x^1f(t)\,dt.$$
    On rappelle que l'espace $(E,\|\cdot\|_\infty)$ est complet.
    1. Montrer que l'application $T$ ainsi définie appartient à $\mathcal L(E)$ et calculer sa norme.
    2. Montrer que l'équation $T(f)=f$ n'admet pas de solution $f$ non nulle.
