- id: topo-exam2022-23-ex04
  titre: Norme hilbertienne N sur C^1([0,1]) vs sup
  enonce: |
    On note $E=\mathcal C^1([0,1],\mathbb R)$ l'espace des fonctions réelles de classe $\mathcal C^1$ sur l'intervalle $[0,1]$. Pour tout $f\in E$, on pose
    $$N(f)=\left((f(0))^2+\int_0^1(f'(t))^2\,dt\right)^{\frac12}.$$
    1. Montrer que $N$ est une norme hilbertienne sur $E$ et donner l'expression du produit scalaire associé.
    2. Montrer que, pour tout $f\in E$,
    $$\|f\|_\infty\le\sqrt2\,N(f).$$
    Indication : on pourra montrer que, pour tout $x\in[0,1]$, $|f(x)|\le|f(0)|+\left(\int_0^1(f'(t))^2dt\right)^{\frac12}$.
    3. Les normes $N$ et $\|\cdot\|_\infty$ sont-elles équivalentes ?
