  enonce: |
    Soit $(X,d)$ un espace métrique.
    1. Montrer que
    $$\forall x,y,z\in X,\quad |d(x,z)-d(x,y)|\le d(y,z).$$
    2. Montrer que l'application distance $d:X\times X\to\mathbb R$ est continue ($X\times X$ étant muni de la distance produit et $\mathbb R$ de sa distance usuelle).
