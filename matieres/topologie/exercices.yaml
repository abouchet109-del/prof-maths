- id: topo-td4-ex08
  titre: 'Espace produit dénombrable X^N : distance et compacité'
  enonce: |
    Soient $(X,d)$ un espace métrique compact et $X^{\mathbb N}$ l'ensemble des suites d'éléments de $X$. On définit $D:X^{\mathbb N}\times X^{\mathbb N}\to\mathbb R_+$ en posant
    $$D(x,y)=\sum_{n=0}^{+\infty}\frac1{2^n}d(x_n,y_n).$$
    1. Montrer que $D$ est bien défini et qu'il s'agit d'une distance sur $X^{\mathbb N}$.
    2. Montrer qu'une suite $(x^p)_{p\in\mathbb N}$ de $X^{\mathbb N}$ converge vers un élément $x\in X^{\mathbb N}$ si et seulement si
    $$\lim_{p\to+\infty}x^p_n=x_n,\quad\forall n\in\mathbb N.$$
    3. Montrer que $(X^{\mathbb N},D)$ est compact.
