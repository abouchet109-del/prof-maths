- id: topo-uvsq-td3-ex03q1
  titre: Point fixe de T_n = (1/(n+1)) a + (n/(n+1)) T
  enonce: |
    Soit $(E,\|\cdot\|)$ un espace de Banach et soit $K\subset E$ un ensemble convexe et compact non vide. On considère l'application $T:K\to K$ vérifiant
    $$\forall u,v\in K,\ \|Tu-Tv\|\le\|u-v\|.$$

    Soit $a\in K$ fixé. Pour tout entier $n$ on définit l'application $T_n$ par
    $$\forall u\in K,\ T_nu:=\frac1{n+1}a+\frac n{n+1}Tu.$$
    Montrer que $T_n:K\to K$ possède un unique point fixe noté $u_n$.
