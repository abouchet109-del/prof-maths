- id: topo-td1-ex06
  titre: 'Intérieur : Q, disque pointé, graphe'
  enonce: |
    Déterminer l'intérieur $\mathring A$ de la partie $A$ de l'espace métrique $(X,d)$, dans les cas suivants.
    1. $X=\mathbb R$, $d(x,y)=|x-y|$, $A=\mathbb Q$.
    2. $X=\mathbb C$, $d(z_1,z_2)=|z_1-z_2|$, $A=\{z\in\mathbb C \mid 0<|z|\le1\}$.
    3. $X=\mathbb R$, $d(x,y)=|x-y|$, $A=\mathbb R\setminus\{\tfrac1n \mid n\in\mathbb N^*\}$.
    4. $E=\mathbb R^2$, $d(x,y)=\sqrt{(x_1-y_1)^2+(x_2-y_2)^2}$, $A=\{x\in\mathbb R^2 \mid x_2=f(x_1)\}$ où $f$ est une fonction quelconque de $\mathbb R$ dans $\mathbb R$.
