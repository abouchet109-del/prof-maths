- id: topo-td3-ex08
  titre: 'Point fixe dépendant d''un paramètre : continuité'
  enonce: |
    Soit $(X,d)$ un espace métrique complet. On munit l'espace produit $\mathbb R\times X$ de la distance produit $((t,x),(s,y))\mapsto|t-s|+d(x,y)$ et on considère une application continue $f:\mathbb R\times X\to X$ pour laquelle il existe une constante $C\in]0,1[$ telle que
    $$d(f(t,x),f(t,y))\le C\,d(x,y),\quad\forall x,y\in X,\ \forall t\in\mathbb R.$$
    1. Montrer que, pour tout $t\in\mathbb R$, il existe un unique $x_t\in X$ tel que $f(t,x_t)=x_t$.
    2. Montrer que
    $$d(x_t,x_s)\le\frac1{1-C}\,d(f(t,x_t),f(s,x_t)),\quad\forall t,s\in\mathbb R,$$
    et en déduire que l'application $t\mapsto x_t$ est continue.
  sources:
  - etab: paris-cite
    fichier: topologie/td/td3.pdf
    page: 2
    numero: Ex 8
