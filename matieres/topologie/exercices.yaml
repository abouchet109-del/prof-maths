- id: topo-dm2022-23-ex01
  titre: 'Fonctions injectives de C([0,1]) : A+ et A-, non connexité'
  enonce: |
    Soit $E=\mathcal C([0,1],\mathbb R)$, muni de la distance $D(f,g)=\sup_{x\in[0,1]}|f(x)-g(x)|$. On note
    $$A:=\{f\in E,\ f\text{ est injective sur }[0,1]\}.$$
    On définit de plus $A_+$ (resp. $A_-$) l'ensemble des fonctions de $E$ qui sont strictement croissantes (resp. strictement décroissantes) sur $[0,1]$.
    1. Montrer que $\Delta:=\{(x,y)\in[0,1]^2,\ x<y\}$ est connexe.
    2. Montrer qu'une fonction $f\in A$ est strictement monotone sur $[0,1]$ à l'aide d'une fonction $g:\Delta\to\mathbb R$ bien choisie.
    3. Montrer que $A_+$ et $A_-$ sont des fermés de $A$.
    4. Qu'en déduit-on quant à la connexité de l'ensemble $A$ ?
