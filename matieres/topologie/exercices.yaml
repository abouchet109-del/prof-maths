- id: topo-partiel2021-22-ex03
  titre: Distance de Hausdorff-like sur les fermés
  enonce: |
    Soit $(X,d)$ un espace métrique borné dans le sens où il existe $C>0$ tel que
    $$d(x,y)\le C,\ \forall x,y\in X.$$
    On note $\mathcal F$ l'ensemble des parties fermées et non vides de $X$. Pour tous $A,B\in\mathcal F$, on définit
    $$\delta(A,B)=\sup_{x\in X}|d(x,A)-d(x,B)|,$$
    où $d(x,A)=\inf_{a\in A}d(x,a)$.
    1. Montrer que $\delta$ est une distance sur $\mathcal F$.
    2. Montrer que l'application $x\mapsto\{x\}$ définit une isométrie de $X$ dans $\mathcal F$.
