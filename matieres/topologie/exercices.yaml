- id: topo-uvsq-td4-ex07q1
  titre: 'Sous-différentiel : CNS de minimum global'
  enonce: |
    Soit $f:\mathbb R^n\to\mathbb R$ une fonction convexe, c'est-à-dire vérifiant
    $$\forall x,y\in\mathbb R^n,\ \forall\lambda\in[0,1],\ f(\lambda x+(1-\lambda)y)\le\lambda f(x)+(1-\lambda)f(y).$$
    Soit $x_0\in\mathbb R^n$. On pose
    $$\partial f(x_0)=\{u\in\mathbb R^n\mid\forall x\in\mathbb R^n,\ f(x)-f(x_0)\ge\langle u,x-x_0\rangle\},$$
    où $\langle\cdot,\cdot\rangle$ désigne le produit scalaire euclidien.
    Donner une condition nécessaire et suffisante pour que $x_0$ réalise un minimum global de $f$ sur $\mathbb R^n$ (exprimée en termes de $\partial f(x_0)$).
