- id: topo-td3-ex05
  titre: Contraction stricte sans point fixe
  enonce: |
    Soit $X=\{x_n\}_{n\in\mathbb N^*}$ un ensemble dénombrable. Pour tous $m,n\in\mathbb N^*$, on pose
    $$d(x_m,x_n)=\begin{cases}1+\frac1m+\frac1n & \text{si } m\neq n\\ 0 & \text{si } m=n\end{cases}$$
    1. Montrer que $d$ est une distance sur $X$ et que l'espace métrique $(X,d)$ est complet.
    2. Soit $f:X\to X$ l'application définie par $f(x_n)=x_{n+1}$, $\forall n\in\mathbb N^*$. Montrer que
    $$d(f(x),f(y))<d(x,y),\quad\forall x\neq y\in X,$$
    mais que $f$ n'a pas de point fixe.
    3. Construire une application $g:X\to X$ telle que
    $$d(g(x),g(y))<d(x,y),\quad\forall x\neq y\in X,$$
    possédant un point fixe $a$, et telle que, pour tout $x\in X\setminus\{a\}$, la suite $(g^n(x))_{n\in\mathbb N}$ (où $g^n=g\circ g^{n-1}$) soit divergente.
  sources:
