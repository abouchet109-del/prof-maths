- id: topo-td2-ex10
  titre: Continuité sur un recouvrement par des restrictions
  enonce: |
    Soient $(X,d)$ et $(Y,\delta)$ deux espaces métriques, $f$ une application de $X$ dans $Y$, et $(A_i)_{i\in I}$ une famille de parties de $X$ telle que $\bigcup_{i\in I}A_i=X$. Montrer que si $f_{|A_i}$, la restriction de $f$ à $A_i$, est continue pour tout $i\in I$ alors $f$ est continue
    (i) lorsque tous les $A_i$ sont des ouverts.
    (ii) lorsque tous les $A_i$ sont des fermés et $|I|$ est fini.
    Montrer que $f$ peut être discontinue lorsque les $A_i$ sont des fermés et $|I|$ est infini.
