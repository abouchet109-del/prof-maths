- id: topo-uvsq-td3-ex09q2b
  titre: '||f''||_2 est une norme sur F équivalente à ||.||'
  enonce: |
    Soit $E=\mathcal C^1([0,1])$ l'espace des fonctions réelles de classe $\mathcal C^1$ sur $[0,1]$. On considère l'espace vectoriel normé $(E,\|.\|)$ où
    $$\forall f\in\mathcal C^1([0,1]),\ \|f\|=\left(\int_0^1\left(|f(t)|^2+|f'(t)|^2\right)dt\right)^{1/2}.$$

