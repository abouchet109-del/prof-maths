- id: topo-td2-ex07
  titre: Distance à une partie ; fonction d'Urysohn
  enonce: |
    Soit $(X,d)$ un espace métrique. Pour tous $A\in\mathcal P(X)\setminus\emptyset$ et $x\in X$, on pose
    $$d(x,A)=\inf_{a\in A}d(x,a).$$
    1. Montrer que $d(x,A)=0\iff x\in\bar A$.
    2. Montrer que la fonction $(x\mapsto d(x,A))$ est continue.
    3. Soient $A$ et $B$ deux fermés non vides tels que $A\cap B=\emptyset$. Construire une fonction $f:X\to[0,1]$ continue et telle que $f(A)=\{0\}$ et $f(B)=\{1\}$.
