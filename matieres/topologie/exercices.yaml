- id: topo-td2-ex02
  titre: d_1 et d_infini sur R[X], suite (X^n)
  enonce: |
    On considère l'espace $E=\mathbb R[X]$.
    1. Montrer que les applications
    $$d_1:(P,Q)\mapsto\int_0^1|P(t)-Q(t)|\,dt\quad\text{et}\quad d_\infty:(P,Q)\mapsto\sup_{t\in[0,1]}|P(t)-Q(t)|$$
    sont des distances sur $E$.
    2. Montrer que la suite $(X^n)_{n\in\mathbb N}$ est bornée dans $(E,d_\infty)$.
    3. Montrer que la suite $(X^n)_{n\in\mathbb N}$ converge dans $(E,d_1)$.
    4. Comparer les distances $d_1$ et $d_\infty$ et en déduire que $(X^n)_{n\in\mathbb N}$ est une suite bornée qui ne possède pas de valeur d'adhérence dans $(E,d_\infty)$.
    5. Les distances $d_1$ et $d_\infty$ sont-elles topologiquement équivalentes ?
  sources:
