- id: topo-dm2021-22-ex01
  titre: 'Fonction coercive : image réciproque de compact, minimum'
  enonce: |
    On munit $\mathbb R^d$ d'une norme $\|\cdot\|$ quelconque. On dit qu'une fonction $f:\mathbb R^d\to\mathbb R$ satisfait la propriété (P) si $\lim_{\|x\|\to+\infty}f(x)=+\infty$, c'est-à-dire
    $$\forall A>0,\ \exists R>0,\ \|x\|\ge R\Longrightarrow f(x)>A.\qquad(P)$$
    On se donne dans ce qui suit une fonction $f$ qui est (i) continue et (ii) satisfait la propriété (P). Les deux questions 1 et 2 ci-dessous sont indépendantes.
    1. On veut montrer que, pour tout compact $K\subset\mathbb R$, $f^{-1}(K)$ est un compact de $\mathbb R^d$.
     (a) Montrer par des exemples simples que ce résultat tombe en défaut si l'on retire l'une des deux hypothèses sur $f$. On se place dans le cas $d=1$ pour les contre-exemples.
     (b) Montrer le résultat demandé.
    2. On cherche désormais à montrer que $f$ est minorée sur $\mathbb R^d$, et qu'elle atteint sa borne inférieure.
     (a) Montrer via un choix adapté de $A$ dans la définition qu'il existe $R>0$ tel que
     $$\inf_{x\in\mathbb R^d}f(x)=\inf_{x\in\overline B(0,R)}f(x).$$
     (b) Conclure.
  sources:
