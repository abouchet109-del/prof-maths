- id: topo-td2-ex11
  titre: Un ouvert de (C([0,1]),d_infini) défini par un sinus d'intégrale
  enonce: |
    On munit $\mathcal C([0,1],\mathbb R)$, l'espace des fonctions continues sur $[0,1]$, de la distance $d_\infty$ définie par
    $$d_\infty(f,g)=\sup_{t\in[0,1]}|f(t)-g(t)|.$$
    Montrer que
    $$\left\{f\in\mathcal C([0,1],\mathbb R),\ \frac12<\sin\left(\int_0^{\frac12}f(t)\,dt\right)<\frac{\sqrt3}{2}\right\}$$
    est un ouvert de $(\mathcal C([0,1],\mathbb R),d_\infty)$.
