- id: topo-dm2023-24-ex01
  titre: 'Points de coupure : segment, deux disques, cercle non homéomorphe à un segment'
  enonce: |
    Définition. On dit qu'un point $x$ d'un espace métrique connexe $(X,d)$ est un point de coupure de $X$ si $X\setminus\{x\}$ n'est pas connexe.
    1. Soit le connexe $X=[a,b]$ pour $a<b$. Déterminer l'ensemble des points de coupure de $X$.
    2. Dans $\mathbb R^2$ muni de la distance euclidienne, on considère $X=\overline B((-1,0),1)\cup\overline B((1,0),1)$.
     (a) Montrer que $X$ est connexe.
     (b) Montrer que $X$ admet un unique point de coupure et le déterminer.
    3. (a) Soit $f:(X,d)\to(Y,d')$. On suppose que $(X,d)$ est connexe et $f$ est un homéomorphisme. Donner les points de coupure de $Y$ à partir de ceux de $X$.
     (b) En déduire qu'un segment de $\mathbb R$ et un cercle de $\mathbb R^2$ ne peuvent être homéomorphes, en se plaçant dans le cas de $X=[0,1]$ et $Y=\{x\in\mathbb R^2,\ \|x\|_2=1\}$.
