- id: topo-exam2021-22-ex03
  titre: Banach de dimension infinie non engendré par un dénombrable
  enonce: |
    On se propose de montrer, par l'absurde, qu'un espace de Banach de dimension infinie ne peut pas être engendré par un ensemble dénombrable. On suppose donc qu'il existe un tel espace de Banach $E$ et on se donne $\{f_n\ /\ n\in\mathbb N\}$ une partie dénombrable telle que tout élément de $E$ soit une combinaison linéaire des $f_n$. Il est rappelé qu'une combinaison linéaire est définie avec une somme **finie** de vecteurs.
    Pour tout $n\in\mathbb N$, on note $F_n=\mathrm{vect}(\{f_1,\cdots,f_n\})$ l'espace engendré par $\{f_1,\cdots,f_n\}$.
    1. Pourquoi les $F_n$ sont-ils des sous-espaces fermés de $E$ ?
    2. Montrer que $E=\bigcup_{n\in\mathbb N}F_n$ et en déduire qu'il existe $n\in\mathbb N$ tel que $F_n$ soit d'intérieur non vide.
    3. Aboutir à une absurdité et conclure.
    4. Montrer qu'il n'existe aucune norme sur l'espace des polynômes $\mathbb C[X]$ pour laquelle cet espace est complet.
