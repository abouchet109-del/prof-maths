- id: topo-uvsq-td4-ex10q1
  titre: 'Coercivité de f'' : f application fermée'
  enonce: |
    On munit $\mathbb R^n$ du produit scalaire usuel $\langle x\mid y\rangle=\sum_{i=1}^nx_iy_j$ et de sa norme associée. Soit $f:\mathbb R^n\to\mathbb R^n$ une application de classe $\mathcal C^1$. On suppose qu'il existe un réel $\alpha>0$ tel que
    $$\forall x\in\mathbb R^n,\ \forall h\in\mathbb R^n,\ \langle f'(x)h\mid h\rangle\ge\alpha\|h\|^2.$$
    Montrer que $\langle f(x)-f(y)\mid x-y\rangle\ge\alpha\|x-y\|^2$ pour tout $x$ et $y\in\mathbb R^n$. En déduire que $f$ est une application fermée, c'est-à-dire que l'image de tout fermé par $f$ est fermée.
