- id: topo-uvsq-td3-ex06
  titre: Normes d'opérateur ||A||_1 et ||A||_inf d'une matrice
  enonce: |
    Soit $A=(a_{ij})_{1\le i,j\le n}$ une matrice carrée. Pour un vecteur $v\in\mathbb R^n$ on note $\|v\|_1=\sum_{i=1}^n|v_i|$ et $\|v\|_\infty=\max_{1\le i\le n}|v_i|$. Montrer que
    $$\|A\|_1:=\sup_{v\neq0}\frac{\|Av\|_1}{\|v\|_1}=\max_j\sum_i|a_{ij}|$$
    et
    $$\|A\|_\infty:=\sup_{v\neq0}\frac{\|Av\|_\infty}{\|v\|_\infty}=\max_i\sum_j|a_{ij}|.$$
