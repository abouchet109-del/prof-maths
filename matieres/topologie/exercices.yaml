- id: topo-uvsq-td1-ex12
  titre: 'Douze propriétés adhérence/intérieur : lesquelles sont vraies'
  enonce: |
    Soient $A$ et $B$ deux sous-ensembles de $(X,d)$ espace normé. Parmi les propriétés suivantes dire lesquelles sont vraies.
    1. $\overline{A\cup B}=\overline A\cup\overline B$
    2. $\overline{A\cap B}=\overline A\cap\overline B$
    3. $(A\cap\overline B)\subset\overline{A\cap B}$
    4. $\overline{A\cap\overline B}=\overline{A\cap B}$
    5. $\mathring{\mathring A}=\mathring A$
    6. $\overline{\overline A}=\overline A$
    7. $A\subset\mathring{\overline A}$ si $A$ est ouvert
    8. $\overline{\mathring B}\subset B$ si $B$ est fermé
    9. $\mathring{\overline{\mathring{\overline A}}}=\mathring{\overline A}$
    10. $\overline{\mathring{\overline{\mathring B}}}=\overline{\mathring B}$
    11. $\mathring{(A\cap B)}=\mathring A\cap\mathring B$
    12. $\partial(A\cap B)\subset\partial A\cup\partial B$.
  sources:
  - etab: uvsq
    fichier: uvsq/topologie/Topologie/TD1_Topologie.pdf
    page: 3
    numero: Ex 12
  annale_prioritaire: false
