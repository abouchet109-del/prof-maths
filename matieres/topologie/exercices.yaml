- id: topo-td3-ex02
  titre: Deux distances sur N*
  enonce: |
    Pour $m$ et $n\in\mathbb N^*$, on pose
    $$d(m,n)=|m-n|\quad\text{et}\quad\delta(m,n)=\frac{|m-n|}{mn}.$$
    1. Montrer que $d$ et $\delta$ sont des distances sur $\mathbb N^*$.
    2. Montrer que les distances $d$ et $\delta$ sont topologiquement équivalentes.
    3. La suite $(n)_{n\in\mathbb N^*}$ est-elle de Cauchy dans $(\mathbb N^*,d)$ et dans $(\mathbb N^*,\delta)$ ?
    4. Les espaces métriques $(\mathbb N^*,d)$ et $(\mathbb N^*,\delta)$ sont-ils complets ?
