- id: topo-exam2021-22-ex04
  titre: 'Système orthonormé : identité de Parseval avec distance à F'
  enonce: |
    Soient $(e_n)_{n\in\mathbb N}$ un système orthonormé dans un espace de Hilbert $H$. On note
    $$F=\overline{\mathrm{vect}(\{e_n/n\in\mathbb N\})}\quad\text{et}\quad F_n=\mathrm{vect}(\{e_1,\cdots,e_n\}),\ \forall n\in\mathbb N.$$
    1. Montrer que, pour tout $x\in H$,
    $$P_{F_n}(x)=\sum_{k=0}^n\langle x,e_k\rangle e_k,$$
    où $P_{F_n}$ désigne l'opérateur de projection sur $F_n$.
    2. En déduire que
    $$\|x\|^2=\|x-P_{F_n}(x)\|^2+\sum_{k=0}^n|\langle x,e_k\rangle|^2.$$
    3. Montrer que
    $$\|x\|^2=\sum_{k\in\mathbb N}|\langle x,e_k\rangle|^2+(d(x,F))^2,$$
    où $d(x,F)$ est la distance de $x$ à $F$.
