- id: topo-dm2023-24-ex02
  titre: 'Opérateur à noyau T_K sur C([0,1]) : norme et point fixe'
  enonce: |
    Soit $E=\mathcal C([0,1],\mathbb R)$ muni de sa norme usuelle $\|\cdot\|_\infty$. Pour $f\in E$, on définit une nouvelle fonction par
    $$T_K(f):x\mapsto\int_0^1K(x,y)f(y)\,dy,$$
    où $K:[0,1]\times[0,1]\to\mathbb R$ est continue.
    1. Montrer qu'il existe $M>0$ tel que pour tout $(x,y)\in[0,1]\times[0,1]$, $|K(x,y)|\le M$. Par définition, que vaut la plus petite telle constante $M$ ?
    2. Montrer que $T_K$ est une application à valeurs dans $E$.
    3. Montrer que $T_K$ est une application linéaire continue de $E$ dans $E$, en donnant une majoration simple de $|||T_K|||$ grâce à ce qui précède.
    4. Donner alors une condition suffisante portant sur $K$ pour qu'il existe une unique fonction $f\in E$ telle que $T_K(f)=f$.
    5. Améliorer le résultat de la question 4 en déterminant la valeur exacte de $|||T_K|||$.
