  titre: 'Suite u_{n+1}=u_n^2-100+sin n : point fixe dans [10,11]^N'
  enonce: |
    Pour $u_0\in\mathbb R$, on définit la suite $(u_n)_{n\in\mathbb N}$ en posant
    $$u_{n+1}=u_n^2-100+\sin n,\quad\forall n\in\mathbb N.$$
    On se propose de montrer qu'il existe un unique choix de $u_0\in\mathbb R$ tel que $u_n\in[10,11],\ \forall n\in\mathbb N$.
    1. Montrer que l'espace $X=[10,11]^{\mathbb N}=\{(u_n)_{n\in\mathbb N}\ /\ u_n\in[10,11],\ \forall n\in\mathbb N\}$, muni de la distance
    $$d_\infty:((u_n)_{n\in\mathbb N},(v_n)_{n\in\mathbb N})\mapsto\sup_{n\in\mathbb N}|u_n-v_n|$$
    est un espace métrique complet.
    2. On considère l'application
    $$f:X\to X,\quad(u_n)_{n\in\mathbb N}\mapsto(v_n)_{n\in\mathbb N}$$
    où
    $$v_n=\sqrt{100+u_{n+1}-\sin n},\quad\forall n\in\mathbb N.$$
    Vérifier que $f$ est bien définie de $X$ dans $X$ et montrer que $f$ est contractante.
    3. Conclure.
