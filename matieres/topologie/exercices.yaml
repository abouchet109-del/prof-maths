- id: topo-td3-ex06
  titre: 'Opérateur intégral : Φ non contractante, Φ∘Φ contractante'
  enonce: |
    On considère $E=\mathcal C([0,1],\mathbb R)$ muni de la distance
    $$d_\infty:(f,g)\mapsto\sup_{x\in[0,1]}|f(x)-g(x)|.$$
    On définit $\Phi:E\to E$ en posant
    $$\Phi f(x)=\int_0^1\frac{f(t)}{1+t^2x^2}\,dt,\quad\forall x\in[0,1],\ \forall f\in E.$$
    1. Montrer que $\Phi$ n'est pas contractante sur $E$.
    2. Montrer que $\Phi\circ\Phi$ est contractante.
    3. Montrer que $\Phi$ possède un unique point fixe dans $E$.
