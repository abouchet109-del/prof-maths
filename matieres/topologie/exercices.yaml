- id: topo-td4-ex04
  titre: Image d'une intersection décroissante de compacts
  enonce: |
    Soient $X$ et $Y$ deux espaces métriques, $(K_n)_{n\in\mathbb N}$ une suite décroissante de compacts de $X$ et $f:X\to Y$ une application continue.
