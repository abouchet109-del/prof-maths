- id: topo-exam2020-21-ex02
  titre: 'Projections dans un Hilbert : |||P_E∘P_F|||<1'
  enonce: |
    Soient $H$ un espace de Hilbert et $E,F$ deux sous-espaces fermés. On rappelle que l'on note $P_E(x)$ la projection d'un point $x$ sur $E$ et $E^\perp$ l'espace orthogonal à $E$. On se propose de montrer que les propriétés suivantes sont équivalentes
    (i) $|||P_E\circ P_F|||<1$.
    (ii) $\exists C>0\ /\ \|P_{E^\perp}(y)\|\ge C\|y\|,\ \forall y\in F$.
    1. Montrer que $\|x\|^2=\|P_E(x)\|^2+\|P_{E^\perp}(x)\|^2,\ \forall x\in H$.
    2. Soit $y\in F$. Que vaut $P_F(y)$ ? En déduire que $\|P_E(y)\|\le|||P_E\circ P_F|||\,\|y\|$.
    3. Montrer que (i) implique (ii).
    4. Réciproquement, montrer que (ii) implique (i).
