- id: topo-uvsq-td3-ex01q1
  titre: Suite de fonctions f_n de Cauchy dans (C([-1,1]),||.||_1)
  enonce: |
    On considère l'espace $\mathcal C([-1,1])$ doté de la norme
    $$\|f\|_1=\int_{-1}^1|f(t)|\,dt.$$
    On définit pour tout $n\ge1$, la fonction $f_n\in\mathcal C([-1,1])$ par
    $$f_n(x)=\begin{cases}0 & \text{si } x\le0,\\ nx & \text{si } 0\le x\le1/n,\\ 1 & \text{sinon.}\end{cases}$$
    Montrer que la suite $(f_n)$ est de Cauchy.
