  titre: 'Disques D_n : intérieur, adhérence, inclusion, réunion'
  enonce: |
    On munit l'espace $\mathbb R^2$ de la distance euclidienne et, pour tout $n\in\mathbb N^*$, on pose
    $$D_n=\left\{(x,y)\in\mathbb R^2\ /\ \left(x-\frac1n\right)^2+\left(y-\frac1n\right)^2\le\frac{\lambda^2}{n^2}\right\}.$$
    1. Donner, sans justification, l'intérieur et l'adhérence de $D_n$.
    2. Donner une condition nécessaire et suffisante sur $\lambda$ pour que $D_{n+1}\subset D_n$.
    3. Donner une condition nécessaire et suffisante sur $\lambda$ pour que $\bigcup_{n\in\mathbb N^*}D_n$ soit fermé et déterminer l'adhérence de cet ensemble lorsqu'il n'est pas fermé.
