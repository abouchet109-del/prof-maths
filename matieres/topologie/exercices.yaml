- id: topo-dm2020-21-ex02
  titre: 'Application expansive d''un compact : isométrie et surjective'
  enonce: |
    On se donne $(X,d)$ un espace métrique compact, ainsi qu'une application $f:X\to X$ satisfaisant
    $$\forall(x,y)\in X^2,\quad d(f(x),f(y))\ge d(x,y).$$
    Le but de l'exercice est de montrer d'une part qu'il y a en fait nécessairement égalité dans l'inégalité ci-dessus (on dit que $f$ est une isométrie : elle préserve les distances), et d'autre part que $f$ est surjective.
    Dans cet exercice, on notera $f^n$ la $n$-ième itérée de $f$, c'est-à-dire $f^0=\mathrm{Id}$, $f^1=f$, $f^2=f\circ f$, $\dots$, $f^{n+1}=f\circ f^n$.
    1. Justifier que, pour tous $x\in X$, et $m\ge n$ deux entiers, on a
    $$d(f^m(x),f^n(x))\ge d(f^{m-n}(x),x).$$
    2. On fixe $x\in X$ et on définit la suite $(x_n)_{n\in\mathbb N}$ par $x_n=f^n(x)$. Justifier qu'on peut extraire de $(x_n)_{n\in\mathbb N}$ une sous-suite de Cauchy. En déduire que pour tout $\varepsilon>0$, on peut trouver $k\ge1$ tel que $d(x_k,x)<\varepsilon$.
    3. En déduire que $f(X)$ est dense dans $X$.
    On se donne désormais deux points $x$ et $y$ de $X$ et on définit les suites
    $$x_n=f^n(x),\quad y_n=f^n(y),\quad u_n=d(x_n,y_n).$$
    En raisonnant comme dans la question 2., on peut montrer (on ne demande pas de le faire) que pour tout $\varepsilon>0$, il existe $k\ge1$ tel que $d(x_k,x)<\varepsilon$ et $d(y_k,y)<\varepsilon$.
    4. Montrer que $(u_n)_{n\in\mathbb N}$ est croissante.
    5. Montrer que pour tout $\varepsilon>0$, $u_1-u_0<2\varepsilon$. En déduire que $f$ est une isométrie.
    6. Conclure de l'ensemble de l'exercice que $f$ est surjective, i.e., $f(X)=X$.
  sources:
  - etab: paris-cite
    fichier: topologie/dm/dm-2020-21.pdf
    page: 1
    numero: Ex 2
  annale_prioritaire: false
  type_source: dm
