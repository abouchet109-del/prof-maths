- id: topo-dm2021-22-ex02
  titre: 'La sphère unité : connexité, pas d''injection continue dans R, Borsuk-Ulam en dim 1'
  enonce: |
    On munit $\mathbb R^2$ de la norme euclidienne $\|\cdot\|_2$. On note $S$ la sphère unité de rayon $1$, c'est-à-dire $S=\{x\in\mathbb R^2,\ \|x\|_2=1\}$.
    1. Montrer que $S$ est connexe.
    Les deux questions 2 et 3 qui suivent sont indépendantes.
    2. (a) Montrer qu'il n'existe pas de bijection continue de $S$ dans $[0,1]$.
     (b) En déduire qu'il n'existe pas d'injection continue de $S$ dans $\mathbb R$.
    3. On se donne une fonction $f:S\to\mathbb R$ continue et on veut montrer qu'il existe deux points diamétralement opposés de $S$ en lesquels $f$ coïncide : autrement dit, il existe $x\in S$ tel que $f(x)=f(-x)$.
     (a) Par le biais de la fonction $g:x\mapsto f(x)-f(-x)$, montrer le résultat.
     (b) Justifier en deux mots pourquoi on a au passage obtenu une preuve alternative de 2. (b).
