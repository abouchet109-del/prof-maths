- id: topo-uvsq-td4-ex05
  titre: 'Application k-lipschitzienne : norme de la différentielle bornée par k'
  enonce: |
    On considère $E$ et $F$ deux espaces vectoriels normés et $\Omega$ un ouvert de $E$. Soit $f:\Omega\to F$ une application différentiable sur $\Omega$. Démontrer que si $f$ est $k$-lipschitzienne sur $\Omega$, c'est-à-dire
    $$\forall x,y\in\Omega,\ \|f(x)-f(y)\|_F\le k\|x-y\|_E,$$
    alors
    $$\forall x\in\Omega,\ \|Df(x)\|_{\mathcal L(E,F)}\le k.$$
