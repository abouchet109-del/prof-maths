- id: topo-td2-ex01
  titre: Produit de fermés/ouverts dans le produit
  enonce: |
    Soit $(X,d)$ un espace métrique. On munit l'ensemble produit $X^2=X\times X$ de la distance produit
    $$D:((x_1,x_2),(y_1,y_2))\mapsto d(x_1,y_1)+d(x_2,y_2).$$
    Soient $A$ et $B\in\mathcal P(X)$. Montrer que
    1. si $A$ et $B$ sont fermés dans $(X,d)$, alors $A\times B$ est fermé dans $(X^2,D)$,
    2. si $A$ et $B$ sont ouverts dans $(X,d)$, alors $A\times B$ est ouvert dans $(X^2,D)$.
