- id: topo-exam2023-24-ex01
  titre: 'Fonctions 1-périodiques de moyenne nulle : Banach et opérateur T'
  enonce: |
    On considère l'ensemble
    $$E=\left\{f:\mathbb R\to\mathbb R\ /\ f\text{ est de classe }\mathcal C^1,\ f(t+1)=f(t),\ \forall t\in\mathbb R,\ \text{et}\ \int_0^1f(t)\,dt=0\right\}.$$
    1. Soit $f\in E$.
     (a) Montrer que $f$ est bornée.
     (b) Montrer que la fonction $f$ s'annule en au moins un point $t_0\in\mathbb R$.
     (c) En déduire que $\|f\|_\infty\le\|f'\|_\infty$ (où $\|f\|_\infty=\sup_{t\in\mathbb R}|f(t)|$).
    2. Pour tout $f\in E$, on pose $\|f\|_E=\|f'\|_\infty$.
     (a) Montrer que $\|\cdot\|_E$ est une norme sur $E$.
     (b) Question difficile à traiter en fin de séance : montrer que $(E,\|\cdot\|_E)$ est un espace de Banach (on rappelle que l'espace des fonctions continues et bornées $(C_b(\mathbb R,\mathbb R),\|\cdot\|_\infty)$ est un espace de Banach).
    3. On définit l'application $T$ en posant, pour tous $f\in E$ et $t\in\mathbb R$,
    $$T(f)(t)=f(t)+\frac12f\left(\frac t2\right)+\frac12f\left(\frac{t+1}2\right).$$
     (a) Vérifier que $T(f)\in E$.
     (b) Montrer que $T\in\mathcal L(E)$ ($E$ est muni de la norme $\|\cdot\|_E$).
     (c) En appliquant le théorème de Picard à l'application $S$ définie par
     $$S(f)(t)=g(t)-\frac12f\left(\frac t2\right)-\frac12f\left(\frac{t+1}2\right),$$
     montrer que, pour tout $g\in E$, l'équation $T(f)=g$ possède une unique solution.
     (d) Montrer que $T$ est un isomorphisme (d'espace vectoriel normé).
  sources:
