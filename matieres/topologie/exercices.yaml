- id: topo-partiel2022-23-ex02
  titre: Suite de Cauchy et fonction limite des distances
  enonce: |
    Soient $(X,d)$ un espace métrique et $(u_n)_{n\in\mathbb N}$ une suite de Cauchy de $X$.
    1. Montrer que, pour tout $x\in X$, $(d(x,u_n))_{n\in\mathbb N}$ est une suite de Cauchy et qu'elle est convergente.
    2. Pour tout $x\in X$, on pose
    $$f(x)=\lim_{n\to+\infty}d(x,u_n).$$
    Montrer que la fonction $f$ ainsi définie est lipschitzienne.
    3. Montrer que
    $$\inf_{x\in X}f(x)=0.$$
    Quand cette borne est-elle atteinte ?
    4. En déduire que si $X$ n'est pas complet, alors il existe une fonction $g:X\to\mathbb R$ continue et non bornée.
