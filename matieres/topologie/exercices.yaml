- id: topo-td4-ex07
  titre: 'Application strictement contractante sur un compact : point fixe'
  enonce: |
    Soient $(X,d)$ un espace métrique compact et $f:X\to X$ une application telle que, pour tous $x,y\in X$ tels que $x\neq y$,
    $$d(f(x),f(y))<d(x,y).$$
    1. On définit la fonction $\Phi:X\to\mathbb R$, en posant, pour tout $x\in X$,
    $$\Phi(x)=d(x,f(x)).$$
    Montrer que $\Phi$ est 2-lipschitzienne, c'est-à-dire,
    $$|\Phi(x)-\Phi(y)|\le2\,d(x,y),\quad\forall x,y\in X.$$
    2. Montrer qu'il existe $a\in X$ tel que $\Phi(a)=\inf_{x\in X}\Phi(x)$.
    3. Montrer que $a$ est un point fixe de $f$.
    4. Ce point fixe est-il unique ?
