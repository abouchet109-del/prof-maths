- id: topo-dm2022-23-ex02
  titre: Plus petite boule fermée contenant un borné ; unicité en norme 2
  enonce: |
    On considère $\mathbb R^d$ muni d'une norme quelconque. Soit $B\subset\mathbb R^d$ un ensemble borné. On veut montrer qu'il existe un plus petit rayon des boules fermées contenant $B$. Soit
    $$r_0=\inf\{r>0,\ \exists x\in\mathbb R^d,\ B\subset\overline B(x,r)\}.$$
    1. Justifier que $r_0$ est bien défini.
    2. Montrer que pour tout $n\in\mathbb N$, il existe $x_n$ tel que $B\subset\overline B(x_n,r_0+2^{-n})$.
    3. Montrer que la suite $(x_n)$ admet une valeur d'adhérence dans $\mathbb R^d$.
    4. Conclure.
    5. Y a-t-il en général unicité de la boule de rayon $r_0$ contenant $B$ ?
    6. Montrer qu'il y a unicité si la norme considérée est la norme $\|\cdot\|_2$.
