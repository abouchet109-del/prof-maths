- id: topo-td1-ex04
  titre: 'Ouvert et/ou fermé : onze exemples'
  enonce: |
    Déterminer si l'ensemble $A$ est ouvert et/ou fermé dans l'ensemble $X$, dans les cas suivants. La distance considérée est la distance usuelle de $\mathbb R$ ou la distance euclidienne sur $\mathbb R^2$.
    1. $A=\emptyset$ avec $X=\mathbb R$
    2. $A=]0,1]$ avec $X=\mathbb R$
    3. $A=]-\infty,1]$ avec $X=\mathbb R$
    4. $A=[0,2[\,\cup\,]1,3]$ avec $X=\mathbb R$
    5. $A=]0,1]$ avec $X=[-1,1]$
    6. $A=[1,2]\cup\bigcup_{n\in\mathbb N^*}\{\tfrac1n\}$ avec $X=\mathbb R$
    7. $A=[-1,0]\cup\bigcup_{n\in\mathbb N^*}\{\tfrac1n\}$ avec $X=\mathbb R$
    8. $A=]0,+\infty[\times\{0\}$ avec $X=\mathbb R^2$
    9. $A=[0,+\infty[\times\{0\}$ avec $X=\mathbb R^2$
    10. $A=\{(x,y)\in\mathbb R^2 \mid x>0,\ y>0 \text{ et } xy<1\}$ avec $X=\mathbb R^2$
    11. $A=\{(x,y)\in\mathbb R^2 \mid x>0,\ y\ge0 \text{ et } xy<1/2\}$ avec $X=\mathbb R^2$
  sources:
  - etab: paris-cite
    fichier: topologie/td/td1.pdf
    page: 1
    numero: Ex 4
  annale_prioritaire: false
  type_source: td
  annale: null
  disponible: true
  sous_chapitre: Chapitre 1 - Espace métrique > 1.4 Intérieur, adhérence et frontière
  methodes:
  - topo-m-01
  - topo-m-03
  - topo-m-02
  notions:
  - topo-n-0012
  - topo-n-0004
  - topo-n-0043
  importance: vital
  justification: 'ouvert/fermé de parties concrètes : m01 (4 annales), m03 (partiels)'
  difficulte: 2
  temps_min: 35
